<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Planner OPT-TR</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.53.0/dist/umd/supabase.js"></script>
<script src="hub-docstore.js?v=20261030a"></script>
<style>
:root{--ink:#111827;--ink2:#4b5563;--ink3:#9ca3af;--line:#e5e7eb;--line2:#f1f3f6;--accent:#ff7a1a;--accent-soft:#fff3e8;--accent-ink:#c2530a;--red:#be123c;--red-soft:#fff1f2;--blue:#ff7a1a;--gold-ink:#d95f0e;--today:#fff7ed;--weekend:#fbfbfd}
*{box-sizing:border-box}
html,body{margin:0;background:#f5f6f8;color:var(--ink);font-family:'Sarabun',sans-serif;font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}

/* ───── เดสก์ท็อป ───── */
.desk{display:none;min-height:100vh;padding:24px}
.desk .app{max-width:none}
.app{margin:0 auto;background:#fff;border-radius:22px;box-shadow:0 18px 50px rgba(15,23,42,.12);display:grid;grid-template-columns:232px 1fr 300px;overflow:hidden;min-height:calc(100vh - 48px)}
.side{background:#f6f7f9;border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.brand h1{margin:0;font-size:18px;font-weight:800}
.add{margin:14px 0 18px;height:42px;border-radius:14px;background:var(--blue);color:#fff;font-weight:700;font-size:15px;box-shadow:0 8px 18px rgba(255,122,26,.28)}
.add:hover{filter:brightness(1.04)}
.sec{font-size:15px;font-weight:800;color:var(--ink);margin:18px 6px 8px}
.person{display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border-radius:12px;font-weight:700;font-size:14.5px;text-align:left;width:100%}
.person:hover{background:#eceff3}
.person.on{background:#fff;box-shadow:0 1px 3px rgba(15,23,42,.08);color:var(--gold-ink)}
.person .n{margin-left:auto;font-size:12px;color:var(--ink3);font-weight:700}
.cat{display:flex;align-items:center;gap:9px;height:32px;padding:0 6px;font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer}
.cat input{width:15px;height:15px;accent-color:var(--c);margin:0}
.cat .cn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addone{margin-top:auto;padding-top:14px}
.addbtn{width:100%;height:40px;border-radius:12px;border:1.5px dashed #ffb27a;background:#fffaf6;color:var(--accent-ink);font-weight:800;font-size:14px}
.addbtn:hover{background:#fff3e8}
.foot{font-size:11.5px;color:var(--ink3);margin-top:10px}
.main{padding:22px 24px;min-width:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.bar h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.bar h2 span{color:var(--ink3);font-weight:700}
.seg{margin-left:auto;display:inline-flex;background:#f0f2f5;border-radius:11px;padding:3px}
.seg button{height:32px;padding:0 14px;border-radius:9px;font-weight:700;font-size:14px;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--gold-ink);box-shadow:0 1px 2px rgba(15,23,42,.1)}
.btn{height:38px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:14px;color:var(--ink)}
.btn:hover{border-color:#ffc9a3;background:#fffaf6}
.iconb{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:18px;font-weight:700;color:var(--ink2)}
.iconb:hover{border-color:#ffc9a3;color:var(--gold-ink)}
.wd{display:grid;grid-template-columns:repeat(7,1fr);font-size:12px;font-weight:700;color:var(--ink3);padding:0 2px 8px}
.wd .we{color:#c8364b}
.grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(96px,1fr);flex:1;min-height:0;border-top:1px solid var(--line)}
.c{border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);padding:8px 8px 6px;display:flex;flex-direction:column;gap:4px;min-width:0;cursor:pointer}
.c:nth-child(7n){border-right:0}
.c:hover{background:#fcfcfd}
.c.out{background:#fafbfc;color:var(--ink3);cursor:default}
.c.we .dn{color:#c8364b}
.c.today{background:#eef4ff}
.c.today .dn{background:var(--accent);color:#fff}
.dn{font-size:13px;font-weight:700;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.ev{font-size:12px;padding:2px 6px;border-left:2px solid var(--c);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:0 4px 4px 0;background:color-mix(in srgb,var(--c) 7%,#fff);text-align:left}
.ev:hover{background:color-mix(in srgb,var(--c) 16%,#fff)}
.more{font-size:11.5px;color:var(--ink3);font-weight:600;padding-left:6px}
.right{background:#fff;border-left:1px solid var(--line);position:relative;min-width:0}
.right-in{position:absolute;top:22px;bottom:18px;left:18px;right:18px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
.right .lab{font-size:14px;color:var(--ink);font-weight:800;margin-top:4px}
.empty{border:1.5px dashed #d6dbe3;border-radius:12px;padding:14px;color:var(--ink3);font-size:13px}
.up{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line2);align-items:center;--c:#999;cursor:pointer}
.up:first-of-type{border-top:0}
.up .d{text-align:center;line-height:1.1}
.up .d b{display:block;font-size:17px;font-weight:800}
.up .d small{font-size:11.5px;color:var(--ink2);font-weight:700}
.up .d.we b{color:#c8364b}
.up .t{font-weight:700;font-size:13.5px;line-height:1.3}
.up .s{font-size:12px;color:var(--c);font-weight:700;margin-top:2px}

/* ───── มือถือ ───── */
.mob{display:none;min-height:100vh;background:#f5f7fa;padding-bottom:110px}
.mtop{padding:12px 14px 10px;background:#fff}
.mtop h1{margin:0;font-size:18px;font-weight:800}
.mo{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.mo button{width:42px;height:42px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:18px}
.mo b{font-size:16px;font-weight:700}
.people{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:10px 14px 12px;background:#fff;border-bottom:1px solid var(--line)}
.people::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line);font-weight:700;font-size:14px;background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.pill.on{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 6px 14px rgba(17,24,39,.2)}
.strip{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:12px 14px 10px;background:#fff}
.strip::-webkit-scrollbar{display:none}
.dayb{flex:0 0 auto;width:50px;height:74px;border-radius:17px;background:#fff;box-shadow:0 1px 3px rgba(15,23,42,.07);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.dayb small{font-size:11px;color:var(--ink3);font-weight:600}
.dayb b{font-size:18px;font-weight:800}
.dayb.we b{color:#c8364b}
.dayb.on{background:var(--ink);color:#fff;box-shadow:0 10px 20px rgba(17,24,39,.25)}
.dayb.on small{color:#cbd5e1}
.dayb.today:not(.on){box-shadow:inset 0 0 0 1.5px var(--accent)}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:5px;height:5px;border-radius:50%}
.dayh{padding:14px 16px 10px;display:flex;align-items:baseline;gap:8px}
.dayh b{font-size:20px;font-weight:800}
.dayh span{color:var(--ink2);font-size:13.5px}
.mlist{padding:0 14px}
.card{background:#fff;border-radius:18px;box-shadow:0 2px 10px rgba(15,23,42,.06);display:flex;overflow:hidden;margin-bottom:10px;cursor:pointer;text-align:left;width:100%}
.card .bar2{width:6px;background:var(--c);flex:0 0 auto}
.card .tx{padding:14px 16px 14px 14px;min-width:0}
.card .tt{font-weight:700;font-size:16px;line-height:1.35}
.card .mt{font-size:13px;color:var(--ink2);margin-top:2px}
.tg{display:inline-block;margin-top:7px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,#fff)}
.emptyd{text-align:center;color:var(--ink3);padding:40px 0}
.tabs{position:fixed;left:0;right:0;bottom:0;height:76px;background:rgba(255,255,255,.97);box-shadow:0 -6px 18px rgba(15,23,42,.07);border-radius:22px 22px 0 0;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));z-index:20}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:var(--ink3);font-weight:600}
.tabs .ti{width:46px;height:30px;border-radius:15px;display:grid;place-items:center;font-size:17px}
.tabs button.on{color:var(--accent)}
.tabs button.on .ti{background:var(--accent-soft)}
.fab{position:fixed;right:16px;bottom:96px;width:60px;height:60px;border-radius:22px;background:var(--accent);color:#fff;font-size:30px;box-shadow:0 14px 28px rgba(255,122,26,.4);display:grid;place-items:center;z-index:20}

@media (max-width:820px){
  .desk{display:none!important}
  .mob{display:block}
}
@media (min-width:821px){
  .desk{display:block}
  .mob,.tabs,.fab{display:none!important}
}
@media (max-width:1100px) and (min-width:821px){ .app{grid-template-columns:200px 1fr} .right{display:none} }

/* ───── ป๊อปอัปจัดการทีมและหมวด ───── */
.mgr,.dlg{position:fixed;inset:0;background:rgba(15,23,42,.35);display:grid;place-items:center;z-index:50;padding:14px}
.mgr[hidden],.dlg[hidden]{display:none}
.mgr-box,.dlg-box{background:#fff;border-radius:18px;width:min(440px,100%);max-height:88vh;overflow:auto;box-shadow:0 30px 60px rgba(15,23,42,.25);padding:18px}
.hd{display:flex;align-items:center;justify-content:space-between;font-size:17px;font-weight:800;margin-bottom:10px}
.x{width:34px;height:34px;border-radius:10px;font-size:16px;color:var(--ink2)}
.x:hover{background:#f1f3f6}
.mg-sec{font-size:13px;font-weight:800;color:var(--ink2);margin:14px 2px 6px}
.mg-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:12px;background:#f8fafc;margin-bottom:6px;font-weight:700}
.mg-row small{display:block;font-size:12px;color:var(--ink3);font-weight:600}
.mg-row i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.mini{font-size:12.5px;font-weight:800;padding:6px 10px;border-radius:10px;background:#fff3e8;color:#c2530a;border:1px solid #ffd2ac}
.mini.danger{background:#fff1f2;color:var(--red);border-color:#fecdd3}
.mini:hover{filter:brightness(.98)}
.addrow{width:100%;margin-top:4px;text-align:center;padding:9px;font-size:13.5px;border-style:dashed}
.ro .addone,.ro .add,.ro .mini,.ro .fab,.ro .addrow,.ro .mg-row .mini{display:none!important}
/* ป๊อปอัปจัดการ + กล่องยืนยัน (แทน confirm / prompt ของเบราว์เซอร์) */
.mgr,.ask{background:rgba(15,23,42,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fadeIn .18s ease}
.ask{position:fixed;inset:0;display:grid;place-items:center;z-index:80;padding:14px}
.ask[hidden]{display:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.mgr-box{width:min(460px,100%);border-radius:22px;padding:20px 20px 22px;box-shadow:0 30px 70px rgba(15,23,42,.28);animation:rise .22s cubic-bezier(.2,.8,.2,1)}
.mgr-sub{font-size:12.5px;color:var(--ink3);font-weight:600;margin:-6px 0 12px}
.mtabs{display:flex;gap:4px;background:var(--line2);padding:4px;border-radius:14px;margin-bottom:12px}
.mtabs button{flex:1;height:40px;border-radius:11px;font-weight:800;font-size:14px;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:6px}
.mtabs button.on{background:#fff;color:var(--accent-ink);box-shadow:0 1px 3px rgba(15,23,42,.1)}
.mtabs em{font-style:normal;font-size:11.5px;background:#e5e7eb;color:var(--ink2);border-radius:999px;padding:1px 7px}
.mtabs button.on em{background:var(--accent-soft);color:var(--accent-ink)}
.mg-sec{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--ink3);margin:18px 2px 8px}
.mg-sec em{font-style:normal;font-size:11.5px;background:var(--line2);color:var(--ink2);border-radius:999px;padding:1px 8px}
.mg-row{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;border:1px solid var(--line2);border-radius:16px;background:#fff;margin-bottom:8px;box-shadow:0 1px 2px rgba(15,23,42,.04);font-weight:700;font-size:14.5px}
.mg-row .tx{flex:1;min-width:0}
.mg-row .tx small{display:block;font-size:12px;color:var(--ink3);font-weight:600;margin-top:1px}
.mg-row .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#fff3e8,#ffd2ac);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:14px;flex:0 0 auto}
.mg-row .sw{width:6px;height:34px;border-radius:4px;flex:0 0 auto}
.mini{display:inline-flex;align-items:center;height:32px;padding:0 12px;font-size:12.5px;font-weight:800;border-radius:10px;background:#fff3e8;color:var(--accent-ink);border:1px solid #ffd2ac;transition:background .15s}
.mini:hover{background:#ffe9d6;filter:none}
.mini.ghost{background:#fff;color:var(--ink2);border-color:var(--line)}
.mini.ghost:hover{background:#f6f7f9}
.mini.danger{background:#fff;color:var(--red);border-color:#fecdd3}
.mini.danger:hover{background:var(--red-soft)}
.addrow{width:100%;height:46px;justify-content:center;margin-top:2px;border-radius:16px;border:1.5px dashed #ffb27a;background:#fffaf6;font-size:14px}
.addrow:hover{background:#fff3e8}
.ask-box{width:min(360px,100%);text-align:center;padding:24px 22px 20px;background:#fff;border-radius:22px;box-shadow:0 30px 70px rgba(15,23,42,.28);animation:rise .22s cubic-bezier(.2,.8,.2,1)}
.ask-ic{width:54px;height:54px;border-radius:18px;margin:0 auto 12px;display:grid;place-items:center;font-size:24px;background:var(--accent-soft)}
.ask-ic.danger{background:var(--red-soft)}
.ask-t{font-size:17px;font-weight:800;color:var(--ink)}
.ask-m{font-size:13.5px;color:var(--ink2);margin:6px 0 0;white-space:pre-line}
.ask-f{text-align:left;margin-top:14px}
.ask-f .field{margin-bottom:10px}
.ask-f input[type=color]{width:100%;height:44px;padding:4px;cursor:pointer}
.ask-btns{display:flex;gap:8px;margin-top:18px}
.ask-btns .btn{flex:1;height:44px}
.btn.solid{background:var(--red);border-color:var(--red);color:#fff}
.btn.solid:hover{background:#9f1239}
@media (max-width:820px){
  .mgr,.ask{place-items:end center;padding:0}
  .mgr-box{width:100%;max-width:none;border-radius:22px 22px 0 0;max-height:86vh;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  .ask-box{width:calc(100% - 28px);margin-bottom:14px}
}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field span{font-size:12.5px;font-weight:700;color:var(--ink2)}
.field input,.field select{height:40px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:14.5px;background:#fff}
.field input:focus,.field select:focus{outline:2px solid #ffd2ac;border-color:#ffb27a}
.acts{display:flex;gap:8px;margin-top:6px}
.acts .btn{flex:1}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:#f06a10}
.btn.rd{background:var(--red-soft);color:var(--red);border-color:#fecdd3}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:13.5px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.notice{margin:10px 14px 0;padding:10px 12px;border-radius:12px;background:#fff7ed;color:#9a3412;font-size:13px}
.notice[hidden]{display:none}
</style>
</head>
<body>

<!-- ═════ เดสก์ท็อป ═════ -->
<div class="desk" id="desk">
 <div class="app">
  <aside class="side">
    <div class="brand"><h1>Planner OPT-TR</h1></div>
    <button class="add" id="addPlanBtn">+ เพิ่มแผน</button>
    <div class="sec">ทีม</div>
    <div id="team"></div>
    <div class="sec">หมวด</div>
    <div id="cats"></div>
    <div class="addone"><button class="addbtn" id="addOne">+ เพิ่มทีม / หมวด</button></div>
    <div class="foot">ทุกคนเห็นข้อมูลตรงกัน</div>
  </aside>
  <section class="main">
    <div class="bar">
      <h2 id="title"></h2>
      <div class="seg" id="view"><button class="on" data-view="person">รายคน</button><button data-view="team">ทั้งทีม</button></div>
      <button class="btn" id="today">วันนี้</button>
      <button class="iconb" id="prev" aria-label="เดือนก่อน">‹</button>
      <button class="iconb" id="next" aria-label="เดือนถัดไป">›</button>
    </div>
    <div class="wd" id="wd"></div>
    <div class="grid" id="grid"></div>
  </section>
  <aside class="right"><div class="right-in">
    <div class="lab" id="selLab"></div>
    <div id="selBox"></div>
    <div class="lab" id="upLab"></div>
    <div id="up"></div>
  </div></aside>
 </div>
</div>

<!-- ═════ มือถือ ═════ -->
<div class="mob" id="mob">
  <div class="mtop">
    <h1>Planner OPT-TR</h1>
    <div class="mo"><button id="mprev" aria-label="เดือนก่อน">‹</button><b id="mtitle"></b><button id="mnext" aria-label="เดือนถัดไป">›</button></div>
  </div>
  <div class="notice" id="notice" hidden></div>
  <div class="people" id="mpeople"></div>
  <div class="strip" id="strip"></div>
  <div class="dayh" id="dayh"></div>
  <div class="mlist" id="cards"></div>
</div>
<nav class="tabs" id="tabs">
  <button class="on" data-tab="cal"><span class="ti">📅</span>ปฏิทิน</button>
  <button data-tab="today"><span class="ti">📌</span>วันนี้</button>
  <button data-tab="team"><span class="ti">👥</span>ทีม</button>
  <button data-tab="add"><span class="ti">＋</span>เพิ่มแผน</button>
</nav>

<!-- ป๊อปอัปจัดการทีมและหมวด -->
<div class="mgr" id="mgr" hidden><div class="mgr-box">
  <div class="hd"><span>จัดการทีมและหมวดงาน</span><button class="x" id="mgrX" aria-label="ปิด">✕</button></div>
  <p class="mgr-sub">เพิ่ม แก้ไข หรือลบทีมและหมวดงาน ทุกคนเห็นการเปลี่ยนแปลงทันที</p>
  <div id="mgrBody"></div>
</div></div>

<!-- กล่องยืนยัน / กรอกชื่อ -->
<div class="ask" id="ask" hidden><div class="ask-box" role="dialog" aria-modal="true">
  <div class="ask-ic" id="askIc"></div>
  <div class="ask-t" id="askT"></div>
  <p class="ask-m" id="askM"></p>
  <div class="ask-f" id="askF"></div>
  <div class="ask-btns"><button class="btn" id="askNo">ยกเลิก</button><button class="btn pri" id="askOk">ตกลง</button></div>
</div></div>

<!-- ป๊อปอัปแผน -->
<div class="dlg" id="dlg" hidden><div class="dlg-box">
  <div class="hd"><span id="dlgTitle">เพิ่มแผน</span><button class="x" id="dlgX" aria-label="ปิด">✕</button></div>
  <label class="field"><span>คน</span><select id="fPerson"></select></label>
  <label class="field"><span>วันที่</span><input type="date" id="fDate"></label>
  <label class="field"><span>หมวด</span><select id="fType"></select></label>
  <label class="field"><span>หัวข้อ</span><input id="fTitle" placeholder="เช่น ประชุม OPT-FS"></label>
  <label class="field"><span>สถานที่</span><input id="fPlace" placeholder="เช่น SKV71"></label>
  <div class="acts">
    <button class="btn rd" id="fDel" hidden>ลบ</button>
    <button class="btn" id="fCancel">ยกเลิก</button>
    <button class="btn pri" id="fSave">บันทึก</button>
  </div>
</div></div>

<div class="toast" id="toast"></div>

<script>
/* ───── ค่าเริ่มต้น ───── */
const DEFAULT_TEAM = ["พี่จอย","กาย","เบนซ์","พี่น้อย","ฟาง JD","พี่หนิง JD","ใบชา"];
const DEFAULT_CATS = [
  {k:'train',l:'อบรม',c:'#6d5ef0'},{k:'meet',l:'ประชุม',c:'#c27700'},{k:'visit',l:'Visit / ตรวจสาขา',c:'#16804d'},
  {k:'ojt',l:'OJT',c:'#0b7e8c'},{k:'office',l:'Office / WFH',c:'#5a6470'},{k:'project',l:'โปรเจกต์ / NPD',c:'#9b3fb5'},
  {k:'leave',l:'ลา',c:'#c8364b'},{k:'off',l:'วันหยุด',c:'#9aa3a0'}
];
const DOW=['จ','อ','พ','พฤ','ศ','ส','อา'], DOWF=['จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์','อาทิตย์'];
const TH=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

/* ───── สถานะ ───── */
let db=null, unsubMonth=null, unsubTeam=null, unsubCats=null;
let team=DEFAULT_TEAM.slice(), cats=DEFAULT_CATS.map(x=>({...x}));
let plans=[];
let Y=new Date().getFullYear(), M=new Date().getMonth();
let person=null, mode='person', sel=null, mSel=null, mTab='cal', canWrite=false, editingId=null;
const todayISO=()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const mkey=()=>Y+'-'+String(M+1).padStart(2,'0');
const catOf=k=>cats.find(c=>c.k===k)||{k,l:k,c:'#9ca3af'};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const $=id=>document.getElementById(id);
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('on'),1800); }
function mon(d){ return (new Date(Y,M,1).getDay()+6)%7; }
function nDays(){ return new Date(Y,M+1,0).getDate(); }
function wkend(d){ return ((mon()+d-1)%7)>4; }
function visible(){ return plans.filter(p=>(mode==='team'||!person||p.person===person)&&cats.some(c=>c.k===p.type)); }
function byDay(){ const m={}; visible().forEach(p=>{ const d=+String(p.date).slice(8,10); (m[d]=m[d]||[]).push(p); }); return m; }

/* ───── ส่วนแสดงผล ───── */
function paintHead(){
  $('title').innerHTML=`${TH[M]} <span>${Y+543}</span>`;
  $('mtitle').textContent=`${TH[M]} ${Y+543}`;
  $('wd').innerHTML=DOW.map((d,i)=>`<div class="${i>4?'we':''}" style="padding-left:8px">${d}</div>`).join('');
  document.querySelectorAll('#view button').forEach(b=>b.classList.toggle('on',b.dataset.view===mode));
}
function paintTeam(){
  const html=team.map(n=>{ const c=plans.filter(p=>p.person===n).length; return `<button class="person ${person===n?'on':''}" data-p="${esc(n)}">${esc(n)}<span class="n">${c}</span></button>`; }).join('');
  $('team').innerHTML=html;
  $('mpeople').innerHTML=`<button class="pill ${!person?'on':''}" data-p="">ทั้งทีม</button>`+team.map(n=>`<button class="pill ${person===n?'on':''}" data-p="${esc(n)}">${esc(n)}</button>`).join('');
}
function paintCats(){
  $('cats').innerHTML=cats.map(c=>`<label class="cat" style="--c:${c.c}"><input type="checkbox" data-c="${esc(c.k)}" checked><span class="cn">${esc(c.l)}</span></label>`).join('');
}
function evHtml(p){ const c=catOf(p.type); return `<button class="ev" style="--c:${c.c}" data-id="${esc(p.id)}" title="${esc(p.person)} · ${esc(p.title)}">${mode==='team'?esc(p.person)+' · ':''}${esc(p.title)}</button>`; }
function paintGrid(){
  const m=byDay(); const off=mon(), n=nDays(), prev=new Date(Y,M,0).getDate();
  let h='';
  for(let i=0;i<off;i++) h+=`<div class="c out"><span class="dn">${prev-off+1+i}</span></div>`;
  const t=todayISO();
  for(let d=1; d<=n; d++){
    const iso=`${Y}-${String(M+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const list=m[d]||[];
    const cls=['c',wkend(d)?'we':'',iso===t?'today':'',d===sel?'sel':''].join(' ');
    h+=`<div class="${cls}" data-d="${d}"><span class="dn">${d}</span>${list.slice(0,3).map(evHtml).join('')}${list.length>3?`<div class="more">+${list.length-3} รายการ</div>`:''}</div>`;
  }
  const rest=(7-((off+n)%7))%7;
  for(let i=1;i<=rest;i++) h+=`<div class="c out"><span class="dn">${i}</span></div>`;
  $('grid').innerHTML=h;
}
function paintRight(){
  const d=sel||(Y===new Date().getFullYear()&&M===new Date().getMonth()?new Date().getDate():1);
  const iso=`${Y}-${String(M+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const list=visible().filter(p=>p.date===iso);
  $('selLab').textContent=`${iso===todayISO()?'วันนี้ · ':''}${DOWF[(mon()+d-1)%7]} ${d} ${TH[M]}`;
  $('selBox').innerHTML=list.length?list.map(p=>cardRow(p,true)).join(''):`<div class="empty">ไม่มีแผนวันนี้<br>กดที่วันเพื่อเพิ่มแผน</div>`;
  const later=visible().filter(p=>p.date>iso).sort((a,b)=>a.date.localeCompare(b.date));
  $('upLab').textContent=`ถัดไป · ${later.length} แผน`;
  $('up').innerHTML=later.map(p=>{ const day=+p.date.slice(8,10), we=wkend(day); return `<div class="up" data-id="${esc(p.id)}" style="--c:${catOf(p.type).c}"><div class="d ${we?'we':''}"><b>${day}</b><small>${DOW[(mon()+day-1)%7]}</small></div><div><div class="t">${esc(p.title)}</div><div class="s">${esc(catOf(p.type).l)}${mode==='team'||!person?' · '+esc(p.person):''}</div></div></div>`; }).join('');
}
function cardRow(p,desk){
  const c=catOf(p.type);
  return `<div class="up" data-id="${esc(p.id)}" style="--c:${c.c};grid-template-columns:1fr;cursor:pointer"><div><div class="t">${esc(p.title)}</div><div class="s">${esc(c.l)} · ${esc(p.person)}${p.place?' · '+esc(p.place):''}</div></div></div>`;
}
function paintStrip(){
  const m=byDay(), n=nDays(), d0=mSel||(Y===new Date().getFullYear()&&M===new Date().getMonth()?new Date().getDate():1);
  mSel=d0;
  $('strip').innerHTML=Array.from({length:n},(_,i)=>i+1).map(d=>{
    const list=m[d]||[], dots=list.slice(0,3).map(p=>`<i style="background:${catOf(p.type).c}"></i>`).join('');
    const iso=`${Y}-${String(M+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    return `<button class="dayb ${wkend(d)?'we':''} ${d===d0?'on':''} ${iso===todayISO()&&d!==d0?'today':''}" data-md="${d}"><small>${DOW[(mon()+d-1)%7]}</small><b>${d}</b><span class="dots">${dots}</span></button>`;
  }).join('');
  const act=document.querySelector('.dayb.on'); if(act) act.scrollIntoView({inline:'center',block:'nearest'});
  const dow=(mon()+d0-1)%7;
  $('dayh').innerHTML=`<b>${d0} ${TH[M]}</b><span>วัน${DOWF[dow]}${`${Y}-${String(M+1).padStart(2,'0')}-${String(d0).padStart(2,'0')}`===todayISO()?' · วันนี้':''}</span>`;
  const iso=`${Y}-${String(M+1).padStart(2,'0')}-${String(d0).padStart(2,'0')}`;
  const list=visible().filter(p=>p.date===iso);
  $('cards').innerHTML=list.length?list.map(p=>{ const c=catOf(p.type); return `<button class="card" style="--c:${c.c}" data-id="${esc(p.id)}"><div class="bar2"></div><div class="tx"><div class="tt">${esc(p.title)}</div><div class="mt">${mode==='team'||!person?esc(p.person)+(p.place?' · '+esc(p.place):''):esc(p.place||'ไม่ระบุสถานที่')}</div><span class="tg">${esc(c.l)}</span></div></button>`; }).join(''):`<div class="emptyd">ไม่มีแผนในวันนี้<br>แตะ + เพื่อเพิ่มแผน</div>`;
}
/* กล่องยืนยันแบบเดียวกับแอป: askBox({...}) → true/false, หรือ {name,color} เมื่อมี input */
function askBox({icon='❔',title,msg='',danger=false,input=null}){
  return new Promise(res=>{
    const box=$('ask'), ok=$('askOk'), no=$('askNo');
    $('askIc').textContent=icon;
    $('askIc').classList.toggle('danger',danger);
    $('askT').textContent=title;
    $('askM').textContent=msg; $('askM').hidden=!msg;
    $('askF').innerHTML=input?`<label class="field"><span>${esc(input.label)}</span><input id="askV" value="${esc(input.value||'')}" autocomplete="off"></label>`+(input.color?`<label class="field"><span>สีหมวด</span><input id="askC" type="color" value="${esc(input.color)}"></label>`:''):'';
    ok.textContent=input?'บันทึก':(danger?'ลบ':'ตกลง');
    ok.className='btn '+(danger?'solid':'pri');
    box.hidden=false;
    if(input) setTimeout(()=>$('askV').focus(),0);
    const done=v=>{ box.hidden=true; ok.onclick=no.onclick=box.onclick=null; res(v); };
    ok.onclick=()=>{
      if(!input) return done(true);
      const name=$('askV').value.trim();
      if(!name) return $('askV').focus();
      done({name,color:input.color?$('askC').value:null});
    };
    no.onclick=()=>done(input?null:false);
    box.onclick=e=>{ if(e.target===box) done(input?null:false); };
  });
}
let mgrTab='team';
function paintMgr(){
  const tabs=`<div class="mtabs" role="tablist">
    <button role="tab" class="${mgrTab==='team'?'on':''}" data-mtab="team">ทีม <em>${team.length}</em></button>
    <button role="tab" class="${mgrTab==='cat'?'on':''}" data-mtab="cat">หมวดงาน <em>${cats.length}</em></button></div>`;
  const body = mgrTab==='team'
    ? team.map(n=>{ const c=plans.filter(p=>p.person===n).length; return `<div class="mg-row"><span class="av">${esc(n.charAt(0))}</span><div class="tx">${esc(n)}<small>${c} แผน</small></div><button class="mini danger" data-tdel="${esc(n)}">ลบ</button></div>`; }).join('')+`<button class="mini addrow" id="addTeam">+ เพิ่มสมาชิกทีม</button>`
    : cats.map(c=>{ const n=plans.filter(p=>p.type===c.k).length; return `<div class="mg-row"><span class="sw" style="background:${esc(c.c)}"></span><div class="tx">${esc(c.l)}<small>${n} แผน</small></div><button class="mini ghost" data-cedit="${esc(c.k)}">แก้ไข</button><button class="mini danger" data-cdel="${esc(c.k)}">ลบ</button></div>`; }).join('')+`<button class="mini addrow" id="addCat">+ เพิ่มหมวดงาน</button>`;
  $('mgrBody').innerHTML=tabs+body;
}
function paintAll(){ paintHead(); paintTeam(); paintCats(); paintGrid(); paintRight(); paintStrip(); if(!$('mgr').hidden) paintMgr(); document.body.classList.toggle('ro',!canWrite); }

/* ───── ข้อมูล (Supabase FAB HUB · planner_docs) ───── */
async function saveTeam(next){ team=next; await db.doc('config/team').set({members:next}); }
async function saveCats(next){ cats=next; await db.doc('config/cats').set({items:next}); }
async function savePlan(id,data){ await db.collection('plans').doc(id).set(data); }
async function delPlan(id){ await db.collection('plans').doc(id).delete(); }
function subscribeMonth(){
  if(unsubMonth) unsubMonth();
  const k=mkey();
  unsubMonth=db.collection('plans').where('month','==',k).onSnapshot(snap=>{
    if(k!==mkey()) return;
    plans=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
    paintAll();
  });
}

/* ───── ป๊อปอัปแผน ───── */
function openPlanDlg(id,dateIso){
  editingId=id||null;
  const p=id?plans.find(x=>x.id===id):null;
  $('dlgTitle').textContent=p?'แก้ไขแผน':'เพิ่มแผน';
  $('fPerson').innerHTML=team.map(n=>`<option ${(p?p.person:(person||team[0]))===n?'selected':''}>${esc(n)}</option>`).join('');
  $('fType').innerHTML=cats.map(c=>`<option value="${esc(c.k)}" ${(p?p.type:cats[0]&&cats[0].k)===c.k?'selected':''}>${esc(c.l)}</option>`).join('');
  $('fDate').value=p?p.date:(dateIso||todayISO());
  $('fTitle').value=p?p.title:'';
  $('fPlace').value=p?(p.place||''):'';
  $('fDel').hidden=!p;
  $('dlg').hidden=false;
  setTimeout(()=>$('fTitle').focus(),50);
}
function closeDlg(){ $('dlg').hidden=true; }
async function saveDlg(){
  const title=$('fTitle').value.trim(), date=$('fDate').value;
  if(!title){ toast('กรอกหัวข้อก่อน'); return; }
  if(!date){ toast('เลือกวันที่ก่อน'); return; }
  const id=editingId||('p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
  const data={person:$('fPerson').value,date,month:date.slice(0,7),type:$('fType').value,title,place:$('fPlace').value.trim(),updatedAt:new Date().toISOString()};
  try{ await savePlan(id,data); closeDlg(); toast('บันทึกแล้ว'); }
  catch(e){ toast('บันทึกไม่สำเร็จ'); }
}

/* ───── การกระทำ ───── */
function shift(n){ const d=new Date(Y,M+n,1); Y=d.getFullYear(); M=d.getMonth(); sel=null; mSel=null; subscribeMonth(); paintAll(); }
function goToday(){ const n=new Date(); Y=n.getFullYear(); M=n.getMonth(); sel=n.getDate(); mSel=n.getDate(); subscribeMonth(); paintAll(); }

document.addEventListener('click',async e=>{
  const t=e.target;
  if(t.closest('#prev')) return shift(-1);
  if(t.closest('#next')) return shift(1);
  if(t.closest('#mprev')) return shift(-1);
  if(t.closest('#mnext')) return shift(1);
  if(t.closest('#today')) return goToday();
  if(t.closest('#addPlanBtn')){ if(!canWrite) return toast('สิทธิ์ดูอย่างเดียว'); return openPlanDlg(null,sel?`${Y}-${String(M+1).padStart(2,'0')}-${String(sel).padStart(2,'0')}`:null); }
  if(t.closest('#fCancel')||t.closest('#dlgX')) return closeDlg();
  if(t.id==='dlg') return closeDlg();
  if(t.closest('#fSave')) return saveDlg();
  if(t.closest('#fDel')){ if(!editingId) return; if(!await askBox({icon:'🗑',title:'ลบแผนนี้?',msg:'แผนจะถูกลบออกจากปฏิทินของทุกคน',danger:true})) return; try{ await delPlan(editingId); closeDlg(); toast('ลบแล้ว'); }catch(e){ toast('ลบไม่สำเร็จ'); } return; }
  const v=t.closest('#view button'); if(v){ mode=v.dataset.view; paintAll(); return; }
  const dayD=t.closest('#grid .c[data-d]'); if(dayD && !t.closest('.ev')){ sel=+dayD.dataset.d; if(canWrite&&e.detail===2) return openPlanDlg(null,`${Y}-${String(M+1).padStart(2,'0')}-${String(sel).padStart(2,'0')}`); paintGrid(); paintRight(); return; }
  const ev=t.closest('[data-id]'); if(ev && ev.closest('#grid,#selBox,#up,#cards')){ if(canWrite) openPlanDlg(ev.dataset.id); return; }
  const pp=t.closest('[data-p]'); if(pp){ const v2=pp.dataset.p||null; person=(person===v2)?null:v2; paintAll(); return; }
  const md=t.closest('[data-md]'); if(md){ mSel=+md.dataset.md; sel=mSel; paintStrip(); paintGrid(); paintRight(); return; }
  if(t.closest('#fab')){ if(!canWrite) return toast('สิทธิ์ดูอย่างเดียว'); return openPlanDlg(null,`${Y}-${String(M+1).padStart(2,'0')}-${String(mSel||1).padStart(2,'0')}`); }
  if(t.closest('#addOne')||t.closest('#tabs [data-tab="team"]')){ if(!canWrite) return toast('สิทธิ์ดูอย่างเดียว'); $('mgr').hidden=false; paintMgr(); return; }
  if(t.closest('#mgrX')||t.id==='mgr'){ $('mgr').hidden=true; return; }
  const mtab=t.closest('[data-mtab]'); if(mtab){ mgrTab=mtab.dataset.mtab; paintMgr(); return; }
  const tdel=t.closest('[data-tdel]');
  if(tdel){ const n=tdel.dataset.tdel, c=plans.filter(p=>p.person===n).length; if(!await askBox({icon:'👤',title:`ลบ ${n} ออกจากทีม?`,msg:c?`มีแผนของ ${n} อยู่ ${c} รายการ แผนจะยังอยู่ในระบบ`:'',danger:true})) return; await saveTeam(team.filter(x=>x!==n)); if(person===n) person=null; toast('ลบทีมแล้ว'); return; }
  if(t.closest('#addTeam')){ const r=await askBox({icon:'👤',title:'เพิ่มสมาชิกทีม',input:{label:'ชื่อสมาชิก'}}); if(!r) return; const name=r.name; if(team.includes(name)) return toast('มีอยู่แล้ว'); await saveTeam([...team,name]); toast('เพิ่มทีมแล้ว'); return; }
  const cedit=t.closest('[data-cedit]');
  if(cedit){ const c=cats.find(x=>x.k===cedit.dataset.cedit); const r=await askBox({icon:'🏷',title:'แก้ไขหมวดงาน',input:{label:'ชื่อหมวด',value:c.l,color:c.c}}); if(!r) return; const next=cats.map(x=>x.k===c.k?{...x,l:r.name,c:/^#[0-9a-f]{6}$/i.test(r.color)?r.color:x.c}:x); await saveCats(next); toast('บันทึกหมวดแล้ว'); return; }
  const cdel=t.closest('[data-cdel]');
  if(cdel){ const k=cdel.dataset.cdel, used=plans.filter(p=>p.type===k).length; if(used){ await askBox({icon:'⚠️',title:'ลบหมวดนี้ไม่ได้',msg:`มีแผนอยู่ ${used} รายการ ย้ายแผนไปหมวดอื่นก่อนจึงจะลบได้`}); return; } if(!await askBox({icon:'🗑',title:'ลบหมวดงานนี้?',danger:true})) return; await saveCats(cats.filter(x=>x.k!==k)); toast('ลบหมวดแล้ว'); return; }
  if(t.closest('#addCat')){ const r=await askBox({icon:'🏷',title:'เพิ่มหมวดงานใหม่',input:{label:'ชื่อหมวด',color:'#2563eb'}}); if(!r) return; const k='c'+Date.now().toString(36); await saveCats([...cats,{k,l:r.name,c:/^#[0-9a-f]{6}$/i.test(r.color)?r.color:'#2563eb'}]); toast('เพิ่มหมวดแล้ว'); return; }
  const tab=t.closest('#tabs button');
  if(tab){ document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b===tab)); const k=tab.dataset.tab;
    if(k==='today'){ const n=new Date(); Y=n.getFullYear(); M=n.getMonth(); mSel=n.getDate(); subscribeMonth(); paintAll(); }
    if(k==='add'){ if(!canWrite) return toast('สิทธิ์ดูอย่างเดียว'); openPlanDlg(null,`${Y}-${String(M+1).padStart(2,'0')}-${String(mSel||1).padStart(2,'0')}`); }
    if(k==='team'){ if(!canWrite) return toast('สิทธิ์ดูอย่างเดียว'); $('mgr').hidden=false; paintMgr(); }
    return;
  }
});
document.addEventListener('change',async e=>{
  const c=e.target.closest('[data-c]'); if(!c) return;
});

/* ───── เริ่มต้น ───── */
async function start(){
  const sb = window.supabase ? null : null;
  try{
    if(!(await HubMod.SB.ready())) throw new Error('no db');
    const client=HubMod.SB.client();
    const sess=(()=>{ try{ return JSON.parse(localStorage.getItem('fab_session')||'null'); }catch(e){ return null; } })();
    const role=String((sess&&sess.role)||sessionStorage.getItem('fab_role')||'').toLowerCase();
    canWrite=['admin','support'].includes(role);
    db=makeDb(client);
  }catch(e){
    $('notice').hidden=false; $('notice').textContent='ยังเชื่อมต่อฐานข้อมูลฮับไม่ได้ ลองรีเฟรชหน้า หรือล็อกอินฮับใหม่';
    paintAll(); return;
  }
  if(!canWrite){ $('notice').hidden=false; $('notice').textContent='คุณมีสิทธิ์ดูอย่างเดียว ถ้าต้องแก้ไขแผน ให้แอดมินหรือ Support เป็นผู้แก้'; }
  unsubTeam=db.doc('config/team').onSnapshot(s=>{ const m=s.exists&&Array.isArray(s.data().members)?s.data().members:null; if(m&&m.length){ team=m.slice(); paintAll(); } });
  unsubCats=db.doc('config/cats').onSnapshot(s=>{ const it=s.exists&&Array.isArray(s.data().items)?s.data().items:null; if(it&&it.length){ cats=it.map(x=>({...x})); paintAll(); } });
  const n=new Date(); sel=n.getDate(); mSel=n.getDate();
  subscribeMonth();
  paintAll();
}

/* ตัวต่อฐานข้อมูลแบบเดียวกับ Firestore ที่หน้าเดิมใช้ (collection/doc/where/onSnapshot) */
function makeDb(sb){
  let cache={}, listeners=[];
  const emit=()=>listeners.slice().forEach(f=>{ try{ f(); }catch(e){} });
  const who=(()=>{ try{ const s=JSON.parse(localStorage.getItem('fab_session')||'null'); return (s&&(s.nick||s.name))||''; }catch(e){ return ''; } })();
  async function refresh(){ const r=await sb.from('planner_docs').select('col,id,data').eq('deleted',false).limit(5000); if(r.error) throw r.error; const c={}; r.data.forEach(x=>{ (c[x.col]=c[x.col]||{})[x.id]=x.data; }); cache=c; emit(); }
  async function write(col,id,data){ const r=await sb.from('planner_docs').upsert({col,id,data,deleted:false,updated_at:new Date().toISOString(),updated_by:who}); if(r.error) throw r.error; (cache[col]=cache[col]||{})[id]=data; emit(); }
  async function remove(col,id){ const r=await sb.from('planner_docs').update({deleted:true,updated_at:new Date().toISOString(),updated_by:who}).eq('col',col).eq('id',id); if(r.error) throw r.error; if(cache[col]) delete cache[col][id]; emit(); }
  const watch=run=>{ listeners.push(run); run(); return ()=>{ listeners=listeners.filter(x=>x!==run); }; };
  const docRef=(col,id)=>({
    set:data=>write(col,id,data),
    delete:()=>remove(col,id),
    onSnapshot(cb){ return watch(()=>{ const d=(cache[col]||{})[id]; cb({exists:!!d,data:()=>d||{}}); }); }
  });
  const collection=name=>({
    doc:id=>docRef(name,id),
    where:(f,op,v)=>({ onSnapshot(cb){ return watch(()=>{ const all=cache[name]||{}; const docs=Object.keys(all).filter(id=>op==='=='?all[id][f]===v:true).map(id=>({id,data:()=>all[id]})); cb({docs}); }); } })
  });
  refresh().catch(()=>{});
  setInterval(()=>refresh().catch(()=>{}),20000);
  window.addEventListener('focus',()=>refresh().catch(()=>{}));
  return { collection, doc:path=>{ const [c,i]=path.split('/'); return docRef(c,i); } };
}

/* ตอนนี้ตัว refresh จะเรียกจากฐาน; ให้ปุ่มเริ่มใช้งานพร้อมกันทุกหน้าจอ */
document.body.classList.add('ro');
start();

    </label>
    <div class="row-btns" style="margin-top:14px">
      <button class="btn btn-primary" onclick="doImport()">นำเข้า</button>
      <button class="btn btn-secondary" onclick="closeModal()">ยกเลิก</button>
    </div>`;
  wireGrid();
}

/* อ่านค่าที่พิมพ์ในตาราง · คัดลอกจาก Excel มาวาง = กระจายลงหลายแถวหลายช่อง */
function grabGrid(){
  document.querySelectorAll('#modalBox [data-gr]').forEach(el => {
    const r = +el.dataset.gr, c = +el.dataset.gc;
    if (IMP.grid[r]) IMP.grid[r][c] = el.value;
  });
}
function wireGrid(){
  document.querySelectorAll('#modalBox [data-gr]').forEach(el => {
    el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => { grabGrid(); $('#impSum').innerHTML = impSummary(); });
    if (el.tagName !== 'INPUT') return;
    el.addEventListener('paste', ev => {
      const text = (ev.clipboardData || window.clipboardData).getData('text');
      if (!/[\t\n]/.test(text)) return;                       // วางคำเดียว ปล่อยตามปกติ
      ev.preventDefault();
      grabGrid();
      const r0 = +el.dataset.gr, c0 = +el.dataset.gc;
      const lines = text.replace(/\r/g, '').split('\n').filter((l, i, a) => l !== '' || i < a.length - 1);
      lines.forEach((line, k) => {
        const r = r0 + k;
        while (IMP.grid.length <= r) IMP.grid.push(Array(2 + IMP_COLS).fill(''));
        line.split('\t').forEach((v, j) => { if (c0 + j < 2 + IMP_COLS) IMP.grid[r][c0 + j] = v.trim(); });
      });
      /* ข้อถูกที่วางมาเป็นข้อความ/ตัวเลข แปลงเป็น ก ข ค ง ให้ช่องเลือกแสดงได้ */
      IMP.grid.forEach(row => {
        const ch = row.slice(1, 1 + IMP_COLS).filter(Boolean);
        const i = impAnswerIdx(row[1 + IMP_COLS], ch);
        if (row[1 + IMP_COLS] && i >= 0) row[1 + IMP_COLS] = chMark(i);
      });
      renderImport();
    });
  });
}
window.impAddRows = function(n){ grabGrid(); IMP.grid = IMP.grid.concat(blankRows(n)); renderImport(); };
window.impDelRow = function(i){
  grabGrid(); IMP.grid.splice(i, 1);
  if (!IMP.grid.length) IMP.grid = blankRows(1);
  renderImport();
};
window.impTab = function(t){ if (IMP.tab === 'grid') grabGrid(); IMP.tab = t; renderImport(); };

window.impReadFile = async function(input){
  const f = input.files && input.files[0]; if (!f) return;
  try{
    await loadXLSX();
    const buf = await f.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:'', raw:false });
    IMP.file = { name: f.name, rows };
    renderImport();
  }catch(e){ msg('อ่านไฟล์ไม่สำเร็จ — ' + esc(e.message || e), 'err'); }
};

window.impTemplate = async function(){
  try{
    await loadXLSX();
    const rows = [
      ['โจทย์', 'ก', 'ข', 'ค', 'ง', 'ข้อถูก'],
      ['อุณหภูมิตู้เย็นที่ปลอดภัยคือเท่าใด', '0–4 °C', '5–10 °C', '10–15 °C', '15–20 °C', 'ก'],
      ['เมื่อพบอาหารมีกลิ่นผิดปกติ ต้องทำอย่างไรก่อน', 'ทิ้งเอง', 'แจ้งหัวหน้างานทันที', 'ชิมดูก่อน', '', 'ข']
    ];
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{ wch:44 }, { wch:18 }, { wch:18 }, { wch:18 }, { wch:18 }, { wch:8 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'ข้อสอบ');
    XLSX.writeFile(wb, 'ฟอร์มข้อสอบก่อนหลังอบรม.xlsx');
    msg('โหลดไฟล์ตัวอย่างแล้ว — กรอกทับแถวตัวอย่างได้เลย');
  }catch(e){ msg('สร้างไฟล์ตัวอย่างไม่สำเร็จ — ' + esc(e.message || e), 'err'); }
};

window.doImport = function(){
  if (IMP.tab === 'grid') grabGrid();
  const { ok } = impParsed();
  if (!ok.length) return msg('ยังไม่มีข้อที่นำเข้าได้ — ตรวจว่ามีโจทย์ ตัวเลือกอย่างน้อย 2 ข้อ และเลือกข้อถูกแล้ว', 'warn');
  const replace = $('#impReplace') && $('#impReplace').checked;
  const stamp = Date.now().toString(36);
  const add = ok.map((x, i) => ({ id: 'q' + stamp + i, label: x.q, choices: x.choices, answer: x.answer }));
  editing.questions = replace ? add : editing.questions.concat(add);
  closeModal();
  renderEditor();
  msg(`นำเข้า ${add.length} ข้อแล้ว (รวม ${editing.questions.length} ข้อ) — ตรวจอีกครั้งก่อนกดบันทึก`);
};

window.saveTraining = async function(){
  if (!ttCan('manage-trainings')) return msg('ไม่มีสิทธิ์แก้การอบรม', 'warn');
  grabEditor();
  const e = editing;
  if (!String(e.title || '').trim()) return msg('ใส่ชื่อหลักสูตรก่อน', 'warn');
  if (!e.questions.length) return msg('ต้องมีคำถามอย่างน้อย 1 ข้อ', 'warn');
  const blank = e.questions.findIndex(q => (q.choices || []).some(c => !String(c || '').trim()));
  if (blank >= 0) return msg(`ข้อ ${blank + 1} มีตัวเลือกที่ยังว่าง — ใส่ข้อความหรือกด ✕ ลบตัวเลือกนั้น`, 'warn');
  e.questions.forEach(q => { q.choices = q.choices.map(c => String(c).trim()); });
  const bad = e.questions.findIndex(q => !String(q.label || '').trim() || (q.choices || []).length < 2);
  if (bad >= 0) return msg(`ข้อ ${bad + 1} ยังไม่สมบูรณ์ — ต้องมีคำถามและตัวเลือกอย่างน้อย 2 ข้อ`, 'warn');
  const badA = e.questions.findIndex(q => q.answer == null || q.answer >= (q.choices || []).length);
  if (badA >= 0) return msg(`ข้อ ${badA + 1} ยังไม่ได้เลือกว่าข้อไหนถูก`, 'warn');

  const row = {
    key:e.key, title:e.title.trim(), description:e.description || '', emoji:e.emoji || '🎓',
    train_date: e.train_date || null, place:e.place || '', trainer:e.trainer || '',
    status:e.status || 'draft', questions:e.questions, participants:e.participants || [],
    pre_open: !!e.pre_open, post_open: !!e.post_open,
    visible_brands:e.visible_brands || [], visible_branches:e.visible_branches || [],
    sort_order:e.sort_order || 0, updated_at:new Date().toISOString(),
    source: e.source || null
  };
  const put = r => e.id ? SB.from('tr_trainings').update(r).eq('id', e.id) : SB.from('tr_trainings').insert(r);
  let { error } = await put(row);
  let noLink = false;
  if (error && /source/.test(error.message || '')){
    delete row.source; noLink = true;
    ({ error } = await put(row));
  }
  if (error) return msg('บันทึกไม่สำเร็จ — ' + esc(error.message), 'err');
  if (noLink){
    editing = null; await loadTrainings(); renderTrainings();
    return msg('บันทึกแล้ว แต่ยังจำลิงก์กับ Training Record ไม่ได้ — ต้องรัน <b>supabase/training-test.sql</b> อีกครั้ง (มีคอลัมน์ใหม่)', 'warn');
  }
  editing = null;
  msg('บันทึกการอบรมแล้ว');
  await loadTrainings(); renderTrainings();
};

boot();
</script>

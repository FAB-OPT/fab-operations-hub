<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ff641e">
<title>แบบทดสอบก่อน–หลังอบรม — FAB Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--orange:#ff641e;--orange-soft:#fff3ec;--ink:#17191d;--muted:#667085;--line:#e5e7eb;--bg:#f5f6f8;--card:#fff;--green:#198754;--red:#b42318;--shadow:0 8px 28px rgba(16,24,40,.06)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun',system-ui,"Leelawadee UI",Tahoma,sans-serif;font-size:15px;line-height:1.68;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:var(--orange)}

/* ── แถบบน ── */
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:30;flex-wrap:wrap}
.btn-back{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:700;color:#555}
.btn-back svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tb-title{font-size:17px;font-weight:800;margin:0}
.tb-title small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* ชื่อผู้ใช้ไม่มีกรอบ ไม่มีวงกลมตัวย่อ — ตรงกับที่ฮับใช้อยู่ */
.who-tag{display:flex;flex-direction:column;align-items:flex-end;line-height:1.3;min-width:0}
.who-nm{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.who-role{color:var(--muted);font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.navtabs{display:flex;gap:6px;flex-wrap:wrap}
.navtab{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 15px;font-weight:700;color:#555;font-size:14px}
.navtab.on{background:var(--orange);border-color:var(--orange);color:#fff}

main{padding:22px clamp(12px,3vw,26px) 70px;max-width:1320px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:clamp(16px,3vw,24px);margin-bottom:18px}
h2{margin:0 0 4px;font-size:19px;font-weight:800;letter-spacing:-.01em}
h3{margin:0 0 4px;font-size:16px;font-weight:800}
.sub{color:var(--muted);margin:0 0 18px;font-size:14px}
.muted{color:var(--muted)}
input,select,textarea{width:100%;border:1px solid #d9dde4;border-radius:10px;background:#fff;padding:10px 12px;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,100,30,.12)}
textarea{min-height:88px;resize:vertical}
textarea.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;min-height:150px}
select:disabled,input:disabled{background:#f4f5f7;color:#8a919c}
label{font-weight:700;font-size:14px;display:block;margin-bottom:6px}
.field{margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.btn{border:0;border-radius:10px;padding:10px 18px;font-weight:750}
.btn-primary{background:var(--orange);color:#fff}.btn-primary:hover{background:#e95210}
.btn-secondary{background:#eef0f3;color:#333}
.btn-danger{background:#fff1f0;color:var(--red);border:1px solid #f5c9c4}
.btn-sm{padding:6px 12px;font-size:13.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;border-radius:99px;padding:3px 11px;font-size:12.5px;font-weight:700}
.pill.silver{background:#eef1f5;color:#475467}
.pill.gold{background:#fff5da;color:#8a6100}
.pill.pass,.pill.open{background:#eaf7ef;color:#146c43}
.pill.fail{background:#fff1f0;color:var(--red)}
.pill.off,.pill.closed{background:#f2f4f7;color:#98a2b3}
.pill.draft{background:#fff8e6;color:#8a6100}
.pill.branch{background:var(--orange-soft);color:#b33a05}
.pill.brand{background:#eef2ff;color:#3538cd}
/* ติ๊กสาขา — สาขามีหลายสิบแห่ง จัดเป็นหลายคอลัมน์และจำกัดความสูงให้เลื่อนในกรอบ */
.branch-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 14px;
  max-height:260px;overflow:auto;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:#fff}
.branch-pick label{display:flex;gap:9px;align-items:center;font-weight:400;font-size:14.5px;cursor:pointer}
/* การ์ดคะแนนที่โชว์ให้คนกรอก/สาขาเห็น */
.score-box{margin:18px 0 6px;padding:16px 18px;border:1px solid var(--line);border-radius:13px;background:#fbfcfe;text-align:left}
.score-top{display:flex;justify-content:space-between;align-items:center;gap:14px}
.score-total{font-size:30px;font-weight:800;line-height:1.1}
.score-note{margin:10px 0 0;font-size:13.5px;color:#8a6100;background:#fff8e6;border-radius:9px;padding:9px 12px}
.score-secs{margin-top:14px;display:grid;gap:11px}
.score-sec-top{display:flex;justify-content:space-between;gap:12px;font-size:14px;margin-bottom:5px}
/* ป้ายกลุ่มเป้าหมายในตารางจัดการฟอร์ม — ขึ้นบรรทัดใหม่ได้เมื่อเลือกหลายสาขา */
.pill.brand,.pill.branch{display:inline-block;margin:1px 0}
.notice{display:none;margin-bottom:16px;padding:12px 15px;border-radius:11px;font-size:14.5px;line-height:1.55}
.notice.show{display:block}
.notice.err{background:#fff1f0;color:var(--red);border:1px solid #f5c9c4}
.notice.warn{background:#fff8e6;color:#8a6100;border:1px solid #f2dfae}
.notice.ok{background:#eaf7ef;color:#146c43;border:1px solid #bfe3ce}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.loading{padding:50px;text-align:center;color:var(--muted)}

/* ── รายการฟอร์ม ── */
/* ── รายการแบบฟอร์ม ──
   ฟอร์มมีไม่กี่ชุด ตารางการ์ดจึงเหลือที่ว่างข้าง ๆ เป็นบริเวณกว้าง
   ใช้แถวเต็มความกว้างแทน และใส่ตัวเลขที่คนอยากรู้ก่อนกดเข้าไป */
.list-head{margin:0 0 14px}
.list-head h2{margin:0 0 3px}
.list-head .sub{margin:0}
.form-rows{display:flex;flex-direction:column;gap:11px}
.form-item{
  background:#fff;border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);transition:.16s ease;overflow:hidden;
}
.form-item.clickable{cursor:pointer}
.form-item.clickable:hover{border-color:#ffc4a7;box-shadow:0 10px 26px rgba(255,100,30,.10);transform:translateY(-2px)}
.form-item.off{opacity:.62}
.form-row{padding:18px 20px;display:flex;align-items:center;gap:16px}

/* ── แถบความคืบหน้า ──
   ตอบคำถามแรกที่คนเปิดหน้านี้มาถาม: ทำไปถึงไหนแล้ว เหลืออีกเท่าไร
   นับเฉพาะคนที่ผู้ใช้คนนี้เห็น สาขาจึงไม่เห็นยอดของสาขาอื่น */
.fr-progress{padding:0 20px 16px;display:flex;flex-direction:column;gap:7px}
.fr-bar{height:7px;background:#eef0f3;border-radius:99px;overflow:hidden}
.fr-bar span{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,#ff8a3c,var(--orange));transition:width .3s ease}
.fr-pg{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--muted);font-weight:600}
.fr-pg b{color:var(--ink);font-weight:800}
.fr-emoji{font-size:30px;line-height:1;flex:none}
.fr-body{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.fr-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fr-title{font-size:17px;font-weight:800;letter-spacing:-.01em;line-height:1.35}
.fr-desc{font-size:14px;color:var(--muted);line-height:1.5}
.fr-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:3px}
.fr-meta span{background:var(--orange-soft);color:#b33a05;border-radius:7px;padding:2px 9px;font-weight:600}
.fr-meta b{font-weight:800}
.fr-go{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:var(--orange);color:#fff;box-shadow:0 2px 8px rgba(255,100,30,.32)}
.fr-go svg{width:17px;height:17px}
.form-item.clickable:hover .fr-go{transform:translateX(2px)}

/* ── ตาราง ── */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:860px}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:#fafbfc;font-weight:700;color:#4b5563;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fcfcfd}
.score{font-weight:800;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.stat{border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:#fff}
.stat b{display:block;font-size:25px;font-weight:800;line-height:1.25}
.stat span{color:var(--muted);font-size:13px}

/* ── การกรอกฟอร์ม ── */
.flow-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.eyebrow{margin:0 0 3px;color:var(--orange);font-weight:800;font-size:13.5px}
.progress{height:7px;background:#e9ebef;border-radius:99px;overflow:hidden;margin-top:7px;min-width:150px}
.progress span{display:block;height:100%;width:0;background:var(--orange);transition:width .25s ease}
.who-row{display:flex;gap:9px;flex-wrap:wrap;margin:-2px 0 18px}
.scale-note{background:#f8f9fa;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:20px;color:#4b5563;font-size:14px}
.scale-note b{color:var(--ink)}
.scale-note ul{margin:8px 0 0;padding-left:18px}
.section-head{margin:0 0 6px;padding-left:12px;border-left:4px solid var(--orange);font-size:18px;font-weight:800}
.qlist{display:grid;gap:13px;margin-top:18px}
.question{border:1px solid var(--line);border-radius:14px;padding:17px}
.question.unanswered{border-color:#f3c1bb;background:#fffafa}
.question p{margin:0 0 13px;font-weight:600}
.qnum{color:var(--orange);font-weight:800;margin-right:6px}
.rating-head,.rating{display:grid;gap:8px}
.rating-head{margin:0 0 8px;color:var(--muted);font-size:11.5px;text-align:center}
.rating label{position:relative;cursor:pointer;text-align:center;border:1px solid var(--line);border-radius:9px;padding:10px 4px;font-size:15px;color:#555;background:#fff;font-weight:600}
.rating input{position:absolute;opacity:0;pointer-events:none}
.rating label:has(input:checked){background:var(--orange);color:#fff;border-color:var(--orange);font-weight:800}
.rating label.na:has(input:checked){background:#667085;border-color:#667085}
.choice-list{display:grid;gap:9px}
.choice-list label{display:flex;gap:10px;align-items:center;font-weight:400;padding:11px 13px;border:1px solid var(--line);border-radius:11px;cursor:pointer}
.choice-list label:has(input:checked){border-color:var(--orange);background:var(--orange-soft)}
.choice-list input{width:18px;height:18px;accent-color:var(--orange);flex:0 0 auto}
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.success{text-align:center;padding:36px 10px}
.success-icon{width:72px;height:72px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:#eaf7ef;color:var(--green);font-size:36px;font-weight:900}
.success p{color:var(--muted);max-width:540px;margin:10px auto 24px}

/* ── กล่องซ้อน ── */
.modal{display:none;position:fixed;inset:0;background:rgba(16,24,40,.5);z-index:60;padding:18px;overflow-y:auto}
.modal.show{display:block}
.modal-box{max-width:860px;margin:18px auto;background:#fff;border-radius:16px;padding:24px}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px}
.sec-bar{height:8px;background:#eef0f3;border-radius:99px;overflow:hidden;margin-top:5px}
.sec-bar span{display:block;height:100%;background:var(--orange)}
.sec-row{margin-bottom:13px}
.sec-row .top{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.qtable{width:100%;min-width:0;font-size:13.5px;margin-top:6px}
.qtable td:last-child{text-align:right;font-weight:800;width:64px}
.qv1{color:var(--red)}.qv2{color:#b54708}.qv3{color:#475467}.qv4{color:#146c43}.qv5{color:#0b6b3a}.qvna{color:#98a2b3}
details{border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:10px}
summary{font-weight:700;cursor:pointer}
.txtblock{background:#f8f9fa;border-radius:10px;padding:11px 13px;margin-top:7px;white-space:pre-wrap;font-size:14px}

/* ── หน้ารายชื่อ ── */
.ppl-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.ppl-head h2{margin:0 0 3px}

/* ปุ่มเลือกแบบกดทีละอัน แทน dropdown ที่มีแค่สามตัวเลือก
   เห็นครบพร้อมกันโดยไม่ต้องกดเปิด และแตะง่ายกว่าบนมือถือ */
.field-label{font-weight:700;font-size:14px;display:block;margin-bottom:6px}
.seg{display:flex;gap:7px;flex-wrap:wrap}
.seg button{
  flex:1 1 auto;min-width:76px;border:1px solid #d9dde4;background:#fff;
  border-radius:10px;padding:9px 12px;font-weight:700;font-size:13.5px;color:#5b616b;
}
.seg button:hover{border-color:#b9c0ca}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* การนำเข้าจาก Excel ยังอยู่ แต่พับเก็บไว้ เพราะเป็นทางที่ใช้ครั้งแรกครั้งเดียว
   ส่วนการเพิ่มทีละคนคือสิ่งที่ต้องทำบ่อยกว่า จึงได้ปุ่มอยู่บนสุด */
.bulk{border:1px dashed #cfd4dc;border-radius:14px;background:#fbfcfd;overflow:hidden}
.bulk summary{
  cursor:pointer;padding:14px 18px;font-weight:700;font-size:14px;color:var(--muted);
  list-style:none;display:flex;align-items:center;gap:9px;
}
.bulk summary::-webkit-details-marker{display:none}
.bulk summary::before{content:"+";font-size:17px;line-height:1;color:var(--muted)}
.bulk[open] summary::before{content:"−"}
.bulk[open] summary{border-bottom:1px solid var(--line);color:var(--ink)}
.bulk-body{padding:16px 18px 18px}
.bulk-body .sub{margin-bottom:12px}
/* เลือกไฟล์ได้ หรือจะคัดลอกมาวางแบบเดิมก็ได้ ทางไหนก็ลงช่องเดียวกัน
   ไฟล์ที่อ่านแล้วจะถูกกางออกมาให้ตรวจก่อน ไม่ยิงเข้าฐานข้อมูลทันที
   เพราะรายชื่อผิดหนึ่งบรรทัดแปลว่ามีคนถูกประเมินผิดคน */
.pickfile{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.pickfile .fname{font-size:13px;color:var(--muted);min-width:0;flex:1 1 220px}
.pickfile .fname b{color:var(--ink)}
.orline{display:flex;align-items:center;gap:10px;margin:0 0 10px;color:var(--muted);font-size:12.5px}
.orline::before,.orline::after{content:"";flex:1;height:1px;background:var(--line)}

/* ── ตัวเลือกในตัวแก้ไขฟอร์ม — แทนที่ช่อง JSON เดิม ── */
.when-row{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:11px}
.pass-rows{display:flex;flex-wrap:wrap;gap:9px 20px;margin-top:11px}
.pass-rows[hidden],#eFilterBox[hidden]{display:none}
.chk-row{display:flex;flex-wrap:wrap;gap:9px 20px;margin-top:9px}
.inline{display:inline-flex;align-items:center;gap:8px;font-size:14.5px;font-weight:500;line-height:1.7}
.inline input[type=checkbox]{width:18px;height:18px;flex:none;accent-color:var(--orange);margin:0}
.inline input[type=number]{width:74px;padding:7px 9px;text-align:center;font-weight:700}
.ko-row{
  display:grid;grid-template-columns:minmax(0,1fr) auto auto auto auto auto;gap:9px;align-items:center;
  border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px;background:#fcfcfd;
}
.ko-row select,.ko-row input{padding:8px 10px;font-size:14px}
.ko-row input[type=number]{width:76px;text-align:center}
.ko-empty{color:var(--muted);font-size:14px;padding:4px 0 2px}
@media(max-width:640px){
  .when-row{grid-template-columns:1fr}
  .ko-row{grid-template-columns:1fr auto;gap:8px 10px}
  .ko-row>select{grid-column:1/-1}
  .ko-row>input[type=number],.ko-row>span{justify-self:start}
  .ko-row .ko-del{grid-column:1/-1;justify-self:start}
}

/* ── ตัวแก้ไขฟอร์ม ── */
.sec-edit{border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:13px;background:#fcfcfd}
.sec-edit .sec-top{display:grid;grid-template-columns:70px 1fr 90px auto;gap:9px;align-items:end;margin-bottom:11px}
.q-edit{display:flex;gap:8px;align-items:flex-start;margin-bottom:7px}
.q-edit textarea{min-height:44px;font-size:14px}
.q-edit .qi{flex:0 0 30px;padding-top:11px;color:var(--muted);font-size:13px;text-align:right}

@media(max-width:820px){
  .topbar{padding:10px 12px;gap:9px}
  .tb-title{font-size:15px}.tb-title small{display:none}
  /* แท็บสี่อันเรียงบนจอแคบจะตกบรรทัดเป็นสามแถว กินความสูงเกือบครึ่งจอ
     ให้เลื่อนแนวนอนแทน แถบบนจึงสูงคงที่ไม่ว่าจะมีกี่แท็บ */
  .tb-right{flex:1 1 100%;flex-wrap:nowrap;justify-content:space-between;gap:10px;min-width:0}
  .navtabs{flex:1 1 auto;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;min-width:0}
  .navtabs::-webkit-scrollbar{display:none}
  .navtab{flex:none;padding:6px 13px;font-size:13px}
  .who-tag{flex:none;max-width:130px}
  .who-nm{max-width:130px;font-size:12.5px}

  /* แถวฟอร์มบนมือถือ — ไอคอนเล็กลง ขอบในแคบลง ปุ่มไปอยู่ท้ายแถวเมตา */
  .form-row{padding:14px 15px;gap:12px;align-items:flex-start}
  .fr-progress{padding:0 15px 13px}
  .fr-emoji{font-size:25px}
  .fr-title{font-size:15.5px}
  .fr-desc{font-size:13px}
  .fr-meta{font-size:12px;gap:6px}
  .fr-go{width:30px;height:30px;align-self:center}
  main{padding:16px 12px 60px}
  .grid2{grid-template-columns:1fr}

    .select('id,company,course,batch,train_date,train_time,place,trainer,people,issued_at,saved_at');

  /* ใบที่ออกแล้วขึ้นก่อน ตามวันอบรมล่าสุด — แบบร่างที่ยังไม่มีคนไม่เอา */
  ROSTERS = (data || []).filter(r => (r.people || []).length)
    .sort((a, b) => (!!b.issued_at - !!a.issued_at) || String(b.train_date || '').localeCompare(String(a.train_date || '')));
  return ROSTERS;
}

const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));

const BRANDS = [['55','Santa Fe Easy'], ['50','Santa Fe'], ['40','เจ๊แดง จุ่มนัวร์']];
function brandOfCode(code){
  const hit = BRANDS.find(([p]) => String(code||'').startsWith(p));
  return hit ? hit[1] : '';
}

const ME = (function(){
  let s = null;
  try{ s = JSON.parse(localStorage.getItem('fab_session') || 'null'); }catch(e){}
  const role   = (s && s.role) || sessionStorage.getItem('fab_role') || '';
  const branch = (s && (s.branchName || s.name)) || sessionStorage.getItem('fab_branch_name') || '';
  const code   = (s && (s.code || s.branchCode)) || sessionStorage.getItem('fab_branch_pin') || '';

  return {

    name: (s && s.name) || branch || '',

   ⚠️ ค่าตั้งต้นต้องตรงกับ PERM_SYSTEMS.traintest ในไฟล์ index.html ของฮับ */
const TT_PERM_KEY = 'fab_perms_traintest_v1';
const TT_PERM_DEFAULTS = {
  'view-results':    ['admin','support','coo','vp','bzm'],
  'export-results':  ['admin','support','coo','vp','bzm'],
  'view-followup':   ['admin','support','coo','vp','bzm'],
  'manage-trainings':['admin','support'],
  'delete-training': ['admin'],
  'delete-attempt':  ['admin']
};
let TT_PERMS = null;
try{ TT_PERMS = JSON.parse(localStorage.getItem(TT_PERM_KEY) || 'null'); }catch(e){}
function ttCan(action){
  if (!action) return true;
  if (!ME.ok) return false;
  const p = TT_PERMS && TT_PERMS[action];
  if (!p) return (TT_PERM_DEFAULTS[action] || []).includes(ME.role);
  const code = String(ME.code || '');
  if (code && (p.deny  || []).includes(code)) return false;
  if (code && (p.allow || []).includes(code)) return true;
  return (p.roles || []).includes(ME.role);
}
async function ttLoadPerms(){
  try{
    await sbReady();
    const { data, error } = await SB.from('hub_config').select('value').eq('key','perms').limit(1);
    if (error || !data || !data.length) return false;
    const next = ((data[0] || {}).value || {}).traintest || null;
    const before = JSON.stringify(TT_PERMS || null);
    TT_PERMS = next;
    try{ localStorage.setItem(TT_PERM_KEY, JSON.stringify(next)); }catch(e){}
    return JSON.stringify(next || null) !== before;
  }catch(e){ return false; }
}

/* ชุดมาตรฐานแก้ได้ในตัวแก้ไขการอบรม เก็บที่ hub_config key 'tr_eval' = { sections:[{ title, q:[{ id, label }] }] }
   ใช้กับทุกการอบรม · ยังไม่เคยบันทึก = ใช้ EVAL_DEFAULT */
let EVAL_SECS = EVAL_DEFAULT;
const evalQs = () => EVAL_SECS.flatMap(sec => sec.q);
async function loadEvalSet(){
  try{
    const { data, error } = await SB.from('hub_config').select('value').eq('key','tr_eval').limit(1);
    const v = !error && data && data.length ? (data[0].value || {}) : {};
    if (Array.isArray(v.sections) && v.sections.length) EVAL_SECS = v.sections;
    else if (Array.isArray(v.questions) && v.questions.length) EVAL_SECS = [{ title:'', q:v.questions }];
  }catch(e){}
}
const EVAL_LV = ['', 'ปรับปรุง', 'น้อย', 'ปานกลาง', 'มาก', 'มากที่สุด'];
const evalsOf = key => attempts.filter(a => a.training_key === key && a.phase === 'eval');
const fmtD = v => v ? new Date(v).toLocaleDateString('th-TH', { day:'2-digit', month:'short', year:'numeric' }) : '—';
const fmtDT = v => v ? new Date(v).toLocaleString('th-TH', { day:'2-digit', month:'short', year:'2-digit', hour:'2-digit', minute:'2-digit' }) : '—';

function visibleTo(t){
  if (ttCan('manage-trainings') || ttCan('view-results')) return true;
  const bd = t.visible_brands || [], br = t.visible_branches || [];
  if (bd.length && !bd.includes(ME.brand)) return false;
  if (br.length && !br.some(x => ME.branch === x || String(ME.code) === String(x).split(' ')[0])) return false;
  return true;
}
/* ผู้เข้าอบรมที่ผู้ใช้คนนี้เห็น — สาขาเห็นเฉพาะคนของสาขาตัวเอง */
function participantsFor(t){
  const all = t.participants || [];
  if (!ME.isBranch) return all;
  const code = String(ME.code || '');
  return all.filter(p => !p.branch || p.branch === ME.branch || String(p.branch).split(' ')[0] === code);
}
const attemptOf = (key, phase, pid) =>
  attempts.find(a => a.training_key === key && a.phase === phase && String(a.participant_id) === String(pid));

async function loadTrainings(){
  await sbReady();
  const { data, error } = await SB.from('tr_trainings').select('*').order('sort_order').order('id');
  if (error){
    $('#view').innerHTML = '';
    msg('โหลดการอบรมไม่สำเร็จ — ' + esc(error.message) +

    return false;
  }
  trainings = data || [];
  return true;
}
async function loadAttempts(){
  await sbReady();
  const { data, error } = await SB.from('tr_attempts').select('*').order('created_at', { ascending:false });
  if (error){ msg('โหลดผลไม่สำเร็จ — ' + esc(error.message), 'err'); return; }
  attempts = data || [];
}

async function boot(){
  await sbReady();
  renderWho();
  if (!ME.ok){
    $('#view').innerHTML = `<div class="card"><div class="empty">
      <h2>ยังไม่ได้เข้าสู่ระบบ</h2>
      <p class="sub">หน้านี้ต้องเข้าผ่านหน้าหลักของฮับ</p>
      <button class="btn btn-primary" onclick="backToHub()">ไปหน้าเข้าสู่ระบบ</button>
    </div></div>`;
    return;
  }
  const okLoad = await loadTrainings();
  await loadEvalSet();
  await loadAttempts();
  renderNav();
  if (okLoad) await go('list');

  /* เข้ามาจากหน้าแบบฟอร์มทั่วไป — แบบทดสอบเป็นฟอร์มชนิดหนึ่งในนั้น
     ?run=<key>&phase=pre|post เริ่มทำเลย · ?tab=results|followup|trainings เปิดแท็บนั้น
     (&edit=<id> แก้การอบรมนั้น · &new=1 สร้างใหม่) */
  const qp = new URLSearchParams(location.search);
  if (okLoad && qp.get('run') && trainings.some(t => t.key === qp.get('run'))) startRun(qp.get('run'), ['post','eval'].includes(qp.get('phase')) ? qp.get('phase') : 'pre');
  else if (okLoad && qp.get('tab') && tabAllowed(qp.get('tab'))){
    if (qp.get('kind') === 'eval') rp.kind = 'eval';
    await go(qp.get('tab'));
    if (qp.get('tab') === 'trainings'){
      if (qp.get('edit')) editTraining(+qp.get('edit'));
      else if (qp.get('new')) newTraining();
    }
  }
  ttLoadPerms().then(changed => {
    if (!changed) return;
    renderNav();
    if (!tabAllowed(tab)) go('list');
  });
}
function tabAllowed(t){
  if (t === 'results' || t === 'report') return ttCan('view-results');
  if (t === 'followup')  return ttCan('view-followup');
  if (t === 'trainings') return ttCan('manage-trainings');
  return true;
}

function renderNav(){
  const tabs = [['list','การอบรม']];
  if (ttCan('view-results'))    tabs.push(['results','ผลก่อน–หลัง · ประเมิน']);
  if (ttCan('view-results'))    tabs.push(['report','ออกรายงาน']);
  if (ttCan('view-followup'))   tabs.push(['followup','ติดตามคนที่ยังไม่ทำ']);
  if (ttCan('manage-trainings'))tabs.push(['trainings','จัดการการอบรม']);

window.go = async function(t){
  if (!tabAllowed(t)){ tab = 'list'; renderNav(); renderList(); return msg('ไม่มีสิทธิ์เข้าหน้านี้', 'warn'); }
  if (t !== 'run') run = null;
  if (t !== 'trainings') editing = null;
  tab = t; clearMsg(); renderNav(); window.scrollTo({ top:0 });
  if (t === 'list'){ await loadTrainings(); await loadAttempts(); return renderList(); }
  if (t === 'results'){ $('#view').innerHTML = '<div class="loading">กำลังโหลด…</div>'; await loadAttempts(); return renderResults(); }
  if (t === 'followup'){ $('#view').innerHTML = '<div class="loading">กำลังโหลด…</div>'; await loadAttempts(); return renderFollowup(); }
  if (t === 'report'){ $('#view').innerHTML = '<div class="loading">กำลังโหลด…</div>'; await loadAttempts(); return renderReport(); }
  if (t === 'trainings'){ await loadTrainings(); loadHubBranches(); if (ROSTERS == null) loadRosters().catch(() => {}); return renderTrainings(); }
};

/* ══════════════════════════════════════════════════════════════════
   หน้ารายการการอบรม — เป็นที่เตือนว่ายังมีแบบทดสอบค้างอยู่
   ══════════════════════════════════════════════════════════════════ */
function pendingList(){
  /* [{training, phase, people:[...]}] — งานที่ผู้ใช้คนนี้ยังต้องทำ */
  const out = [];
  trainings.filter(t => t.status === 'open' && visibleTo(t)).forEach(t => {
    ['pre','post'].forEach(ph => {
      if (!(ph === 'pre' ? t.pre_open : t.post_open)) return;
      const miss = participantsFor(t).filter(p => !attemptOf(t.key, ph, p.id));
      if (miss.length) out.push({ training:t, phase:ph, people:miss });
    });
  });
  return out;
}

function renderList(){
  const list = trainings.filter(t => visibleTo(t) && (t.status === 'open' || ttCan('manage-trainings')));
  const pend = pendingList();
  const alert = pend.length ? `
    <div class="notice warn show">
      <b>🔔 ยังมีแบบทดสอบที่ต้องทำ</b><br>
      ${pend.map(p => `${esc(p.training.title)} — <b>${esc(PHASE[p.phase])}</b> เหลือ ${p.people.length} คน`).join('<br>')}
    </div>` : '';

  if (!list.length){
    $('#view').innerHTML = alert + `<div class="card"><div class="empty">
      ${ttCan('manage-trainings') ? 'ยังไม่มีการอบรม — สร้างได้ที่แท็บ <b>จัดการการอบรม</b>'
                                  : 'ตอนนี้ยังไม่มีการอบรมที่เปิดอยู่'}
    </div></div>`;
    return;
  }
  $('#view').innerHTML = alert + `
    <div class="list-head">
      <h2>การอบรม</h2>
      <p class="sub">ทำแบบทดสอบก่อนเรียนก่อนเริ่มอบรม และทำแบบทดสอบหลังเรียนเมื่ออบรมจบ · ไม่มีเกณฑ์ผ่าน เก็บไว้เทียบคะแนนอย่างเดียว</p>
    </div>
    <div class="form-rows">
      ${list.map(t => {
        const ppl = participantsFor(t), nq = (t.questions || []).length;
        const doneP = ppl.filter(p => attemptOf(t.key,'pre',p.id)).length;
        const doneQ = ppl.filter(p => attemptOf(t.key,'post',p.id)).length;
        const btn = (ph, on) => {
          if (!on) return `<button class="btn btn-secondary btn-sm" disabled>${esc(PHASE[ph])} · ยังไม่เปิด</button>`;
          const left = ppl.length - (ph === 'pre' ? doneP : doneQ);
          return `<button class="btn ${left ? 'btn-primary' : 'btn-secondary'} btn-sm" onclick="startRun('${esc(t.key)}','${ph}')">
            ${esc(PHASE[ph])}${left ? ` · เหลือ ${left} คน` : ' · ครบแล้ว'}</button>`;
        };
        return `<div class="form-item">
          <div class="form-row">
            <span class="fr-emoji">${esc(t.emoji || '🎓')}</span>
            <span class="fr-body">
              <span class="fr-top">
                <span class="fr-title">${esc(t.title)}</span>
                <span class="pill ${t.status === 'open' ? 'open' : t.status === 'draft' ? 'draft' : 'closed'}">${
                  t.status === 'open' ? 'เปิดอยู่' : t.status === 'draft' ? 'ร่าง' : 'จบแล้ว'}</span>
              </span>
              <span class="fr-desc">${esc(t.description || '')}</span>
              <span class="fr-meta">
                ${t.train_date ? `<span>อบรม ${esc(fmtD(t.train_date))}</span>` : ''}
                ${t.trainer ? `<span>วิทยากร ${esc(t.trainer)}</span>` : ''}
                ${nq ? `<span>${nq} ข้อ</span>` : ''}
                <span>ผู้เข้าอบรม ${ppl.length} คน</span>
              </span>
              <span class="row-btns" style="margin-top:9px">
                ${btn('pre', t.status === 'open' && t.pre_open)}
                ${btn('post', t.status === 'open' && t.post_open)}
                ${t.status === 'open' && t.post_open
                  ? `<button class="btn btn-secondary btn-sm" onclick="startRun('${esc(t.key)}','eval')">ประเมินอบรม · ${evalsOf(t.key).length}/${ppl.length}</button>`
                  : `<button class="btn btn-secondary btn-sm" disabled>ประเมินอบรม · เปิดพร้อมหลังเรียน</button>`}
              </span>
            </span>
          </div>
          <div class="fr-progress">
            <div class="fr-pg"><span>ก่อนเรียน <b>${doneP}</b>/${ppl.length}</span><span>หลังเรียน <b>${doneQ}</b>/${ppl.length}</span></div>
            <div class="fr-bar"><span style="width:${ppl.length ? Math.round(doneQ / ppl.length * 100) : 0}%"></span></div>
          </div>
        </div>`;
      }).join('')}
    </div>`;
}

/* ══════════════════════════════════════════════════════════════════
   ทำแบบทดสอบ

window.startRun = function(key, phase){
  const t = trainings.find(x => x.key === key); if (!t) return;
  if (phase === 'eval'){ run = { t, phase, answers:{} }; tab = 'run'; renderNav(); return renderEval(); }
  if (!(t.questions || []).length) return msg('การอบรมนี้ยังไม่มีคำถาม', 'warn');
  run = { t, phase, person:null, answers:{} };
  tab = 'run'; renderNav(); renderPick();
};

function renderPick(){
  const t = run.t;
  const ppl = participantsFor(t);
  const left = ppl.filter(p => !attemptOf(t.key, run.phase, p.id));
  $('#view').innerHTML = `
    <div class="card">
      <h2>${esc(t.title)} · ${esc(PHASE[run.phase])}</h2>
      <p class="sub">เลือกชื่อผู้ทำแบบทดสอบ · คนที่ทำไปแล้วจะไม่อยู่ในรายการ</p>
      ${left.length ? `
        <label>ผู้เข้าอบรม</label>
        <select id="rnWho">${left.map(p =>
          `<option value="${esc(p.id)}">${esc(p.name)}${p.branch ? ' · ' + esc(p.branch) : ''}</option>`).join('')}</select>
        <div class="row-btns" style="margin-top:14px">
          <button class="btn btn-primary" onclick="beginRun()">เริ่มทำแบบทดสอบ</button>
          <button class="btn btn-secondary" onclick="go('list')">ยกเลิก</button>
        </div>`
      : `<div class="notice ok show" style="margin:0">ทุกคนทำ${esc(PHASE[run.phase])}ครบแล้ว</div>
        <div class="row-btns" style="margin-top:14px"><button class="btn btn-secondary" onclick="go('list')">กลับ</button></div>`}
    </div>`;
}

window.beginRun = function(){
  const pid = $('#rnWho').value;
  run.person = participantsFor(run.t).find(p => String(p.id) === String(pid));
  if (!run.person) return msg('เลือกชื่อผู้ทำก่อน', 'warn');
  run.answers = {};
  renderRun();
};

function renderRun(){
  const t = run.t;
  $('#view').innerHTML = `
    <div class="card">
      <h2>${esc(t.title)} · ${esc(PHASE[run.phase])}</h2>
      <p class="sub">ผู้ทำ: <b>${esc(run.person.name)}</b>${run.person.branch ? ' · ' + esc(run.person.branch) : ''}
        <br>${(t.questions || []).length} ข้อ · คะแนนเต็ม ${(t.questions || []).length} คะแนน · ตอบแล้ว ${Object.keys(run.answers).length} ข้อ
        <br>ไม่มีเกณฑ์ผ่าน ใช้ดูว่าอบรมแล้วรู้เพิ่มขึ้นแค่ไหน</p>
    </div>
    ${(t.questions || []).map((q, i) => `
      <div class="card">
        <label>${i + 1}. ${esc(q.label)}</label>
        <div class="runch">${(q.choices || []).map((c, j) =>
          `<button type="button" class="${run.answers[q.id] === j ? 'on' : ''}" onclick="answer('${q.id}',${j})"><b>${chMark(j)}</b>${esc(c)}</button>`).join('')}</div>
      </div>`).join('')}
    <div class="card">
      <div class="row-btns">
        <button class="btn btn-primary" onclick="submitRun()">ส่งคำตอบ</button>
        <button class="btn btn-secondary" onclick="go('list')">ยกเลิก</button>
      </div>
    </div>`;
}
window.answer = function(qid, j){ run.answers[qid] = j; renderRun(); };

window.submitRun = async function(){
  const t = run.t, qs = t.questions || [];
  const miss = qs.filter(q => run.answers[q.id] == null);
  if (miss.length) return msg(`ยังตอบไม่ครบ เหลืออีก ${miss.length} ข้อ`, 'warn');
  const score = qs.reduce((a, q) => a + (run.answers[q.id] === q.answer ? 1 : 0), 0);
  const pct = qs.length ? Math.round(score / qs.length * 1000) / 10 : 0;
  const { error } = await SB.from('tr_attempts').insert({
    training_key: t.key, training_title: t.title, phase: run.phase,
    participant_id: String(run.person.id), participant_name: run.person.name,
    participant_branch: run.person.branch || ME.branch || '',
    answers: run.answers, score, total: qs.length, pct,
    taker_code: ME.code, taker_name: ME.name, taker_branch: ME.branch || ME.name
  });
  if (error) return msg('บันทึกไม่สำเร็จ — ' + esc(error.message), 'err');
  await loadAttempts();

  const done = { t, phase: run.phase, person: run.person, answers: run.answers, score, total: qs.length, pct };
  run = null;
  renderResult(done);
};

/* ── ประเมินอบรม (ไม่ระบุชื่อ) ── */
function renderEval(){
  const t = run.t;
  const note = ($('#evNote') || {}).value;
  if (note != null) run.note = note;
  let no = 0;
  $('#view').innerHTML = `
    <div class="card">
      <h2>${esc(t.title)} · ประเมินอบรม</h2>
      <p class="sub">ไม่ระบุชื่อผู้ประเมิน · 5 = มากที่สุด · 4 = มาก · 3 = ปานกลาง · 2 = น้อย · 1 = ปรับปรุง${t.trainer ? '<br>วิทยากร ' + esc(t.trainer) : ''}</p>
    </div>
    ${EVAL_SECS.map(sec => `
      ${sec.title ? `<div class="ev-sec">${esc(sec.title)}</div>` : ''}
      ${sec.q.map(q => `
      <div class="card">
        <label>${++no}. ${esc(q.label)}</label>
        <div class="evsc">${[5,4,3,2,1].map(v =>
          `<button type="button" class="${run.answers[q.id] === v ? 'on' : ''}" onclick="evAnswer('${q.id}',${v})">${v}<small>${EVAL_LV[v]}</small></button>`).join('')}</div>
      </div>`).join('')}`).join('')}
    <div class="card">
      <label>ข้อเสนอแนะเพิ่มเติม <span class="muted">(ไม่บังคับ)</span></label>
      <textarea id="evNote">${esc(run.note || '')}</textarea>
      <div class="row-btns" style="margin-top:14px">
        <button class="btn btn-primary" onclick="submitEval()">ส่งแบบประเมิน</button>
        <button class="btn btn-secondary" onclick="go('list')">ยกเลิก</button>
      </div>
    </div>`;
}
window.evAnswer = function(qid, v){ run.answers[qid] = v; const y = window.scrollY; renderEval(); window.scrollTo({ top:y }); };

window.submitEval = async function(){
  const t = run.t;
  const qs = evalQs();
  const miss = qs.filter(q => run.answers[q.id] == null);
  if (miss.length) return msg(`ยังให้คะแนนไม่ครบ เหลืออีก ${miss.length} ข้อ`, 'warn');
  const note = ($('#evNote').value || '').trim();
  const score = qs.reduce((a, q) => a + run.answers[q.id], 0), total = qs.length * 5;
  const { error } = await SB.from('tr_attempts').insert({
    training_key: t.key, training_title: t.title, phase: 'eval',
    participant_id: '', participant_name: '', participant_branch: ME.branch || '',
    answers: Object.assign({}, run.answers, note ? { note } : {}),
    score, total, pct: Math.round(score / total * 1000) / 10,
    taker_code: ME.code, taker_name: ME.name, taker_branch: ME.branch || ME.name
  });
  if (error) return msg('บันทึกไม่สำเร็จ — ' + esc(error.message), 'err');
  await loadAttempts();
  run = null;
  const n = (t.participants || []).length, got = evalsOf(t.key).length;
  $('#view').innerHTML = `
    <div class="card"><div class="empty">
      <h2>ขอบคุณสำหรับการประเมิน ✓</h2>
      <p class="sub">${esc(t.title)} · ประเมินแล้ว ${got}${n ? ' / ' + n : ''} คน</p>
      <div class="row-btns" style="justify-content:center;margin-top:14px">
        ${!n || got < n ? `<button class="btn btn-primary" onclick="startRun('${esc(t.key)}','eval')">ประเมินคนถัดไป</button>` : ''}
        <button class="btn btn-secondary" onclick="go('list')">กลับหน้าการอบรม</button>
      </div>
    </div></div>`;
  window.scrollTo({ top:0 });
};

/* หน้าผลหลังทำเสร็จ
   ก่อนเรียน = บอกแค่คะแนน ไม่เฉลยรายข้อ (ชุดเดียวกับหลังเรียน เฉลยตอนนี้ = บอกข้อสอบล่วงหน้า)
   หลังเรียน = เทียบกับก่อนเรียน + ดูรายข้อว่าข้อไหนก่อนผิดแล้วหลังถูก */
function renderResult(d){
  const t = d.t, qs = t.questions || [];
  const pre = d.phase === 'post' ? attemptOf(t.key, 'pre', d.person.id) : null;
  const diffPt = pre ? d.score - Number(pre.score) : null;
  const diffPct = pre ? Math.round((d.pct - Number(pre.pct)) * 10) / 10 : null;
  const left = participantsFor(t).filter(p => !attemptOf(t.key, d.phase, p.id)).length;
  const sign = v => (v > 0 ? '+' : '') + v;
  const box = (cls, label, a) => `<div class="${cls}"><div class="l">${label}</div>
    <div class="v">${a ? a.score : '—'}<small>${a ? ' / ' + a.total + ' คะแนน · ' + a.pct + '%' : ''}</small></div>
    <div class="bar"><span style="width:${a ? Math.max(2, a.pct) : 0}%"></span></div></div>`;

  $('#view').innerHTML = `
    <div class="card">
      <h2>${esc(t.title)} · ${esc(PHASE[d.phase])}</h2>
      <p class="sub">${esc(d.person.name)}${d.person.branch ? ' · ' + esc(d.person.branch) : ''} · บันทึกคะแนนแล้ว</p>
      <div class="rs-big">
        <div class="n">${d.score}<small> / ${d.total}</small></div>
        <div class="p">คะแนน${esc(PHASE[d.phase])} · ${d.pct}%</div>
      </div>
      ${d.phase === 'post' ? (pre ? `
        <div class="cmp">
          ${box('pre', 'ก่อนเรียน', pre)}
          ${box('post', 'หลังเรียน', { score: d.score, total: d.total, pct: d.pct })}
        </div>
        <div class="delta ${diffPt > 0 ? 'up' : diffPt < 0 ? 'down' : 'same'}">
          ${diffPt > 0 ? '▲ ดีขึ้น' : diffPt < 0 ? '▼ ลดลง' : 'เท่าเดิม'} ${diffPt === 0 ? '' : sign(diffPt) + ' คะแนน (' + sign(diffPct) + '%)'}
        </div>` : `<p class="sub" style="text-align:center">ไม่พบคะแนนก่อนเรียนของคนนี้ จึงยังเทียบไม่ได้</p>`)
      : `<p class="sub" style="text-align:center;margin-top:8px">หลังอบรมจะทำชุดเดิมอีกครั้ง แล้วระบบจะเทียบคะแนนให้</p>`}
    </div>
    ${d.phase === 'post' ? `
    <div class="card">
      <h2>รายข้อ</h2>
      <div class="table-wrap"><table class="qcmp">
        <thead><tr><th>คำถาม</th><th style="text-align:center">ก่อนเรียน</th><th style="text-align:center">หลังเรียน</th></tr></thead>
        <tbody>${qs.map((q, i) => {
          const mk = v => v == null ? '<span class="muted">—</span>' : v === q.answer ? '<span class="y">✓</span>' : '<span class="x">✗</span>';
          return `<tr><td>${i + 1}. ${esc(q.label)}<br><span class="muted" style="font-size:12.5px">ข้อถูก: ${chMark(q.answer)}. ${esc((q.choices || [])[q.answer] || '')}</span></td>
            <td class="c">${mk(pre ? (pre.answers || {})[q.id] : null)}</td><td class="c">${mk(d.answers[q.id])}</td></tr>`;
        }).join('')}</tbody>
      </table></div>
    </div>` : ''}
    <div class="card">
      <div class="row-btns">
        ${d.phase === 'post' ? `<button class="btn btn-primary" onclick="startRun('${esc(t.key)}','eval')">ประเมินอบรมต่อ ›</button>` : ''}
        ${left ? `<button class="btn ${d.phase === 'post' ? 'btn-secondary' : 'btn-primary'}" onclick="startRun('${esc(t.key)}','${d.phase}')">ทำคนถัดไป (เหลือ ${left} คน)</button>` : ''}
        <button class="btn btn-secondary" onclick="go('list')">กลับหน้าการอบรม</button>
      </div>
    </div>`;
  window.scrollTo({ top:0 });
}

/* ══════════════════════════════════════════════════════════════════
   ผลก่อน–หลัง
   ══════════════════════════════════════════════════════════════════ */
let rf = { training:'', branch:'', q:'' };

/* 1 แถว = 1 คน พร้อมคะแนนก่อนและหลังของการอบรมนั้น */
function resultRows(){
  const list = [];
  trainings.filter(t => !rf.training || t.key === rf.training).forEach(t => {
    (t.participants || []).forEach(p => {
      const pre = attemptOf(t.key,'pre',p.id), post = attemptOf(t.key,'post',p.id);
      if (!pre && !post) return;
      list.push({ t, p, pre, post,
        diff: (pre && post) ? Math.round((Number(post.pct) - Number(pre.pct)) * 10) / 10 : null });
    });
  });
  const q = (rf.q || '').trim().toLowerCase();
  return list.filter(r =>
    (!rf.branch || (r.p.branch || '') === rf.branch) &&
    (!q || (`${r.p.name} ${r.p.branch || ''} ${r.t.title}`).toLowerCase().includes(q)));
}

function renderResults(){
  const branches = [...new Set(trainings.flatMap(t => (t.participants || []).map(p => p.branch).filter(Boolean)))].sort();
  $('#view').innerHTML = `
    <div class="card">
      <h2>ผลก่อน–หลังอบรม</h2>
      <p class="sub">ไม่มีผ่าน/ไม่ผ่าน — ดูว่าคะแนนขยับขึ้นเท่าไหร่หลังอบรม</p>
      <div class="grid3">
        <div><label>การอบรม</label><select id="rfTraining">
          <option value="">ทุกการอบรม</option>
          ${trainings.map(t => `<option value="${esc(t.key)}" ${rf.training===t.key?'selected':''}>${esc(t.title)}</option>`).join('')}
        </select></div>
        <div><label>สาขา</label><select id="rfBranch">
          <option value="">ทุกสาขา</option>
          ${branches.map(b => `<option value="${esc(b)}" ${rf.branch===b?'selected':''}>${esc(b)}</option>`).join('')}
        </select></div>
        <div><label>ค้นหาชื่อ</label><input id="rfQ" value="${esc(rf.q)}" placeholder="ชื่อผู้เข้าอบรม"></div>
      </div>
      <div class="row-btns" style="margin-top:14px">
        <button class="btn btn-secondary btn-sm" onclick="go('results')">โหลดใหม่</button>
        ${ttCan('export-results') ? `<button class="btn btn-secondary btn-sm" onclick="csvResults()">⬇ ดาวน์โหลด CSV</button>` : ''}
        <button class="btn btn-secondary btn-sm" onclick="printResults()">🖨 พิมพ์รายงาน / PDF</button>
      </div>
    </div>
    <div class="stats" id="rStats"></div>
    <div class="card" style="padding:0;overflow:hidden">
      <div class="table-wrap"><table>
        <thead><tr><th>ผู้เข้าอบรม</th><th>สาขา</th><th>การอบรม</th><th>ก่อนเรียน</th><th>หลังเรียน</th><th>เปลี่ยนแปลง</th><th></th></tr></thead>
        <tbody id="rBody"></tbody>
      </table></div>
      <div class="empty" id="rEmpty" style="display:none">ยังไม่มีผลตามเงื่อนไขนี้</div>
    </div>
    <div id="rEval"></div>`;
  ['rfTraining','rfBranch'].forEach(id => $('#'+id).onchange = () => {
    rf[id === 'rfTraining' ? 'training' : 'branch'] = $('#'+id).value; paintResults(); });
  $('#rfQ').oninput = () => { rf.q = $('#rfQ').value; paintResults(); };
  paintResults();
}

const pctCell = a => a ? `<b>${a.pct}%</b> <span class="muted">(${a.score}/${a.total})</span>` : '<span class="muted">ยังไม่ทำ</span>';
const diffCell = d => d == null ? '<span class="muted">—</span>'
  : `<b style="color:${d > 0 ? 'var(--green)' : d < 0 ? 'var(--red)' : 'inherit'}">${d > 0 ? '▲ +' : d < 0 ? '▼ ' : ''}${d}%</b>`;

function paintResults(){
  const rows = resultRows();
  const both = rows.filter(r => r.diff != null);
  const avgPre  = both.length ? (both.reduce((a,r) => a + Number(r.pre.pct), 0) / both.length).toFixed(1) : '—';
  const avgPost = both.length ? (both.reduce((a,r) => a + Number(r.post.pct), 0) / both.length).toFixed(1) : '—';
  const avgDiff = both.length ? (both.reduce((a,r) => a + r.diff, 0) / both.length).toFixed(1) : '—';
  $('#rStats').innerHTML = `
    <div class="stat"><b>${rows.length}</b><span>ผู้เข้าอบรมที่มีผล</span></div>
    <div class="stat"><b>${avgPre}${avgPre==='—'?'':'%'}</b><span>เฉลี่ยก่อนเรียน</span></div>
    <div class="stat"><b>${avgPost}${avgPost==='—'?'':'%'}</b><span>เฉลี่ยหลังเรียน</span></div>
    <div class="stat"><b style="color:${avgDiff !== '—' && +avgDiff > 0 ? 'var(--green)' : 'inherit'}">${avgDiff==='—'?'—':(+avgDiff>0?'+':'')+avgDiff+'%'}</b><span>เปลี่ยนแปลงเฉลี่ย</span></div>`;
  $('#rEmpty').style.display = rows.length ? 'none' : '';
  paintEval();
  $('#rBody').innerHTML = rows.map(r => `<tr>
      <td><b>${esc(r.p.name)}</b></td>
      <td>${esc(r.p.branch || '')}</td>
      <td class="muted" style="font-size:13px">${esc(r.t.title)}</td>
      <td>${pctCell(r.pre)}</td>
      <td>${pctCell(r.post)}</td>
      <td>${diffCell(r.diff)}</td>
      <td class="row-btns">
        <button class="btn btn-secondary btn-sm" onclick="detail('${esc(r.t.key)}','${esc(r.p.id)}')">ดู</button>
      </td></tr>`).join('');
}

/* ผลประเมินอบรม — ตารางแบบรายงานเดิม: จำนวนคนต่อระดับ · คิดเป็น % (เฉลี่ย ÷ 5) · เฉลี่ยรายหมวด
   + ข้อเสนอแนะ · ของแต่ละการอบรม (ตามตัวกรองการอบรม) */
function paintEval(){
  const el = $('#rEval'); if (!el) return;
  const list = trainings.filter(t => (!rf.training || t.key === rf.training) && evalsOf(t.key).length);
  el.innerHTML = list.map(t => {
    const ev = evalsOf(t.key);
    const stat = id => {
      const vals = ev.map(e => Number((e.answers || {})[id])).filter(v => v >= 1 && v <= 5);
      const cnt = [0,0,0,0,0,0]; vals.forEach(v => cnt[v]++);
      return { cnt, pct: vals.length ? vals.reduce((a, v) => a + v, 0) / vals.length / 5 * 100 : null };
    };
    const notes = ev.map(e => (e.answers || {}).note).filter(Boolean);
    let no = 0; const all = [];
    const body = EVAL_SECS.map(sec => {
      const rows = sec.q.map(q => { const st = stat(q.id); if (st.pct != null) all.push(st.pct); return { q, st }; });
      const got = rows.filter(r => r.st.pct != null);
      const avg = got.length ? got.reduce((a, r) => a + r.st.pct, 0) / got.length : null;
      return `${sec.title ? `<tr class="ev-h"><td colspan="8">${esc(sec.title)}</td></tr>` : ''}
        ${rows.map(r => `<tr><td class="c">${++no}</td><td>${esc(r.q.label)}</td>
          ${[5,4,3,2,1].map(v => `<td class="c">${r.st.cnt[v]}</td>`).join('')}
          <td class="c"><b>${r.st.pct == null ? '—' : r.st.pct.toFixed(2)}</b></td></tr>`).join('')}
        <tr class="ev-avg"><td colspan="7">เฉลี่ย${sec.title ? ' ' + esc(sec.title) : ''}</td><td class="c">${avg == null ? '—' : avg.toFixed(2)}</td></tr>`;
    }).join('');
    const total = all.length ? all.reduce((a, v) => a + v, 0) / all.length : null;
    return `<div class="card">
      <h2>ผลประเมินอบรม · ${esc(t.title)}</h2>
      <p class="sub">ประเมินแล้ว ${ev.length}${(t.participants || []).length ? ' / ' + t.participants.length : ''} คน · ไม่ระบุชื่อ
        ${total == null ? '' : ` · ภาพรวม <b style="color:var(--ink)">${total.toFixed(2)}%</b>`}</p>
      <div class="table-wrap"><table class="ev-tb">
        <thead><tr><th class="c">ลำดับ</th><th>หัวข้อการประเมิน</th>
          ${[5,4,3,2,1].map(v => `<th class="c">${EVAL_LV[v]}<br><span class="muted">${v}</span></th>`).join('')}<th class="c">คิดเป็น %</th></tr></thead>
        <tbody>${body}</tbody>
      </table></div>
      ${notes.length ? `<h3 style="margin:16px 0 4px;font-size:15px">ข้อเสนอแนะเพิ่มเติม (${notes.length})</h3>${notes.map(n => `<div class="evcm">${esc(n)}</div>`).join('')}` : ''}
    </div>`;
  }).join('');
}

window.detail = function(key, pid){
  const t = trainings.find(x => x.key === key); if (!t) return;
  const p = (t.participants || []).find(x => String(x.id) === String(pid)); if (!p) return;
  const pre = attemptOf(key,'pre',pid), post = attemptOf(key,'post',pid);
  const rows = (t.questions || []).map((q, i) => {
    const a = v => v == null ? '—' : esc((q.choices || [])[v] ?? '—');
    const mark = (v) => v === q.answer ? '<span class="pill pass">ถูก</span>' : '<span class="pill fail">ผิด</span>';
    return `<tr>
      <td>${i + 1}. ${esc(q.label)}</td>
      <td>${pre ? a(pre.answers[q.id]) + ' ' + mark(pre.answers[q.id]) : '—'}</td>

    <div class="modal-head">
      <div>
        <h2>${esc(p.name)}</h2>

      </div>
      <div class="row-btns">
        ${ttCan('delete-attempt') && (pre || post) ? `<button class="btn btn-danger btn-sm" onclick="delAttempts('${esc(key)}','${esc(pid)}')">ลบผล</button>` : ''}
        <button class="btn btn-secondary btn-sm" onclick="closeModal()">ปิด</button>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b>${pre ? pre.pct + '%' : '—'}</b><span>ก่อนเรียน ${pre ? '· ' + fmtDT(pre.created_at) : ''}</span></div>
      <div class="stat"><b>${post ? post.pct + '%' : '—'}</b><span>หลังเรียน ${post ? '· ' + fmtDT(post.created_at) : ''}</span></div>
      <div class="stat"><b>${diff == null ? '—' : (diff > 0 ? '+' : '') + diff + '%'}</b><span>เปลี่ยนแปลง</span></div>
    </div>
    <h3 style="margin:18px 0 10px">คำตอบรายข้อ</h3>
    <div class="table-wrap"><table>
      <thead><tr><th>คำถาม</th><th>ก่อนเรียน</th><th>หลังเรียน</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="3">—</td></tr>'}</tbody>
    </table></div>`;
  $('#modal').classList.add('show');
};

window.delAttempts = async function(key, pid){
  if (!ttCan('delete-attempt')) return msg('ไม่มีสิทธิ์ลบผล', 'warn');
  if (!confirm('ลบผลทั้งก่อนและหลังเรียนของคนนี้?\n\nลบแล้วให้ทำใหม่ได้ แต่ของเดิมเอาคืนไม่ได้')) return;
  const ids = attempts.filter(a => a.training_key === key && String(a.participant_id) === String(pid)).map(a => a.id);
  for (const id of ids){
    const { error } = await SB.from('tr_attempts').delete().eq('id', id);
    if (error) return msg('ลบไม่สำเร็จ — ' + esc(error.message), 'err');
  }
  closeModal(); await loadAttempts(); paintResults(); msg('ลบผลแล้ว ให้ทำใหม่ได้');
};

/* ── CSV ── */
const csvCell = v => '"' + String(v == null ? '' : v).replace(/"/g,'""') + '"';
const stamp = () => new Date().toISOString().slice(0,10);
function download(name, text){
  const blob = new Blob(['﻿' + text], { type:'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
window.csvResults = function(){
  if (!ttCan('export-results')) return msg('ไม่มีสิทธิ์ดาวน์โหลด', 'warn');

  if (!rows.length) return msg('ยังไม่มีผลตามเงื่อนไขนี้', 'warn');
  const head = ['การอบรม','วันที่อบรม','ผู้เข้าอบรม','สาขา','ก่อนเรียน (คะแนน)','ก่อนเรียน (%)','หลังเรียน (คะแนน)','หลังเรียน (%)','เปลี่ยนแปลง (%)'];
  const body = rows.map(r => [r.t.title, fmtD(r.t.train_date), r.p.name, r.p.branch || '',
    r.pre ? `${r.pre.score}/${r.pre.total}` : '', r.pre ? r.pre.pct : '',
    r.post ? `${r.post.score}/${r.post.total}` : '', r.post ? r.post.pct : '',
    r.diff == null ? '' : r.diff].map(csvCell).join(','));
  download(`ผลก่อนหลังอบรม-${stamp()}.csv`, [head.map(csvCell).join(','), ...body].join('\r\n'));
};

function printDoc(html, title){
  let host = document.getElementById('printhost');
  if (!host){ host = document.createElement('div'); host.id = 'printhost'; document.body.appendChild(host); }
  host.innerHTML = html;
  const oldTitle = document.title;
  document.title = title || oldTitle;
  let cleaned = false;
  const cleanup = () => { if (cleaned) return; cleaned = true;
    host.innerHTML = ''; document.title = oldTitle; window.removeEventListener('afterprint', cleanup); };
  window.addEventListener('afterprint', cleanup);
  setTimeout(() => {
    try{ window.print(); }catch(e){ msg('เบราว์เซอร์ไม่รองรับการพิมพ์', 'err'); return cleanup(); }
    setTimeout(cleanup, 60000);
  }, 150);
}

/* ══════════════════════════════════════════════════════════════════
   ออกรายงาน — เลือกการอบรม + ชนิดรายงาน · ตัวอย่างบนจอเป็นกระดาษ A4 หน้าเดียวกับที่พิมพ์
   1 = ทดสอบก่อน–หลัง เปรียบเทียบ (รายคน + รายข้อ)

let rp = { training:'', kind:'test' };
const f2 = v => v == null || isNaN(v) ? '—' : Number(v).toFixed(2);
const sgn = v => (v > 0 ? '+' : '') + v;

/* หัวกระดาษ: โลโก้ · ชื่อบริษัท/หน่วยงาน · กล่องข้อมูลเอกสาร แล้วแถบชื่อรายงาน */
function rpHead(t, title, sub, code){

    <div class="lg"><img src="../logo.png" alt=""></div>
    <div class="co"><b>บริษัท เอฟเอบี ฟู้ดโฮลดิ้ง จำกัด</b><span>FAB Food Holding Co., Ltd.</span><i>ฝ่ายปฏิบัติการ · งานฝึกอบรม</i></div>
    <div class="meta">วันที่ออกรายงาน<b>${esc(fmtD(new Date()))}</b></div>

}
/* ข้อมูลหลักสูตร: ตารางสองคู่ต่อแถว · extra = [[หัว, ค่า(html)], ...] */
function rpInfo(t, extra){
  const cells = [['วันที่อบรม', esc(t.train_date ? fmtD(t.train_date) : '—')], ['สถานที่', esc(t.place || '—')],
                 ['วิทยากร', esc(t.trainer || '—')], ...(extra || [])];

  for (let i = 0; i < cells.length; i += 2) rows.push(cells[i + 1]
    ? `<tr><th>${cells[i][0]}</th><td>${cells[i][1]}</td><th>${cells[i+1][0]}</th><td>${cells[i+1][1]}</td></tr>`
    : `<tr><th>${cells[i][0]}</th><td colspan="3">${cells[i][1]}</td></tr>`);
  return `<table class="rp-info"><tbody>
    <tr><th>หลักสูตร</th><td colspan="3"><b>${esc(t.title)}</b></td></tr>
    ${rows.join('')}
  </tbody></table>`;
}
const rpSign = () => `<div class="sign">
  <div><div class="ln"></div>ผู้จัดทำรายงาน<br>วันที่ ........./........./.........</div>
  <div><div class="ln"></div>ผู้ตรวจสอบ<br>วันที่ ........./........./.........</div>
</div>
<div class="foot">FAB Operations Hub · ออกรายงานเมื่อ ${esc(fmtDT(new Date()))}</div>`;

function reportTestHtml(t){
  const ppl = t.participants || [], qs = t.questions || [];
  const rows = ppl.map(p => {
    const pre = attemptOf(t.key,'pre',p.id), post = attemptOf(t.key,'post',p.id);
    return { p, pre, post, d: pre && post ? Number(post.score) - Number(pre.score) : null };
  });
  const both = rows.filter(r => r.d != null);
  const avgOf = (list, fn) => list.length ? list.reduce((a, r) => a + fn(r), 0) / list.length : null;
  const aPre = avgOf(both, r => Number(r.pre.pct)), aPost = avgOf(both, r => Number(r.post.pct));
  const up = both.filter(r => r.d > 0).length, same = both.filter(r => r.d === 0).length, down = both.filter(r => r.d < 0).length;
  const qRows = qs.map((q, i) => {
    const cnt = ph => both.filter(r => (r[ph].answers || {})[q.id] === q.answer).length;
    const a = cnt('pre'), b = cnt('post');
    return `<tr><td class="c">${i + 1}</td><td>${esc(q.label)}</td>
      <td class="c">${a} (${both.length ? Math.round(a / both.length * 100) : 0}%)</td>
      <td class="c">${b} (${both.length ? Math.round(b / both.length * 100) : 0}%)</td>
      <td class="c ${b > a ? 'up' : b < a ? 'down' : ''}">${b === a ? '0' : sgn(b - a) + ' คน'}</td></tr>`;
  }).join('');
  return `<div class="rp">
    ${rpHead(t, 'รายงานผลการทดสอบก่อน–หลังการฝึกอบรม', 'เปรียบเทียบคะแนนแบบทดสอบชุดเดียวกัน ก่อนเรียนและหลังเรียน', 'รายงานผลทดสอบก่อน–หลัง')}
    ${rpInfo(t, [['ผู้เข้าอบรม', ppl.length + ' คน'], ['ทำครบสองรอบ', both.length + ' คน · แบบทดสอบ ' + qs.length + ' ข้อ']])}
    <div class="rp-stats">
      <div><b>${aPre == null ? '—' : aPre.toFixed(1) + '%'}</b><span>เฉลี่ยก่อนเรียน</span></div>
      <div><b>${aPost == null ? '—' : aPost.toFixed(1) + '%'}</b><span>เฉลี่ยหลังเรียน</span></div>
      <div><b>${aPre == null ? '—' : sgn((aPost - aPre).toFixed(1)) + '%'}</b><span>เปลี่ยนแปลงเฉลี่ย</span></div>
      <div><b>${up} / ${same} / ${down}</b><span>ดีขึ้น / เท่าเดิม / ลดลง (คน)</span></div>
    </div>
    <h3>1. ผลรายบุคคล</h3>
    <table>
      <thead><tr><th style="width:36px">ลำดับ</th><th>ชื่อ–สกุล</th><th>สาขา</th><th>ก่อนเรียน</th><th>หลังเรียน</th><th>เปลี่ยนแปลง</th><th>ผล</th></tr></thead>
      <tbody>${rows.map((r, i) => `<tr><td class="c">${i + 1}</td><td>${esc(r.p.name)}</td><td>${esc(r.p.branch || '')}</td>
        <td class="c">${r.pre ? `${r.pre.score}/${r.pre.total} (${r.pre.pct}%)` : 'ยังไม่ทำ'}</td>
        <td class="c">${r.post ? `${r.post.score}/${r.post.total} (${r.post.pct}%)` : 'ยังไม่ทำ'}</td>
        <td class="c ${r.d > 0 ? 'up' : r.d < 0 ? 'down' : ''}">${r.d == null ? '—' : r.d === 0 ? '0' : sgn(r.d) + ' คะแนน'}</td>
        <td class="c">${r.d == null ? '—' : r.d > 0 ? '▲ ดีขึ้น' : r.d < 0 ? '▼ ลดลง' : 'เท่าเดิม'}</td></tr>`).join('') ||
        '<tr><td colspan="7" class="c">ยังไม่มีผู้เข้าอบรม</td></tr>'}</tbody>
    </table>
    ${qs.length ? `<h3>2. ผลรายข้อ (นับเฉพาะคนที่ทำครบทั้งสองรอบ ${both.length} คน)</h3>
    <table>
      <thead><tr><th style="width:36px">ข้อ</th><th>คำถาม</th><th>ตอบถูก ก่อนเรียน</th><th>ตอบถูก หลังเรียน</th><th>เปลี่ยนแปลง</th></tr></thead>
      <tbody>${qRows}</tbody>
    </table>` : ''}
    ${rpSign()}
  </div>`;
}

function reportEvalHtml(t){
  const ev = evalsOf(t.key), ppl = (t.participants || []).length;
  const stat = id => {
    const vals = ev.map(e => Number((e.answers || {})[id])).filter(v => v >= 1 && v <= 5);
    const cnt = [0,0,0,0,0,0]; vals.forEach(v => cnt[v]++);
    const mean = vals.length ? vals.reduce((a, v) => a + v, 0) / vals.length : null;
    return { cnt, mean, pct: mean == null ? null : mean / 5 * 100 };
  };
  let no = 0; const all = [];
  const body = EVAL_SECS.map(sec => {
    const rows = sec.q.map(q => { const st = stat(q.id); if (st.pct != null) all.push(st); return { q, st }; });
    const got = rows.filter(r => r.st.pct != null);
    const avg = got.length ? got.reduce((a, r) => a + r.st.pct, 0) / got.length : null;
    const avgM = got.length ? got.reduce((a, r) => a + r.st.mean, 0) / got.length : null;
    return `${sec.title ? `<tr class="h"><td colspan="9">${esc(sec.title)}</td></tr>` : ''}
      ${rows.map(r => `<tr><td class="c">${++no}</td><td>${esc(r.q.label)}</td>
        ${[5,4,3,2,1].map(v => `<td class="c">${r.st.cnt[v]}</td>`).join('')}
        <td class="c">${f2(r.st.mean)}</td><td class="c">${f2(r.st.pct)}</td></tr>`).join('')}
      <tr class="avg"><td colspan="7">เฉลี่ย</td><td class="c">${f2(avgM)}</td><td class="c">${f2(avg)}</td></tr>`;
  }).join('');
  const tot = all.length ? all.reduce((a, x) => a + x.pct, 0) / all.length : null;
  const totM = all.length ? all.reduce((a, x) => a + x.mean, 0) / all.length : null;
  const level = m => m == null ? '—' : m >= 4.51 ? 'มากที่สุด' : m >= 3.51 ? 'มาก' : m >= 2.51 ? 'ปานกลาง' : m >= 1.51 ? 'น้อย' : 'ปรับปรุง';
  const notes = ev.map(e => (e.answers || {}).note).filter(Boolean);
  return `<div class="rp">
    ${rpHead(t, 'รายงานผลการประเมินการฝึกอบรม', '', 'รายงานผลประเมินอบรม')}
    ${rpInfo(t, [['ผู้ตอบแบบประเมิน', ev.length + ' คน'],
                 ['ผลโดยรวม', `<b>${f2(tot)}%</b>`]])}
    <table>
      <thead><tr><th rowspan="2" style="width:36px">ลำดับ</th><th rowspan="2">หัวข้อการประเมิน</th>
        <th>มากที่สุด</th><th>มาก</th><th>ปานกลาง</th><th>น้อย</th><th>ปรับปรุง</th><th rowspan="2">ค่าเฉลี่ย</th><th rowspan="2">คิดเป็น %</th></tr>
        <tr><th>5</th><th>4</th><th>3</th><th>2</th><th>1</th></tr></thead>
      <tbody>${body}
        <tr class="tot"><td colspan="7">เฉลี่ยรวมทุกหัวข้อ</td><td class="c">${f2(totM)}</td><td class="c">${f2(tot)}</td></tr></tbody>
    </table>
    <p style="font-size:10.5px;color:#555;margin:4px 0 0">ผู้เข้าอบรมประเมินแบบไม่ระบุชื่อ · 5 = มากที่สุด · 4 = มาก · 3 = ปานกลาง · 2 = น้อย · 1 = ปรับปรุง</p>
    <h3>ข้อเสนอแนะเพิ่มเติม (${notes.length})</h3>
    ${notes.length ? `<ol class="cm">${notes.map(n => `<li>${esc(n)}</li>`).join('')}</ol>` : '<p style="color:#666;margin:0">— ไม่มีข้อเสนอแนะ —</p>'}
    ${rpSign()}
  </div>`;
}

function renderReport(){
  if (!trainings.length){ $('#view').innerHTML = '<div class="card"><div class="empty">ยังไม่มีการอบรม</div></div>'; return; }
  if (!rp.training || !trainings.some(t => t.key === rp.training)) rp.training = trainings[0].key;
  const t = trainings.find(x => x.key === rp.training);
  const nEv = evalsOf(t.key).length;
  const nBoth = (t.participants || []).filter(p => attemptOf(t.key,'pre',p.id) && attemptOf(t.key,'post',p.id)).length;
  $('#view').innerHTML = `
    <div class="card">
      <h2>ออกรายงาน</h2>
      <div class="rp-bar">
        <div><label>การอบรม</label><select id="rpTraining">${trainings.map(x =>
          `<option value="${esc(x.key)}" ${x.key === rp.training ? 'selected' : ''}>${esc(x.title)}${x.train_date ? ' · ' + esc(fmtD(x.train_date)) : ''}</option>`).join('')}</select></div>
        <div class="row-btns" style="flex:none;min-width:0">
          <button class="btn btn-primary" onclick="printReport()">🖨 พิมพ์ / บันทึก PDF</button>
        </div>
      </div>
      <div class="rp-kind">
        <button type="button" class="${rp.kind === 'test' ? 'on' : ''}" onclick="rpKind('test')"><i>รายงาน 1 · ทำครบสองรอบ ${nBoth} คน</i><b>ทดสอบก่อน–หลัง เปรียบเทียบ</b></button>
        <button type="button" class="${rp.kind === 'eval' ? 'on' : ''}" onclick="rpKind('eval')"><i>รายงาน 2 · ผู้ตอบ ${nEv} คน</i><b>แบบประเมินอบรม</b></button>
      </div>
    </div>
    <div class="paper-wrap"><div class="paper">${rp.kind === 'eval' ? reportEvalHtml(t) : reportTestHtml(t)}</div></div>`;
  $('#rpTraining').onchange = () => { rp.training = $('#rpTraining').value; renderReport(); };
}
window.rpKind = function(k){ rp.kind = k; renderReport(); };
window.printReport = function(){
  const t = trainings.find(x => x.key === rp.training); if (!t) return;
  printDoc(`<div class="paper">${rp.kind === 'eval' ? reportEvalHtml(t) : reportTestHtml(t)}</div>`,
    `${rp.kind === 'eval' ? 'รายงานประเมินอบรม' : 'รายงานทดสอบก่อนหลัง'}-${(t.title || '').replace(/[\\/:*?"<>|\s]+/g,'')}-${stamp()}`);
};

   ติดตามคนที่ยังไม่ทำ

let ff = { training:'' };
function renderFollowup(){
  const list = trainings.filter(t => t.status === 'open');
  if (!list.length){
    $('#view').innerHTML = `<div class="card"><div class="empty">ยังไม่มีการอบรมที่เปิดอยู่</div></div>`;
    return;
  }
  if (!ff.training || !list.some(t => t.key === ff.training)) ff.training = list[0].key;
  const t = list.find(x => x.key === ff.training);
  const ppl = t.participants || [];
  const rows = ppl.map(p => ({ p, pre: !!attemptOf(t.key,'pre',p.id), post: !!attemptOf(t.key,'post',p.id) }));
  const missPre = rows.filter(r => !r.pre), missPost = rows.filter(r => !r.post);
  $('#view').innerHTML = `
    <div class="card">
      <h2>ติดตามคนที่ยังไม่ทำแบบทดสอบ</h2>

      <div class="grid3">
        <div><label>การอบรม</label><select id="ffTraining">${list.map(x =>
          `<option value="${esc(x.key)}" ${x.key===ff.training?'selected':''}>${esc(x.title)}</option>`).join('')}</select></div>

        <button class="btn btn-primary btn-sm" onclick="copyFollowup('post')">📋 ที่ยังไม่ทำหลังเรียน</button>
      </div>
    </div>

      <div class="stat"><b>${ppl.length}</b><span>ผู้เข้าอบรมทั้งหมด</span></div>
      <div class="stat"><b style="color:${missPre.length?'var(--red)':'inherit'}">${missPre.length}</b><span>ยังไม่ทำก่อนเรียน</span></div>
      <div class="stat"><b style="color:${missPost.length?'var(--red)':'inherit'}">${missPost.length}</b><span>ยังไม่ทำหลังเรียน</span></div>
      <div class="stat"><b>${rows.filter(r => r.pre && r.post).length}</b><span>ทำครบทั้งสองรอบ</span></div>
    </div>
    <div class="card" style="padding:0;overflow:hidden">
      <div class="table-wrap"><table>
        <thead><tr><th>ผู้เข้าอบรม</th><th>สาขา</th><th>ก่อนเรียน</th><th>หลังเรียน</th></tr></thead>
        <tbody>${rows.sort((a,b) => (a.pre + a.post) - (b.pre + b.post)).map(r => `<tr>
          <td><b>${esc(r.p.name)}</b></td><td>${esc(r.p.branch || '')}</td>
          <td>${r.pre ? '<span class="pill pass">ทำแล้ว</span>' : '<span class="pill fail">ยังไม่ทำ</span>'}</td>
          <td>${r.post ? '<span class="pill pass">ทำแล้ว</span>' : '<span class="pill fail">ยังไม่ทำ</span>'}</td>
        </tr>`).join('') || '<tr><td colspan="4"><div class="empty">ยังไม่มีรายชื่อผู้เข้าอบรม</div></td></tr>'}</tbody>
      </table></div>
    </div>`;
  $('#ffTraining').onchange = () => { ff.training = $('#ffTraining').value; renderFollowup(); };
}

window.copyFollowup = function(phase){
  const t = trainings.find(x => x.key === ff.training); if (!t) return;
  const miss = (t.participants || []).filter(p => !attemptOf(t.key, phase, p.id));
  if (!miss.length) return msg(`ทำ${PHASE[phase]}ครบทุกคนแล้ว`, 'ok');
  const text = `🎓 ${t.title}${t.train_date ? ' (อบรม ' + fmtD(t.train_date) + ')' : ''}\n` +
    `ยังไม่ได้ทำแบบทดสอบ${PHASE[phase]} ${miss.length} คน — รบกวนทำให้ครบด้วยครับ\n\n` +
    miss.map(p => '• ' + p.name + (p.branch ? ' · ' + p.branch : '')).join('\n') +
    `\n\nลิงก์: ${location.origin + location.pathname}`;
  const done = () => msg('คัดลอกข้อความแล้ว — วางส่งใน LINE ได้เลย');
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(done).catch(() => window.prompt('คัดลอกข้อความนี้', text));
  else window.prompt('คัดลอกข้อความนี้', text);
};

const newKey = () => 'tr-' + Date.now().toString(36);
window.newTraining = function(){
  editing = { key:newKey(), title:'', description:'', emoji:'🎓', train_date:'', place:'', trainer:'',
    status:'draft', questions:[], participants:[], pre_open:true, post_open:false, source:null,
    visible_brands:[], visible_branches:[], sort_order:(trainings.length + 1) };
  renderEditor();
};
window.editTraining = function(id){
  const t = trainings.find(x => x.id === id); if (!t) return;
  editing = clone(t);
  editing.questions = editing.questions || [];
  editing.participants = editing.participants || [];
  renderEditor();
};
window.delTraining = async function(id){
  if (!ttCan('delete-training')) return msg('ไม่มีสิทธิ์ลบการอบรม', 'warn');
  const t = trainings.find(x => x.id === id); if (!t) return;
  const used = attempts.filter(a => a.training_key === t.key).length;
  if (!confirm(`ลบการอบรม "${t.title}" ?\n\n` +
    (used ? `มีผลแบบทดสอบแล้ว ${used} รายการ — ผลจะไม่ถูกลบ แต่จะไม่มีตัวการอบรมให้เทียบคำถาม\n\n` : '') + 'ยืนยันการลบ?')) return;
  const { error } = await SB.from('tr_trainings').delete().eq('id', id);
  if (error) return msg('ลบไม่สำเร็จ — ' + esc(error.message), 'err');
  msg('ลบเรียบร้อย'); await loadTrainings(); renderTrainings();
};

function grabEditor(){
  document.querySelectorAll('#view [data-t]').forEach(el => {
    editing[el.dataset.t] = el.type === 'checkbox' ? el.checked : el.value;
  });
  document.querySelectorAll('#view [data-qi]').forEach(el => {
    const i = +el.dataset.qi, k = el.dataset.qk;
    if (el.dataset.qc != null) editing.questions[i].choices[+el.dataset.qc] = el.value;
    else if (k === 'choices') editing.questions[i].choices = el.value.split('\n').map(x => x.trim()).filter(Boolean);
    else editing.questions[i][k] = el.value;
  });
}
const CH_MARK = 'กขคงจฉชซฌญ';
const chMark = j => CH_MARK[j] || String(j + 1);
window.addChoice = function(i){
  grabEditor();
  const q = editing.questions[i];
  if (q.choices.length >= CH_MARK.length) return msg('ตัวเลือกมากสุด ' + CH_MARK.length + ' ข้อ', 'warn');
  q.choices.push(''); renderEditor();
};
window.delChoice = function(i, j){
  grabEditor();
  const q = editing.questions[i];
  if (q.choices.length <= 2) return msg('ต้องมีอย่างน้อย 2 ตัวเลือก', 'warn');
  q.choices.splice(j, 1);
  if (q.answer === j) q.answer = 0; else if (q.answer > j) q.answer--;
  renderEditor();
};
window.addQuestion = function(){
  grabEditor();
  editing.questions.push({ id:'q' + Date.now().toString(36) + editing.questions.length,
    label:'', choices:['','','',''], answer:0 });
  renderEditor();
};
window.delQuestion = function(i){ grabEditor(); editing.questions.splice(i,1); renderEditor(); };
window.moveQuestion = function(i, d){
  grabEditor();
  const j = i + d; if (j < 0 || j >= editing.questions.length) return;
  editing.questions.splice(j, 0, editing.questions.splice(i,1)[0]); renderEditor();
};
window.setAnswer = function(i, j){ grabEditor(); editing.questions[i].answer = j; renderEditor(); };
window.togOpen = function(k){ grabEditor(); editing[k] = !editing[k]; renderEditor(); };
window.cancelEdit = function(){ editing = null; go('trainings'); };

/* รายชื่อผู้เข้าอบรม — วางทีเดียวทั้งชุดจาก Excel ได้ (ชื่อ, สาขา, ตำแหน่ง) */
window.addPeople = function(){
  grabEditor();
  const raw = $('#ppPaste').value || '';
  const lines = raw.split('\n').map(x => x.trim()).filter(Boolean);
  if (!lines.length) return msg('วางรายชื่อก่อน (บรรทัดละ 1 คน)', 'warn');
  let n = 0;
  lines.forEach(line => {
    const part = line.split(/[\t,]/).map(x => x.trim());
    const name = part[0]; if (!name) return;
    if ((editing.participants || []).some(p => p.name === name && (p.branch || '') === (part[1] || ''))) return;
    editing.participants.push({ id:'p' + Date.now().toString(36) + n, name, branch:part[1] || '', position:part[2] || '' });
    n++;
  });
  renderEditor();
  msg(`เพิ่มผู้เข้าอบรม ${n} คน`);
};
window.delPerson = function(i){ grabEditor(); editing.participants.splice(i,1); renderEditor(); };

window.openRosters = async function(){
  grabEditor();
  try{ await Promise.all([loadRosters(), loadHubBranches()]); }
  catch(err){ return msg('โหลดรายการจาก Training Record ไม่สำเร็จ — ' + esc(err.message || err), 'err'); }
  renderEditor();
};

/* ดึงรายชื่อเข้าการอบรมนี้ — รวมกับของเดิมด้วยรหัสคน ไม่ลบใครทิ้ง
   ผลที่ทำไปแล้วผูกกับรหัสคน (participant_id) ถ้าลบแล้วสร้างใหม่ผลจะหลุด */
window.pullRoster = function(){
  grabEditor();
  const r = (ROSTERS || []).find(x => x.id === $('#trrPick').value);
  if (!r) return msg('เลือกรอบอบรมก่อน', 'warn');
  const onlyCame = $('#trrOnlyCame').checked;
  const src = (r.people || []).filter(p => !onlyCame || p.attended);
  if (!src.length) return msg(onlyCame ? 'รอบนี้ยังไม่มีคนที่เช็คชื่อว่ามาอบรม' : 'รอบนี้ไม่มีรายชื่อ', 'warn');

  const e = editing;
  if (!String(e.title || '').trim()) e.title = (r.course || '') + (r.batch ? ' รุ่นที่ ' + r.batch : '');
  if (!e.train_date && r.train_date) e.train_date = String(r.train_date).slice(0, 10);
  if (!e.place && r.place) e.place = r.place;
  if (!e.trainer && r.trainer) e.trainer = r.trainer;

  const have = new Set((e.participants || []).map(p => String(p.id)));
  let added = 0;
  src.forEach(p => {
    const id = 'trr-' + (p.id || p.empCode || p.name);
    if (have.has(id)) return;
    e.participants.push({ id, name: p.name || '', branch: branchLabel(p.branchId),
      position: p.position || '', empCode: p.empCode || '' });
    have.add(id); added++;
  });
  e.source = { system:'training-record', id:r.id, course:r.course || '', batch:r.batch || '',
    train_date:r.train_date || '', synced_at:new Date().toISOString() };
  renderEditor();
  msg(added ? `ดึงรายชื่อเพิ่ม ${added} คน (รวม ${e.participants.length} คน)` : 'รายชื่อตรงกับ Training Record แล้ว ไม่มีคนใหม่');
};

window.evDel    = function(si, qi){ evDraft[si].q.splice(qi, 1); evPaint(); };

window.evSave = async function(){

  const secs = evDraft.map(sec => ({ title:(sec.title || '').trim(),
    q:sec.q.map(q => ({ id:q.id, label:(q.label || '').trim() })).filter(q => q.label) })).filter(sec => sec.q.length);
  if (!secs.length) return msg('ต้องมีอย่างน้อย 1 ข้อ', 'warn');

};

/* ══════════════════════════════════════════════════════════════════
   นำเข้าข้อสอบ — สองทาง
   1) ไฟล์ Excel / CSV: 1 แถว = 1 ข้อ · คอลัมน์ โจทย์ | ก | ข | ค | ง | ข้อถูก
      (มีไฟล์ตัวอย่างให้โหลด · ตัวเลือกไม่ครบ 4 ก็ได้ อย่างน้อย 2)
   2) กรอกเป็นช่อง: ตารางเดียวกับในไฟล์ พิมพ์ทีละช่อง
      หรือคัดลอกหลายแถวจาก Excel มาวางที่ช่องแรก ระบบกระจายลงช่องให้
   ข้อถูกใส่ได้ทั้ง ก/ข/ค/ง · A/B/C/D · 1/2/3/4 หรือพิมพ์ข้อความตัวเลือกที่ถูก
   ══════════════════════════════════════════════════════════════════ */
const IMP_COLS = 4;                                   // ตัวเลือก ก ข ค ง
let xlsxLoading = null;
function loadXLSX(){
  if (window.XLSX) return Promise.resolve();
  if (!xlsxLoading) xlsxLoading = new Promise((ok, fail) => {
    const el = document.createElement('script');
    el.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    el.onload = () => ok();
    el.onerror = () => { xlsxLoading = null; fail(new Error('โหลดตัวอ่านไฟล์ไม่สำเร็จ')); };
    document.head.appendChild(el);
  });
  return xlsxLoading;
}

/* ข้อถูก → ลำดับตัวเลือก (0 = ก) · อ่านไม่ออก = -1 */
function impAnswerIdx(v, choices){
  const t = String(v == null ? '' : v).trim().replace(/[.)]$/, '');
  if (!t) return -1;
  let i = CH_MARK.indexOf(t);
  if (i >= 0 && t.length === 1) return i;
  if (/^[a-jA-J]$/.test(t)) return t.toUpperCase().charCodeAt(0) - 65;
  if (/^\d{1,2}$/.test(t)) return +t - 1;
  i = choices.findIndex(c => c === t);
  return i;
}
/* แถว [โจทย์, ก, ข, ค, ง, ข้อถูก] → { q, choices, answer } หรือเหตุผลที่ใช้ไม่ได้ */
function impRow(cells){
  const c = (cells || []).map(x => String(x == null ? '' : x).trim());
  const q = c[0] || '';
  const choices = c.slice(1, 1 + IMP_COLS).filter(Boolean);
  if (!q && !choices.length && !c[1 + IMP_COLS]) return null;            // แถวว่าง ข้ามเงียบ ๆ
  if (!q) return { err:'ไม่มีโจทย์' };
  if (choices.length < 2) return { err:'ตัวเลือกไม่ถึง 2 ข้อ' };
  const ans = impAnswerIdx(c[1 + IMP_COLS], choices);
  if (ans < 0 || ans >= choices.length) return { err:'ยังไม่ได้ระบุข้อถูก (ใส่ ก ข ค ง)' };
  return { q, choices, answer: ans };
}
/* หัวตารางในไฟล์ — ข้ามแถวแรกถ้าเป็นหัวคอลัมน์ */
const impIsHeader = r => /โจทย์|คำถาม|question/i.test(String((r || [])[0] || ''));

let IMP = { tab:'grid', grid:[], file:null };
const blankRows = n => Array.from({ length:n }, () => Array(2 + IMP_COLS).fill(''));

window.openImport = function(){
  grabEditor();
  IMP = { tab:'grid', grid: blankRows(5), file:null };
  renderImport();
  $('#modal').classList.add('show');
};

function impParsed(){
  const rows = IMP.tab === 'file' ? (IMP.file ? IMP.file.rows : []) : IMP.grid;
  const ok = [], bad = [];
  rows.forEach((r, i) => {
    if (IMP.tab === 'file' && i === 0 && impIsHeader(r)) return;
    const x = impRow(r);
    if (!x) return;
    if (x.err) bad.push({ n: i + 1, err: x.err }); else ok.push(x);
  });
  return { ok, bad };
}

function impSummary(){
  const { ok, bad } = impParsed();
  return `<div style="margin-top:10px">
    ${ok.length ? `<span class="pill pass">พร้อมนำเข้า ${ok.length} ข้อ</span>` : '<span class="muted">ยังไม่มีข้อที่นำเข้าได้</span>'}
    ${bad.length ? `<div class="notice warn show" style="margin:8px 0 0">แถวที่ใช้ไม่ได้ (จะถูกข้าม):<br>${
      bad.slice(0, 8).map(b => `แถว ${b.n}: ${esc(b.err)}`).join('<br>')}${bad.length > 8 ? '<br>…และอีก ' + (bad.length - 8) + ' แถว' : ''}</div>` : ''}
  </div>`;
}

function impGridHtml(){
  const head = ['โจทย์', ...Array.from({ length:IMP_COLS }, (_, j) => 'ตัวเลือก ' + chMark(j)), 'ข้อถูก'];
  return `<div class="table-wrap" style="max-height:340px;overflow:auto"><table class="impgrid">
    <thead><tr><th>#</th>${head.map(h => `<th>${esc(h)}</th>`).join('')}<th></th></tr></thead>
    <tbody>${IMP.grid.map((r, i) => `<tr>
      <td class="muted">${i + 1}</td>
      <td><input data-gr="${i}" data-gc="0" value="${esc(r[0])}" placeholder="โจทย์ข้อ ${i + 1}" style="min-width:220px"></td>
      ${Array.from({ length:IMP_COLS }, (_, j) =>
        `<td><input data-gr="${i}" data-gc="${j + 1}" value="${esc(r[j + 1])}" style="min-width:110px"></td>`).join('')}
      <td><select data-gr="${i}" data-gc="${1 + IMP_COLS}" style="min-width:70px">
        <option value="">—</option>
        ${Array.from({ length:IMP_COLS }, (_, j) =>
          `<option value="${chMark(j)}" ${String(r[1 + IMP_COLS]) === chMark(j) ? 'selected' : ''}>${chMark(j)}</option>`).join('')}
      </select></td>
      <td><button type="button" class="chdel" onclick="impDelRow(${i})" title="ลบแถว">✕</button></td>
    </tr>`).join('')}</tbody></table></div>
    <div class="row-btns" style="margin-top:8px">
      <button class="btn btn-secondary btn-sm" onclick="impAddRows(5)">+ เพิ่มอีก 5 แถว</button>
    </div>`;
}

      <button class="btn btn-secondary btn-sm" onclick="closeModal()">ปิด</button>

        <br>มีข้อสอบใน Excel อยู่แล้ว? คัดลอกหลายแถวมาวางที่ช่องโจทย์ช่องแรก ระบบกระจายลงช่องให้</p>

    : `
      <p class="sub" style="margin:0 0 8px">ไฟล์ .xlsx หรือ .csv · คอลัมน์ตามลำดับ: <b>โจทย์ | ก | ข | ค | ง | ข้อถูก</b>
        <br>ข้อถูกใส่ ก ข ค ง (หรือ 1 2 3 4) · แถวแรกเป็นหัวตารางได้</p>
      <div class="row-btns">
        <label class="btn btn-primary btn-sm" style="margin:0;cursor:pointer">📁 เลือกไฟล์

        <button class="btn btn-secondary btn-sm" onclick="impTemplate()">⬇ ดาวน์โหลดไฟล์ตัวอย่าง</button>
      </div>

    <div id="impSum">${impSummary()}</div>

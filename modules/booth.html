<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>งานบูธ & Catering เจ๊แดง</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="hub-mod.css?v=20261112">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.53.0/dist/umd/supabase.js"></script>
<script src="hub-docstore.js?v=20261112a"></script>
<style>
/* หน้ารวมหน้าเดียว: Plan งาน (ปฏิทิน) เป็นหน้าหลัก · ทะเบียนงาน & P&L เป็นหน้าต่างซ้อนที่เปิดจากงานในปฏิทิน หรือปุ่ม "รายงาน & ตั้งค่า" */
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column;background:var(--bg)}
.stage{position:relative;flex:1;min-height:0}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.addov{position:fixed;inset:0;z-index:2000;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:20px}
.addov[hidden]{display:none}
.addbox{background:var(--bg);border-radius:18px;box-shadow:0 20px 60px rgba(15,23,42,.3);width:min(1120px,100%);height:100%;max-height:calc(100vh - 40px);display:flex;flex-direction:column;overflow:hidden}
.addov.wide .addbox{width:min(1480px,100%)}
.addhd{display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--bg2);border-bottom:1px solid var(--border);font-weight:800}
.addhd .addx{margin-left:auto;border:1px solid var(--border);background:#fff;border-radius:10px;width:34px;height:34px;font-size:16px;cursor:pointer}
.addbox iframe{flex:1;min-height:0;border:0;width:100%;background:var(--bg)}
@media(max-width:760px){.addov{padding:0}.addbox{border-radius:0;max-height:none}}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><div class="logo-wrap"><img src="../logo.png" alt="FAB"></div>
    <div class="brand-text"><div class="t-title">งานบูธ &amp; Catering เจ๊แดง</div><div class="t-sub">FAB Operations &amp; Training Hub</div></div></div>
  <div class="spacer"></div>
  <span class="userchip admin" id="me">—</span>
  <button class="btn-back" id="backBtn" title="กลับหน้าหลัก"><svg viewBox="0 0 24 24" width="15" height="15"><path d="M15 18l-6-6 6-6"/></svg><span class="bt-label">กลับหน้าหลัก</span></button>
</div>

<div class="stage">
  <iframe id="fPlan" title="Plan งาน" src="planner-booth.html?embed=1"></iframe>
</div>

<div class="addov" id="addOv" hidden>
  <div class="addbox"><div class="addhd"><span id="addTtl">ทะเบียนงาน</span><button class="addx" id="addX" aria-label="ปิด">✕</button></div>
    <iframe id="fAdd" title="ทะเบียนงาน และ P&L"></iframe></div>
</div>

<script>
(function () {
  var H = window.HubMod, $ = function (id) { return document.getElementById(id); };
  /* ต้องเข้าผ่านฮับ (ไม่มี session = กลับไปล็อกอินที่ฮับ) */
  if (!H || !(H.Hub.role() && H.Hub.session())) { location.replace('../index.html'); return; }
  $('me').textContent = H.Hub.fullName() || 'ผู้ใช้ฮับ';
  $('backBtn').onclick = function () { H.Hub.back(); };

  var DEF = { 'desk-view': ['admin', 'coo', 'support'], 'desk-register': ['admin', 'support'], 'desk-sales': ['admin', 'support'], 'desk-admin': ['admin'] };
  var canDesk = false;

  /* หน้าต่างซ้อน: แอปทะเบียนงาน (New/index.html) ฝังเป็น iframe — โหลดใหม่ทุกครั้งที่เปิด */
  function showOv(title, src, wide) {
    $('addTtl').textContent = title; $('addOv').classList.toggle('wide', !!wide);
    $('fAdd').src = src; $('addOv').hidden = false;
  }
  function closeOv(refresh) {
    $('addOv').hidden = true; $('fAdd').src = 'about:blank';
    if (refresh) { try { $('fPlan').contentWindow.postMessage({ bs: 'refresh' }, location.origin); } catch (x) {} }   /* Plan ดึงงานที่เพิ่ม/แก้ใหม่ */
  }
  $('addX').onclick = function () { closeOv(true); };
  $('addOv').addEventListener('click', function (e) { if (e.target === $('addOv')) closeOv(true); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('addOv').hidden) closeOv(true); });

  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin || !e.data || !canDesk) return;
    var d = e.data;
    if (d.bs === 'add-job') {   /* + เพิ่ม → Catering/Booth: ฟอร์มลงทะเบียนงาน */
      var ty = d.type === 'booth' ? 'booth' : 'catering';
      showOv(ty === 'booth' ? 'ลงทะเบียนงาน Booth' : 'ลงทะเบียนงาน Catering', 'New/index.html?embed=1&add=' + ty);
    } else if (d.bs === 'open-event' && d.id) {   /* กดงานในปฏิทิน → หน้างาน: สลิป ยอดขาย P&L */
      showOv('งาน & P&L', 'New/index.html?embed=1&event=' + encodeURIComponent(d.id));
    } else if (d.bs === 'open-desk') {   /* ปุ่มแยก: รายงาน & P&L (dash) · เมนู & BOM (menus) */
      var vw = d.view === 'menus' ? 'menus' : 'dash';
      showOv(vw === 'menus' ? 'เมนู & BOM' : 'รายงาน & P&L · ทะเบียนงาน', 'New/index.html?embed=1&view=' + vw, true);
    } else if (d.bs === 'added') { closeOv(true); }
  });

  /* ส่วนทะเบียนงานเปิดให้เฉพาะคนที่มีสิทธิ์ข้อใดข้อหนึ่งของส่วนนี้ (หน้าสิทธิ์ของฮับ) */
  function decide() {
    canDesk = Object.keys(DEF).some(function (k) { return H.can('plannerbooth', k, DEF); });
    if (canDesk && new URLSearchParams(location.search).get('tab') === 'desk') showOv('รายงาน & P&L · ทะเบียนงาน', 'New/index.html?embed=1&view=dash', true);
  }
  var done = false, t = setTimeout(function () { if (!done) { done = true; decide(); } }, 4000);
  H.Cfg.loadSb().then(function () { clearTimeout(t); if (!done) { done = true; decide(); } }, function () { clearTimeout(t); if (!done) { done = true; decide(); } });
})();
</script>
</body>
</html>

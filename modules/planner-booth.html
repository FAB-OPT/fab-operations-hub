<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Plan งานบูธเจ๊แดง</title>
<!-- สร้างจาก modules/planner.html: โครงเดียวกัน แยกข้อมูล (col ขึ้นต้นด้วย b) แยกสิทธิ์ (plannerbooth) ไม่ซิงก์ Visit -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.53.0/dist/umd/supabase.js"></script>
<script src="hub-docstore.js?v=20261030a"></script>
<style>
:root{--ink:#111827;--ink2:#4b5563;--ink3:#9ca3af;--line:#e5e7eb;--line2:#f1f3f6;--accent:#ff7a1a;--accent-soft:#fff3e8;--accent-ink:#c2530a;--red:#be123c;--red-soft:#fff1f2;--blue:#ff7a1a;--gold-ink:#d95f0e;--today:#fff7ed;--weekend:#fbfbfd}
*{box-sizing:border-box}
html,body{margin:0;background:#f5f6f8;color:var(--ink);font-family:'Sarabun',sans-serif;font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}

/* ───── เดสก์ท็อป ───── */
.desk{display:none;min-height:100vh;padding:24px}
.desk .app{max-width:none}
.app{margin:0 auto;background:#fff;border-radius:22px;box-shadow:0 18px 50px rgba(15,23,42,.12);display:grid;grid-template-columns:232px 1fr 300px;overflow:hidden;min-height:calc(100vh - 48px)}
.side{background:#f6f7f9;border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.desk .app{overflow:clip}  /* ตัดมุมโดยไม่สร้างกรอบเลื่อน เพื่อให้แถบซ้ายติดจอได้ */
.desk .side{align-self:stretch;overflow-y:auto}  /* แถบซ้ายยืดเต็มความสูงของการ์ด พื้นหลังต่อเนื่องตอนเลื่อน */
.desk .c>*{flex-shrink:0}  /* รายการในช่องวันไม่ถูกบีบให้เตี้ยลง */
.brand h1{margin:0;font-size:18px;font-weight:800}
.add{margin:14px 0 18px;height:42px;border-radius:14px;background:var(--blue);color:#fff;font-weight:700;font-size:15px;box-shadow:0 8px 18px rgba(255,122,26,.28)}
.add:hover{filter:brightness(1.04)}
.sec{font-size:17px;font-weight:800;color:var(--ink);margin:18px 6px 8px}
.person{display:flex;align-items:center;gap:10px;height:44px;padding:0 10px;border-radius:12px;font-weight:700;font-size:16px;text-align:left;width:100%}
.person:hover{background:#eceff3}
.person.on{background:#fff;box-shadow:0 1px 3px rgba(15,23,42,.08);color:var(--gold-ink)}
.person .n{margin-left:auto;font-size:13.5px;color:var(--ink3);font-weight:700}
.cat{display:flex;align-items:center;gap:9px;height:36px;padding:0 6px;font-size:15.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.cat input{appearance:none;-webkit-appearance:none;width:13px;height:13px;border-radius:50%;border:2px solid var(--c);background:#fff;margin:0;flex:0 0 auto;cursor:pointer}
.cat input:checked{background:var(--c)}
.cat input:focus-visible{outline:2px solid #ffd2ac;outline-offset:2px}
.scard{background:#fff;border-radius:14px;padding:8px 6px 6px;box-shadow:0 1px 2px rgba(15,23,42,.05);margin-bottom:10px}
.scard h4{display:flex;align-items:center;gap:8px;margin:6px 8px 8px;font-size:15px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
.scard h4:before{content:"";width:4px;height:16px;border-radius:3px;background:var(--accent)}
.scard .person{background:transparent}
.scard .person:hover{background:#f6f7f9}
.scard .person.on{background:#fff3e8;box-shadow:none;color:var(--accent-ink)}
.scard .person.all{height:44px;margin-bottom:6px;background:#111827;color:#fff;font-weight:800;box-shadow:0 4px 10px rgba(17,24,39,.18)}
.scard .person.all .n{color:#d1d5db}
.scard .person.all:hover{background:#1f2937}
.scard .person.all.on{background:var(--accent);color:#fff}
.scard .person.all.on .n{color:#fff}
.cat .cn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addone{margin-top:auto;padding-top:14px}
.addbtn{width:100%;height:44px;border-radius:12px;border:1.5px dashed #ffb27a;background:#fffaf6;color:var(--accent-ink);font-weight:800;font-size:15.5px}
.addbtn:hover{background:#fff3e8}
.foot{font-size:12.5px;color:var(--ink3);margin-top:10px}
.sidenav{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.sidenav button{height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:15.5px;color:var(--ink2)}
.sidenav .goOut{color:var(--red);border-color:#fecdd3}
.main{padding:22px 24px;min-width:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.bar h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em}
.bar h2 span{color:var(--ink3);font-weight:700}
.seg{margin-left:auto;display:inline-flex;background:#f0f2f5;border-radius:11px;padding:3px}
.seg button{height:34px;padding:0 16px;border-radius:9px;font-weight:700;font-size:15.5px;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--gold-ink);box-shadow:0 1px 2px rgba(15,23,42,.1)}
.btn{height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:15.5px;color:var(--ink)}
.btn:hover{border-color:#ffc9a3;background:#fffaf6}
.iconb{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:18px;font-weight:700;color:var(--ink2)}
.iconb:hover{border-color:#ffc9a3;color:var(--gold-ink)}
.wd{display:grid;grid-template-columns:repeat(7,1fr);font-size:14.5px;font-weight:800;color:var(--ink3);padding:0 2px 8px}
.wd .we{color:#c8364b}
.grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(96px,1fr);flex:1;min-height:0;border-top:1px solid var(--line)}
.c{border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);padding:8px 8px 6px;display:flex;flex-direction:column;gap:4px;min-width:0;cursor:pointer}
.c:nth-child(7n){border-right:0}
.c:hover{background:#fcfcfd}
.c.out{background:#fafbfc;color:var(--ink3);cursor:default}
.c.we .dn{color:#c8364b}
.c.today{background:#eef4ff}
.c.today .dn{background:var(--accent);color:#fff}
.dn{font-size:16px;font-weight:800;width:30px;height:30px;display:grid;place-items:center;border-radius:50%}
.boothlab{display:block;font-size:12.5px;font-weight:800;color:#c2410c;background:#FFEDE3;border-radius:7px;padding:2px 8px;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bst{display:inline-block;font-size:11.5px;font-weight:800;border-radius:999px;padding:1px 8px;margin-left:6px;color:#fff;background:var(--c,#9aa3a0)}
.scard .person.bo{height:auto;min-height:48px;padding:8px 10px;align-items:flex-start;gap:6px}
.scard .person.bo .bst{margin:2px 0 0 auto;flex:0 0 auto}
.bsub{display:block;font-size:12.5px;font-weight:600;color:var(--ink3)}
.mg-cols{grid-template-columns:1fr 1fr 1fr!important}
.hol{display:block;width:100%;text-align:left;font-size:13px;font-weight:800;color:#4b5563;background:#eef1f4;border:0;border-radius:7px;padding:3px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.hol:hover{background:#e2e6eb}
.offlab{display:inline-block;margin-left:6px;vertical-align:middle;font-size:11.5px;font-weight:800;color:#4b5563;background:#eef1f4;border-radius:6px;padding:1px 6px;white-space:nowrap}
.dlg-acts-row{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 14px}
.chipbtn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;border:1px solid #d6dbe2;background:#fff;color:#1f2937;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.chipbtn:hover{background:#f3f4f6}
.chipbtn.dayoff{background:#fff7ed;border-color:#fed7aa;color:#9a3412}
.chipbtn.dayoff:hover{background:#ffedd5}
.chipbtn.dayoff i{width:8px;height:8px;border-radius:50%;background:#f59e0b;display:inline-block}
/* รายการถัดไปในแถบขวา: จัดกลุ่มตามวัน มีจุดสีหมวดหน้ารายการ */
.ug{font-size:15px;font-weight:800;margin:14px 0 6px;padding:7px 10px;border-radius:10px;background:color-mix(in srgb,var(--c,#e5e7eb) 18%,#fff)}
.ui{position:relative;padding:5px 0 9px 16px}
.ui b{display:block;font-size:14.5px;font-weight:700;line-height:1.3}
/* รายการถัดไป: ชื่อคนเล็กลงหน่อย หมวดเป็นตัวกลาง ชื่อเรื่องใหญ่สุดให้อ่านง่าย */
.ui{color:#1f2937;padding:11px 4px;border-bottom:1px solid #f1f3f6}
.ui small{display:block;font-size:13px;color:#6b7280;font-weight:700;margin-top:1px}
.ui b{display:block;font-size:16px;font-weight:700;line-height:1.35;margin-top:2px;color:#111827}
.ui .pn{display:block;font-size:14px;color:#111827;font-weight:800;margin-bottom:1px}
/* รายการถัดไปแบบการ์ด (ไม่ใช้แล้ว) */
.nx{display:flex;border-radius:12px;overflow:hidden;margin-bottom:8px;cursor:pointer;background:none;border:0;padding:0;width:100%;text-align:left;font:inherit}
.nx .dd{background:var(--c);color:#fff;width:52px;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7px 0}
.nx .dd b{font-size:20px;font-weight:800;line-height:1}
.nx .dd small{font-size:11.5px;font-weight:700;margin-top:3px}
.nx .bd{flex:1;min-width:0;background:color-mix(in srgb,var(--c) 10%,#fff);padding:7px 10px}
.nx .tt{font-size:14.5px;font-weight:700;line-height:1.3;color:#111827;overflow-wrap:anywhere}
.nx .mt{display:flex;align-items:center;gap:6px;margin-top:4px;min-width:0}
.nx .who{font-size:12px;font-weight:800;color:#fff;background:#111827;border-radius:6px;padding:1px 8px;white-space:nowrap;flex:0 0 auto}
.nx .ct{font-size:12px;font-weight:800;color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.evw{display:flex;min-width:0;border-radius:8px;overflow:hidden}
.evw .ev{flex:1;min-width:0;border-left:0;border-radius:0;background:color-mix(in srgb,var(--c) 10%,#fff)}
.evn{flex:0 1 auto;max-width:44%;display:flex;align-items:center;font-size:12.5px;font-weight:800;color:#fff;background:var(--c);padding:4px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev{font-size:13.5px;padding:3px 7px;border-left:2px solid var(--c);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:0 4px 4px 0;background:color-mix(in srgb,var(--c) 7%,#fff);text-align:left}
.ev:hover{background:color-mix(in srgb,var(--c) 16%,#fff)}
.more{font-size:13px;color:var(--ink3);font-weight:700;padding-left:6px}
.right{background:#fff;border-left:1px solid var(--line);position:relative;min-width:0}
.right-in{position:absolute;top:22px;bottom:18px;left:8px;right:12px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
.right .lab{font-size:16px;color:var(--ink);font-weight:800;margin-top:4px}
.empty{border:1.5px dashed #d6dbe3;border-radius:12px;padding:14px;color:var(--ink3);font-size:13px}
.up{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line2);align-items:center;--c:#999;cursor:pointer}
.up:first-of-type{border-top:0}
.up .d{text-align:center;line-height:1.1}
.up .d b{display:block;font-size:17px;font-weight:800}
.up .d small{font-size:11.5px;color:var(--ink2);font-weight:700}
.up .d.we b{color:#c8364b}
.up .t{font-weight:700;font-size:15px;line-height:1.3}
.up .s{font-size:12px;color:var(--c);font-weight:700;margin-top:2px}

/* ───── มือถือ ───── */
.mob{display:none;min-height:100vh;background:#f5f7fa;padding-bottom:110px}
.mtop{padding:12px 14px 10px;background:#fff}
.mtop h1{margin:0;font-size:18px;font-weight:800}
.mo{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.mo button{width:42px;height:42px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:18px}
.mo b{font-size:16px;font-weight:700}
.people{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:10px 14px 12px;background:#fff;border-bottom:1px solid var(--line)}
.people::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line);font-weight:700;font-size:14px;background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.pill.on{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 6px 14px rgba(17,24,39,.2)}
.strip{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:12px 14px 10px;background:#fff}
.strip::-webkit-scrollbar{display:none}
.dayb{flex:0 0 auto;width:50px;height:74px;border-radius:17px;background:#fff;box-shadow:0 1px 3px rgba(15,23,42,.07);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.dayb small{font-size:11px;color:var(--ink3);font-weight:600}
.dayb b{font-size:18px;font-weight:800}
.dayb.we b{color:#c8364b}
.dayb.on{background:var(--ink);color:#fff;box-shadow:0 10px 20px rgba(17,24,39,.25)}
.dayb.on small{color:#cbd5e1}
.dayb.today:not(.on){box-shadow:inset 0 0 0 1.5px var(--accent)}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:5px;height:5px;border-radius:50%}
.dayh{padding:14px 16px 10px;display:flex;align-items:baseline;gap:8px}
.dayh b{font-size:20px;font-weight:800}
.dayh span{color:var(--ink2);font-size:13.5px}
.mlist{padding:0 14px}
.card{background:#fff;border-radius:18px;box-shadow:0 2px 10px rgba(15,23,42,.06);display:flex;overflow:hidden;margin-bottom:10px;cursor:pointer;text-align:left;width:100%}
.card .bar2{width:6px;background:var(--c);flex:0 0 auto}
.card .tx{padding:14px 16px 14px 14px;min-width:0}
.card .tt{font-weight:700;font-size:16px;line-height:1.35}
.card .mt{font-size:13px;color:var(--ink2);margin-top:2px}
.tg{display:inline-block;margin-top:7px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,#fff)}
.emptyd{text-align:center;color:var(--ink3);padding:40px 0}
.tabs{position:fixed;left:0;right:0;bottom:0;height:76px;background:rgba(255,255,255,.97);box-shadow:0 -6px 18px rgba(15,23,42,.07);border-radius:22px 22px 0 0;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));z-index:20}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:var(--ink3);font-weight:600}
.tabs .ti{width:46px;height:30px;border-radius:15px;display:grid;place-items:center;font-size:17px}
.tabs button.on{color:var(--accent)}
.tabs button.on .ti{background:var(--accent-soft)}
/* มือถือ: รายการจัดกลุ่มตามวัน (สลับกับปฏิทินด้วยปุ่ม รายการ | ปฏิทิน) */
.mseg{display:flex;background:#e5e7eb;border-radius:14px;padding:4px;margin:12px 14px 4px}
.mseg div{flex:1;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:var(--ink2)}
.mseg .on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.12)}
.agenda{padding:0 14px 110px}
.agh{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;padding:10px 14px;margin-top:14px;border-radius:12px;background:color-mix(in srgb,var(--c,#e5e7eb) 16%,#fff)}
/* หัวข้อวันที่เลือกในแถบขวา: เป็นกล่องมุมโค้ง พื้นสีอ่อนตามวัน */
#selLab{padding:9px 12px;border-radius:12px;margin-bottom:10px;background:color-mix(in srgb,var(--c,#e5e7eb) 18%,#fff)}
/* วันนี้: พื้นส้มเข้มตัวขาว ให้เด่นกว่าวันอื่น */
.isToday{background:var(--accent)!important;color:#fff!important;box-shadow:0 6px 14px rgba(255,122,26,.3)}
.isToday small,.isToday span{color:#fff!important}
.hol2{font-style:normal;font-size:12.5px;font-weight:800;color:#fff;background:#c8364b;border-radius:999px;padding:2px 9px;white-space:nowrap}
.agh small{margin-left:auto;font-size:13px;font-weight:800;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:3px 10px;white-space:nowrap}
.dc{margin-bottom:12px}
.agr2{display:flex;width:100%;padding:0;border:0;background:none;border-radius:14px;overflow:hidden;margin-bottom:10px;box-shadow:0 1px 3px rgba(15,23,42,.06);text-align:left;cursor:pointer}
.agr2 .nm{background:var(--c);color:#fff;font-size:15px;font-weight:800;width:96px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2;padding:12px 8px;overflow-wrap:anywhere}
.agr2 .tt{flex:1;min-width:0;background:color-mix(in srgb,var(--c) 10%,#fff);padding:10px 12px}
.agr2 .tt small{display:block;font-size:13px;font-weight:800;color:var(--c)}
.agr2 .tt b{display:block;font-size:17px;font-weight:700;line-height:1.3;color:var(--ink);overflow-wrap:anywhere;margin-top:2px}
.agr{display:flex;align-items:center;gap:12px;width:100%;padding:12px 2px;background:none;border:0;border-bottom:1px solid var(--line2);text-align:left;cursor:pointer}
.agr .bar{width:5px;height:46px;border-radius:3px;background:var(--c);flex:0 0 auto}
.agr .tx{flex:1;min-width:0}
.agr .tx small{display:block;font-size:14px;font-weight:800;color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agr .tx b{display:block;font-size:17px;font-weight:700;line-height:1.3;color:var(--ink)}
.mob.list .strip,.mob.list .dayh,.mob.list .mlist{display:none}
.mob:not(.list) .agenda{display:none}
/* มือถือ: ตัวหนังสือใหญ่และเข้มขึ้น อ่านบนจอเล็กได้สบาย */
@media (max-width:820px){
  .mtop h1{font-size:21px}
  .mo b{font-size:18px}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mhead h1{font-size:19px;font-weight:800;white-space:nowrap}
.mnav{display:flex;justify-content:space-between;gap:8px;margin-top:10px}
.mnav button{height:36px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:700;color:var(--ink2)}
.mnav #mOut{color:var(--red);border-color:#fecdd3}
.mhead .mo{margin-top:0;gap:6px;justify-content:flex-end}
.mhead .mo button{width:36px;height:36px;border-radius:12px;font-size:17px}
.mhead .mo b{font-size:15.5px;font-weight:800;white-space:nowrap}
  .people{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;overflow:visible;padding:12px 14px 14px}
  .pill{height:42px;padding:0 6px;font-size:15px;display:flex;align-items:center;justify-content:center;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:14px;box-shadow:0 1px 2px rgba(15,23,42,.05)}
  .pill.all{grid-column:1/-1;height:46px;font-size:16px;background:var(--ink);border-color:var(--ink);color:#fff}

async function loadBranches(){
  try{
    const res=await fetch(`${HUB_CONFIG_URL}?action=config&_=${Date.now()}`).then(r=>r.json());
    if(!res||!res.ok) return;
    const users=Array.isArray(res.users)?res.users:[];
    const bzmName=nick=>{ const n=String(nick||'').trim(); if(!n) return ''; const hit=users.find(u=>u&&u.role==='bzm'&&String(u.nick||'').trim()===n); return (hit&&String(hit.name||'').trim())||n; };
    if(Array.isArray(res.jaedaengBranches)) BRANCHES.jaedaeng=res.jaedaengBranches.filter(b=>b&&b.name).map(b=>{
      const nm=(b.manager||'').trim().replace(/^(นางสาว|นาง|นาย|น\.ส\.|ดร\.|ด\.ช\.|ด\.ญ\.)\s*/,'').trim(), nick=(b.managerNick||'').trim();
      return {name:String(b.name).trim(), bzm:(!nm&&!nick)?'':(nick?`คุณ ${nm} (${nick})`.replace(/\s+/g,' ').trim():`คุณ ${nm}`)};
    });
    const sf=res.branches;
    if(sf&&sf.branches){ const st=sf.statusMap||{}, bz=sf.bzmMap||{};
      BRANCHES.santafe=Object.keys(sf.branches).filter(c=>String(c).startsWith('50')&&st[c]!=='closed').sort().map(c=>({name:`${c} ${sf.branches[c]}`.trim(), bzm:bzmName(bz[c])}));
      /* ยามะจัง (รหัส 60) และ Top Secret จากทะเบียนสาขาเดียวกันของฮับ */
      const bm=sf.brandMap||{};
      Object.keys(sf.branches).filter(c=>st[c]!=='closed').sort().forEach(c=>{
        const nm=String(sf.branches[c]||'').trim(), key=bm[c]||'';
        const bk=(key==='topsecret'||/top\s*secret/i.test(nm))?'topsecret':((key==='yamachan'||String(c).startsWith('60'))?'yamachan':'');
        if(bk) BRANCHES[bk].push({name:`${c} ${nm}`.trim(), bzm:bzmName(bz[c])});
      });
    }
  }catch(err){}
}

/* กล่องยืนยันแบบเดียวกับแอป: askBox({...}) → true/false, หรือ {name,color} เมื่อมี input */
function askBox({icon='❔',title,msg='',danger=false,input=null}){
  return new Promise(res=>{
    const box=$('ask'), ok=$('askOk'), no=$('askNo');
    $('askIc').textContent=icon;
    $('askIc').classList.toggle('danger',danger);
    $('askT').textContent=title;
    $('askM').textContent=msg; $('askM').hidden=!msg;
    $('askF').innerHTML=input?`<label class="field"><span>${esc(input.label)}</span><input id="askV" value="${esc(input.value||'')}" autocomplete="off"></label>`+(input.color?`<label class="field"><span>สีหมวด</span><input id="askC" type="color" value="${esc(input.color)}"></label>`:''):'';
    ok.textContent=input?'บันทึก':(danger?'ลบ':'ตกลง');
    ok.className='btn '+(danger?'solid':'pri');
    box.hidden=false;
    if(input) setTimeout(()=>$('askV').focus(),0);
    const done=v=>{ box.hidden=true; ok.onclick=no.onclick=box.onclick=null; res(v); };
    ok.onclick=()=>{
      if(!input) return done(true);
      const name=$('askV').value.trim();
      if(!name && !input.allowEmpty) return $('askV').focus();
      done({name,color:input.color?$('askC').value:null});
    };
    no.onclick=()=>done(input?null:false);
    /* คลิกนอกกล่องไม่ปิด · ปิดได้ด้วยปุ่มยกเลิกหรือบันทึก/ตกลงเท่านั้น */
  });
}

let offSkip={};

function weekendOffs(){
  const k=mkey(), out=[], n=new Date(Y,M+1,0).getDate();
  const real=new Set(dbPlans.filter(p=>p.type==='off').map(p=>offKey(p.person,p.date)));
  for(let d=1; d<=n; d++){
    const dow=new Date(Y,M,d).getDay();

    const iso=`${k}-${String(d).padStart(2,'0')}`;

      const key=offKey(name,iso);
      if(offSkip[key]||real.has(key)) return;
      out.push({id:'wo:'+key,person:name,date:iso,month:k,type:'off',title:'Day Off',place:'',virtual:true});
    });
  }
  return out;
}

async function saveHol(next){

async function savePlan(id,data){ await db.collection('bplans').doc(id).set(data); }
async function delPlan(id){
  if(String(id).startsWith('wo:')) return saveOffSkip(String(id).slice(3));
  const pl0=plans.find(x=>x.id===id);
  if(pl0 && pl0.type==='off' && pl0.date) await saveOffSkip(offKey(pl0.person,pl0.date));
  const pl=plans.find(x=>x.id===id);
  if(pl&&pl.src==='visit'){ const r=await visitClient.rpc('fqa_delete',{p_id:String(id).slice(2),p_brand:pl.brand||''}); if(r.error) throw r.error; refreshVisit(); return; }

}
function subscribeMonth(){
  refreshVisit();
  if(unsubMonth) unsubMonth();
  const k=mkey();

    if(k!==mkey()) return;
    dbPlans=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.date).localeCompare(String(b.date)));

    paintAll();
  });
}

function closeDlg(){ $('dlg').hidden=true; }
async function saveDlg(){
  if(editingId && String(editingId).startsWith('wo:')) return toast('Day Off อัตโนมัติแก้ไม่ได้ ให้ลบแล้วเพิ่มใหม่');
  const title=$('fTitle').value.trim(), date=$('fDate').value;
  /* หัวข้อไม่บังคับ ถ้าว่างใช้ชื่อหมวดแทน */
  const titleFinal=title||catOf($('fType').value).l;
  /* เพิ่มแผนใหม่ = ติ๊กได้หลายวันในเดือนเดียวกัน · แก้ไข = วันเดียว */
  /* ช่วงวันที่ (ตั้งแต่ - ถึง) สร้างแผนทุกวันในช่วง ไม่เกิน 62 วัน */
  const multi=!$('fDaysW').hidden;
  const from=$('fFrom').value, to=$('fTo').value;
  let dates=[date];
  if(!editingId && multi){
    if(!from||!to||to<from){ toast('ช่วงวันที่ไม่ถูกต้อง'); return; }
    dates=[];
    for(let d=new Date(from+'T00:00:00'); d<=new Date(to+'T00:00:00') && dates.length<62; d.setDate(d.getDate()+1)){
      dates.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);
    }
  }
  if(!dates.length || !dates[0] || dates[0].endsWith('-undefined')){ toast('เลือกวันที่อย่างน้อยหนึ่งวัน'); return; }
  if(editingId){ const old=plans.find(x=>x.id===editingId); if(!old||!canEditPlan(old)) return toast('แก้ไขได้เฉพาะแผนของตัวเอง'); }
  if(!canMgr && $('fPerson').value!==owner) return toast('เพิ่มแผนได้เฉพาะของตัวเอง');
  try{
    for(const dt of dates){
      const id=editingId||('p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
      const data={person:$('fPerson').value,date:dt,month:dt.slice(0,7),type:$('fType').value,title:titleFinal,place:$('fPlace').value.trim(),booth:$('fBooth').value||'',updatedAt:new Date().toISOString()};
      if(data.type==='visit' && LOCAL_VISIT[data.person]){
        const bk=$('fLBrand').value, bn=(BRANCHES[bk]||[]).length?$('fBranch').value:$('fLBranch').value.trim();
        if(!bk||!bn) return toast('เลือกแบรนด์และสาขาก่อน');
        await savePlan(id,{...data,brand:bk,branch:bn,title:`${LOCAL_BRAND_LABEL[bk]} · ${bn}`,place:LOCAL_BRAND_LABEL[bk]});
      }else if(data.type==='visit'){
        if(editingId && !String(editingId).startsWith('v:')) await db.collection('bplans').doc(editingId).delete();
        await visitWrite(editingId,data);
      }else{
        if(editingId && String(editingId).startsWith('v:')) return toast('แผน Visit เปลี่ยนหมวดไม่ได้');
        await savePlan(id,data);
      }
    }
    refreshVisit();
    /* แผนที่บันทึกไปอยู่คนละเดือนกับที่เปิดอยู่ จะหายจากหน้าจอ จึงพาไปดูเดือนนั้นให้เลย */
    const f0=dates[0];
    if(f0.slice(0,7)!==mkey()){ Y=+f0.slice(0,4); M=+f0.slice(5,7)-1; sel=+f0.slice(8,10); mSel=sel; subscribeMonth(); }
    closeDlg(); toast(dates.length>1?`บันทึก ${dates.length} วันแล้ว (เริ่ม ${f0})`:`บันทึกแล้ว (${f0})`);
  }
  catch(e){ toast(e&&e.message&&!e.code?e.message:'บันทึกไม่สำเร็จ'); }
}

    setInterval(()=>refreshVisit(),30000);
  }catch(e){
    $('notice').hidden=false; $('notice').textContent='ยังเชื่อมต่อฐานข้อมูลฮับไม่ได้ ลองรีเฟรชหน้า หรือล็อกอินฮับใหม่';
    paintAll(); return;
  }
    unsubTeam=db.doc('bconfig/team').onSnapshot(s=>{ const m=s.exists&&Array.isArray(s.data().members)?s.data().members:null; if(m&&m.length){ team=m.slice(); paintAll(); } });
  db.doc('bconfig/booths').onSnapshot(s=>{ const it=s.exists&&Array.isArray(s.data().items)?s.data().items:[]; booths=it.map(x=>({...x})); if(boothSel&&!boothOf(boothSel)) boothSel=null; paintAll(); });
  unsubCats=db.doc('bconfig/cats').onSnapshot(s=>{ const it=s.exists&&Array.isArray(s.data().items)?s.data().items:null; if(it&&it.length){ cats=it.map(x=>({...x})); paintAll(); } });
  db.doc('bconfig/offskip').onSnapshot(s=>{ const it=s.exists&&s.data()&&s.data().items&&typeof s.data().items==='object'?s.data().items:{}; offSkip={...it}; paintAll(); });
  unsubHol=db.doc(holDocId()).onSnapshot(s=>{ const it=s.exists&&s.data()&&s.data().items&&typeof s.data().items==='object'?s.data().items:{}; hols={...it}; paintAll(); });
  const n=new Date(); sel=n.getDate(); mSel=n.getDate();
  subscribeMonth();
  paintAll();
}

/* ตัวต่อฐานข้อมูลแบบเดียวกับ Firestore ที่หน้าเดิมใช้ (collection/doc/where/onSnapshot) */
function makeDb(sb){
  let cache={}, listeners=[];
  const emit=()=>listeners.slice().forEach(f=>{ try{ f(); }catch(e){} });
  const who=(()=>{ try{ const s=JSON.parse(localStorage.getItem('fab_session')||'null'); return (s&&(s.nick||s.name))||''; }catch(e){ return ''; } })();
  /* ดึงครบทุกแถวเป็นหน้า ๆ ละ 1000 (ฐานข้อมูลจำกัดการดึงต่อครั้ง ถ้าไม่แบ่งหน้า แถวใหม่จะหายตอนรีเฟรช) */
  async function refresh(){
    let all=[], from=0;
    for(;;){
      const r=await sb.from('planner_docs').select('col,id,data').eq('deleted',false).like('col','b%').order('col').order('id').range(from,from+999);
      if(r.error) throw r.error;
      all=all.concat(r.data||[]);
      if(!r.data || r.data.length<1000) break;
      from+=1000;
    }
    const c={}; all.forEach(x=>{ (c[x.col]=c[x.col]||{})[x.id]=x.data; }); cache=c; emit();
  }
  async function write(col,id,data){ const r=await sb.from('planner_docs').upsert({col,id,data,deleted:false,updated_at:new Date().toISOString(),updated_by:who}); if(r.error) throw r.error; (cache[col]=cache[col]||{})[id]=data; emit(); }
  async function remove(col,id){ const r=await sb.from('planner_docs').update({deleted:true,updated_at:new Date().toISOString(),updated_by:who}).eq('col',col).eq('id',id); if(r.error) throw r.error; if(cache[col]) delete cache[col][id]; emit(); }
  const watch=run=>{ listeners.push(run); run(); return ()=>{ listeners=listeners.filter(x=>x!==run); }; };
  const docRef=(col,id)=>({
    set:data=>write(col,id,data),
    delete:()=>remove(col,id),
    onSnapshot(cb){ return watch(()=>{ const d=(cache[col]||{})[id]; cb({exists:!!d,data:()=>d||{}}); }); }
  });
  const collection=name=>({
    doc:id=>docRef(name,id),
    where:(f,op,v)=>({
      onSnapshot(cb){ return watch(()=>{ const all=cache[name]||{}; const docs=Object.keys(all).filter(id=>op==='=='?all[id][f]===v:true).map(id=>({id,data:()=>all[id]})); cb({docs}); }); },
      async get(){ const all=cache[name]||{}; return {docs:Object.keys(all).filter(id=>op==='=='?all[id][f]===v:true).map(id=>({id,data:()=>all[id]}))}; }
    })
  });
  refresh().catch(()=>{});
  setInterval(()=>refresh().catch(()=>{}),20000);
  window.addEventListener('focus',()=>refresh().catch(()=>{}));
  return { collection, doc:path=>{ const [c,i]=path.split('/'); return docRef(c,i); } };
}

/* ตอนนี้ตัว refresh จะเรียกจากฐาน; ให้ปุ่มเริ่มใช้งานพร้อมกันทุกหน้าจอ */
document.body.classList.add('ro');
start();
</script>

<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FBFCFD">
<title>ระบบแบบฟอร์มออนไลน์ — FAB Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--orange:#ff641e;--orange-soft:#fff3ec;--ink:#17191d;--muted:#667085;--line:#e5e7eb;--bg:#f5f6f8;--card:#fff;--green:#198754;--red:#b42318;--shadow:0 8px 28px rgba(16,24,40,.06)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun',system-ui,"Leelawadee UI",Tahoma,sans-serif;font-size:15px;line-height:1.68;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:var(--orange)}

/* ── แถบบน ── */
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:30;flex-wrap:wrap}
.btn-back{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:700;color:#555}
.btn-back svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tb-title{font-size:17px;font-weight:800;margin:0}
.tb-title small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.tb-who{display:none}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* ชื่อผู้ใช้ไม่มีกรอบ ไม่มีวงกลมตัวย่อ — ตรงกับที่ฮับใช้อยู่ */
.who-tag{display:flex;flex-direction:column;align-items:flex-end;line-height:1.3;min-width:0}
.who-nm{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.who-role{color:var(--muted);font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.who-av{display:none}
.who-tx{display:contents}
.navtabs{display:flex;gap:6px;flex-wrap:wrap}
.navtab{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 15px;font-weight:700;color:#555;font-size:14px}
.navtab.on{background:var(--orange);border-color:var(--orange);color:#fff}

main{padding:22px clamp(12px,3vw,26px) 70px;max-width:1320px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:clamp(16px,3vw,24px);margin-bottom:18px}
h2{margin:0 0 4px;font-size:19px;font-weight:800;letter-spacing:-.01em}
h3{margin:0 0 4px;font-size:16px;font-weight:800}
.sub{color:var(--muted);margin:0 0 18px;font-size:14px}
.muted{color:var(--muted)}
input,select,textarea{width:100%;border:1px solid #d9dde4;border-radius:10px;background:#fff;padding:10px 12px;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,100,30,.12)}
textarea{min-height:88px;resize:vertical}
textarea.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;min-height:150px}
select:disabled,input:disabled{background:#f4f5f7;color:#8a919c}
label{font-weight:700;font-size:14px;display:block;margin-bottom:6px}
.field{margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.btn{border:0;border-radius:10px;padding:10px 18px;font-weight:750}
.btn-primary{background:var(--orange);color:#fff}.btn-primary:hover{background:#e95210}
.btn-secondary{background:#eef0f3;color:#333}
.btn-danger{background:#fff1f0;color:var(--red);border:1px solid #f5c9c4}
.btn-sm{padding:6px 12px;font-size:13.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;border-radius:99px;padding:3px 11px;font-size:12.5px;font-weight:700}
.pill.silver{background:#eef1f5;color:#475467}
.pill.gold{background:#fff5da;color:#8a6100}
.pill.pass,.pill.open{background:#eaf7ef;color:#146c43}
.pill.fail{background:#fff1f0;color:var(--red)}
.pill.off,.pill.closed{background:#f2f4f7;color:#98a2b3}
.pill.draft{background:#fff8e6;color:#8a6100}
.pill.branch{background:var(--orange-soft);color:#b33a05}
.pill.brand{background:#eef2ff;color:#3538cd}
/* ติ๊กสาขา — สาขามีหลายสิบแห่ง จัดเป็นหลายคอลัมน์และจำกัดความสูงให้เลื่อนในกรอบ */
.branch-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 14px;
  max-height:260px;overflow:auto;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:#fff}
.branch-pick label{display:flex;gap:9px;align-items:center;font-weight:400;font-size:14.5px;cursor:pointer}
/* การ์ดคะแนนที่โชว์ให้คนกรอก/สาขาเห็น */
.score-box{margin:18px 0 6px;padding:16px 18px;border:1px solid var(--line);border-radius:13px;background:#fbfcfe;text-align:left}
.score-top{display:flex;justify-content:space-between;align-items:center;gap:14px}
.score-total{font-size:30px;font-weight:800;line-height:1.1}
.score-note{margin:10px 0 0;font-size:13.5px;color:#8a6100;background:#fff8e6;border-radius:9px;padding:9px 12px}
.score-secs{margin-top:14px;display:grid;gap:11px}
.score-sec-top{display:flex;justify-content:space-between;gap:12px;font-size:14px;margin-bottom:5px}
/* ป้ายกลุ่มเป้าหมายในตารางจัดการฟอร์ม — ขึ้นบรรทัดใหม่ได้เมื่อเลือกหลายสาขา */
.pill.brand,.pill.branch{display:inline-block;margin:1px 0}
.notice{display:none;margin-bottom:16px;padding:12px 15px;border-radius:11px;font-size:14.5px;line-height:1.55}
.notice.show{display:block}
.notice.err{background:#fff1f0;color:var(--red);border:1px solid #f5c9c4}
.notice.warn{background:#fff8e6;color:#8a6100;border:1px solid #f2dfae}
.notice.ok{background:#eaf7ef;color:#146c43;border:1px solid #bfe3ce}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.loading{padding:50px;text-align:center;color:var(--muted)}

/* ── รายการฟอร์ม ── */
/* ── รายการแบบฟอร์ม ──
   ฟอร์มมีไม่กี่ชุด ตารางการ์ดจึงเหลือที่ว่างข้าง ๆ เป็นบริเวณกว้าง
   ใช้แถวเต็มความกว้างแทน และใส่ตัวเลขที่คนอยากรู้ก่อนกดเข้าไป */
.list-head{margin:0 0 14px}
.list-head h2{margin:0 0 3px}
.list-head .sub{margin:0}
.form-rows{display:flex;flex-direction:column;gap:11px}
.form-item{
  background:#fff;border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);transition:.16s ease;overflow:hidden;
}
.form-item.clickable{cursor:pointer}
.form-item.clickable:hover{border-color:#ffc4a7;box-shadow:0 10px 26px rgba(255,100,30,.10);transform:translateY(-2px)}
.form-item.off{opacity:.62}
.form-row{padding:18px 20px;display:flex;align-items:center;gap:16px}

/* ── แถบความคืบหน้า ──
   ตอบคำถามแรกที่คนเปิดหน้านี้มาถาม: ทำไปถึงไหนแล้ว เหลืออีกเท่าไร
   นับเฉพาะคนที่ผู้ใช้คนนี้เห็น สาขาจึงไม่เห็นยอดของสาขาอื่น */
.fr-progress{padding:0 20px 16px;display:flex;flex-direction:column;gap:7px}
.fr-bar{height:7px;background:#eef0f3;border-radius:99px;overflow:hidden}
.fr-bar span{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,#ff8a3c,var(--orange));transition:width .3s ease}
.fr-pg{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--muted);font-weight:600}
.fr-pg b{color:var(--ink);font-weight:800}
.fr-emoji{font-size:30px;line-height:1;flex:none}
.fr-body{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.fr-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fr-title{font-size:17px;font-weight:800;letter-spacing:-.01em;line-height:1.35}
.fr-desc{font-size:14px;color:var(--muted);line-height:1.5}
.fr-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:3px}
.fr-meta span{background:var(--orange-soft);color:#b33a05;border-radius:7px;padding:2px 9px;font-weight:600}
.fr-meta b{font-weight:800}
.fr-go{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:var(--orange);color:#fff;box-shadow:0 2px 8px rgba(255,100,30,.32)}
.fr-go svg{width:17px;height:17px}
.form-item.clickable:hover .fr-go{transform:translateX(2px)}

/* ── ตาราง ── */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:860px}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:#fafbfc;font-weight:700;color:#4b5563;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fcfcfd}
.score{font-weight:800;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.stat{border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:#fff}
.stat b{display:block;font-size:25px;font-weight:800;line-height:1.25}
.stat span{color:var(--muted);font-size:13px}

/* ── การกรอกฟอร์ม ── */
.flow-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.eyebrow{margin:0 0 3px;color:var(--orange);font-weight:800;font-size:13.5px}
.progress{height:7px;background:#e9ebef;border-radius:99px;overflow:hidden;margin-top:7px;min-width:150px}
.progress span{display:block;height:100%;width:0;background:var(--orange);transition:width .25s ease}
.who-row{display:flex;gap:9px;flex-wrap:wrap;margin:-2px 0 18px}
.scale-note{background:#f8f9fa;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:20px;color:#4b5563;font-size:14px}
.scale-note b{color:var(--ink)}
.scale-note ul{margin:8px 0 0;padding-left:18px}
.section-head{margin:0 0 6px;padding-left:12px;border-left:4px solid var(--orange);font-size:18px;font-weight:800}
.qlist{display:grid;gap:13px;margin-top:18px}
.question{border:1px solid var(--line);border-radius:14px;padding:17px}
.question.unanswered{border-color:#f3c1bb;background:#fffafa}
.question p{margin:0 0 13px;font-weight:600}
.qnum{color:var(--orange);font-weight:800;margin-right:6px}
.rating-head,.rating{display:grid;gap:8px}
.rating-head{margin:0 0 8px;color:var(--muted);font-size:11.5px;text-align:center}
.rating label{position:relative;cursor:pointer;text-align:center;border:1px solid var(--line);border-radius:9px;padding:10px 4px;font-size:15px;color:#555;background:#fff;font-weight:600}
.rating input{position:absolute;opacity:0;pointer-events:none}
.rating label:has(input:checked){background:var(--orange);color:#fff;border-color:var(--orange);font-weight:800}
.rating label.na:has(input:checked){background:#667085;border-color:#667085}
.choice-list{display:grid;gap:9px}
.choice-list label{display:flex;gap:10px;align-items:center;font-weight:400;padding:11px 13px;border:1px solid var(--line);border-radius:11px;cursor:pointer}
.choice-list label:has(input:checked){border-color:var(--orange);background:var(--orange-soft)}
.choice-list input{width:18px;height:18px;accent-color:var(--orange);flex:0 0 auto}
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.success{text-align:center;padding:36px 10px}
.success-icon{width:72px;height:72px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:#eaf7ef;color:var(--green);font-size:36px;font-weight:900}
.success p{color:var(--muted);max-width:540px;margin:10px auto 24px}

/* ── กล่องซ้อน ── */
.modal{display:none;position:fixed;inset:0;background:rgba(16,24,40,.5);z-index:60;padding:18px;overflow-y:auto}
.modal.show{display:block}
.modal-box{max-width:860px;margin:18px auto;background:#fff;border-radius:16px;padding:24px}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px}
.sec-bar{height:8px;background:#eef0f3;border-radius:99px;overflow:hidden;margin-top:5px}
.sec-bar span{display:block;height:100%;background:var(--orange)}
.sec-row{margin-bottom:13px}
.sec-row .top{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.qtable{width:100%;min-width:0;font-size:13.5px;margin-top:6px}
.qtable td:last-child{text-align:right;font-weight:800;width:64px}
.qv1{color:var(--red)}.qv2{color:#b54708}.qv3{color:#475467}.qv4{color:#146c43}.qv5{color:#0b6b3a}.qvna{color:#98a2b3}
details{border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:10px}
summary{font-weight:700;cursor:pointer}
.txtblock{background:#f8f9fa;border-radius:10px;padding:11px 13px;margin-top:7px;white-space:pre-wrap;font-size:14px}

/* ── หน้ารายชื่อ ── */
.ppl-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.ppl-head h2{margin:0 0 3px}

/* ปุ่มเลือกแบบกดทีละอัน แทน dropdown ที่มีแค่สามตัวเลือก
   เห็นครบพร้อมกันโดยไม่ต้องกดเปิด และแตะง่ายกว่าบนมือถือ */
.field-label{font-weight:700;font-size:14px;display:block;margin-bottom:6px}
.seg{display:flex;gap:7px;flex-wrap:wrap}
.seg button{
  flex:1 1 auto;min-width:76px;border:1px solid #d9dde4;background:#fff;
  border-radius:10px;padding:9px 12px;font-weight:700;font-size:13.5px;color:#5b616b;
}
.seg button:hover{border-color:#b9c0ca}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* การนำเข้าจาก Excel ยังอยู่ แต่พับเก็บไว้ เพราะเป็นทางที่ใช้ครั้งแรกครั้งเดียว
   ส่วนการเพิ่มทีละคนคือสิ่งที่ต้องทำบ่อยกว่า จึงได้ปุ่มอยู่บนสุด */
.bulk{border:1px dashed #cfd4dc;border-radius:14px;background:#fbfcfd;overflow:hidden}
.bulk summary{
  cursor:pointer;padding:14px 18px;font-weight:700;font-size:14px;color:var(--muted);
  list-style:none;display:flex;align-items:center;gap:9px;
}
.bulk summary::-webkit-details-marker{display:none}
.bulk summary::before{content:"+";font-size:17px;line-height:1;color:var(--muted)}
.bulk[open] summary::before{content:"−"}
.bulk[open] summary{border-bottom:1px solid var(--line);color:var(--ink)}
.bulk-body{padding:16px 18px 18px}
.bulk-body .sub{margin-bottom:12px}
/* เลือกไฟล์ได้ หรือจะคัดลอกมาวางแบบเดิมก็ได้ ทางไหนก็ลงช่องเดียวกัน
   ไฟล์ที่อ่านแล้วจะถูกกางออกมาให้ตรวจก่อน ไม่ยิงเข้าฐานข้อมูลทันที
   เพราะรายชื่อผิดหนึ่งบรรทัดแปลว่ามีคนถูกประเมินผิดคน */
.pickfile{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.pickfile .fname{font-size:13px;color:var(--muted);min-width:0;flex:1 1 220px}
.pickfile .fname b{color:var(--ink)}
.orline{display:flex;align-items:center;gap:10px;margin:0 0 10px;color:var(--muted);font-size:12.5px}
.orline::before,.orline::after{content:"";flex:1;height:1px;background:var(--line)}

/* ── ตัวเลือกในตัวแก้ไขฟอร์ม — แทนที่ช่อง JSON เดิม ── */
.when-row{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:11px}
.pass-rows{display:flex;flex-wrap:wrap;gap:9px 20px;margin-top:11px}
.pass-rows[hidden],#eFilterBox[hidden]{display:none}
.chk-row{display:flex;flex-wrap:wrap;gap:9px 20px;margin-top:9px}
.inline{display:inline-flex;align-items:center;gap:8px;font-size:14.5px;font-weight:500;line-height:1.7}
.inline input[type=checkbox]{width:18px;height:18px;flex:none;accent-color:var(--orange);margin:0}
.inline input[type=number]{width:74px;padding:7px 9px;text-align:center;font-weight:700}
.ko-row{
  display:grid;grid-template-columns:minmax(0,1fr) auto auto auto auto auto;gap:9px;align-items:center;
  border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px;background:#fcfcfd;
}
.ko-row select,.ko-row input{padding:8px 10px;font-size:14px}
.ko-row input[type=number]{width:76px;text-align:center}
.ko-empty{color:var(--muted);font-size:14px;padding:4px 0 2px}
@media(max-width:640px){
  .when-row{grid-template-columns:1fr}
  .ko-row{grid-template-columns:1fr auto;gap:8px 10px}
  .ko-row>select{grid-column:1/-1}
  .ko-row>input[type=number],.ko-row>span{justify-self:start}
  .ko-row .ko-del{grid-column:1/-1;justify-self:start}
}

/* ── ตัวแก้ไขฟอร์ม ── */
.sec-edit{border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:13px;background:#fcfcfd}
.sec-edit .sec-top{display:grid;grid-template-columns:70px 1fr 90px auto;gap:9px;align-items:end;margin-bottom:11px}
.q-edit{display:flex;gap:8px;align-items:flex-start;margin-bottom:7px}
.q-edit textarea{min-height:44px;font-size:14px}
.q-edit .qi{flex:0 0 30px;padding-top:11px;color:var(--muted);font-size:13px;text-align:right}

@media(max-width:820px){
  .topbar{padding:10px 12px;gap:9px}
  .tb-title{font-size:15px}.tb-title small{display:none}
  /* แท็บสี่อันเรียงบนจอแคบจะตกบรรทัดเป็นสามแถว กินความสูงเกือบครึ่งจอ
     ให้เลื่อนแนวนอนแทน แถบบนจึงสูงคงที่ไม่ว่าจะมีกี่แท็บ */
  .tb-right{flex:1 1 100%;flex-wrap:nowrap;justify-content:space-between;gap:10px;min-width:0}
  .navtabs{flex:1 1 auto;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;min-width:0}
  .navtabs::-webkit-scrollbar{display:none}
  .navtab{flex:none;padding:6px 13px;font-size:13px}
  .who-tag{flex:none;max-width:130px}
  .who-nm{max-width:130px;font-size:12.5px}

  /* แถวฟอร์มบนมือถือ — ไอคอนเล็กลง ขอบในแคบลง ปุ่มไปอยู่ท้ายแถวเมตา */
  .form-row{padding:14px 15px;gap:12px;align-items:flex-start}
  .fr-progress{padding:0 15px 13px}
  .fr-emoji{font-size:25px}
  .fr-title{font-size:15.5px}
  .fr-desc{font-size:13px}
  .fr-meta{font-size:12px;gap:6px}
  .fr-go{width:30px;height:30px;align-self:center}
  main{padding:16px 12px 60px}
  .grid2{grid-template-columns:1fr}
  .question{padding:14px 12px}.rating{gap:5px}.rating label{padding:10px 1px;font-size:14px}
  .rating-head{gap:5px;font-size:10px}
  .actions .btn{flex:1;padding:12px 8px}
  .sec-edit .sec-top{grid-template-columns:1fr 1fr}
}

/* ── เอกสารสำหรับพิมพ์ / บันทึก PDF (ซ่อนบนจอ โผล่เฉพาะตอนพิมพ์) ── */
#printhost{display:none}
@media print{
  body>*:not(#printhost){display:none!important}
  #printhost{display:block!important;padding:0;color:#111;font-size:12px}
  @page{size:A4;margin:14mm 12mm}
  #printhost h1{font-size:19px;margin:0 0 3px}
  #printhost h3{font-size:13.5px;margin:16px 0 6px;border-bottom:1px solid #bbb;padding-bottom:3px}
  #printhost p{margin:0;font-size:11.5px;color:#444}
  .pr-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
    border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:12px}
  .pr-org{text-align:right;font-weight:700;font-size:11.5px}
  .pr-org span{font-weight:400;color:#555}
  .pr-stats{display:flex;gap:10px;margin:0 0 14px}
  .pr-stats>div{flex:1;border:1px solid #bbb;border-radius:6px;padding:7px 10px}
  .pr-stats b{display:block;font-size:17px}
  .pr-stats span{font-size:10.5px;color:#555}
  .pr-table{width:100%;border-collapse:collapse;margin-bottom:8px;font-size:11.5px}
  .pr-table th,.pr-table td{border:1px solid #bbb;padding:4px 6px;text-align:left;vertical-align:top}
  .pr-table th{background:#eee;font-weight:700}
  .pr-table .num{text-align:right;white-space:nowrap}
  .pr-table tr{break-inside:avoid;page-break-inside:avoid}
  .pr-text{border:1px solid #bbb;border-radius:6px;padding:7px 9px;white-space:pre-wrap}
  .pr-foot{margin-top:14px;border-top:1px solid #bbb;padding-top:6px;color:#555}
}

/* ── สลับระบบในกลุ่มแบบฟอร์ม ──
   สามระบบนี้อยู่การ์ดเดียวกันในฮับ (คนละตาราง คนละสิทธิ์ แต่เข้าจากที่เดียว) */
.sysbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.sysbtn{display:inline-flex;align-items:center;gap:7px;text-decoration:none;
  background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:9px 15px;font-weight:700;font-size:14px;color:#4b5563;box-shadow:var(--shadow)}
.sysbtn:hover{border-color:#ffc4a7;color:var(--ink)}
.sysbtn.on{background:var(--orange);border-color:var(--orange);color:#fff;box-shadow:0 3px 10px rgba(255,100,30,.25)}
@media (max-width:640px){
  .sysbar{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
  .sysbar::-webkit-scrollbar{display:none}
  .sysbtn{flex:none;padding:8px 13px;font-size:13px}
}
@media print{ .sysbar{display:none} }

/* ════════ ใช้บนมือถือ ════════
   คนส่วนใหญ่เปิดจาก LINE บนมือถือ จึงยึดมือถือเป็นหลัก:
   เมนูอยู่แถบล่าง (นิ้วโป้งถึง) · ปุ่มหลักของแต่ละหน้าติดขอบล่างเสมอ
   · ตารางกว้าง ๆ กลายเป็นการ์ด · ข้อความแจ้งเตือนลอยให้เห็นแม้เลื่อนลงไปแล้ว */
:root{--tabbar-h:62px}
.btn,.navtab,.seg button,.tab-b,.sysbtn{touch-action:manipulation;-webkit-tap-highlight-color:transparent}

/* ปุ่มหลักติดขอบล่าง: วางไว้ท้ายเนื้อหา แล้วเกาะขอบล่างจอระหว่างเลื่อน */
.actbar{position:sticky;bottom:12px;z-index:25;margin-top:6px;display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 10px 30px rgba(16,24,40,.12)}
.actbar .grow{flex:1;min-width:0}
.actbar .btn{padding:11px 18px}
.ab-note{font-size:13px;color:var(--muted);line-height:1.35}
.ab-note b{color:var(--ink);font-size:15px}

/* ── แถบเมนูล่าง (มือถือ) ── */
.tabbar{display:none}
@media(max-width:820px){
  body.has-tabbar .tabbar{position:fixed;inset:auto 0 0 0;z-index:40;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;
    height:calc(var(--tabbar-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
    background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(16,24,40,.05)}
  .tab-b{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-size:11.5px;font-weight:700;color:#8a919c;min-height:48px;position:relative;padding:0}
  .tab-b svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .tab-b[aria-current="page"]{color:var(--orange)}
  .tab-b[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--orange)}
  body.has-tabbar main{padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 20px)}
  body.has-tabbar .actbar{bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 10px)}
  .navtabs{display:none}   /* มือถือใช้แถบล่างแทน · ตอนตอบ/แก้ฟอร์มมีปุ่มยกเลิกให้กลับ */
  .grid3{grid-template-columns:1fr}

  /* แถบบนเหลือแถวเดียว: ปุ่มกลับเป็นไอคอน · ชื่อระบบ · ชื่อผู้ใช้ */
  .topbar{flex-wrap:nowrap;padding:9px 12px;gap:10px}
  .btn-back{padding:0;width:38px;height:38px;justify-content:center;border-radius:12px;flex:none}
  .btn-back span{display:none}
  .topbar>div:nth-child(2){min-width:0;flex:1}
  .tb-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tb-right{flex:0 1 auto;min-width:0}
  body:not(.has-tabbar) .tb-right{flex:0 1 auto}
  /* แถบบนแบบแอป: ปุ่มกลับไม่มีกรอบ · ชื่อระบบตัวหนา · ชื่อผู้ใช้บรรทัดเล็กข้างใต้ */
  .topbar{padding:calc(18px + env(safe-area-inset-top)) 16px 14px 10px;gap:8px;min-height:80px}
  .btn-back{border:0;background:transparent;color:var(--ink);width:40px;height:40px;border-radius:50%}
  .btn-back:active{background:#f2f4f7}
  .btn-back svg{width:22px;height:22px;stroke-width:2.2}
  .tb-sys{display:none}
  .tb-title{font-size:18.5px;line-height:1.3;letter-spacing:-.01em}
  .tb-who{display:none;font-size:13.5px;color:var(--muted);font-weight:600;line-height:1.35;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tb-right{display:none}
  .notice.show{top:88px}

  /* ข้อความแจ้งเตือนลอยใต้แถบบน เห็นได้แม้เลื่อนลงไปกลางฟอร์มแล้ว */
  .notice.show{position:fixed;left:12px;right:12px;top:64px;z-index:70;margin:0;box-shadow:0 12px 30px rgba(16,24,40,.18)}

  main{padding:12px 12px 28px}
  .card{border-radius:16px;margin-bottom:12px;padding:15px}
  h2{font-size:17.5px}
  .sub{font-size:13.5px;margin-bottom:12px}
  input,select,textarea{font-size:16px;padding:11px 12px}   /* 16px = iPhone ไม่ซูมเข้าเองตอนแตะช่อง */
  .sysbar{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#e9ebef;border-radius:13px;padding:4px;margin-bottom:12px}
  .sysbtn{justify-content:center;box-shadow:none;border:0;background:transparent;padding:8px 6px;font-size:13px;border-radius:10px;white-space:nowrap}
  .sysbtn.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.12)}
  .sysbtn .lg{display:none}
  .actbar{border-radius:14px;padding:9px 10px}
  .actbar .btn{padding:12px 16px;font-size:15px}
}

.sysbtn .sm{display:none}
@media(max-width:820px){ .sysbtn .sm{display:inline} }
/* ── รายการฟอร์ม ── */
.lh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:2px 2px 10px}
.lh h2{margin:0}
.lh .cnt{font-size:13px;color:var(--muted);font-weight:600}
.lh .cnt b{color:var(--orange)}
.fr-line{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 0}
.fr-line span+span::before{content:"·";margin:0 6px;color:#c3c8d0}
.fr-line .due{color:#b33a05;font-weight:700}
.list-sec{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.3px;margin:16px 4px 8px}
@media(max-width:820px){
  .form-rows{gap:8px}
  .form-row{padding:13px 13px;gap:12px;align-items:center}
  .fr-emoji{font-size:24px;width:40px;height:40px;border-radius:12px;background:var(--orange-soft);display:grid;place-items:center}
  .form-item.off .fr-emoji{background:#f2f4f7}
  .fr-title{font-size:15px;line-height:1.35}
  .fr-desc{font-size:12.5px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .form-item.clickable:hover{transform:none}
  .form-item.clickable:active{transform:scale(.985)}
}

/* ── ตอบแบบฟอร์ม ── */
.fill-head{display:flex;gap:12px;align-items:flex-start}
.fill-head .fr-emoji{font-size:28px}
.fill-head h2{margin:0 0 2px;line-height:1.3}
.fill-head p{margin:0;color:var(--muted);font-size:13.5px}
.fill-prog{height:6px;background:#eef0f3;border-radius:99px;overflow:hidden;margin-top:12px}
.fill-prog span{display:block;height:100%;background:var(--orange);border-radius:99px;transition:width .25s ease}
.qcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:10px;scroll-margin-top:80px}
.qcard.miss{border-color:#f3b4ac;background:#fffafa}
.qcard.miss .qhint{display:block}
.qhint{display:none;color:var(--red);font-size:12.5px;font-weight:700;margin-top:8px}
.qlab{display:flex;gap:9px;align-items:flex-start;font-weight:700;font-size:15px;line-height:1.45;margin-bottom:10px}
.qno{flex:none;min-width:24px;height:24px;border-radius:8px;background:var(--orange-soft);color:#b33a05;font-size:12.5px;font-weight:800;display:grid;place-items:center;margin-top:1px}
.qcard.done .qno{background:var(--orange);color:#fff}
.qreq{color:var(--red);margin-left:2px}
.qhelp{font-size:13px;color:var(--muted);margin:-4px 0 10px 33px}
.seg.scale{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg.scale button{min-width:0;padding:11px 0;font-size:15px}
.seg.choice button{min-height:46px}
.seg.multi button.on::before{content:"✓ "}
@media(max-width:820px){
  .seg button{min-height:46px;font-size:14.5px}
  .qcard{padding:14px 13px}
}

/* ── คำตอบ ── */
.flt{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) minmax(0,1.5fr);gap:10px}
.flt label{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.strip{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;padding:2px 4px 12px;font-size:13px;color:var(--muted)}
.strip b{font-size:20px;color:var(--ink);font-weight:800;margin-right:4px;font-variant-numeric:tabular-nums}
.rcards{display:none}
.rc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.rc:active{background:#fafbfc}
.rc-top{display:flex;gap:10px;align-items:baseline}
.rc-top b{font-size:14.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-top span{font-size:12px;color:var(--muted);flex:none}
.rc-sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.rc-qa{margin-top:8px;display:grid;gap:4px;font-size:13px}
.rc-qa div{display:flex;gap:8px}
.rc-qa i{font-style:normal;color:var(--muted);flex:0 0 42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-qa em{font-style:normal;font-weight:700;min-width:0;overflow-wrap:anywhere}
.rc-more{font-size:12px;color:var(--orange);font-weight:700;margin-top:6px}
@media(max-width:820px){
  .flt{grid-template-columns:1fr 1fr}
  .flt>div:first-child{grid-column:1/-1}
  .tools .btn{flex:1;white-space:nowrap}
  .rtable-card{display:none}
  .rcards{display:block}
}

/* ── ติดตามสาขา ── */
.fu-sum{display:flex;align-items:center;gap:14px}
.fu-big{font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.fu-big small{font-size:15px;color:var(--muted);font-weight:700}
.fu-bar{height:8px;background:#eef0f3;border-radius:99px;overflow:hidden;margin-top:10px}
.fu-bar span{display:block;height:100%;background:var(--green);border-radius:99px}
.fu-seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:#e9ebef;border-radius:12px;padding:4px;margin:4px 0 10px}
.fu-seg button{border:0;background:transparent;border-radius:9px;padding:8px 4px;font-weight:700;font-size:13.5px;color:#5b616b;min-height:40px}
.fu-seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.12)}
.fu-seg b{font-variant-numeric:tabular-nums}
.fu-list{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.fu-row{display:flex;align-items:center;gap:10px;padding:12px 14px;font-size:14.5px}
.fu-row+.fu-row{border-top:1px solid var(--line)}
.fu-row .dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--red)}
.fu-row.ok .dot{background:var(--green)}
.fu-row b{flex:1;min-width:0;font-weight:700}
.fu-row .st{font-size:12.5px;font-weight:700;color:var(--red)}
.fu-row.ok .st{color:var(--green)}

/* ── จัดการฟอร์ม ── */
.mh{display:flex;align-items:center;gap:12px;margin:2px 2px 10px}
.mh h2{margin:0;flex:1}
.mf{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:8px}
.mf-top{display:flex;gap:11px;align-items:flex-start}
.mf-top .fr-emoji{font-size:22px}
.mf-t{flex:1;min-width:0}
.mf-t b{display:block;font-size:15px;line-height:1.35}
.mf-acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.mf-acts .btn{flex:1 1 auto}
.sg-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:4px}
.sg-tiles button{border:1px solid var(--line);background:#fafbfc;border-radius:12px;padding:10px 8px;font-weight:700;font-size:13px;color:#333;min-height:46px}
.sg-tiles button.pri{background:var(--orange);border-color:var(--orange);color:#fff}
@media(max-width:820px){ .sg-tiles{grid-template-columns:1fr 1fr} }

/* ── ตัวแก้ไขฟอร์ม ── */
.qtypes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.qtypes button{border:1px dashed #cfd4dc;background:#fbfcfd;border-radius:12px;padding:10px 6px;font-weight:700;font-size:13px;color:#4b5563;min-height:48px;
  display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.25}
.qtypes button span{font-size:18px}
.qtypes button:hover{border-color:var(--orange);color:var(--ink)}
.qe{background:#fafbfc;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.qe-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.qe-top b{flex:1;font-size:13.5px}
.ib{border:1px solid var(--line);background:#fff;border-radius:10px;width:36px;height:36px;font-size:15px;color:#555;display:grid;place-items:center;padding:0}
.ib.del{color:var(--red);border-color:#f5c9c4;background:#fff8f7}
.qe-req{display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:600;font-size:14px}
.qe-req input{width:20px;height:20px;accent-color:var(--orange)}
@media(max-width:820px){ .qtypes{grid-template-columns:repeat(2,minmax(0,1fr))} }
/* มือถือ: กล่องซ้าย/ขวาของจอคอมยุบรวมเป็นคอลัมน์เดียว ปุ่มหลักยังเกาะขอบล่างได้ตลอดหน้า */
@media(max-width:820px){
  .flt>.tools{grid-column:1/-1}
  .ed-grid>div{display:contents}
  .fu-grid{display:flex;flex-direction:column}
  .fu-side,.fu-main{display:contents}
  .fu-side .actbar{order:9}
}

/* ── กล่องซ้อนกลายเป็นแผ่นเลื่อนขึ้นจากขอบล่างบนมือถือ ── */
@media(max-width:640px){
  .modal{padding:0;display:none;align-items:flex-end}
  .modal.show{display:flex}
  .modal-box{margin:0;width:100%;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  .modal-box::before{content:"";display:block;width:40px;height:4px;border-radius:9px;background:#d9dde4;margin:-6px auto 12px}
  .modal-head{flex-direction:column;gap:10px}
  .modal-head .row-btns{width:100%}
  .modal-head .row-btns .btn{flex:1}
  .qtable td{padding:9px 6px;vertical-align:top}
  .qtable td:last-child{width:auto;max-width:48%}
}
@media print{ .tabbar,.actbar{display:none!important} }

/* ════════ ใบสั่ง ════════
   ฟอร์มหนึ่งใบ = ใบสั่งหนึ่งใบ: หัวบอกจำนวนข้อ/วันปิดรับ · ชื่อฟอร์ม · รอยปรุ · ท้ายใบเป็นสิ่งที่ต้องทำ
   สาขา: ปุ่มเริ่มตอบ / ตอบแล้ว · ผู้ดูแล: ตอบแล้วกี่สาขา + ปุ่มดูคำตอบ/ตามสาขา */
.hero{margin:18px 2px 22px}
.hero-k{font-size:15px;font-weight:700;color:var(--muted);margin:0 0 4px}
.hero h1{margin:0;font-size:clamp(26px,3.6vw,36px);line-height:1.3;font-weight:800;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--orange)}
.hero p{margin:8px 0 0;color:var(--muted);font-size:14.5px}
.hero .row-btns{margin-top:12px}
.tks{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.tk{background:#fff;border-radius:18px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 28px rgba(16,24,40,.07);display:flex;flex-direction:column;transition:.16s ease}
.tk.clickable{cursor:pointer}
.tk.clickable:hover{transform:translateY(-2px);box-shadow:0 1px 2px rgba(16,24,40,.05),0 16px 34px rgba(255,100,30,.14)}
.tk-h{padding:16px 18px 14px;border-bottom:2px dashed var(--line);position:relative}
.tk-h::before,.tk-h::after{content:"";position:absolute;bottom:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.tk-h::before{left:-10px}.tk-h::after{right:-10px}
.tk-no{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);font-weight:700;min-height:22px}
.tk-no>span{display:inline-flex;align-items:center;gap:7px;min-width:0;white-space:nowrap}
.tk-k{font-style:normal;font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:999px;background:#eef0f3;color:#475467;white-space:nowrap}
.tk-k.sg{background:#fdf3d8;color:#8a5a00}
.tk-k.tr{background:#e8f0fd;color:#1d4ed8}
.tk-x{font-style:normal;font-weight:600}
.tk-no .due{color:#c2410c;background:var(--orange-soft);padding:2px 9px;border-radius:999px}
.tk-no .ok{color:var(--green);background:#e9f7ef;padding:2px 9px;border-radius:999px}
.tk-t{display:flex;gap:10px;align-items:flex-start;margin-top:8px;font-size:17px;font-weight:800;line-height:1.38;letter-spacing:-.01em}
.tk-t span{font-size:22px;line-height:1.2;flex:none}
.tk-d{font-size:13.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.tk-b{padding:14px 18px 16px;margin-top:auto}
.tk-pg{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
.tk-pg b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
.tk-bar{height:8px;border-radius:9px;background:#eef0f3;overflow:hidden}
.tk-bar i{display:block;height:100%;background:var(--orange);border-radius:9px}
.tk-go{display:flex;gap:8px}
.tk-go+.tk-go,.tk-bar+.tk-go{margin-top:12px}
.tk-go .btn{flex:1;padding:11px 12px}
.tk-go .btn-dark{background:var(--ink);color:#fff}
.tk-go .btn-dark:hover{background:#2b2f36}
.tk-go .btn-line{background:#fff;border:1px solid var(--line);color:var(--ink)}
.tk-done{flex:1;text-align:center;padding:10px;font-weight:800;color:var(--green);font-size:14px}
.tk.off{opacity:.62;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.tk.off .tk-t span{filter:grayscale(.4)}
/* การอบรม: สามขั้น ก่อนเรียน → หลังเรียน → ประเมินอบรม */
.tk-flow{display:grid;grid-template-columns:repeat(3,1fr);position:relative;margin:2px 0 14px}
.tk-flow::before{content:"";position:absolute;top:14px;left:16.67%;right:16.67%;height:2px;background:#e4e7ec}
.tk-fs{position:relative;text-align:center;background:none;border:0;font:inherit;padding:0;color:var(--ink);cursor:pointer;min-width:0}
.tk-fs:disabled{cursor:default}
.tk-fs .dot{width:30px;height:30px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:#fff;border:2px solid #d0d5dd;font-weight:800;font-size:13px;color:var(--muted)}
.tk-fs b{display:block;font-size:13.5px;font-weight:800;line-height:1.3}
.tk-fs span{display:block;font-size:12px;color:var(--muted);margin-top:1px;font-variant-numeric:tabular-nums}
.tk-fs.ok .dot{background:var(--green);border-color:var(--green);color:#fff}
.tk-fs.ok span{color:var(--green);font-weight:700}
.tk-fs.now .dot{background:var(--orange);border-color:var(--orange);color:#fff;box-shadow:0 0 0 4px var(--orange-soft)}
.tk-fs.now span{color:#c2410c;font-weight:700}
.tk-fs:disabled b,.tk-fs:disabled span{color:#9aa1ab}
.tk-add{border:2px dashed #d9dde4;background:transparent;box-shadow:none;min-height:190px;display:grid;place-items:center;color:var(--muted);font-weight:800;font-size:15px;cursor:pointer;border-radius:18px}
.tk-add:hover{border-color:var(--orange);color:var(--orange)}
@media(max-width:820px){

  .tks{grid-template-columns:1fr;gap:12px}
  .tk-h{padding:14px 16px 12px}
  .tk-t{font-size:16px}
  .tk-b{padding:12px 16px 14px}
  /* ใบที่ตอบแล้ว/ปิดแล้วบนมือถือย่อเหลือแถวเดียว ไม่กินที่ */
  .tk.off .tk-d,.tk.off .tk-b{display:none}
  .tk.off .tk-h{border-bottom:0}
  .tk.off .tk-h::before,.tk.off .tk-h::after{display:none}
  .tk-add{min-height:64px}
}

/* ════════ ธีม สแตนเลสครัว ════════
   พื้นเทาอมฟ้าแบบโต๊ะสแตนเลส · แถบเมนูสีเข้ม · ส้มถ่านไฟ · ฟอนต์ Anuphan
   ใช้ชุดเดียวกันทั้ง online-form / training-test / silver-gold — แก้สีที่ :root ด้านล่างนี้ที่เดียว
   (ใบรายงานสำหรับพิมพ์ .paper ยังเป็นกระดาษขาว ไม่ตามธีม) */
:root{--bg:#ECEFF2;--surface:#FBFCFD;--surface-2:#E3E8ED;--field:#FFFFFF;--ink:#15202B;--muted:#5E6B78;--line:#DDE3E9;--line-2:#CFD7DF;
  --orange:#E4572E;--orange-soft:#FCE9E3;--accent-ink:#B23A16;--on-accent:#FFF7F4;--green:#1F7A55;--card:#FBFCFD;
  --nav:#15202B;--nav-2:#1F2C39;--nav-line:#26333F;--nav-ink:#F3F6F9;--nav-muted:#93A1AE;
  --shadow:0 1px 2px rgba(20,32,43,.06),0 10px 26px rgba(20,32,43,.07)}
body{font-family:'Anuphan','Sarabun',system-ui,"Leelawadee UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink)}
.topbar,.card,.tk,.stat,.modal-box,.qcard,.rc,.fu-list,.mf,.ib,.fu-side .actbar,.tabbar{background:var(--surface)!important}
.card,.tk,.stat,.qcard,.rc,.fu-list,.mf{border-color:var(--line)}
input,select,textarea,.btn-back,.tk-go .btn-line,.tk-fs:not(.ok):not(.now) .dot{background:var(--field)!important;color:var(--ink);border-color:var(--line-2)!important}
.btn-secondary,.sg-tiles button{background:var(--surface-2)!important;color:var(--ink)!important;border-color:var(--line)!important}
.btn-primary,.sg-tiles button.pri{background:var(--orange)!important;border-color:var(--orange)!important;color:var(--on-accent)!important}
.btn-primary:hover{background:#CC4722!important}
.tk-h::before,.tk-h::after{background:var(--bg)!important}
.tk-h{border-bottom-color:var(--line-2)!important}
.tk-k{background:var(--surface-2)!important;color:var(--muted)!important}
.navtab.on{background:var(--orange-soft);color:var(--accent-ink)}
.who-av{background:var(--orange-soft)!important;color:var(--accent-ink)!important}
.who-role{background:var(--surface-2)!important;color:var(--muted)!important}
.tk-go .btn-dark,.actbar{background:var(--ink)!important;color:var(--bg)!important;border-color:var(--ink)!important}
.tk-bar{background:var(--surface-2)!important}
@media(min-width:821px){
  .topbar{background:var(--nav)!important;border-color:var(--nav)!important}
  .topbar .tb-title,.topbar .who-nm{color:var(--nav-ink)}

  .topbar .navtab{background:transparent!important;border-color:transparent!important;color:#B5C1CC}

  .topbar .who-av{background:var(--orange)!important;color:#fff!important}
  .topbar .who-role{background:var(--nav-line)!important;color:#B5C1CC!important}
}

let HUB_BRANCHES = [], HUB_READY = Promise.resolve();
async function loadHubBranches(){
  try{
    await sbReady();
    const { data } = await SB.from('hub_config').select('key,value').in('key', ['branches','jaedaengBranches']);
    const out = [];
    (data || []).forEach(row => {
      const v = row.value || {};
      const map = v.branches || v || {};
      const st = v.statusMap || {};
      Object.keys(map).forEach(code => {
        if (String(st[code] || '') === 'closed') return;
        out.push({ code, name: String(map[code] || ''), label: code + ' ' + String(map[code] || '') });
      });
    });
    HUB_BRANCHES = out.sort((a, b) => a.code.localeCompare(b.code));
  }catch(e){ HUB_BRANCHES = []; }
}

function visibleTo(f){
  if (ofCan('manage-forms') || ofCan('view-results')) return true;
  const bd = f.visible_brands || [], br = f.visible_branches || [];
  if (bd.length && !bd.includes(ME.brand)) return false;
  if (br.length && !br.some(x => ME.branch === x || String(ME.code) === String(x).split(' ')[0])) return false;
  return true;
}
/* เปิดให้ตอบอยู่ไหม — สถานะ + ช่วงเวลา */
function isOpen(f){
  if (f.status !== 'open') return false;
  const now = Date.now();
  if (f.open_at  && now < Date.parse(f.open_at))  return false;
  if (f.close_at && now > Date.parse(f.close_at)) return false;
  return true;
}
function canFill(f){ return isOpen(f) && visibleTo(f); }
function audienceLabel(f){
  const bd = f.visible_brands || [], br = f.visible_branches || [];
  if (!bd.length && !br.length) return '<span class="muted">ทุกคน</span>';
  const parts = [];
  if (bd.length) parts.push(bd.map(x => `<span class="pill brand">${esc(x)}</span>`).join(' '));
  if (br.length) parts.push(br.length <= 2
    ? br.map(x => `<span class="pill branch">${esc(x)}</span>`).join(' ')
    : `<span class="pill branch" title="${esc(br.join(' · '))}">${br.length} สาขา</span>`);
  return parts.join(' ');
}

  if (t === 'results' || t === 'report') return ofCan('view-results');
  if (t === 'followup') return ofCan('view-followup');
  if (t === 'forms')    return ofCan('manage-forms') || sgCan('manage-forms') || ttCan('manage-trainings');

    <span class="who-av ${av.length > 2 ? 'code' : ''}">${esc(av)}</span>

      <span class="who-role">${esc(ME.isBranch ? 'สาขา' : ME.title)}</span></span></div>`;

};
function renderNav(){
  const tabs = [['list','แบบฟอร์ม','แบบฟอร์ม']];
  if (ofCan('view-results'))  tabs.push(['results','คำตอบ','คำตอบ']);
  if (ofCan('view-results'))  tabs.push(['report','ออกรายงาน','รายงาน']);
  if (ofCan('view-followup')) tabs.push(['followup','ติดตามสาขาที่ยังไม่ตอบ','ติดตาม']);
  if (ofCan('manage-forms') || sgCan('manage-forms') || ttCan('manage-trainings')) tabs.push(['forms','จัดการฟอร์ม','จัดการ']);
  $('#navtabs').innerHTML = tabs.map(([k,n]) =>
    `<button class="navtab ${(tab==='fill'?'list':tab)===k?'on':''}" onclick="go('${k}')">${TAB_ICON[k]}<span>${esc(n)}</span></button>`).join('');
  /* มือถือ: เมนูย้ายไปแถบล่าง · ซ่อนตอนกำลังตอบ/แก้ฟอร์ม เพื่อให้ปุ่มส่ง/บันทึกเป็นปุ่มเดียวที่ขอบล่าง */
  const cur = tab === 'fill' ? 'list' : tab;
  $('#tabbar').innerHTML = tabs.map(([k,,short]) =>
    `<button class="tab-b" ${cur===k?'aria-current="page"':''} onclick="go('${k}')">${TAB_ICON[k]}<span>${esc(short)}</span></button>`).join('');
  document.body.classList.toggle('has-tabbar', tabs.length > 1 && tab !== 'fill' && !editing);
  document.body.classList.toggle('is-fill', tab === 'fill');
}
window.go = async function(t){
  if (!tabAllowed(t)){ tab = 'list'; renderNav(); renderList(); return msg('ไม่มีสิทธิ์เข้าหน้านี้', 'warn'); }
  if (t !== 'fill') fill = null;
  if (t !== 'forms') editing = null;
  tab = t; clearMsg(); renderNav(); window.scrollTo({ top:0 });
  if (t === 'list'){ await loadForms(); await Promise.all([loadMine(), loadSgForms(), loadTt(), ofCan('view-followup') ? loadResponses().then(() => HUB_READY) : null]); return renderList(); }
  if (t === 'results'){ $('#view').innerHTML = '<div class="loading">กำลังโหลด…</div>'; await loadResponses(); return renderResults(); }
  if (t === 'followup'){ $('#view').innerHTML = '<div class="loading">กำลังโหลด…</div>'; await loadResponses(); return renderFollowup(); }
  if (t === 'report'){ $('#view').innerHTML = '<div class="loading">กำลังโหลด…</div>'; await Promise.all([loadResponses(), HUB_READY]); return renderReport(); }
  if (t === 'forms'){ await loadForms(); await Promise.all([loadSgForms(), loadTt()]); return renderForms(); }
};

/* ใบของแบบทดสอบก่อน–หลังอบรม · ผู้เข้าอบรมทำสองรอบ */
function ttItemHtml(t){
  const open = t.status === 'open', nq = (t.questions || []).length, n = ttPeople(t).length;
  /* แถบสามขั้น · ขั้นที่ต้องทำตอนนี้ = ขั้นแรกที่เปิดแล้วยังไม่ครบ → ปุ่มหลักท้ายใบพาไปขั้นนั้น */
  const st = TT_STEPS.map(([ph, name, flag]) => ({ ph, name: ph === 'eval' ? 'ประเมิน' : name, on: open && t[flag], got: ttDone(t, ph) }));

  const go = ph => `ttGo('run=${encodeURIComponent(t.key)}&phase=${ph}')`;

  const sub = [t.description || '', t.trainer ? 'วิทยากร ' + t.trainer : ''].filter(Boolean).join(' · ');

/* วันปิดรับ · ใกล้ปิด (3 วัน) เป็นสีส้ม */
function dueHtml(f){
  if (!f.close_at) return isOpen(f) ? 'ไม่มีกำหนดปิด' : '';
  const days = Math.ceil((Date.parse(f.close_at) - Date.now()) / 86400000);
  if (days < 0) return 'ปิดรับแล้ว';
  if (days <= 3) return `<span class="due">${days === 0 ? 'ปิดรับวันนี้' : 'เหลือ ' + days + ' วัน'}</span>`;
  return 'ปิดรับ ' + esc(fmtD(f.close_at));
}
const myDate = key => { const r = (myResp || []).find(x => x.form_key === key); return r ? fmtD(r.created_at) : ''; };

  /* ใกล้ปิดรับ: ป้ายส้มย้ายมาอยู่ข้างป้ายชนิดฟอร์ม เห็นก่อน */

  } else {

const fmtDT = v => v ? new Date(v).toLocaleString('th-TH', { day:'2-digit', month:'short', year:'2-digit', hour:'2-digit', minute:'2-digit' }) : '';
const fmtD  = v => v ? new Date(v).toLocaleDateString('th-TH', { day:'2-digit', month:'short', year:'2-digit' }) : '—';

/* ══════════════════════════════════════════════════════════════════
   ตอบแบบฟอร์ม
   ══════════════════════════════════════════════════════════════════ */
window.startFill = function(key){
  const form = forms.find(f => f.key === key);
  if (!form) return;
  if (!canFill(form)) return msg('แบบฟอร์มนี้ไม่ได้เปิดให้คุณตอบ', 'warn');
  if (form.once_per_user && myAnswered.has(key)) return msg('คุณตอบแบบฟอร์มนี้ไปแล้ว', 'warn');
  fill = { form, answers:{} };
  tab = 'fill'; renderNav();
  renderFill();
};

function qInput(q, val){
  const id = 'q_' + q.id;
  if (q.type === 'long')   return `<textarea id="${id}" data-q="${q.id}">${esc(val || '')}</textarea>`;
  if (q.type === 'number') return `<input id="${id}" data-q="${q.id}" type="number" value="${esc(val ?? '')}">`;
  if (q.type === 'date')   return `<input id="${id}" data-q="${q.id}" type="date" value="${esc(val || '')}">`;
  if (q.type === 'yesno')  return `<div class="seg choice" data-q="${q.id}">
      <button type="button" class="${val === 'ใช่' ? 'on' : ''}" onclick="pickOne('${q.id}','ใช่')">ใช่</button>
      <button type="button" class="${val === 'ไม่ใช่' ? 'on' : ''}" onclick="pickOne('${q.id}','ไม่ใช่')">ไม่ใช่</button>
    </div>`;
  if (q.type === 'scale'){
    const min = Number(q.min) || 1, max = Number(q.max) || 5, out = [];
    for (let i = min; i <= max; i++) out.push(`<button type="button" class="${String(val) === String(i) ? 'on' : ''}" onclick="pickOne('${q.id}',${i})">${i}</button>`);
    return `<div class="seg scale" data-q="${q.id}">${out.join('')}</div>`;
  }
  if (q.type === 'single') return `<div class="seg choice" data-q="${q.id}">${(q.options || []).map(o =>
      `<button type="button" class="${val === o ? 'on' : ''}" onclick="pickOne('${q.id}','${esc(o).replace(/'/g,"\\'")}')">${esc(o)}</button>`).join('')}</div>`;
  if (q.type === 'multi'){
    const cur = Array.isArray(val) ? val : [];
    return `<div class="seg choice multi" data-q="${q.id}">${(q.options || []).map(o =>
      `<button type="button" class="${cur.includes(o) ? 'on' : ''}" onclick="pickMany('${q.id}','${esc(o).replace(/'/g,"\\'")}')">${esc(o)}</button>`).join('')}</div>`;
  }
  return `<input id="${id}" data-q="${q.id}" value="${esc(val || '')}">`;
}
window.pickOne = function(qid, v){ fill.answers[qid] = v; renderFill(); };
window.pickMany = function(qid, v){
  const cur = Array.isArray(fill.answers[qid]) ? fill.answers[qid] : [];
  fill.answers[qid] = cur.includes(v) ? cur.filter(x => x !== v) : cur.concat([v]);
  renderFill();
};
/* เก็บค่าจากช่องพิมพ์ก่อนวาดใหม่ ไม่งั้นกดปุ่มตัวเลือกแล้วข้อความที่พิมพ์ไว้หาย */
function grabTyped(){
  document.querySelectorAll('#view [data-q]').forEach(el => {
    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') fill.answers[el.dataset.q] = el.value;
  });
}
const isAnswered = v => !(v == null || v === '' || (Array.isArray(v) && !v.length));
/* นับข้อที่ตอบแล้ว · อัปเดตแถบล่างสด ๆ ระหว่างพิมพ์ โดยไม่วาดทั้งหน้าใหม่ */
function fillProgress(){
  const qs = fill.form.questions || [];
  const done = qs.filter(q => isAnswered(fill.answers[q.id])).length;
  const need = qs.filter(q => q.required && !isAnswered(fill.answers[q.id])).length;
  return { done, total: qs.length, need };
}
function paintFillProgress(){
  if (!fill) return;
  grabTyped();
  const p = fillProgress();
  const bar = $('#fillBar'), note = $('#fillNote');
  if (bar) bar.style.width = (p.total ? p.done / p.total * 100 : 0) + '%';
  if (note) note.innerHTML = `<b>${p.done}/${p.total}</b> ข้อ<br>${p.need ? `เหลือข้อบังคับ ${p.need} ข้อ` : 'พร้อมส่งแล้ว'}`;
  (fill.form.questions || []).forEach(q => {
    const c = document.getElementById('qc_' + q.id); if (!c) return;
    const ok = isAnswered(fill.answers[q.id]);
    c.classList.toggle('done', ok);
    if (ok) c.classList.remove('miss');
  });
}
function renderFill(){
  grabTyped();
  const f = fill.form, p = fillProgress();
  $('#view').innerHTML = `
    <div class="card fill-card">
      <div class="tk-h">
        <div class="tk-no"><span>${p.total} ข้อ</span><span>${dueHtml(f)}</span></div>
        <div class="tk-t" style="font-size:20px"><span>${esc(f.emoji || '📋')}</span>${esc(f.title)}</div>
        ${f.description ? `<div class="tk-d">${esc(f.description)}</div>` : ''}
      </div>
      <div class="fill-prog"><span id="fillBar" style="width:${p.total ? p.done / p.total * 100 : 0}%"></span></div>
    </div>
    ${(f.questions || []).map((q, i) => {
      const ok = isAnswered(fill.answers[q.id]);
      const miss = fill.tried && q.required && !ok;
      return `<div class="qcard ${ok ? 'done' : ''} ${miss ? 'miss' : ''}" id="qc_${q.id}">
        <div class="qlab"><span class="qno">${i + 1}</span><span>${esc(q.label)}${q.required ? '<span class="qreq">*</span>' : ''}</span></div>
        ${q.help ? `<p class="qhelp">${esc(q.help)}</p>` : ''}
        ${qInput(q, fill.answers[q.id])}
        <div class="qhint">ข้อนี้ต้องตอบ</div>
      </div>`;
    }).join('')}
    <div class="actbar">
      <button class="btn btn-secondary" onclick="go('list')">ยกเลิก</button>
      <div class="grow ab-note" id="fillNote"></div>
      <button class="btn btn-primary" onclick="submitFill()">ส่งคำตอบ</button>
    </div>`;
  $('#view').querySelectorAll('input[data-q],textarea[data-q]').forEach(el => el.addEventListener('input', paintFillProgress));
  paintFillProgress();
}

window.submitFill = async function(){
  grabTyped();
  const f = fill.form;
  const miss = (f.questions || []).filter(q => {
    if (!q.required) return false;
    const v = fill.answers[q.id];
    return v == null || v === '' || (Array.isArray(v) && !v.length);
  });
  if (miss.length){
    /* ทำกรอบแดงข้อที่ขาด แล้วพาไปข้อแรกที่ยังไม่ตอบ */
    fill.tried = true; renderFill();
    const first = document.getElementById('qc_' + miss[0].id);
    if (first && first.scrollIntoView) first.scrollIntoView({ behavior:'smooth', block:'start' });
    return msg(`ยังตอบไม่ครบ — เหลือ ${miss.length} ข้อที่ต้องตอบ (ข้อที่มี <span style="color:var(--red)">*</span>)`, 'warn');
  }

  const { error } = await SB.from('fm_responses').insert({
    form_key: f.key, form_title: f.title, answers: fill.answers,
    respondent_code: ME.code, respondent_name: ME.name, respondent_role: ME.role,
    respondent_branch: ME.branch || ME.name, respondent_brand: ME.brand
  });
  if (error) return msg('ส่งคำตอบไม่สำเร็จ — ' + esc(error.message), 'err');
  myAnswered.add(f.key);
  fill = null;
  await go('list');
  msg('ส่งคำตอบเรียบร้อย ขอบคุณครับ');
};

let rf = { form:'', branch:'', q:'' };

const ansText = v => Array.isArray(v) ? v.join(', ') : (v == null || v === '' ? '—' : String(v));

function filteredResponses(){

    (!rf.branch || r.respondent_branch === rf.branch) &&
    (!q || (`${r.respondent_name} ${r.respondent_branch} ${JSON.stringify(r.answers || {})}`).toLowerCase().includes(q)));
}

function renderResults(){

function optHtml(all, items, cur, label){
  return `<option value="">${esc(all)}</option>` + items.map(i =>
    `<option value="${esc(i)}" ${cur===i?'selected':''}>${esc(label ? label(i) : i)}</option>`).join('');
}

function paintResults(){
  const list = filteredResponses();
  const form = rf.form ? forms.find(f => f.key === rf.form) : null;
  const qs = form ? (form.questions || []) : [];
  $('#rStats').innerHTML = `
    <span><b>${list.length}</b>คำตอบ</span>
    <span><b>${new Set(list.map(r => r.respondent_code)).size}</b>ผู้ตอบ</span>
    <span><b>${new Set(list.map(r => r.form_key)).size}</b>แบบฟอร์ม</span>`;
  $('#rEmpty').style.display = list.length ? 'none' : '';
  $('.rtable-card').style.visibility = list.length ? '' : 'hidden';
  /* มือถือ: คำตอบละการ์ด · โชว์ 3 ข้อแรก กดเพื่อดูครบ */
  $('#rCards').innerHTML = list.map(r => {
    const a = r.answers || {};
    const qa = form
      ? qs.slice(0, 3).map(q => `<div><i>${esc(q.label)}</i><em>${esc(ansText(a[q.id]))}</em></div>`).join('')
      : `<div><i>แบบฟอร์ม</i><em>${esc(r.form_title || r.form_key)}</em></div>`;

      <div class="rc-top"><b>${esc(r.respondent_name || '—')}</b><span>${fmtD(r.created_at)}</span></div>

      <div class="rc-more">${form ? (more > 0 ? `ดูอีก ${more} ข้อ ›` : 'ดูรายละเอียด ›') : `ตอบ ${more} ข้อ · ดูรายละเอียด ›`}</div>

  const head = form
    ? ['วันที่','ผู้ตอบ','สาขา', ...qs.map(q => q.label), '']

  $('#rTable').innerHTML = `
    <thead><tr>${head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
    <tbody>${list.map(r => {
      const cells = form
        ? qs.map(q => `<td>${esc(ansText((r.answers || {})[q.id]))}</td>`).join('')
        : `<td class="muted" style="font-size:13px">${esc(r.form_title || r.form_key)}</td>
           <td>${Object.keys(r.answers || {}).length} ข้อ</td>`;
      return `<tr>
        <td class="muted">${fmtD(r.created_at)}</td>
        <td><b>${esc(r.respondent_name || '—')}</b></td>
        <td>${esc(r.respondent_branch || '')}</td>
        ${cells}

          <button class="btn btn-secondary btn-sm" onclick="detail(${r.id})">ดู</button>
          ${ofCan('delete-response') ? `<button class="btn btn-danger btn-sm" onclick="delResp(${r.id})">ลบ</button>` : ''}
        </td></tr>`;
    }).join('')}</tbody>`;

window.detail = function(id){
  const r = responses.find(x => x.id === id); if (!r) return;
  const form = forms.find(f => f.key === r.form_key);
  const qs = form ? (form.questions || []) : [];

    : Object.keys(r.answers || {}).map(k => `<tr><td>${esc(k)}</td><td><b>${esc(ansText(r.answers[k]))}</b></td></tr>`).join('');

window.delResp = async function(id){
  if (!ofCan('delete-response')) return msg('ไม่มีสิทธิ์ลบคำตอบ', 'warn');
  const r = responses.find(x => x.id === id); if (!r) return;
  if (!confirm(`ลบคำตอบของ ${r.respondent_name || '—'} ?\n\nลบแล้วเอาคืนไม่ได้`)) return;
  const { error } = await SB.from('fm_responses').delete().eq('id', id);
  if (error) return msg('ลบไม่สำเร็จ — ' + esc(error.message), 'err');
  msg('ลบเรียบร้อย'); await loadResponses(); paintResults();
};

/* ── ส่งออก CSV ─────────────────────────────────────────────────── */
const csvCell = v => '"' + String(v == null ? '' : v).replace(/"/g,'""') + '"';
const stamp = () => new Date().toISOString().slice(0,10);
function download(name, text){
  const blob = new Blob(['\ufeff' + text], { type:'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
window.csvResults = function(){
  if (!ofCan('export-results')) return msg('ไม่มีสิทธิ์ดาวน์โหลด', 'warn');
  const list = filteredResponses();
  if (!list.length) return msg('ยังไม่มีคำตอบตามเงื่อนไขนี้', 'warn');
  const form = rf.form ? forms.find(f => f.key === rf.form) : null;
  const qs = form ? (form.questions || []) : [];
  const head = ['วันที่','ผู้ตอบ','ตำแหน่ง','สาขา','แบรนด์','แบบฟอร์ม']
    .concat(qs.length ? qs.map(q => q.label) : ['คำตอบ']);
  const body = list.map(r => [fmtD(r.created_at), r.respondent_name, r.respondent_role, r.respondent_branch, r.respondent_brand, r.form_title || r.form_key]
    .concat(qs.length ? qs.map(q => ansText((r.answers || {})[q.id]))
                      : [Object.keys(r.answers || {}).map(k => k + ': ' + ansText(r.answers[k])).join(' | ')])
    .map(csvCell).join(','));
  download(`คำตอบแบบฟอร์ม-${stamp()}.csv`, [head.map(csvCell).join(','), ...body].join('\r\n'));
};

/* ══════════════════════════════════════════════════════════════════
   ติดตามสาขาที่ยังไม่ตอบ — ทะเบียนสาขามาจากฮับ
   ══════════════════════════════════════════════════════════════════ */
let ff = { form:'', show:'miss' };
function followupForms(){ return forms.filter(f => isOpen(f)); }

function followupRows(form){
  /* สาขาที่อยู่ในกลุ่มเป้าหมายของฟอร์มนี้ — ไม่ระบุ = ทุกสาขาในทะเบียนฮับ */
  const want = form.visible_branches || [];
  const list = want.length
    ? HUB_BRANCHES.filter(b => want.includes(b.name) || want.includes(b.label) || want.includes(b.code))
    : HUB_BRANCHES.slice();
  const done = new Set(responses.filter(r => r.form_key === form.key)
    .map(r => String(r.respondent_branch || '') + '|' + String(r.respondent_code || '')));
  const answered = b => [...done].some(k => k.includes(b.name) || k.endsWith('|' + b.code));
  return list.map(b => ({ ...b, done: answered(b) }));
}

function renderFollowup(){
  const list = followupForms();
  if (!list.length){
    $('#view').innerHTML = `<div class="card"><div class="empty">ยังไม่มีแบบฟอร์มที่เปิดให้ตอบ จึงยังไม่มีอะไรให้ตาม</div></div>`;
    return;
  }
  if (!ff.form || !list.some(f => f.key === ff.form)) ff.form = list[0].key;
  const form = list.find(f => f.key === ff.form);
  const rows = followupRows(form).sort((a,b) => (a.done - b.done) || a.code.localeCompare(b.code));
  const miss = rows.filter(r => !r.done), done = rows.length - miss.length;
  const shown = ff.show === 'miss' ? miss : ff.show === 'done' ? rows.filter(r => r.done) : rows;
  $('#view').innerHTML = `<div class="fu-grid"><div class="fu-side">
    <div class="card">
      <label style="font-size:12.5px;color:var(--muted);margin-bottom:4px">แบบฟอร์ม</label>
      <select id="ffForm">${list.map(f =>
        `<option value="${esc(f.key)}" ${f.key===ff.form?'selected':''}>${esc(f.title)}</option>`).join('')}</select>
      <div class="fu-sum" style="margin-top:14px">
        <div class="fu-big">${done}<small> / ${rows.length} สาขาตอบแล้ว</small></div>
      </div>
      <div class="fu-bar"><span style="width:${rows.length ? done / rows.length * 100 : 0}%"></span></div>
      ${HUB_BRANCHES.length ? '' : '<p class="sub" style="margin:10px 0 0">ยังโหลดทะเบียนสาขาไม่ได้ ลองกดโหลดใหม่อีกครั้ง</p>'}
    </div>
    <div class="fu-seg">
      <button class="${ff.show==='miss'?'on':''}" onclick="ffShow('miss')">ยังไม่ตอบ <b>${miss.length}</b></button>
      <button class="${ff.show==='done'?'on':''}" onclick="ffShow('done')">ตอบแล้ว <b>${done}</b></button>
      <button class="${ff.show==='all'?'on':''}" onclick="ffShow('all')">ทั้งหมด</button>
    </div>
    <div class="actbar">
      <button class="btn btn-secondary" onclick="go('followup')" title="โหลดใหม่">↻</button>
      <div class="grow ab-note">${miss.length ? `<b>${miss.length}</b> สาขายังไม่ตอบ` : 'ครบทุกสาขาแล้ว'}</div>
      <button class="btn btn-primary" onclick="copyFollowup()" ${miss.length ? '' : 'disabled'}>📋 คัดลอกข้อความตามงาน</button>
    </div>
    </div><div class="fu-main">
    ${shown.length ? `<div class="fu-list">${shown.map(r =>
      `<div class="fu-row ${r.done ? 'ok' : ''}"><span class="dot"></span><b>${esc(r.label)}</b><span class="st">${r.done ? 'ตอบแล้ว' : 'ยังไม่ตอบ'}</span></div>`).join('')}</div>`
      : `<div class="card empty">${ff.show === 'miss' ? 'ทุกสาขาตอบครบแล้ว 🎉' : 'ยังไม่มีสาขาที่ตอบ'}</div>`}
    </div></div>`;
  $('#ffForm').onchange = () => { ff.form = $('#ffForm').value; renderFollowup(); };
}
window.ffShow = function(v){ ff.show = v; renderFollowup(); };

window.copyFollowup = function(){
  const form = followupForms().find(f => f.key === ff.form); if (!form) return;
  const miss = followupRows(form).filter(r => !r.done);
  if (!miss.length) return msg('ทุกสาขาตอบครบแล้ว ไม่มีใครต้องตาม', 'ok');
  const text = `📋 ${form.title}\nยังไม่ได้ตอบแบบฟอร์มนี้ รบกวนตอบด้วยครับ (${miss.length} สาขา)\n\n` +
    miss.map(r => '• ' + r.label).join('\n') +
    `\n\nลิงก์: ${location.origin + location.pathname}`;
  const done = () => msg('คัดลอกข้อความแล้ว — วางส่งใน LINE ได้เลย');
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(done).catch(() => window.prompt('คัดลอกข้อความนี้', text));
  else window.prompt('คัดลอกข้อความนี้', text);
};

/* ══════════════════════════════════════════════════════════════════
   ออกรายงาน — เลือกฟอร์ม + ชนิดรายงาน · ตัวอย่างบนจอเป็นกระดาษ A4 หน้าเดียวกับที่พิมพ์
   1 = สรุปผลรายข้อ (นับตัวเลือก · เฉลี่ยตัวเลข/สเกล · ข้อความรวม) + สาขาที่ยังไม่ตอบ

let rpo = { form:'', kind:'sum' };
function rpHead(title){
  return `<div class="rp-lh">
    <div class="lg"><img src="../logo.png" alt=""></div>
    <div class="co"><b>บริษัท เอฟเอบี ฟู้ดโฮลดิ้ง จำกัด</b><span>FAB Food Holding Co., Ltd.</span></div>
    <div class="meta">วันที่ออกรายงาน<b>${esc(fmtD(new Date()))}</b></div>
  </div>
  <div class="rp-tt"><h1>${esc(title)}</h1></div>`;
}
const rpSign = () => `<div class="sign">
  <div><div class="ln"></div>ผู้จัดทำรายงาน<br>วันที่ ........./........./.........</div>
  <div><div class="ln"></div>ผู้ตรวจสอบ<br>วันที่ ........./........./.........</div>
</div>`;
function rpInfo(f, list){
  const rows = followupRows(f), got = rows.filter(r => r.done).length;
  const period = f.close_at ? `${f.open_at ? fmtD(f.open_at) + ' – ' : 'ถึง '}${fmtD(f.close_at)}` : 'ไม่มีกำหนดปิด';
  return `<table class="rp-info"><tbody>
    <tr><th>แบบฟอร์ม</th><td colspan="3"><b>${esc((f.emoji || '') + ' ' + f.title)}</b></td></tr>
    <tr><th>ช่วงเปิดรับ</th><td>${esc(period)}</td><th>จำนวนคำตอบ</th><td>${list.length} คำตอบ</td></tr>
    ${rows.length ? `<tr><th>สาขาที่ตอบแล้ว</th><td colspan="3">${got} จาก ${rows.length} สาขา (${Math.round(got / rows.length * 100)}%)</td></tr>` : ''}
  </tbody></table>`;
}
const pctOf = (n, d) => d ? Math.round(n / d * 1000) / 10 + '%' : '—';

function reportSumHtml(f){
  const list = responses.filter(r => r.form_key === f.key);
  const qs = f.questions || [];
  const blocks = qs.map((q, i) => {
    const vals = list.map(r => (r.answers || {})[q.id]).filter(v => v != null && v !== '' && !(Array.isArray(v) && !v.length));
    const head = `<h3>${i + 1}. ${esc(q.label)} <span style="font-weight:400;color:#666">· ${esc(qTypeLabel(q.type))} · ตอบ ${vals.length} คน</span></h3>`;
    if (q.type === 'single' || q.type === 'multi' || q.type === 'yesno'){
      const opts = q.type === 'yesno' ? ['ใช่','ไม่ใช่'] : (q.options || []);
      const cnt = o => vals.filter(v => Array.isArray(v) ? v.includes(o) : v === o).length;
      const other = [...new Set(vals.flat().filter(v => !opts.includes(v)))];
      return head + `<table><thead><tr><th>ตัวเลือก</th><th style="width:90px">จำนวน</th><th style="width:90px">ร้อยละ</th></tr></thead><tbody>
        ${[...opts, ...other].map(o => `<tr><td>${esc(o)}</td><td class="c">${cnt(o)}</td><td class="c">${pctOf(cnt(o), vals.length)}</td></tr>`).join('')}
      </tbody></table>`;
    }
    if (q.type === 'scale' || q.type === 'number'){
      const nums = vals.map(Number).filter(v => !isNaN(v));
      const avg = nums.length ? nums.reduce((a, v) => a + v, 0) / nums.length : null;
      let dist = '';
      if (q.type === 'scale'){
        const lo = q.min ?? 1, hi = q.max ?? 5, cols = [];
        for (let v = hi; v >= lo; v--) cols.push(v);
        dist = `<table><thead><tr>${cols.map(v => `<th>${v}</th>`).join('')}<th>ค่าเฉลี่ย</th></tr></thead><tbody><tr>
          ${cols.map(v => `<td class="c">${nums.filter(x => x === v).length}</td>`).join('')}<td class="c"><b>${avg == null ? '—' : avg.toFixed(2)}</b> / ${hi}</td></tr></tbody></table>`;
      } else {
        dist = `<table><thead><tr><th>ค่าเฉลี่ย</th><th>ต่ำสุด</th><th>สูงสุด</th><th>รวม</th></tr></thead><tbody><tr>
          <td class="c"><b>${avg == null ? '—' : +avg.toFixed(2)}</b></td><td class="c">${nums.length ? Math.min(...nums) : '—'}</td>
          <td class="c">${nums.length ? Math.max(...nums) : '—'}</td><td class="c">${nums.reduce((a, v) => a + v, 0)}</td></tr></tbody></table>`;
      }
      return head + dist;
    }
    /* ข้อความ / วันที่: รวมทุกคำตอบพร้อมสาขา */
    const rowsT = list.filter(r => { const v = (r.answers || {})[q.id]; return v != null && v !== ''; });
    return head + (rowsT.length ? `<table><thead><tr><th style="width:36%">สาขา / ผู้ตอบ</th><th>คำตอบ</th></tr></thead><tbody>
      ${rowsT.map(r => `<tr><td>${esc(r.respondent_branch || r.respondent_name || '')}</td><td>${esc(ansText((r.answers || {})[q.id]))}</td></tr>`).join('')}
    </tbody></table>` : '<p style="color:#666;margin:0">— ยังไม่มีคำตอบ —</p>');
  }).join('');
  const miss = followupRows(f).filter(r => !r.done);
  return `<div class="rp">
    ${rpHead('รายงานสรุปผลแบบฟอร์ม')}
    ${rpInfo(f, list)}
    ${blocks || '<p>แบบฟอร์มนี้ยังไม่มีคำถาม</p>'}
    ${miss.length ? `<h3>สาขาที่ยังไม่ตอบ (${miss.length})</h3><ol class="miss">${miss.map(b => `<li>${esc(b.label || b.name)}</li>`).join('')}</ol>` : ''}
    ${rpSign()}
  </div>`;
}

function printDoc(html, title){
  let host = document.getElementById('printhost');
  if (!host){ host = document.createElement('div'); host.id = 'printhost'; document.body.appendChild(host); }
  host.innerHTML = html;
  const oldTitle = document.title;
  document.title = title || oldTitle;
  let cleaned = false;
  const cleanup = () => { if (cleaned) return; cleaned = true;
    host.innerHTML = ''; document.title = oldTitle; window.removeEventListener('afterprint', cleanup); };
  window.addEventListener('afterprint', cleanup);
  setTimeout(() => {
    try{ window.print(); }catch(e){ msg('เบราว์เซอร์ไม่รองรับการพิมพ์', 'err'); return cleanup(); }
    setTimeout(cleanup, 60000);
  }, 150);
}

window.editForm = function(id){

  editing = clone(f);
  editing.questions = editing.questions || [];
  renderNav(); renderEditor(); window.scrollTo({ top:0 });
};
window.dupForm = async function(id){
  const f = forms.find(x => x.id === id); if (!f) return;
  const c = clone(f); delete c.id; delete c.created_at; delete c.updated_at;
  c.key = newKey(); c.title = f.title + ' (สำเนา)'; c.status = 'draft';
  const { error } = await SB.from('fm_forms').insert(c);
  if (error) return msg('ทำสำเนาไม่สำเร็จ — ' + esc(error.message), 'err');
  msg('ทำสำเนาแล้ว'); await loadForms(); renderForms();
};
window.delForm = async function(id){
  if (!ofCan('delete-form')) return msg('ไม่มีสิทธิ์ลบแบบฟอร์ม', 'warn');
  const f = forms.find(x => x.id === id); if (!f) return;
  const used = responses.filter(r => r.form_key === f.key).length;
  if (!confirm(`ลบแบบฟอร์ม "${f.title}" ?\n\n` +
    (used ? `มีคำตอบที่ส่งมาแล้ว ${used} รายการ — คำตอบจะไม่ถูกลบ แต่จะไม่มีตัวฟอร์มให้เทียบคำถาม\n\n` : '') +
    'ยืนยันการลบ?')) return;
  const { error } = await SB.from('fm_forms').delete().eq('id', id);
  if (error) return msg('ลบไม่สำเร็จ — ' + esc(error.message), 'err');
  msg('ลบเรียบร้อย'); await loadForms(); renderForms();
};

            <button class="ib" onclick="grabEditor();moveQ(${i},-1)" title="เลื่อนขึ้น" ${i ? '' : 'disabled'}>↑</button>
            <button class="ib" onclick="grabEditor();moveQ(${i},1)" title="เลื่อนลง" ${i < e.questions.length - 1 ? '' : 'disabled'}>↓</button>
            <button class="ib del" onclick="grabEditor();delQ(${i})" title="ลบข้อนี้">✕</button>
          </div>
          <input data-qi="${i}" data-qk="label" value="${esc(q.label)}" placeholder="คำถาม">
          <input data-qi="${i}" data-qk="help" value="${esc(q.help || '')}" placeholder="คำอธิบายเพิ่มเติม (ไม่ใส่ก็ได้)" style="margin-top:8px">
          ${hasOptions(q.type) ? `<label style="margin-top:10px">ตัวเลือก (บรรทัดละ 1 ข้อ)</label>
            <textarea data-qi="${i}" data-qk="options">${esc((q.options || []).join('\n'))}</textarea>` : ''}
          ${q.type === 'scale' ? `<div class="grid2" style="margin-top:10px">
            <div><label>ต่ำสุด</label><input type="number" data-qi="${i}" data-qk="min" value="${esc(q.min ?? 1)}"></div>
            <div><label>สูงสุด</label><input type="number" data-qi="${i}" data-qk="max" value="${esc(q.max ?? 5)}"></div>
          </div>` : ''}
          <label class="qe-req">
            <input type="checkbox" data-qi="${i}" data-qk="required" ${q.required ? 'checked' : ''}>ต้องตอบข้อนี้
          </label>
        </div>`).join('')}
      <label style="margin:${e.questions.length ? 14 : 0}px 0 8px">${e.questions.length ? 'เพิ่มคำถามอีกข้อ' : 'เริ่มจากเลือกชนิดคำถามข้อแรก'}</label>
      <div class="qtypes">
        ${Q_TYPES.map(t => `<button type="button" onclick="addQTyped('${t.id}')"><span>${t.icon}</span>${esc(t.label)}</button>`).join('')}
      </div>
    </div>

    <div class="actbar">
      <button class="btn btn-secondary" onclick="cancelEdit()">ยกเลิก</button>
      <div class="grow ab-note">${e.questions.length} ข้อ</div>
      <button class="btn btn-primary" onclick="saveForm()">บันทึกแบบฟอร์ม</button>
    </div>
    </div></div>`;
}
window.setOnce = function(v){ grabEditor(); editing.once_per_user = v; renderEditor(); };
window.addQTyped = function(t){
  grabEditor(); addQ(t);
  const el = document.querySelector(`[data-qi="${editing.questions.length - 1}"][data-qk="label"]`);
  if (el){ el.scrollIntoView && el.scrollIntoView({ block:'center' }); try{ el.focus({ preventScroll:true }); }catch(e){} }
};
window.togBrand = function(b){
  grabEditor();
  const cur = editing.visible_brands || [];
  editing.visible_brands = cur.includes(b) ? cur.filter(x => x !== b) : cur.concat([b]);
  renderEditor();
};
window.addBranch = function(v){
  if (!v) return;
  grabEditor();
  const cur = editing.visible_branches || [];
  if (!cur.includes(v)) editing.visible_branches = cur.concat([v]);
  renderEditor();
};
window.rmBranch = function(b){
  grabEditor();
  editing.visible_branches = (editing.visible_branches || []).filter(x => x !== b);
  renderEditor();
};

window.saveForm = async function(){
  if (!ofCan('manage-forms')) return msg('ไม่มีสิทธิ์แก้แบบฟอร์ม', 'warn');
  grabEditor();
  const e = editing;
  if (!String(e.title || '').trim()) return msg('ใส่ชื่อแบบฟอร์มก่อน', 'warn');
  if (!e.questions.length) return msg('ต้องมีคำถามอย่างน้อย 1 ข้อ', 'warn');
  const bad = e.questions.findIndex(q => !String(q.label || '').trim());
  if (bad >= 0) return msg(`ข้อ ${bad + 1} ยังไม่มีคำถาม`, 'warn');

  const row = {
    key: e.key, title: e.title.trim(), description: e.description || '', emoji: e.emoji || '📋',
    status: e.status || 'draft', questions: e.questions,
    visible_brands: e.visible_brands || [], visible_branches: e.visible_branches || [],
    once_per_user: !!e.once_per_user,
    open_at:  e.open_at  ? new Date(e.open_at).toISOString()  : null,
    close_at: e.close_at ? new Date(e.close_at).toISOString() : null,
    sort_order: e.sort_order || 0, updated_at: new Date().toISOString()
  };
  const { error } = e.id
    ? await SB.from('fm_forms').update(row).eq('id', e.id)
    : await SB.from('fm_forms').insert(row);
  if (error) return msg('บันทึกไม่สำเร็จ — ' + esc(error.message), 'err');
  editing = null; renderNav();
  msg('บันทึกแบบฟอร์มแล้ว');
  await loadForms(); renderForms();
};

boot();
</script>
</body>
</html>

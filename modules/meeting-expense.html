<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบส่งเอกสารเบิกเงินประชุมสาขา · FAB Operations Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hub-mod.css">
<style>
/* ระบบเบิกเงินประชุม — โครงแบบ "ตารางบัญชี" (เมนูซ้าย + ตาราง) ในสีส้มของฮับ
   ส่วนกลาง (ปุ่ม ช่องกรอก กล่องหน้าต่าง แจ้งเตือน) อยู่ที่ hub-mod.css
   จอกว้าง ≥ 900px = เมนูซ้าย + ตาราง · จอแคบ = แถบบน + เมนูเลื่อนแนวนอน + การ์ด */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--bg2);border-right:1px solid var(--border);
  padding:18px 14px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;margin:0 6px 18px}
.brand img{width:38px;height:38px;object-fit:contain;mix-blend-mode:multiply}
.brand b{display:block;font-size:14px;line-height:1.25;font-weight:800}
.brand small{display:block;font-size:11.5px;color:var(--text3)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav .tab{display:flex;align-items:center;justify-content:flex-start;gap:10px;width:100%;min-height:0;padding:10px 12px;border-radius:10px;box-shadow:none;background:none;
  color:var(--text2);font-weight:700;font-size:14px;text-align:left;white-space:nowrap}
.nav .tab:hover{background:var(--bg3);color:var(--text)}
.nav .tab[aria-selected="true"]{background:var(--gold-soft);color:var(--gold-ink);box-shadow:none}
.nav .tab[aria-selected="true"] .n{background:var(--gold);color:#fff}
.nav .tab .ic{width:18px;text-align:center}
.nav .tab .n{margin-left:auto;background:var(--gold);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;line-height:18px;font-weight:800}
.side .sp{flex:1;min-height:16px}
.rbox{border:1px solid var(--border);border-radius:12px;padding:12px;font-size:12.5px;color:var(--text2);background:var(--bg3)}
.rbox b{display:block;color:var(--text);font-size:15px;font-weight:800}
.who{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 6px;font-size:13px;font-weight:700;color:var(--text2)}
.who i{width:28px;height:28px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:800;flex:none}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px;padding:9px;border:1px solid var(--border);border-radius:10px;
  font-weight:700;font-size:13px;color:var(--text2);background:var(--bg2)}
.back:hover{border-color:var(--border2);color:var(--text)}
.back svg{width:15px;height:15px}
.main{padding:24px 28px 90px;min-width:0}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.head h1{font-size:23px;font-weight:800;letter-spacing:-.015em}
.head .sp{flex:1}
.head .sub{flex-basis:100%;color:var(--text3);font-size:13.5px;margin-top:-6px}
.upd{color:var(--text3);font-size:12.5px}
/* ตัวเลขสรุปแถบเดียว */
.kstrip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--bg2);border:1px solid var(--border);border-radius:14px;margin:16px 0}
.kstrip>div{padding:14px 16px;border-right:1px solid var(--border);min-width:0}
.kstrip>div:last-child{border-right:0}
.kstrip small{display:block;color:var(--text3);font-weight:700;font-size:12px}
.kstrip b{display:block;font-size:22px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kstrip b.o{color:var(--gold)}.kstrip b.g{color:var(--green)}
.kstrip em{font-style:normal;font-size:12px;color:var(--text3)}
/* ตัวกรอง */
.fl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:99px;border:1px solid var(--border);background:var(--bg2);
  font-weight:700;font-size:13px;color:var(--text2);white-space:nowrap}
.chip:hover{border-color:var(--border2)}
.chip.on{background:var(--text);border-color:var(--text);color:#fff}
.chip em{font-style:normal;opacity:.6}
.fl select{width:auto;min-width:130px;padding:6px 32px 6px 12px;border-radius:99px;font-size:13px;font-weight:700}
.fl .q{flex:1;min-width:200px;max-width:300px;margin-left:auto}
.fl .q input{padding:7px 12px;border-radius:99px;font-size:13px}
/* ตาราง */
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.tbl th{font-size:12px;color:var(--text3);text-align:left;font-weight:700;padding:10px 10px;background:var(--bg3);border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:10px 10px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:14px}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:#fffaf6}
.tbl tr.sel td{background:var(--gold-soft)}
.tbl td small{display:block;font-size:12px;color:var(--text3);line-height:1.35}
.tbl .r{text-align:right}
.tbl .brc{min-width:150px}
.twrap{overflow-x:auto;border-radius:14px}
.twrap .tbl{min-width:900px}
.num{font-variant-numeric:tabular-nums}
.tbl select{width:auto;min-width:128px;padding:5px 30px 5px 10px;font-size:13px;border-radius:8px}
.tbl input[type=checkbox],.cardsel input{width:17px;height:17px;accent-color:var(--gold);cursor:pointer}
.docno{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.link{color:var(--text);font-weight:700;text-align:left}
.link:hover{color:var(--gold-ink);text-decoration:underline}
.meter{height:6px;border-radius:99px;background:var(--bg3);border:1px solid var(--border);overflow:hidden;min-width:70px}
.meter i{display:block;height:100%;background:var(--gold);border-radius:99px}
.meter i.over{background:var(--red)}
.thumb{display:inline-flex;align-items:center;gap:4px}
.thumb img{width:34px;height:34px;object-fit:cover;border-radius:8px;border:1px solid var(--border);cursor:zoom-in}
.icon-btn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--text3);border:1px solid transparent}
.icon-btn:hover{background:var(--red-soft);color:var(--red-ink);border-color:var(--red-line)}
.icon-btn svg{width:16px;height:16px}
.bulk{position:sticky;bottom:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--text);color:#fff;border-radius:12px;
  padding:9px 12px;margin-top:12px;font-size:13.5px;box-shadow:var(--shadow-lg);z-index:5}
.bulk .sp{flex:1}
.bulk .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
/* ป้ายสถานะ */
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-sent{background:#f3f4f6;color:#4b5563;border-color:var(--border)}
.p-wait{background:var(--gold-soft);color:var(--gold-ink);border-color:var(--gold-line)}
.p-ok{background:var(--green-soft);color:var(--green-ink);border-color:var(--green-line)}
.p-no{background:var(--red-soft);color:var(--red-ink);border-color:var(--red-line)}
/* การ์ด */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px;margin-top:12px}
.card.hl{border-color:var(--gold-line);box-shadow:0 0 0 3px var(--gold-soft)}
.card.warn{background:var(--gold-soft);border-color:var(--gold-line)}
.card.bad{background:var(--red-soft);border-color:var(--red-line)}
.card h3{font-size:15px;font-weight:800;margin-bottom:6px}
.lead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13.5px;padding:3px 0}
.lead span{color:var(--text2)}
.lead b{text-align:right;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:36px 20px;color:var(--text3);background:var(--bg2);border:1px dashed var(--border2);border-radius:14px;margin-top:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.grid3 .card,.grid2 .card{margin-top:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px;margin-bottom:16px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;align-items:center}
.inline{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:8px 10px}
.inline label{margin:0;white-space:nowrap}
.inline input{width:120px}
/* เอกสารแบบการ์ด (มือถือของผู้ดูแล + ฝั่งสาขา) */
.slip{background:var(--bg2);border:1px solid var(--border);border-left:4px solid var(--border2);border-radius:12px;padding:12px 14px;margin-top:10px}
.slip.st-ok{border-left-color:var(--green)}.slip.st-no{border-left-color:var(--red)}.slip.st-wait{border-left-color:var(--gold)}
.slip .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.slip .amt{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.25}
.slip .desc{margin-top:8px;font-size:13.5px;white-space:pre-wrap;border-top:1px dashed var(--border);padding-top:8px}
.slip .note-cut{margin-top:8px;font-size:13px;background:var(--gold-soft);color:var(--gold-ink);border:1px solid var(--gold-line);border-radius:8px;padding:6px 9px;font-weight:700}
.slip .note-no{margin-top:8px;font-size:13px;background:var(--red-soft);color:var(--red-ink);border-radius:8px;padding:6px 9px}
.slip .acts select{width:auto;min-width:140px;padding:6px 30px 6px 10px;font-size:13px}
.slip .acts .push{margin-left:auto}
.cardsel{display:flex;align-items:center;gap:8px}
.sec{font-size:13px;font-weight:800;color:var(--text2);margin:18px 2px 0}
/* ฝั่งสาขา */
.bgrid{display:grid;grid-template-columns:minmax(0,480px) minmax(0,1fr);gap:18px;align-items:start;margin-top:16px}
.quota .big{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.quota .meter{margin:8px 0 6px;height:8px}
.quota .row2{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--text2)}
.bank{border-radius:16px;padding:16px 18px;color:#fff;background:linear-gradient(135deg,#e8620c,#ff9a3c);box-shadow:0 12px 26px -16px rgba(234,88,12,.7)}
.bank small{opacity:.85;font-weight:600}
.bank b{display:block;font-size:19px;font-weight:800;margin-top:2px}
.bank .ac{font-variant-numeric:tabular-nums;font-size:15px}
.bank .meta{opacity:.8;font-size:12px;margin-top:6px}
.bank.none{background:var(--bg2);color:var(--text);border:1px dashed var(--border2);box-shadow:none}
.payee{display:flex;gap:10px;align-items:center;background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:14px}
.payee .ic{width:34px;height:34px;border-radius:10px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.payee small{display:block;color:var(--text3);font-size:12px}
.payee b{display:block;font-size:15px}
.payee .ac{font-size:13px;color:var(--text2);font-variant-numeric:tabular-nums}
.payee.none .ic{background:var(--red)}
.done{background:var(--green-soft);border:1px solid var(--green-line);border-radius:16px;padding:18px;text-align:center;margin-top:12px}
.done .ck{width:48px;height:48px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:800;margin:0 auto 8px}
.done b{font-size:17px}
.steps{display:flex;gap:6px;margin-top:14px}
.steps div{flex:1;text-align:center;font-size:11.5px;color:var(--text3);font-weight:700}
.steps i{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);margin:0 auto 4px;font-style:normal}
.steps .on{color:var(--gold-ink)}.steps .on i{background:var(--gold);border-color:var(--gold);color:#fff}
.submit-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:4px}
.submit-row .msg{font-size:13.5px;color:var(--text2)}
.submit-row .msg.ok{color:var(--green-ink);font-weight:700}
.submit-row .msg.bad{color:var(--red-ink);font-weight:700}
.submit-row .btn{width:100%;padding:12px;font-size:15px}
.sum2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.sum2>div{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.sum2 small{display:block;color:var(--text3);font-weight:700;font-size:12px}
.sum2 b{font-size:18px;font-variant-numeric:tabular-nums}
.narrow{max-width:640px}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:10px;font-size:13px}
.cmp>div{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px;min-width:0;overflow-wrap:anywhere}
.cmp>div.new{background:var(--green-soft);border-color:var(--green-line)}
.cmp small{display:block;color:var(--text3);font-weight:700}
.cmp .arr{font-size:20px;color:var(--gold)}
/* รายการแบบตารางที่พับเป็นการ์ดบนจอแคบ (วงเงิน · ผู้รับเงิน) */
.rowlist{background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.rowlist .tr{display:grid;grid-template-columns:1.6fr 1fr 1.3fr .9fr auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);font-size:14px}
.rowlist .tr:last-child{border-bottom:0}
.rowlist .th{background:var(--bg3);font-size:12px;font-weight:700;color:var(--text3)}
.rowlist small{display:block;font-size:12px;color:var(--text3)}
/* ═══ จอกว้าง · หน้าสาขา: เต็มจอ · ฟอร์มซ้าย | ใบเบิกตัวอย่างสด + วงเงินขวา (ติดขอบ) · ประวัติเป็นตาราง · ผู้รับเงิน 2 คอลัมน์ ═══ */
.hist-tbl,.live{display:none}
/* ฝั่งสาขา · ดีไซน์ขาว-ส้ม: แถบสรุปรอบ + ฟอร์มเรียงลงมา + ช่องรูป 3 ช่อง */
.bgrid.one{grid-template-columns:minmax(0,1fr)!important}
.dv2{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start;margin-top:16px}
.dv2 .card{margin-top:0;padding:24px 28px}
.dv2 .sum{background:var(--bg3);border-radius:14px;padding:18px 20px;margin:14px 0 18px}.dv2 .sum small{color:var(--text3);font-weight:600}
.dv2 .sum .big{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.dv2 .sum .chip{display:inline-block;margin-top:8px;background:var(--gold-soft);color:var(--gold-ink);border:1px solid var(--gold-line);border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700}
.dv2 .kv{display:grid;grid-template-columns:150px 1fr;gap:10px 16px;font-size:14.5px}.dv2 .kv span{color:var(--text3)}.dv2 .kv b{font-weight:700}
.dv2 .rcp{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.dv2 .rcp img{width:112px;height:112px;border-radius:12px;object-fit:cover;border:1px solid var(--border);cursor:zoom-in}
.tl{position:relative;margin-top:14px}.tl .nd{position:relative;padding:0 0 22px 38px}.tl .nd:last-child{padding-bottom:0}
.tl .nd::before{content:"";position:absolute;left:11px;top:26px;bottom:0;width:2px;background:var(--border)}.tl .nd:last-child::before{display:none}
.tl .nd.on::before{background:#2f6fe0}
.tl .dot{position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;border:2.5px solid var(--border2);background:#fff;display:grid;place-items:center;font-size:12px;color:#fff;font-weight:800}
.tl .nd.ok .dot{background:#2f6fe0;border-color:#2f6fe0}.tl .nd.cur .dot{border-color:#e0a21a;background:#e0a21a;box-shadow:0 0 0 4px rgba(224,162,26,.18)}
.tl .nd b{display:block;font-size:15px}.tl .nd.ok b{color:#2f6fe0}.tl .nd.cur b{color:#b9780a}.tl .nd.idle b{color:var(--text3)}
.tl .nd small{display:block;color:var(--text2);font-size:13px;margin-top:2px;line-height:1.5}.tl .nd.idle small{color:var(--text3)}
.rstrip{display:flex;justify-content:space-between;align-items:center;gap:14px 28px;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:16px 22px;margin-top:14px}
.rstrip b{font-size:17px}.rstrip small{display:block;font-size:12.5px;color:var(--text3);font-weight:600}
.rstrip .rs-r{display:flex;gap:26px;align-items:center}.rstrip .rs-r>div+div{border-left:1px solid var(--border);padding-left:26px}
.rstrip .rs-r b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.rstrip .rs-r .pill{margin-top:4px}
.amtbox{position:relative;max-width:360px}.amtbox input{padding-right:52px}.amtbox span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none}
.fhint{font-size:12.5px;color:var(--text3);margin-top:6px}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:420px}
.slot{position:relative;aspect-ratio:1;border:1.5px dashed var(--border2);border-radius:14px;display:grid;place-items:center;overflow:hidden;color:var(--text3);font-size:13px;text-align:center;background:var(--bg2)}
.slot.add{background:var(--gold-soft);border-color:var(--gold-line);color:var(--gold-ink);font-weight:700;cursor:pointer;line-height:1.35}
.slot.add i{display:block;font-style:normal;font-size:24px;line-height:1}
.slot img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.slot .modal-x{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.95);border:1px solid var(--border);line-height:1}
.sendrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:22px;padding-top:20px;border-top:1px solid var(--border)}
.sendrow .btn{padding:14px 34px;font-size:16px;font-weight:800;border-radius:14px}.sendrow .sendnote{font-size:12.5px;color:var(--text3)}
.fmsg{font-size:13.5px;margin-top:10px;color:var(--text2)}.fmsg:empty{display:none}.fmsg.bad{color:var(--red-ink);font-weight:700}.fmsg.ok{color:var(--green-ink);font-weight:700}
.payline{background:var(--bg3);border-radius:12px;padding:11px 14px;font-size:13.5px;margin-top:18px}
.pcard small{display:block;color:var(--text3);font-size:12.5px}.pcard b{font-size:16px}.pcard .pr{display:flex;gap:28px;margin-top:10px}
.pcard .pnote{background:var(--bg3);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--text2);margin-top:12px}
.pcard a{color:var(--gold-ink);font-weight:700;cursor:pointer;display:inline-block;margin-top:12px;font-size:13.5px}
.flowc{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.flowc .ar{color:var(--text3)}
.dn-head{display:flex;align-items:center;gap:14px;background:var(--green-soft);border:1px solid var(--green-line);border-radius:16px;padding:16px 20px}
.dn-head .ck{width:42px;height:42px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:22px;flex:none}
.dn-head b{font-size:18px}.dn-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:20px 26px;margin-top:14px}
.dn-track{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr}
.dn-line{position:absolute;left:12px;right:12px;top:10px;height:3px;background:#e5e7eb;border-radius:9px}.dn-line i{display:block;height:100%;background:var(--gold);border-radius:9px;transition:width .4s}

<script>

const {Hub, Cfg} = HubMod;
/* ระบบนี้ไม่ใช้กับสาขารหัส 60 (ยามะจัง) — ซ่อนจากทุกหน้าของโมดูลนี้ (โมดูลอื่นยังเห็นตามปกติ) */
const Branches = Object.assign(Object.create(HubMod.Branches), {
  list(inc){ return HubMod.Branches.list(inc).filter(b=>!String(b.code).startsWith("60")); }
});
const S = new HubMod.Store("mx");
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>(Number(n)||0).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});
/* จำนวนเต็มแสดงไม่มีทศนิยม · มีเศษแสดง 2 ตำแหน่ง (750.50 ไม่ใช่ 750.5) */
const baht=n=>{n=Number(n)||0; const f=Math.round(n*100)%100?2:0; return n.toLocaleString("th-TH",{minimumFractionDigits:f,maximumFractionDigits:f});};
const nowISO=()=>new Date().toISOString();
const dmy=HubMod.fmtDMY;
/* วันที่ + เวลาที่ส่ง */
const stamp=v=>{ const d=new Date(v); if(isNaN(d)) return String(v||"-");
  return dmy(HubMod.localDate(d))+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };
/* ข้อความใหม่แทนที่อันเก่า — ถ้าซ้อนกันสองอันที่ตำแหน่งเดียวกันจะอ่านไม่ออกทั้งคู่ */
function toast(t){document.querySelectorAll(".toast").forEach(x=>x.remove());
  const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600);}

/* ลำดับวงเงิน: เฉพาะสาขา → ค่าเริ่มต้นของรอบ → ค่าเริ่มต้นกลาง · ใส่ 0 = ตกไปใช้ค่าถัดไป · ทุกค่าเป็น 0 = ยังไม่ได้ตั้ง */
function limitOf(rid,code){
  const r=roundOf(rid)||{}, cfg=CFG();
  if(cfg.limits&&Number(cfg.limits[code])>0) return Number(cfg.limits[code]);
  return Number(r.limitDefault)||Number(cfg.defaultLimit)||0;
}

function modal(title,body,onSave,saveTxt="บันทึก",danger){
  const m=document.createElement("div");m.className="mask";
  const box=document.createElement("div");box.className="modal";
  box.innerHTML=`<div class="modal-head"><h3>${esc(title)}</h3><button class="modal-x" type="button" aria-label="ปิด">×</button></div>`;
  const bd=document.createElement("div");bd.className="modal-body";bd.appendChild(body);box.appendChild(bd);
  const close=()=>{m.remove();flushPending();};
  $(".modal-x",box).onclick=close;
  if(onSave){
    const act=document.createElement("div");act.className="modal-foot actions";
    const s=Object.assign(document.createElement("button"),{className:"btn"+(danger?" danger":""),textContent:saveTxt});
    const c=Object.assign(document.createElement("button"),{className:"btn ghost",textContent:"ยกเลิก"});
    c.onclick=close;
    s.onclick=async()=>{s.disabled=true;const o=s.textContent;s.textContent="กำลังดำเนินการ…";
      try{await onSave();close();}catch(e){toast(e.message||"ทำรายการไม่สำเร็จ");s.disabled=false;s.textContent=o;}};
    act.append(c,s);box.appendChild(act);
  }
  m.appendChild(box);
  m.onclick=e=>{if(e.target===m)close();};
  $("#modalHost").appendChild(m);return m;
}

function attachEmpPick(f){
  const n=$("#pn",f), c=$("#pc",f), pp=$("#pp",f), l=$("#pl",f); if(!n||!l) return;
  loadEmps();
  const norm=t=>String(t||"").replace(/^(นาย|นางสาว|นาง|น\.ส\.)\s*/,"").replace(/\s+/g,"").toLowerCase();
  const hide=()=>{ l.style.display="none"; };
  const show=src=>{
    const q=norm(src.value); if(!q||!EMPS||!EMPS.length) return hide();
    const hit=EMPS.filter(e=>norm(e.name).includes(q)||(e.code&&e.code.toLowerCase().includes(q))).slice(0,8);
    if(!hit.length) return hide();
    l.innerHTML=hit.map((e,i)=>`<div data-i="${i}" style="padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--border,#eee)"><b>${esc(e.name)}</b><div class="muted" style="font-size:12px">${esc([e.code?"รหัส "+e.code:"",e.position,e.branch].filter(Boolean).join(" · "))}</div></div>`).join("");
    l.style.display="block";
    l.onmousedown=ev=>{ const d=ev.target.closest("[data-i]"); if(!d) return; ev.preventDefault();
      const e=hit[+d.dataset.i]; n.value=e.name; c.value=e.code; pp.value=e.position; hide(); };
  };
  loadEmps().then(()=>{ if(document.activeElement===n) show(n); else if(document.activeElement===c) show(c); });
  n.addEventListener("input",()=>show(n)); c.addEventListener("input",()=>show(c));
  n.addEventListener("blur",()=>setTimeout(hide,150)); c.addEventListener("blur",()=>setTimeout(hide,150));
}

    idx===2?{c:no?"ok":"ok",t:no?"ไม่อนุมัติ":"อนุมัติ",d:stamp(x.statusAt)+who()+(no&&x.reason?"<br>เหตุผล: "+esc(x.reason):"")}:{c:"idle",t:"อนุมัติ / ไม่อนุมัติ",d:"ถ้าอนุมัติ เงินโอนเข้าบัญชีผู้รับเงินภายใน 7 วันทำการ ถ้าไม่อนุมัติ จะแสดงเหตุผลที่นี่"}];

      <div class="sum"><small>${cut?"ยอดที่จะได้รับ":"ยอดเบิก"}</small><div class="big">${baht(x.amount)} บาท</div>${cut?`<span class="chip">ขอเบิก ${baht(x.claimedAmount)} · ตัดตามวงเงิน เหลือ ${baht(x.amount)}</span>`:""}</div>

  { const h=document.querySelector(".main>.head h1"); if(h) h.innerHTML=`ส่งเอกสารรอบ ${esc(roundLabel(roundIdOf(x)))} แล้ว<small class="hsub">รอบนี้ส่งครบ 1 ครั้งแล้ว · ส่งครั้งถัดไปได้เมื่อเปิดรอบใหม่</small>`; }
  /*END*/
  { const hr=document.getElementById("hdr-r");
    if(hr) hr.innerHTML=`<div class="hsteps">${nodes.map((n,i)=>`<div class="hs ${n.c}" title="${esc(n.d.replace(/<br>/g," "))}"><span class="dot">${n.c==="ok"?"✓":""}</span><span><b>${n.t}</b><small>${n.d.split(" · ")[0].replace(/<br>.*/,"")}</small></span></div>${i<2?'<i class="ln"></i>':""}`).join("")}</div>`; }
  (x.photos||[]).forEach(u=>{ const im=new Image(); im.src=u; im.alt="ใบเสร็จ"; im.onclick=()=>zoom(u); $("#dnph",d).appendChild(im); });

    <div class="field"><label>ชื่อผู้ทำการเบิก <span style="color:var(--gold)">*</span></label><input id="cn" autocomplete="name" placeholder="ชื่อ–นามสกุล ผู้กรอกเอกสาร" value="${esc(DRAFT.claimant)}"></div>
    <div class="field"><label>จำนวนเงิน <span style="color:var(--gold)">*</span></label><div class="amtbox"><input id="am" inputmode="decimal" placeholder="0" value="${esc(DRAFT.amount)}"><span>บาท</span></div>
      ${lim0?`<div class="fhint">เบิกเกินวงเงินได้ แต่ระบบจะจ่ายไม่เกินวงเงินต่อรอบ ${baht(lim0)} บาท</div>`:""}</div>
    <div class="field"><label>หมายเหตุ</label><textarea id="nt" placeholder="เช่น ประชุมพนักงานประจำเดือน ค่าอาหารว่าง 12 คน">${esc(DRAFT.note)}</textarea></div>
    <div class="field"><label>แนบรูปใบเสร็จ <span style="color:var(--gold)">*</span> <span class="muted" style="font-weight:500">1–${MAX_PHOTOS} รูป</span></label><input id="ph" type="file" accept="image/*" multiple style="display:none">
      <div class="slots" id="strip"></div></div>
    <div class="payline">${pay.name?`ผู้รับเงิน: <b>${esc(pay.name)}</b>${pay.empCode?" · "+esc(pay.empCode):""}${pay.position?" · "+esc(pay.position):""}`:`ผู้รับเงิน: <b>ยังไม่มี</b> · แจ้งเพิ่มที่เมนู “ผู้รับเงิน”`}</div>
    <div class="sendrow"><button class="btn" id="send">ส่งเอกสาร</button><span class="sendnote">ส่งแล้วลบและส่งใหม่ได้จนกว่าผู้ดูแลจะอนุมัติ</span></div><div class="fmsg" id="msg"></div>`; }
  left.appendChild(f);

  { const lim=limitOf(r.id,ME.code), hint=()=>{ const a=Number($("#am",f).value)||0; msg(lim&&a>lim+1e-9?"ยอดเกินวงเงิน — ระบบจะจ่ายตามวงเงิน "+money(lim)+" บาท":"",""); };
    $("#am",f).addEventListener("input",hint); hint(); }

        status:"ส่งแล้ว",submittedAt:nowISO(),submittedBy:Hub.fullName()});

      toast("ส่งสำเร็จ · เลขเอกสาร "+docNo+(payAmt<amount?" · ตัดตามวงเงิน "+money(payAmt)+" บาท":""));
      renderBranch();
    }catch(err){ msg("ส่งไม่สำเร็จ: "+(err.message||"ลองใหม่อีกครั้ง"),"bad"); b.disabled=false; b.textContent="ส่งเอกสาร"; }
  };
}
let HY="";
function branchHistory(body,mine){
  const w=document.createElement("div"); w.className="narrow"; body.appendChild(w);
  if(!mine.length){ w.innerHTML=`<div class="empty">ยังไม่มีประวัติ</div>`; return; }

  mine=mine.filter(c=>roundIdOf(c).slice(0,4)===HY);

  const nRounds=new Set(okYear.map(roundIdOf)).size;

  const g={}; mine.forEach(x=>(g[roundIdOf(x)]=g[roundIdOf(x)]||[]).push(x));
  const cards=document.createElement("div"); cards.className="hist-cards"; w.appendChild(cards);
  Object.keys(g).sort().reverse().forEach(rid=>{
    cards.insertAdjacentHTML("beforeend",`<div class="sec">รอบ ${esc(roundLabel(rid))}</div>`);
    g[rid].forEach(x=>cards.appendChild(slip(x,false,true)));
  });
  /* จอกว้าง: ตารางหนึ่งแถวต่อใบ · กดแถวเพื่อดูรายละเอียด/รูป/ลบ */
  const tb=document.createElement("div"); tb.className="hist-tbl rowlist"; w.appendChild(tb);
  tb.innerHTML=`<div class="hrow hth"><span>รอบ</span><span>ส่งเมื่อ</span><span>ผู้ทำการเบิก</span><span>จำนวนเงิน</span><span>ใบเสร็จ</span><span>สถานะ</span><span></span></div>`;
  mine.slice().sort((a,b)=>roundIdOf(b).localeCompare(roundIdOf(a))||byTime(a,b)).forEach(x=>{
    const st=statusOf(x), row=document.createElement("div"); row.className="hrow";
    const cutH=Number(x.claimedAmount)>Number(x.amount)+1e-9;
    row.innerHTML=`<span><b>${esc(roundLabel(roundIdOf(x)))}</b></span><span>${esc(thDate(x.submittedAt)||stamp(x.submittedAt))}</span>
      <span>${esc(x.claimantName||"-")}</span><span>${cutH?`<span class="cutchip">ขอเบิก ${baht(x.claimedAmount)} · ตัดตามวงเงิน เหลือ ${baht(x.amount)}</span>`:"<b>"+baht(x.amount)+" บาท</b>"}${st==="ไม่อนุมัติ"&&x.reason?`<span class="rsn">เหตุผล: ${esc(x.reason)}</span>`:""}</span>
      <span>${(x.photos||[]).length} รูป</span><span>${pill(st)}</span><span class="chev">›</span>`;
    let det=null;
    row.onclick=()=>{
      if(det){ det.remove(); det=null; row.classList.remove("open"); return; }
      det=document.createElement("div"); det.className="hdet"; det.appendChild(slip(x,false));

  const pend=PREQ().filter(p=>p.branchCode===ME.code&&p.status==="pending");
  const last=PREQ().filter(p=>p.branchCode===ME.code&&p.status==="rejected").sort((a,b)=>(b.reviewedAt||"").localeCompare(a.reviewedAt||""))[0];
  w.innerHTML=`<div style="margin-top:16px">${cur.name?`<div class="bank"><small>ผู้รับเงินปัจจุบัน</small><b>${esc(cur.name)}</b><div class="ac">${esc(cur.position||"")}</div>
      <div class="meta">${cur.empCode?"รหัสพนักงาน "+esc(cur.empCode)+" · ":""}${cur.updatedAt?"อัปเดต "+esc(dmy(cur.updatedAt))+(cur.updatedBy?" โดย "+esc(cur.updatedBy):""):""}</div></div>`

  if(pend.length){
    const p=pend[0];
    w.insertAdjacentHTML("beforeend",`<div class="card warn">${pill("รอดำเนินการ","รอผู้ดูแลอนุมัติ")}
      <div style="margin-top:8px">ขอเปลี่ยนเป็น <b>${esc(p.next.name)}</b></div><div class="muted num">${esc(p.next.position||"")}${p.reason?" · เหตุผล: "+esc(p.reason):""}</div></div>`);
  }else if(last&&(!cur.updatedAt||last.reviewedAt>cur.updatedAt)){
    w.insertAdjacentHTML("beforeend",`<div class="card bad">${pill("ไม่อนุมัติ","คำขอล่าสุดไม่ได้รับอนุมัติ")}

    ${payeeFields(pend.length?{}:cur)}
    <div class="field"><label>เหตุผล</label><input id="pr" placeholder="เช่น ผู้จัดการสาขาคนเดิมย้ายสาขา"></div>
    <button class="btn full" id="preq" ${pend.length?"disabled":""}>${pend.length?"มีคำขอค้างอยู่ · รออนุมัติ":"ส่งคำขอ"}</button>`;
  w.appendChild(f); attachEmpPick(f);
  $("#preq",f).onclick=async e=>{
    const b=e.currentTarget;
    try{
      const next=readPayee(f);
      b.disabled=true; b.textContent="กำลังส่ง…";
      await S.refresh().catch(()=>{});
      if(PREQ().some(p=>p.branchCode===ME.code&&p.status==="pending")) throw new Error("มีคำขอค้างอยู่แล้ว รอผู้ดูแลอนุมัติก่อน");
      await S.set("payeeReq","PR-"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),{branchCode:ME.code,branchName:ME.name,
        prev:{name:cur.name||"",empCode:cur.empCode||"",position:cur.position||""},next,
        reason:$("#pr",f).value.trim(),status:"pending",createdAt:nowISO(),createdBy:Hub.fullName()});
      toast("ส่งคำขอให้ผู้ดูแลแล้ว");
      renderBranch();
    }catch(err){ toast(err.message||"ส่งคำขอไม่สำเร็จ"); b.disabled=false; b.textContent="ส่งคำขอ"; }
  };
}

/* ───── เอกสารหนึ่งใบ (การ์ด) ───── */
function slip(x,admin,compact){
  const st=statusOf(x), p=pillOf(st);
  const s=document.createElement("div"); s.className="slip "+p[1];
  const manage=admin&&can("update-status");
  /* การ์ดแบบย่อ (มือถือ): ฝั่งผู้ดูแล = สาขา+ยอด+ปุ่มอนุมัติ · ฝั่งสาขา = รอบ+ยอด+วันที่ส่ง */
  if(admin||compact){
    const cutH=Number(x.claimedAmount)>Number(x.amount)+1e-9;
    const amt=cutH?`<span class="cutchip">ขอเบิก ${baht(x.claimedAmount)} · ตัดตามวงเงิน เหลือ ${baht(x.amount)}</span>`:`<div class="amt">${baht(x.amount)} บาท</div>`;
    const title=admin?esc(Branches.label(x.branchCode,x.branchName)):"<b>"+esc(roundLabel(roundIdOf(x)))+"</b>";
    const meta=admin?esc(x.claimantName||"-")+" · "+esc(stamp(x.submittedAt))+" · ใบเสร็จ "+(x.photos||[]).length+" รูป"
      :"ส่ง "+esc(thDate(x.submittedAt)||stamp(x.submittedAt))+" · "+esc(x.claimantName||"-");
    s.classList.add("cd2");
    s.innerHTML=`<div class="top"><div style="min-width:0;font-size:16px;font-weight:700">${manage?`<input type="checkbox" data-sel="${esc(x.id)}" ${SEL.has(x.id)?"checked":""} style="width:auto;height:auto;margin-right:8px">`:""}${title}</div>${pill(st)}</div>
      <div style="margin-top:8px">${amt}</div><div class="muted" style="font-size:13px;margin-top:6px">${meta}</div>
      ${st==="ไม่อนุมัติ"&&x.reason?`<div style="color:var(--red-ink);font-size:13px;margin-top:6px">เหตุผล: ${esc(x.reason)}</div>`:""}`;
    if(manage){
      const open=(st==="อนุมัติ"||st==="ไม่อนุมัติ");
      const a=document.createElement("div"); a.className="mact";
      a.innerHTML=open?`<button class="ab ghost" data-act="รอดำเนินการ" data-id="${esc(x.id)}">ยกเลิกผล</button>`:`<button class="ab no" data-act="ไม่อนุมัติ" data-id="${esc(x.id)}">ไม่อนุมัติ</button><button class="ab yes" data-act="อนุมัติ" data-id="${esc(x.id)}">อนุมัติ</button>`;
      s.appendChild(a);
    }
    if(admin){ const op=document.createElement("button"); op.className="link"; op.style.cssText="margin-top:8px;font-size:13px"; op.textContent="ดูรายละเอียด / รูปใบเสร็จ"; op.onclick=()=>detail(x); s.appendChild(op); }
    return s;
  }
  s.innerHTML=`<div class="top"><div style="min-width:0">
      ${manage?`<label class="cardsel" style="margin:0 0 4px"><input type="checkbox" data-sel="${esc(x.id)}" ${SEL.has(x.id)?"checked":""}> <span class="docno">${esc(x.docNo||x.id)}</span></label>`:`<div class="muted docno">${esc(x.docNo||x.id)}</div>`}
      <div class="amt">${money(x.amount)} ฿</div>
      ${admin?`<div style="font-weight:700;font-size:13.5px"><span class="tag">${esc(Branches.brandName(Branches.brandOf(x.branchCode)))}</span>${esc(Branches.label(x.branchCode,x.branchName))}</div>`:""}
    </div>${pill(st)}</div>
    <div style="margin-top:6px">
      <div class="lead"><span>ผู้ทำการเบิก</span><b>${esc(x.claimantName||"-")}</b></div>
      <div class="lead"><span>ผู้รับเงิน</span><b>${esc([x.payeeName||x.payee,acctOf(x)].filter(Boolean).join(" · ")||"-")}</b></div>
      <div class="lead"><span>ส่งเมื่อ</span><b>${esc(stamp(x.submittedAt))} · รอบ ${esc(roundLabel(roundIdOf(x)))}</b></div>
      ${x.statusAt?`<div class="lead"><span>อัปเดตสถานะ</span><b>${esc(x.statusBy||"-")} · ${esc(stamp(x.statusAt))}</b></div>`:""}
    </div>
    ${Number(x.claimedAmount)>Number(x.amount)+1e-9?`<div class="note-cut">ขอเบิก ${money(x.claimedAmount)} ฿ · ตัดตามวงเงิน เหลือ ${money(x.amount)} ฿</div>`:""}
    ${x.note?`<div class="desc">${esc(x.note)}</div>`:""}
    ${x.reviewNote?`<div class="note-no">ผู้ดูแล: ${esc(x.reviewNote)}</div>`:""}`;
  const ph=photoStrip(x.photos);
  if(ph.children.length) s.appendChild(ph);
  const a=document.createElement("div"); a.className="acts";
  if(manage) a.appendChild(statusSelect(x));
  /* สาขาลบได้เฉพาะใบที่ยังไม่อนุมัติ — ใบที่อนุมัติแล้วเป็นหลักฐานการจ่ายเงิน */
  const mayDelete=admin?can("delete-claims"):(can("delete-own")&&ME.role==="branch"&&x.branchCode===ME.code&&st!=="อนุมัติ");
  if(mayDelete){
    const d=Object.assign(document.createElement("button"),{className:"btn sm danger push",textContent:"ลบ"});
    d.onclick=()=>removeClaim(x);
    a.appendChild(d);
  }
  if(a.children.length) s.appendChild(a);
  return s;
}
/* ปุ่มในแถว: อนุมัติ / ไม่อนุมัติ (ถามเหตุผล) / ยกเลิกผล */
function rowAct(id,to,btn){
  const x=S.get("claims",id); if(!x) return;
  const go=async reason=>{ await changeStatus(x,to,reason?{reason}:null); toast("อัปเดตสถานะเป็น “"+to+"” แล้ว"); };
  if(to==="ไม่อนุมัติ"){
    const f=document.createElement("div");
    f.innerHTML=`<div class="field"><label>เหตุผลที่ไม่อนุมัติ</label><textarea id="rsn" placeholder="เช่น ใบเสร็จไม่ชัด มองไม่เห็นยอดเงิน"></textarea></div><div class="muted">สาขาจะเห็นเหตุผลนี้ในประวัติ แล้วส่งใหม่ได้</div>`;
    modal("ไม่อนุมัติ "+(x.docNo||x.id),f,async()=>{ const t=$("#rsn",f).value.trim(); if(!t) throw new Error("ใส่เหตุผลก่อน"); await go(t); },"ไม่อนุมัติ",true);
    return;
  }
  btn.disabled=true;
  go().catch(err=>{ toast(err.message||"อัปเดตสถานะไม่สำเร็จ"); btn.disabled=false; });
}
function statusSelect(x){
  const st=statusOf(x);
  const sel=document.createElement("select"); sel.setAttribute("aria-label","สถานะเอกสาร "+(x.docNo||x.id));
  sel.innerHTML=STATUSES.map(v=>`<option ${v===st?"selected":""}>${esc(v)}</option>`).join("");
  sel.onchange=async()=>{
    const to=sel.value;
    sel.blur(); sel.disabled=true;
    try{ await changeStatus(x,to); toast("อัปเดตสถานะเป็น “"+to+"” แล้ว"); }
    catch(e){ toast(e.message||"อัปเดตสถานะไม่สำเร็จ"); sel.value=st; sel.disabled=false; }
  };
  return sel;
}
/* เปลี่ยนสถานะหนึ่งใบ — ใช้ทั้งช่องเลือกในแถวและปุ่มอัปเดตหลายใบ · คืน false = สถานะเดิมอยู่แล้ว */
async function changeStatus(x,to,extra){
  const from=statusOf(x);
  if(from===to) return false;
  /* ดึงใบที่ไม่อนุมัติกลับมา = ใช้สิทธิ์และวงเงินของรอบอีกครั้ง */
  if(from==="ไม่อนุมัติ"){
    const rid=roundIdOf(x), lim=limitOf(rid,x.branchCode);
    const other=activeClaim(rid,x.branchCode,x.id);
    if(other) throw new Error("เปลี่ยนไม่ได้ สาขานี้มีเอกสารรอบนี้อยู่แล้ว ("+(other.docNo||other.id)+")");
    if(lim&&used(rid,x.branchCode)+(Number(x.amount)||0)>lim+1e-9) throw new Error("เปลี่ยนไม่ได้ สาขาจะเกินวงเงินรอบนี้ ("+money(lim)+" บาท)");
  }
  /* expect = สถานะที่เห็นอยู่บนจอ · อีกเครื่องเพิ่งเปลี่ยนไป จะไม่เขียนทับ */
  await S.update("claims",x.id,{status:to,statusAt:nowISO(),statusBy:Hub.fullName(),reason:to==="ไม่อนุมัติ"?((extra&&extra.reason)||""):""},x.status==null?null:{status:x.status});
  return true;
}
function removeClaim(x){
  const f=document.createElement("div");
  f.innerHTML=`<div style="font-size:15px">ยืนยันลบเอกสาร <b class="docno">${esc(x.docNo||x.id)}</b> ?</div>
    <div class="muted" style="margin-top:6px">${esc(Branches.label(x.branchCode,x.branchName))} · ${money(x.amount)} บาท · ลบแล้วเรียกคืนไม่ได้</div>`;
  modal("ลบเอกสาร",f,async()=>{
    await S.refresh().catch(()=>{});
    const cur=S.get("claims",x.id);
    if(!cur) throw new Error("เอกสารนี้ถูกลบไปแล้ว");
    if(ME.role==="branch"&&statusOf(cur)==="อนุมัติ") throw new Error("เอกสารนี้อนุมัติแล้ว ลบไม่ได้");
    await S.remove("claims",x.id,{status:cur.status});
    SEL.delete(x.id);
    toast("ลบเอกสารแล้ว");
  },"ลบเอกสาร",true);
}
function detail(x){
  const d=document.createElement("div");
  const s=slip(x,false); const a=$(".acts",s); if(a) a.remove();
  d.appendChild(s);
  s.querySelectorAll(".photos img").forEach(i=>{i.style.width="130px";i.style.height="170px";});
  const rid=roundIdOf(x), lim=limitOf(rid,x.branchCode);
  d.insertAdjacentHTML("beforeend",`<div class="card"><div class="lead"><span>วงเงินสาขา รอบ ${esc(roundLabel(rid))}</span><b>${lim?baht(used(rid,x.branchCode))+" / "+baht(lim)+" ฿":"ยังไม่ได้ตั้ง"}</b></div>
    ${x.payeeEmpCode?`<div class="lead"><span>รหัสพนักงานผู้รับเงิน</span><b>${esc(x.payeeEmpCode)}</b></div>`:""}</div>`);
  modal(Branches.label(x.branchCode,x.branchName),d,null);
}

/* ═════════════ ผู้ดูแล / ทีมบริหาร ═════════════ */
function adminTabs(){
  const t=[];
  if(can("view-claims")||can("update-status")) t.push({k:"list",t:"เอกสารเบิก",ic:"🧾",n:CLAIMS().filter(isWaiting).length});
  if(can("manage-rounds")) t.push({k:"rounds",t:"รอบเบิก",ic:"🗓"});
  if(can("view-claims")||can("update-status")) t.push({k:"bzm",t:"สรุปตาม BZM",ic:"👥"});
  if(can("view-claims")||can("update-status")) t.push({k:"rpt",t:"รายงาน",ic:"📊"});
  if(can("manage-limits")) t.push({k:"limits",t:"วงเงินสาขา",ic:"💰"});
  if(can("manage-payees")) t.push({k:"payees",t:"ผู้รับเงิน",ic:"🏦",n:PREQ().filter(p=>p.status==="pending").length});
  return t;
}
function renderAdmin(){
  const tabs=adminTabs();
  if(!tabs.length)
    return gate("ไม่มีสิทธิ์เข้าระบบนี้","บัญชีของคุณยังไม่ได้รับสิทธิ์ในระบบเบิกเงินประชุมสาขา<br>ขอสิทธิ์ได้จากผู้ดูแลฮับ (⚙️ → สิทธิ์ปุ่มแต่ละระบบ)");
  if(!tabs.some(t=>t.k===ATAB)) ATAB=tabs[0].k;
  const r=currentRound();
  let extra="";
  const nb=Branches.list().length;
  if(r&&nb){ const sent=sentBranches(r.id);
    extra=`<div class="meter" style="margin-top:8px"><i style="width:${Math.min(100,sent/nb*100)}%"></i></div><div style="margin-top:4px">ส่งแล้ว ${sent} / ${nb} สาขา</div>`; }
  const body=frame(tabs,ATAB,k=>{ATAB=k;renderAdmin();},roundBoxHtml(r,extra));
  ({list:adminList,bzm:adminBzm,rpt:adminReport,rounds:adminRounds,limits:adminLimits,payees:adminPayees})[ATAB](body,r);
}
function adminList(body,r){
  const manage=can("update-status");
  const rids=[...new Set(ROUNDS().map(x=>x.id).concat(CLAIMS().map(roundIdOf)))].filter(Boolean).sort().reverse();
  if(F.round===""&&rids.length) F.round=(r||{}).id||rids[0];
  body.innerHTML=`<div class="head"><h1>${manage?"เอกสารเบิก":"ภาพรวมการเบิก"}</h1><span class="sp"></span>
      <input id="fq" class="hq" value="${esc(F.q)}" placeholder="ค้นหารหัส / ชื่อสาขา">
      <select id="fr" class="hs" aria-label="รอบ">${rids.map(id=>`<option value="${esc(id)}" ${F.round===id?"selected":""}>รอบ ${esc(roundLabel(id))}</option>`).join("")}
        <option value="_all" ${F.round==="_all"?"selected":""}>ทุกรอบ</option></select></div>
    <div class="kstrip" id="kp" style="display:none"></div>
    <div class="fl">
      <span id="chips"></span><span class="sp" style="flex:1"></span>
      <select id="fb" class="hs" aria-label="แบรนด์"><option value="">ทุกแบรนด์</option>${Branches.brands().map(k=>`<option value="${esc(k)}" ${F.brand===k?"selected":""}>${esc(Branches.brandName(k))}</option>`).join("")}</select>
      <button class="btn ghost sm" id="csv">⬇ ส่งออก Excel</button>
    </div>
    <div id="out"></div><div id="bulk"></div>`;
  const out=$("#out",body);
  const scope=()=>CLAIMS().filter(c=>(F.round==="_all"||!F.round||roundIdOf(c)===F.round)&&(!F.brand||Branches.brandOf(c.branchCode)===F.brand));
  const listNow=()=>{ const q=F.q.trim().toLowerCase();
    return scope().filter(c=>(!F.status||statusOf(c)===F.status)
      &&(!q||[c.branchCode,Branches.label(c.branchCode,c.branchName),c.claimantName,c.payeeName,c.docNo||c.id].join(" ").toLowerCase().indexOf(q)>=0))
      .sort((a,b)=>(isWaiting(a)?0:1)-(isWaiting(b)?0:1)||byTime(a,b)); };
  const draw=()=>{
    const sc=scope(), list=listNow();
    const wait=CLAIMS().filter(isWaiting), ok=sc.filter(c=>statusOf(c)==="อนุมัติ");
    const all=F.round==="_all";
    const nbr=Branches.list().filter(b=>!F.brand||b.brand===F.brand).length;
    const sent=new Set(sc.filter(c=>!isRejected(c)).map(c=>c.branchCode)).size;
    $("#kp",body).innerHTML=`<div><small>รอตรวจ</small><b class="o">${wait.length} ใบ</b><em>ทุกรอบ</em></div>
      <div><small>ยอดรอตรวจ</small><b>${baht(sumOf(wait))} ฿</b><em>ทุกรอบ</em></div>
      <div><small>อนุมัติแล้ว</small><b class="g">${baht(sumOf(ok))} ฿</b><em>${ok.length} ใบ · ${all?"ทุกรอบ":"รอบที่เลือก"}</em></div>
      <div><small>สาขาที่ส่ง</small><b>${sent}${all?"":" / "+nbr}</b><em>${all?"ทุกรอบ":"รอบที่เลือก"}</em></div>`;
    $("#chips",body).innerHTML=[["","ทั้งหมด",sc.length]].concat(STATUSES.map(s=>[s,s,sc.filter(c=>statusOf(c)===s).length]))
      .map(([k,t,n])=>`<button class="chip ${F.status===k?"on":""}" data-st="${esc(k)}">${esc(t)} <em>${n}</em></button>`).join(" ");
    /* ตัดตัวที่เลือกซึ่งไม่อยู่ในรายการแล้ว */
    const ids=new Set(list.map(c=>c.id)); [...SEL].forEach(id=>{ if(!ids.has(id)) SEL.delete(id); });
    if(!list.length) out.innerHTML=`<div class="empty">ไม่มีรายการ</div>`;
    else if(WIDE()){
      out.innerHTML=tableHtml(list,manage);
    }else{ out.innerHTML=""; list.forEach(x=>out.appendChild(slip(x,true))); }
    drawBulk(list);
  };
  const drawBulk=list=>{
    const box=$("#bulk",body);
    const chosen=list.filter(c=>SEL.has(c.id));
    if(!manage||!chosen.length){ box.innerHTML=""; return; }
    box.innerHTML=`<div class="bulk"><b>เลือก ${chosen.length} ใบ · ${money(sumOf(chosen))} บาท</b><span class="sp"></span>
      <button class="btn sm ok" data-to="อนุมัติ">อนุมัติที่เลือก</button><button class="btn sm ghost" data-to="รอดำเนินการ">รอดำเนินการ</button>
      <button class="btn sm ghost" data-clear="1">ยกเลิกเลือก</button></div>`;
    box.querySelectorAll("button").forEach(b=>b.onclick=async()=>{
      if(b.dataset.clear){ SEL.clear(); draw(); return; }
      const to=b.dataset.to; box.querySelectorAll("button").forEach(x=>x.disabled=true);
      let okN=0, skip=0; const errs=[];
      for(const x of chosen){
        try{ (await changeStatus(S.get("claims",x.id)||x,to))?okN++:skip++; }
        catch(e){ errs.push((x.docNo||x.id)+" · "+(e.message||"ไม่สำเร็จ")); }

function exportCsv(list){
  if(!list.length) return toast("ไม่มีรายการให้ส่งออก");
  const rows=[["เลขเอกสาร","รอบ","รหัสสาขา","สาขา","แบรนด์","ผู้ทำการเบิก","ยอด (จ่ายตามวงเงิน)","ผู้รับเงิน","รหัสพนักงาน","ตำแหน่งผู้รับเงิน","สถานะ","ส่งเมื่อ","หมายเหตุ","อัปเดตสถานะโดย"]]
    .concat(list.map(c=>[c.docNo||c.id,roundLabel(roundIdOf(c)),c.branchCode,Branches.nameOf(c.branchCode)||c.branchName||"",
      Branches.brandName(Branches.brandOf(c.branchCode)),c.claimantName||"",Number(c.amount)||0,c.payeeName||c.payee||"",c.payeeEmpCode||"",
      c.payeePosition||"",statusOf(c),stamp(c.submittedAt),c.note||"",c.statusBy||""]));
  /* รหัสสาขา · รหัสพนักงาน ครอบด้วย ="" ให้ Excel ไม่ตัดเลขศูนย์หน้า */
  const cell=(v,i)=>{ const s=String(v==null?"":v); if([2,8].includes(i)&&s) return '="'+s.replace(/"/g,'""')+'"';
    return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const csv="﻿"+rows.map(r=>r.map(cell).join(",")).join("\r\n");
  const a=document.createElement("a");

  a.download="เบิกเงินประชุม-"+(F.round&&F.round!=="_all"?F.round:"ทุกรอบ")+".csv";

}

      <div class="sub">สาขาตามทะเบียนฮับ · ไม่นับเอกสารที่ไม่อนุมัติ · เลือกช่วงเดือนและเกณฑ์ที่ต้องการดู</div></div>
    <div class="fl"><label class="muted">ตั้งแต่ <input type="month" id="rf" value="${esc(RV.from)}"></label><label class="muted">ถึง <input type="month" id="rt" value="${esc(RV.to)}"></label>
      <span><button class="chip ${RV.basis==="ok"?"on":""}" data-b="ok">เฉพาะอนุมัติแล้ว</button> <button class="chip ${RV.basis==="all"?"on":""}" data-b="all">รวมรอตรวจ</button></span></div>
    <div id="rout"></div>`;
  const redo=()=>adminReport(body);
  $("#rf",body).onchange=e=>{RV.from=e.target.value||RV.from;redo();};
  $("#rt",body).onchange=e=>{RV.to=e.target.value||RV.to;redo();};
  body.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{RV.basis=b.dataset.b;redo();});
  const inRange=id=>id>=RV.from&&id<=RV.to, okOnly=RV.basis==="ok";
  const cl=CLAIMS().filter(c=>!isRejected(c)&&inRange(roundIdOf(c))&&(!okOnly||statusOf(c)==="อนุมัติ"));
  const brs=Branches.list(), byCode={}; brs.forEach(b=>byCode[b.code]=b);
  const inList=cl.filter(c=>byCode[c.branchCode]);
  const out=$("#rout",body);
  const tot=sumOf(inList), nb=new Set(inList.map(c=>c.branchCode)).size;
  const months=[]; { let [y,m]=RV.from.split("-").map(Number); const [ey,em]=RV.to.split("-").map(Number); while((y<ey||(y===ey&&m<=em))&&months.length<36){ months.push(y+"-"+String(m).padStart(2,"0")); m++; if(m>12){m=1;y++;} } }
  const mv=months.map(id=>({id,v:sumOf(inList.filter(c=>roundIdOf(c)===id))}));
  const mx=Math.max(1,...mv.map(x=>x.v));
  const multiYear=RV.from.slice(0,4)!==RV.to.slice(0,4);
  const chart=`<div class="card" style="margin-bottom:14px"><div class="lead" style="margin-bottom:8px"><span>ยอดเบิกรายเดือน</span><b>${baht(tot)} ฿</b></div>
    <div style="display:flex;align-items:flex-end;gap:6px;height:170px;overflow-x:auto;padding-top:18px">${mv.map(x=>`<div style="flex:1 0 40px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:40px">
      <small class="num" style="font-size:10.5px;color:var(--text3)">${x.v?baht(x.v):""}</small>
      <div style="width:70%;max-width:34px;border-radius:6px 6px 0 0;background:${x.v?"var(--primary,#F97316)":"var(--border)"};height:${x.v?Math.max(3,x.v/mx*100*0.78):1.5}%"></div>
      <small style="font-size:11px;margin-top:4px">${MONTHS_TH[+x.id.slice(5,7)]}${multiYear?" "+String((+x.id.slice(0,4)+543)%100):""}</small></div>`).join("")}</div></div>`;
  const keyOf={bzm:c=>bzmOf(c.branchCode).label,brand:c=>byCode[c.branchCode].brandName,branch:c=>byCode[c.branchCode].code+" "+byCode[c.branchCode].name};
  const g={}; inList.forEach(c=>{ const k=keyOf[RV.by](c); const o=g[k]||(g[k]={k,sum:0,n:0,br:new Set()}); o.sum+=Number(c.amount)||0; o.n++; o.br.add(c.branchCode); });
  const rows=Object.values(g).sort((a,b)=>b.sum-a.sum);
  const gt=[["bzm","ตาม BZM"],["brand","ตามแบรนด์"],["branch","ตามสาขา"]];
  const tbl=`<div class="card" style="margin-bottom:14px"><div class="fl" style="margin:0 0 10px">${gt.map(([k,t])=>`<button class="chip ${RV.by===k?"on":""}" data-g="${k}">${t}</button>`).join(" ")}</div>
    ${rows.length?`<div class="rowlist"><div class="tr th"><span>${RV.by==="bzm"?"BZM":RV.by==="brand"?"แบรนด์":"สาขา"}</span><span>ใบเบิก</span><span>สาขา</span><span>ยอดเบิก</span><span>สัดส่วน</span></div>
    ${rows.map(x=>`<div class="tr line-item"><span><b>${esc(x.k)}</b></span><span class="num">${x.n}</span><span class="num">${x.br.size}</span><span class="num"><b>${baht(x.sum)}</b></span>
      <span><div class="meter"><i style="width:${tot?x.sum/tot*100:0}%"></i></div><small class="num">${tot?(x.sum/tot*100).toFixed(1):0}%</small></span></div>`).join("")}</div>`:`<div class="empty">ช่วงนี้ยังไม่มีเอกสารเบิก${okOnly?"ที่อนุมัติ":""}</div>`}</div>`;
  const sentSet=new Set(inList.map(c=>c.branchCode));
  const lim=(CFG().limits||{}), dl=Number(CFG().defaultLimit)||0;
  const none=brs.filter(b=>!sentSet.has(b.code)&&(Number(lim[b.code])>0||dl>0));
  const nonec=none.length?`<details class="card" style="margin-bottom:14px"><summary style="cursor:pointer"><b>สาขาที่ไม่มีการเบิกในช่วงนี้</b> <span class="pill p-wait">${none.length} สาขา</span></summary>
    <div class="rowlist" style="margin-top:10px">${none.map(b=>`<div class="tr line-item"><span><b>${esc(b.code)} ${esc(b.name)}</b><small>${esc(b.brandName)}</small></span><span>${esc(bzmOf(b.code).label)}</span></div>`).join("")}</div></details>`:"";
  out.innerHTML=`<div class="kstrip"><div><small>ยอดเบิกรวม</small><b class="g">${baht(tot)}</b><em>${okOnly?"อนุมัติแล้ว":"รวมรอตรวจ"} · ${months.length} เดือน</em></div>
      <div><small>จำนวนใบเบิก</small><b>${inList.length}</b><em>${nb} สาขา</em></div>
      <div><small>เฉลี่ยต่อใบ</small><b>${inList.length?baht(Math.round(tot/inList.length)):"—"}</b><em>บาท</em></div>
      <div><small>ไม่มีการเบิก</small><b class="o">${none.length}</b><em>จาก ${brs.length} สาขา</em></div></div>${chart}${tbl}${nonec}`;
  out.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{RV.by=b.dataset.g;redo();});
  $("#rprt",body).onclick=()=>window.print();
  $("#rcsv",body).onclick=()=>{
    if(!inList.length) return toast("ไม่มีรายการให้ส่งออก");
    const R=[["รอบ","รหัสสาขา","สาขา","แบรนด์","BZM","ผู้รับเงิน","ยอดเบิก","สถานะ"]];
    inList.slice().sort((a,b)=>roundIdOf(a).localeCompare(roundIdOf(b))||String(a.branchCode).localeCompare(String(b.branchCode)))
      .forEach(c=>{ const b=byCode[c.branchCode]; R.push([roundIdOf(c),b.code,b.name,b.brandName,bzmOf(b.code).label,c.payeeName||c.payee||"",Number(c.amount)||0,statusOf(c)]); });
    const cell=v=>{ const t=String(v==null?"":v); return /[",\r\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t; };
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob(["﻿"+R.map(r=>r.map(cell).join(",")).join("\r\n")],{type:"text/csv;charset=utf-8"}));
    a.download="รายงานเบิกเงินประชุม-"+RV.from+"ถึง"+RV.to+".csv";
    document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  };
}

/* ═════════════ สรุปตาม BZM ═════════════
   BZM ของสาขา = ตามทะเบียนสาขาของฮับ (ฮับเป็นเจ้าของ) · ยอดนับจากเอกสารเบิกที่ไม่ถูกปฏิเสธ · "อนุมัติ" = สถานะอนุมัติ */
const MONTHS_TH=["","ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
function bzmOf(code){
  const raw=Branches.raw()||{}, nick=(raw.bzmMap||{})[code]||"";
  if(!nick) return {key:"",label:"— ไม่ระบุ BZM —"};
  const users=(Cfg.data&&Cfg.data.users)||[];
  const u=users.find(x=>x&&x.nick===nick&&x.role==="bzm")||users.find(x=>x&&x.nick===nick);
  const nm=u&&u.name?String(u.name).replace(/^(นาย|นางสาว|นาง)\s*/,"").trim():"";
  return {key:nick,label:nick+(nm?" · "+nm:"")};
}
let BV={mode:"round",round:"",all:false};   /* มุมมองสรุป: รอบเดียว / ทั้งปีรายเดือน */
function adminBzm(body,r){
  const rids=[...new Set(ROUNDS().map(x=>x.id).concat(CLAIMS().map(roundIdOf)))].filter(Boolean).sort().reverse();
  if(!BV.round||!rids.includes(BV.round)) BV.round=(r||{}).id||rids[0]||"";
  const years=[...new Set(rids.map(x=>x.slice(0,4)))];
  if(!BV.year||!years.includes(BV.year)) BV.year=(BV.round||thisRoundId()).slice(0,4);
  body.innerHTML=`<div class="head"><h1>สรุปตาม BZM</h1><span class="sp"></span>${updLabel()}<button class="btn ghost sm" id="bcsv">⬇ ส่งออก Excel</button>
      <div class="sub">รวมวงเงิน · ยอดเบิก · ยอดอนุมัติ แยกตาม BZM ของแต่ละสาขา (BZM ตามทะเบียนสาขาของฮับ) · ไม่นับเอกสารที่ไม่อนุมัติ</div></div>
    <div class="fl"><span><button class="chip ${BV.mode==="round"?"on":""}" data-m="round">รายรอบ</button> <button class="chip ${BV.mode==="year"?"on":""}" data-m="year">ทั้งปี รายเดือน</button></span>
      ${BV.mode==="round"
        ?`<select id="brd" aria-label="รอบ">${rids.map(id=>`<option value="${esc(id)}" ${BV.round===id?"selected":""}>รอบ ${esc(roundLabel(id))}</option>`).join("")}</select>`
        :`<select id="byr" aria-label="ปี">${years.map(y=>`<option value="${y}" ${BV.year===y?"selected":""}>ปี ${+y+543}</option>`).join("")}</select>
          <label class="muted" style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" id="ball" ${BV.all?"checked":""}> นับรวมที่ยังไม่อนุมัติ</label>`}
    </div><div id="bout"></div>`;
  body.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{BV.mode=b.dataset.m;adminBzm(body,r);});
  if($("#brd",body)) $("#brd",body).onchange=e=>{BV.round=e.target.value;adminBzm(body,r);};
  if($("#byr",body)) $("#byr",body).onchange=e=>{BV.year=e.target.value;adminBzm(body,r);};
  if($("#ball",body)) $("#ball",body).onchange=e=>{BV.all=e.target.checked;adminBzm(body,r);};
  const out=$("#bout",body); let csvRows=[];
  const grp=(fn)=>{ const g={}; Branches.list().forEach(b=>{ const z=bzmOf(b.code); (g[z.label]=g[z.label]||{label:z.label,key:z.key,list:[]}).list.push(b); }); return Object.values(g).sort((a,b)=>a.key?(b.key?a.label.localeCompare(b.label,"th"):-1):1).map(x=>(fn&&fn(x),x)); };
  if(BV.mode==="round"){
    const rid=BV.round;
    if(!rid){ out.innerHTML=`<div class="empty">ยังไม่มีรอบเบิก</div>`; $("#bcsv",body).onclick=()=>toast("ไม่มีรายการให้ส่งออก"); return; }
    const inRound=CLAIMS().filter(c=>roundIdOf(c)===rid&&!isRejected(c));
    const groups=grp(z=>{
      z.rows=z.list.map(b=>{ const lim=limitOf(rid,b.code), cs=inRound.filter(c=>c.branchCode===b.code), sent=sumOf(cs), ok=sumOf(cs.filter(c=>statusOf(c)==="อนุมัติ"));
        return {b,lim,sent,ok,wait:sent-ok,has:cs.length>0,p:payeeOf(b.code)}; }).filter(x=>x.lim>0||x.has);
      z.t={lim:0,sent:0,ok:0,wait:0,br:z.rows.length,notSent:0};
      z.rows.forEach(x=>{ z.t.lim+=x.lim; z.t.sent+=x.sent; z.t.ok+=x.ok; z.t.wait+=x.wait; if(!x.has) z.t.notSent++; });
    }).filter(z=>z.rows.length);
    const T=groups.reduce((a,z)=>({lim:a.lim+z.t.lim,sent:a.sent+z.t.sent,ok:a.ok+z.t.ok,wait:a.wait+z.t.wait,notSent:a.notSent+z.t.notSent,br:a.br+z.t.br}),{lim:0,sent:0,ok:0,wait:0,notSent:0,br:0});
    out.innerHTML=`<div class="kstrip"><div><small>วงเงินรวม</small><b>${baht(T.lim)}</b><em>${T.br} สาขา</em></div><div><small>ส่งเบิกแล้ว</small><b class="o">${baht(T.sent)}</b><em>${T.br-T.notSent} สาขา</em></div>
        <div><small>อนุมัติแล้ว</small><b class="g">${baht(T.ok)}</b><em>รอตรวจ ${baht(T.wait)}</em></div><div><small>ยังไม่ส่ง</small><b>${T.notSent}</b><em>สาขา</em></div></div>
      ${groups.map(z=>`<details class="card" style="margin-bottom:10px" ${groups.length<=3?"open":""}><summary style="cursor:pointer;display:flex;gap:10px;align-items:center;flex-wrap:wrap;list-style:none">
        <b style="min-width:150px">${esc(z.label)}</b><span class="muted">${z.t.br} สาขา</span><span class="sp" style="flex:1"></span>
        <span class="num">วงเงิน ${baht(z.t.lim)}</span><span class="num">เบิก ${baht(z.t.sent)}</span><span class="num" style="color:var(--green)">อนุมัติ ${baht(z.t.ok)}</span>
        ${z.t.notSent?`<span class="pill p-wait">ยังไม่ส่ง ${z.t.notSent}</span>`:`<span class="pill p-ok">ส่งครบ</span>`}</summary>
        <div class="rowlist" style="margin-top:10px"><div class="tr th"><span>สาขา</span><span>ผู้รับเงิน</span><span>วงเงิน</span><span>เบิก</span><span>อนุมัติ</span></div>
        ${z.rows.map(x=>`<div class="tr line-item"><span><b>${esc(x.b.code)} ${esc(x.b.name)}</b></span><span>${x.p.name?esc(x.p.name):"<span class='muted'>—</span>"}</span>
          <span class="num">${x.lim?baht(x.lim):"—"}</span><span class="num">${x.has?baht(x.sent):`<span class="pill p-wait">ยังไม่ส่ง</span>`}</span><span class="num">${x.has?baht(x.ok):"—"}</span></div>`).join("")}</div></details>`).join("")}`;
    csvRows=[["BZM","รหัสสาขา","สาขา","ผู้รับเงิน","วงเงิน","เบิก","อนุมัติ","ยังไม่อนุมัติ"]];
    groups.forEach(z=>z.rows.forEach(x=>csvRows.push([z.label,x.b.code,x.b.name,x.p.name||"",x.lim,x.sent,x.ok,x.wait])));
  }else{
    const yr=BV.year, pick=c=>BV.all?!isRejected(c):statusOf(c)==="อนุมัติ";
    const claims=CLAIMS().filter(c=>roundIdOf(c).slice(0,4)===yr&&pick(c));
    const groups=grp(z=>{ z.m=Array(13).fill(0); const codes=new Set(z.list.map(b=>b.code));
      claims.forEach(c=>{ if(codes.has(c.branchCode)){ const m=+roundIdOf(c).slice(5,7); if(m>=1&&m<=12) z.m[m]+=Number(c.amount)||0; } });
      z.tot=z.m.reduce((a,b)=>a+b,0); }).filter(z=>z.tot>0);
    const colT=Array(13).fill(0); groups.forEach(z=>z.m.forEach((v,i)=>colT[i]+=v));
    out.innerHTML=groups.length?`<div class="muted" style="margin:0 2px 8px">เบิก${BV.all?"ทั้งหมดที่ไม่ถูกปฏิเสธ":"ที่อนุมัติแล้ว"} ปี ${+yr+543} · ${groups.length} BZM · รวม ${baht(colT.reduce((a,b)=>a+b,0))} ฿</div>
      <div class="twrap"><table class="tbl"><thead><tr><th>BZM</th>${MONTHS_TH.slice(1).map(m=>`<th class="r">${m}</th>`).join("")}<th class="r">รวม</th></tr></thead><tbody>
      ${groups.map(z=>`<tr><td><b>${esc(z.label)}</b></td>${z.m.slice(1).map(v=>`<td class="r num">${v?baht(v):"—"}</td>`).join("")}<td class="r num"><b>${baht(z.tot)}</b></td></tr>`).join("")}
      <tr><td><b>รวมทุก BZM</b></td>${colT.slice(1).map(v=>`<td class="r num"><b>${v?baht(v):"—"}</b></td>`).join("")}<td class="r num"><b>${baht(colT.reduce((a,b)=>a+b,0))}</b></td></tr></tbody></table></div>`
      :`<div class="empty">ปี ${+yr+543} ยังไม่มีเอกสารเบิก${BV.all?"":"ที่อนุมัติ"}</div>`;
    csvRows=[["BZM"].concat(MONTHS_TH.slice(1),["รวม"])];
    groups.forEach(z=>csvRows.push([z.label].concat(z.m.slice(1),[z.tot])));
  }
  $("#bcsv",body).onclick=()=>{
    if(csvRows.length<2) return toast("ไม่มีรายการให้ส่งออก");
    const cell=v=>{ const t=String(v==null?"":v); return /[",\r\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t; };
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob(["﻿"+csvRows.map(r=>r.map(cell).join(",")).join("\r\n")],{type:"text/csv;charset=utf-8"}));
    a.download="สรุปเบิกเงินประชุมตาม-BZM-"+(BV.mode==="round"?BV.round:BV.year)+".csv";
    document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  };
}

/* ═════════════ นำเข้ารายชื่อทีมผู้จัดการสาขา + งบต่อคน จาก Excel ═════════════
   ไฟล์ตามแบบ "รายชื่อทีมผู้จัดการสาขา (โอนเงิน …)" — ชีตรายเดือน (เช่น 10-69) คอลัมน์: BZM · สาขา(รหัส) · ชื่อสาขา · รหัสพนักงาน · ชื่อ-สกุล · ตำแหน่ง · งบในการใช้
   นำเข้า = ตั้งวงเงินเฉพาะสาขาตามงบ + ใส่ผู้รับเงิน (ชื่อ รหัสพนักงาน ตำแหน่ง) · คนเดิมไม่เปลี่ยนไม่ถูกแตะ
   ผู้รับเงินเปลี่ยนคน → ข้ามไว้ก่อน (ติ๊กถึงจะเปลี่ยน) */
function loadXlsx(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((ok,no)=>{ const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"; s.onload=()=>ok(window.XLSX);
    s.onerror=()=>no(new Error("โหลดตัวอ่านไฟล์ Excel ไม่ได้ — ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่")); document.head.appendChild(s); });
}
const normName=t=>String(t||"").replace(/^(นาย|นางสาว|นาง|น\.ส\.)\s*/,"").replace(/\s+/g,"").toLowerCase();
function parseRoster(XLSX,wb,sheet){
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[sheet],{header:1,defval:"",raw:true});
  const hi=rows.findIndex(r=>String(r[0]).trim().toUpperCase()==="NO.");
  if(hi<0) throw new Error("ไม่พบแถวหัวตาราง (NO.) ในชีต "+sheet);
  const H=rows[hi].map(x=>String(x).trim());
  const ix=name=>H.indexOf(name);
  const cCode=ix("สาขา"), cEmp=ix("รหัสพนักงาน"), cName=H.findIndex(x=>x.replace(/\s/g,"")==="ชื่อ-สกุล"), cPos=ix("ตำแหน่ง"), cBud=H.findIndex(x=>x==="งบในการใช้"||x==="วงเงินประชุม"), cBzm=ix("BZM");
  if([cCode,cEmp,cName,cBud].some(i=>i<0)) throw new Error("หัวคอลัมน์ไม่ครบ (ต้องมี สาขา · รหัสพนักงาน · ชื่อ - สกุล · งบในการใช้) ในชีต "+sheet);
  const out=[];
  rows.slice(hi+1).forEach(r=>{
    const code=String(r[cCode]).trim().replace(/\.0$/,"");
    if(!/^\d{4}$/.test(code)) return;
    out.push({code,branchName:String(r[cCode+1]||"").trim(),bzm:cBzm>=0?String(r[cBzm]||"").trim():"",empCode:String(r[cEmp]||"").trim().replace(/\.0$/,""),
      name:String(r[cName]||"").replace(/\s+/g," ").trim(),position:cPos>=0?String(r[cPos]||"").trim():"",budget:Number(r[cBud])||0});
  });
  if(!out.length) throw new Error("ไม่พบรายชื่อที่มีรหัสสาขา 4 หลักในชีต "+sheet);
  return out;
}
function openImport(){
  const IMP={wb:null,rows:[],sheet:"",optLimit:true,optSwap:false};
  const f=document.createElement("div");
  f.innerHTML=`<div class="muted" style="margin-bottom:10px">เลือกไฟล์ Excel รายชื่อทีมผู้จัดการสาขา (ชีตรายเดือน เช่น <b>10-69</b>) ระบบแสดงตัวอย่างก่อน แล้วค่อยกดบันทึก</div>
    <div class="field"><input id="xf" type="file" accept=".xlsx,.xls"></div>
    <div id="xs" style="display:none" class="field"><label>ชีตที่จะนำเข้า</label><select id="xsh"></select></div>
    <div id="xo" style="display:none">
      <label style="display:flex;gap:8px;align-items:center;margin:4px 0"><input type="checkbox" id="xl" checked> ตั้งวงเงินเฉพาะสาขาตามงบในไฟล์</label>
      <label style="display:flex;gap:8px;align-items:center;margin:4px 0"><input type="checkbox" id="xw"> เปลี่ยนผู้รับเงินที่ไม่ตรงกับที่มีอยู่</label></div>
    <div id="xp" style="margin-top:10px"></div>`;
  const classify=r=>{
    const hb=Branches.list(true).find(b=>b.code===r.code), ex=payeeOf(r.code), lim=Number((CFG().limits||{})[r.code])||0;
    const o={r,hub:hb,ex,lim,limChange:r.budget>0&&r.budget!==lim};
    if(!hb) o.kind="nohub";
    else if(!ex.name) o.kind="new";
    else if((ex.empCode&&r.empCode&&String(ex.empCode)===String(r.empCode))||normName(ex.name)===normName(r.name)) o.kind="same";
    else o.kind="swap";
    return o;
  };
  const draw=()=>{
    const xp=$("#xp",f); if(!IMP.rows.length){ xp.innerHTML=""; return; }
    const L=IMP.rows.map(classify), cnt=k=>L.filter(x=>x.kind===k).length;
    xp.innerHTML=`<div class="muted" style="margin:0 2px 8px">${L.length} สาขา · เพิ่มผู้รับเงินใหม่ ${cnt("new")} · ตรงเดิม ${cnt("same")} · <b style="color:var(--gold-ink)">เปลี่ยนคน ${cnt("swap")}</b> · ไม่พบในทะเบียนฮับ ${cnt("nohub")} · วงเงินเปลี่ยน ${L.filter(x=>x.limChange&&x.hub).length}</div>
      <div style="max-height:46vh;overflow:auto;border:1px solid var(--border);border-radius:12px;background:var(--bg2)">${L.map(x=>`<div style="display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border)"><div style="flex:1 1 150px;min-width:0"><b>${esc(x.r.code)} ${esc(x.hub?x.hub.name:x.r.branchName)}</b><small style="display:block;color:var(--text3)">${esc(x.r.bzm)}</small></div><div style="flex:1 1 190px;min-width:0">${esc(x.r.name)}<small style="display:block;color:var(--text3)">${esc(x.r.position)}${x.r.empCode?" · รหัส "+esc(x.r.empCode):""}</small></div><div class="num" style="flex:0 0 auto">${x.lim?baht(x.lim):"—"} → <b>${baht(x.r.budget)}</b></div><div style="flex:0 0 auto">${x.kind==="new"?'<span class="pill p-ok">เพิ่มผู้รับเงิน</span>':x.kind==="same"?'<span class="pill p-sent">ตรงเดิม</span>':x.kind==="swap"?`<span class="pill p-wait">เปลี่ยนคน</span><small style="display:block;color:var(--text3)">เดิม: ${esc(x.ex.name)}</small>`:'<span class="pill p-no">ไม่พบสาขาในฮับ</span>'}</div></div>`).join("")}</div>`;
  };
  const load=async()=>{
    const XLSX=await loadXlsx(); IMP.rows=IMP.rows||[];
    IMP.rows=parseRoster(XLSX,IMP.wb,IMP.sheet); draw();
  };
  $("#xf",f).onchange=async e=>{
    const file=e.target.files&&e.target.files[0]; if(!file) return;
    try{
      const XLSX=await loadXlsx(); IMP.wb=XLSX.read(await file.arrayBuffer(),{type:"array"});
      const cands=IMP.wb.SheetNames.filter(x=>/^\d{1,2}-\d{2}$/.test(x.trim()));
      const list=cands.length?cands:IMP.wb.SheetNames;
      $("#xsh",f).innerHTML=list.map(x=>`<option>${esc(x)}</option>`).join("");
      IMP.sheet=list[list.length-1]; $("#xsh",f).value=IMP.sheet;
      $("#xs",f).style.display=""; $("#xo",f).style.display="";
      await load();
    }catch(err){ IMP.rows=[]; $("#xp",f).innerHTML=`<div class="empty">${esc(err.message)}</div>`; }
  };
  $("#xsh",f).onchange=async e=>{ IMP.sheet=e.target.value; try{ await load(); }catch(err){ IMP.rows=[]; $("#xp",f).innerHTML=`<div class="empty">${esc(err.message)}</div>`; } };
  $("#xl",f).onchange=e=>{IMP.optLimit=e.target.checked;}; $("#xw",f).onchange=e=>{IMP.optSwap=e.target.checked;};
  modal("นำเข้ารายชื่อทีมผู้จัดการสาขา / วงเงิน",f,async()=>{
    if(!IMP.rows.length) throw new Error("เลือกไฟล์ Excel ก่อน");
    await S.refresh().catch(()=>{});
    const L=IMP.rows.map(classify).filter(x=>x.hub);
    const limits=Object.assign({},CFG().limits||{}); let nLim=0, nNew=0, nSwap=0, nPos=0;
    if(IMP.optLimit) L.forEach(x=>{ if(x.r.budget>0&&Number(limits[x.r.code])!==x.r.budget){ limits[x.r.code]=x.r.budget; nLim++; } });
    if(nLim) await saveCfg({limits});
    const stamp={updatedAt:nowISO(),updatedBy:Hub.fullName(),source:"import "+IMP.sheet};
    for(const x of L){
      const r=x.r, base={name:r.name,empCode:r.empCode,position:r.position};
      if(x.kind==="new"){ await S.set("payees",r.code,Object.assign(base,stamp)); nNew++; }
      else if(x.kind==="same"){ if(r.position&&x.ex.position!==r.position){ await S.set("payees",r.code,Object.assign({},x.ex,{position:r.position},stamp)); nPos++; } }
      else if(x.kind==="swap"&&IMP.optSwap){ await S.set("payees",r.code,Object.assign(base,stamp)); nSwap++; }
    }
    toast("นำเข้าแล้ว · วงเงิน "+nLim+" สาขา · ผู้รับเงินใหม่ "+nNew+(nSwap?" · เปลี่ยนคน "+nSwap:"")+(nPos?" · อัปเดตตำแหน่ง "+nPos:""));
  },"นำเข้า");
}
function limitForm(b){
  const cur=Number((CFG().limits||{})[b.code])||0;
  const f=document.createElement("div");
  f.innerHTML=`<div class="muted" style="margin-bottom:12px">${esc(b.brandName)} · ${esc(b.code)} ${esc(b.name)}</div>
    <div class="field"><label>วงเงินเฉพาะสาขา (บาท ต่อรอบ)</label><input id="bl" type="number" min="0" step="0.01" value="${cur}"></div>
    <div class="muted">ใส่ 0 = ใช้วงเงินของรอบ</div>`;
  modal("ตั้งวงเงินสาขา",f,async()=>{
    const v=Math.max(0,Number($("#bl",f).value)||0);
    await S.refresh().catch(()=>{});
    const limits=Object.assign({},CFG().limits||{});
    if(v>0) limits[b.code]=v; else delete limits[b.code];
    await saveCfg({limits}); toast("บันทึกแล้ว");
  });
}
function adminPayees(body){
  const pend=PREQ().filter(p=>p.status==="pending").sort((a,b)=>(a.createdAt||"").localeCompare(b.createdAt||""));
  body.innerHTML=`<div class="head"><h1>ผู้รับเงิน</h1>${pend.length?`<span class="pill p-wait">รออนุมัติ ${pend.length}</span>`:""}<span class="sp"></span>
    <div class="sub">สาขาแจ้งเปลี่ยน → ผู้ดูแลอนุมัติ · ผู้ดูแลแก้เองได้ทันที</div></div>
    <div class="sec" style="margin-bottom:10px">คำขอเปลี่ยนผู้รับเงิน · ${pend.length} รายการ</div><div id="reqs" class="grid2"></div>
    ${branchTools("pq")}<div id="out"></div>`;
  const rq=$("#reqs",body);
  if(!pend.length) rq.outerHTML=`<div class="empty" style="margin:0 0 8px">ไม่มีคำขอค้างอยู่</div>`;
  pend.forEach(p=>{
    const c=document.createElement("div"); c.className="card hl";
    c.innerHTML=`<div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(Branches.label(p.branchCode,p.branchName))}</b><span class="muted">${esc(stamp(p.createdAt))}</span></div>
      <div class="cmp"><div>${payeeMini(p.prev,"เดิม")}</div><span class="arr">→</span><div class="new">${payeeMini(p.next,"ขอเปลี่ยนเป็น")}</div></div>
      ${p.reason?`<div class="muted" style="margin-top:8px">เหตุผล: ${esc(p.reason)}</div>`:""}`;
    const a=document.createElement("div"); a.className="acts";
    const y=Object.assign(document.createElement("button"),{className:"btn sm ok",textContent:"อนุมัติเปลี่ยน"});
    const n=Object.assign(document.createElement("button"),{className:"btn sm no",textContent:"ไม่อนุมัติ"});
    y.onclick=()=>{
      const f=document.createElement("div");
      f.innerHTML=`<div class="muted" style="margin-bottom:12px">${esc(Branches.label(p.branchCode,p.branchName))}</div><div class="cmp" style="grid-template-columns:1fr;margin:0"><div class="new">${payeeMini(p.next,"บัญชีใหม่")}</div></div>`;
      modal("อนุมัติเปลี่ยนผู้รับเงิน",f,async()=>{
        /* expect = ยังรออยู่ · กันสองคนกดพร้อมกัน */
        await S.update("payeeReq",p.id,{status:"approved",reviewedAt:nowISO(),reviewedBy:Hub.fullName()},{status:"pending"});
        await S.set("payees",p.branchCode,Object.assign({},p.next,{updatedAt:nowISO(),updatedBy:Hub.fullName()}));
        toast("เปลี่ยนผู้รับเงินแล้ว");
      },"อนุมัติ");
    };
    n.onclick=()=>{
      const f=document.createElement("div");
      f.innerHTML=`<div class="field"><label>เหตุผลที่ไม่อนุมัติ</label><textarea id="rn" placeholder="แจ้งสาขาว่าต้องแก้อะไร"></textarea></div>`;
      modal("ไม่อนุมัติคำขอ",f,async()=>{
        const note=$("#rn",f).value.trim(); if(!note) throw new Error("ใส่เหตุผลให้สาขารู้ว่าต้องแก้อะไร");
        await S.update("payeeReq",p.id,{status:"rejected",reviewNote:note,reviewedAt:nowISO(),reviewedBy:Hub.fullName()},{status:"pending"});
        toast("บันทึกแล้ว");
      },"ยืนยัน",true);
    };
    a.append(y,n); c.appendChild(a); rq.appendChild(c);
  });
  const all=Branches.list(), out=$("#out",body);
  const draw=()=>{
    const base=all.filter(matchBranch), hidden=base.filter(b=>!payeeOf(b.code).name).length;
    const list=window._showNoPayee?base:base.filter(b=>payeeOf(b.code).name);
    const tg=hidden?`<label class="muted" style="display:inline-flex;gap:6px;align-items:center;margin-left:10px"><input type="checkbox" id="snp" ${window._showNoPayee?"checked":""}> แสดงสาขาที่ยังไม่มีผู้รับเงิน (${hidden})</label>`:"";
    if(!list.length){ out.innerHTML=`<div class="muted" style="margin:0 2px 8px">${tg}</div><div class="empty">ไม่พบสาขาที่มีผู้รับเงิน</div>`; const c=$("#snp",out); if(c) c.onchange=()=>{window._showNoPayee=c.checked;draw();}; return; }
    out.innerHTML=`<div class="muted" style="margin:0 2px 8px">${list.length} สาขา${tg}</div>
      <div class="rowlist"><div class="tr th"><span>สาขา</span><span>พนักงานรับเงิน</span><span>ตำแหน่ง</span><span>อัปเดต</span><span></span></div>
      ${list.map(b=>{ const p=payeeOf(b.code);
        return `<div class="tr line-item"><span><b>${esc(b.code)} ${esc(b.name)}</b><small>${esc(b.brandName)}</small></span>
        <span>${p.name?`<b>${esc(p.name)}</b>${p.empCode?`<small class="num">รหัส ${esc(p.empCode)}</small>`:""}`:`<span class="pill p-no">ยังไม่มีผู้รับเงิน</span>`}</span>
        <span>${p.name&&p.position?esc(p.position):"—"}</span>
        <span class="muted num">${p.updatedAt?esc(dmy(p.updatedAt)):"—"}</span>
        <span><button class="btn ghost sm" data-pay="${esc(b.code)}">แก้ไข</button></span></div>`;}).join("")}</div>`;
  };
  out.onclick=e=>{ const btn=e.target.closest("[data-pay]"); if(!btn) return;
    const b=all.find(x=>x.code===btn.dataset.pay), cur=payeeOf(b.code);
    const f=document.createElement("div");
    f.innerHTML=payeeFields(cur)+`<div class="muted" style="margin-top:6px">ผู้ดูแลแก้ได้ทันที ไม่ต้องรออนุมัติ</div>`; attachEmpPick(f);
    modal("ผู้รับเงิน · "+b.code+" "+b.name,f,async()=>{
      const v=readPayee(f);
      await S.set("payees",b.code,Object.assign(cur.position?{position:cur.position}:{},v,{updatedAt:nowISO(),updatedBy:Hub.fullName()}));
      toast("บันทึกแล้ว");
    });
  };
  wireTools(body,"pq",draw);
  draw();
}

/* ═════════════ เริ่มต้น ═════════════ */
function render(){
  if(!ME) return;
  ME.role==="branch"?renderBranch():renderAdmin();
}
/* ข้อมูลใหม่มาถึงระหว่างที่คนกำลังพิมพ์หรือเลือก — รอให้ออกจากช่องก่อนค่อยวาดใหม่ ไม่งั้นเคอร์เซอร์หลุด */
let _pending=false;
function renderSafe(){
  const a=document.activeElement;
  if(a&&$("#app").contains(a)&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)&&a.type!=="checkbox"){ _pending=true; return; }
  if(document.querySelector("#modalHost .mask")){ _pending=true; return; }
  render();
}
function flushPending(){ if(_pending){ _pending=false; setTimeout(renderSafe,0); } }
document.addEventListener("focusout",flushPending);
/* หมุนจอ/ย่อหน้าต่างข้ามขนาด 900px = สลับตาราง ↔ การ์ด */
WIDE_MQ.addEventListener("change",()=>renderSafe());

(async()=>{
  if(!Hub.guard()) return;
  if(Hub.isBranch()){
    const code=Hub.branchCode();
    ME={role:"branch",code,name:Branches.label(code,Hub.branchName())};
  }else ME={role:"office"};
  if(S.hasCache()) render();
  const [okBackend]=await Promise.all([S.checkBackend().catch(()=>null), Cfg.load()]);
  if(ME.role==="branch") ME.name=Branches.label(ME.code,Hub.branchName());
  if(okBackend===false) return gate("ระบบกำลังเปิดใช้งาน","หลังบ้านของฮับยังไม่ได้อัปเดตสำหรับระบบนี้<br>แจ้งผู้ดูแลให้ Deploy Apps Script รุ่นใหม่");
  try{ await S.refresh(); }
  catch(e){ if(!S.hasCache()) return gate("เชื่อมต่อไม่สำเร็จ","โหลดข้อมูลไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่อีกครั้ง"); toast("ใช้ข้อมูลที่โหลดไว้ล่าสุด"); }
  render();
  S.onChange(renderSafe);
  S.startPolling(45000);
})();
</script>

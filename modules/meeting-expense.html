<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบส่งเอกสารเบิกเงินประชุมสาขา · FAB Operations Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hub-mod.css">
<style>
/* เฉพาะระบบเบิกเงิน — ส่วนกลางอยู่ที่ hub-mod.css
   ขั้นตอนตามไฟล์ FINAL (ระบบการส่งเบิกเงินประชุมร้าน/FINAL_LOGIN_UI.html) ยกเว้นหน้าล็อกอิน — เข้าผ่านฮับแทน */
/* เอกสารหนึ่งใบ: แถบซ้ายบอกสถานะ · เทา = ส่งแล้ว · ส้ม = รอดำเนินการ · เขียว = อนุมัติ · แดง = ไม่อนุมัติ */
.slip{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px 16px 22px;
  margin:12px 0;position:relative;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.slip:hover{border-color:var(--border2);box-shadow:var(--shadow-sm)}
.slip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--border2)}
.slip.st-wait::before{background:var(--gold)}
.slip.st-ok::before{background:var(--green)}
.slip.st-no::before{background:var(--red)}
.slip .head{display:flex;align-items:flex-start;gap:10px}
.slip .amt{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.2}
.slip .amt em{font-style:normal;font-size:13px;font-weight:600;color:var(--text3);margin-left:4px}
.docno{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.lead{display:flex;align-items:baseline;gap:7px;font-size:13px;color:var(--text2);margin-top:3px}
.lead .fill{flex:1;border-bottom:1px dotted var(--border2);transform:translateY(-3px);min-width:12px}
.lead .v{color:var(--text);font-weight:700;text-align:right}
.p-sent{background:var(--bg3);color:var(--text2);border-color:var(--border)}
.p-wait{background:var(--gold-soft);color:var(--gold-ink);border-color:var(--gold-line)}
.p-ok{background:var(--green-soft);color:var(--green-ink);border-color:var(--green-line)}
.p-no{background:var(--red-soft);color:var(--red-ink);border-color:var(--red-line)}
.slip .desc{margin-top:10px;font-size:14px;padding-top:10px;border-top:1px dashed var(--border);white-space:pre-wrap}
.slip .actions{align-items:center}
.slip .actions select{width:auto;min-width:150px;padding:8px 12px;font-size:13px}
.slip .actions .push{margin-left:auto}
.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:18px 0 4px}
.filters .field{margin:0}
@media(max-width:640px){.filters{grid-template-columns:1fr 1fr}.filters .field.q{grid-column:1/-1}}
.form-card{margin-top:18px}
.form-card .hint{font-size:13px;color:var(--text3);margin-top:-6px;margin-bottom:14px}
.submit-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:4px}
.submit-row .msg{font-size:13.5px;color:var(--text2)}
.submit-row .msg.ok{color:var(--green-ink);font-weight:700}
.submit-row .msg.bad{color:var(--red-ink);font-weight:700}
.submit-row .btn{margin-left:auto;min-width:160px}
@media(max-width:520px){.submit-row .btn{width:100%;margin-left:0}}
</style>
</head>
<body>
<div id="app"><div class="empty" style="margin:20vh 16px">กำลังเชื่อมต่อ…</div></div>
<div id="modalHost"></div>

<script src="hub-docstore.js"></script>
<script>
"use strict";
const {Hub, Cfg, Branches} = HubMod;
const S = new HubMod.Store("mx");
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>(Number(n)||0).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});
const short=n=>{n=Number(n)||0; const t=n>=1e6?(n/1e6).toFixed(1)+"ล.":n>=1e4?Math.round(n/1e3)+"K":money(n).replace(".00",""); return t;};
const nowISO=()=>new Date().toISOString();
const dmy=HubMod.fmtDMY;
/* วันที่ + เวลาที่ส่ง แบบเดียวกับตารางของระบบเดิม */
const stamp=v=>{ const d=new Date(v); if(isNaN(d)) return String(v||"-");
  return dmy(HubMod.localDate(d))+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };
/* ข้อความใหม่แทนที่อันเก่า — ถ้าซ้อนกันสองอันที่ตำแหน่งเดียวกันจะอ่านไม่ออกทั้งคู่ */
function toast(t){document.querySelectorAll(".toast").forEach(x=>x.remove());
  const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600);}

/* สถานะ 4 แบบตามระบบเดิม · บิลที่ส่งในรุ่นก่อน (pending/approved/rejected) แปลงมาแสดงให้ตรงกัน */
const STATUSES=["ส่งแล้ว","รอดำเนินการ","อนุมัติ","ไม่อนุมัติ"];
const OLD_STATUS={pending:"ส่งแล้ว",approved:"อนุมัติ",rejected:"ไม่อนุมัติ"};
const statusOf=x=>OLD_STATUS[x.status]||x.status||"ส่งแล้ว";
const pillOf=s=>s==="อนุมัติ"?["p-ok","st-ok"]:s==="ไม่อนุมัติ"?["p-no","st-no"]:s==="รอดำเนินการ"?["p-wait","st-wait"]:["p-sent","st-sent"];
const MAX_PHOTOS=3;

/* สิทธิ์ — ค่าตั้งต้นต้องตรงกับ PERM_SYSTEMS.meetexpense ในฮับ (ใช้ตอนฮับยังไม่เคยบันทึกหน้าสิทธิ์) */
const PERM_KEY="meetexpense";
const PERM_DEFAULTS={
  "view-claims":["admin","coo","vp","bzm"],
  "update-status":["admin"], "delete-claims":["admin"],
  "submit-claim":["branch"], "delete-own":["branch"]
};
const can=a=>HubMod.can(PERM_KEY,a,PERM_DEFAULTS);

let ME=null, TAB="send";
let F={status:"", brand:"", q:""};   /* ตัวกรองหน้ารายการ — จำไว้ข้ามการเรนเดอร์ใหม่ */
let DRAFT={claimant:"", amount:"", note:"", photos:[]};   /* ฟอร์มที่กรอกค้างไว้ ข้อมูลใหม่เข้ามาแล้วไม่หาย */

const CLAIMS=()=>S.all("claims");
const byTime=(a,b)=>(b.submittedAt||"").localeCompare(a.submittedAt||"");
const sumOf=list=>list.reduce((s,c)=>s+(Number(c.amount)||0),0);
/* เลขเอกสาร ME-ปปดดวว-XXXX · ใช้เป็น id ในชีตด้วย */
function newDocNo(){
  const d=HubMod.localDate().replace(/-/g,"").slice(2);
  const r=Math.random().toString(36).slice(2,6).toUpperCase().padEnd(4,"0");
  return "ME-"+d+"-"+r;
}

/* ───── รูป: อัปขึ้น Drive ทันทีที่แนบ เก็บเป็นลิงก์ ───── */
function zoom(src){
  const m=document.createElement("div");m.className="zoom";
  m.innerHTML=`<img src="${esc(src)}" alt="รูปเอกสารขยาย">`;
  m.onclick=()=>m.remove();document.body.appendChild(m);}
function photoStrip(urls){
  const ph=document.createElement("div"); ph.className="photos";
  (urls||[]).forEach(u=>{const i=new Image();i.src=u;i.alt="รูปเอกสาร";i.loading="lazy";i.onclick=()=>zoom(u);ph.appendChild(i);});
  return ph;
}

/* กล่องแบบเดียวกับระบบสอบ: หัว (ชื่อ + ปิด) · เนื้อหาพื้นเทา · ปุ่มท้าย ยกเลิกซ้าย ยืนยันขวา */
function modal(title,body,onSave,saveTxt="บันทึก",danger){
  const m=document.createElement("div");m.className="mask";
  const box=document.createElement("div");box.className="modal";
  box.innerHTML=`<div class="modal-head"><h3>${esc(title)}</h3><button class="modal-x" type="button" aria-label="ปิด">×</button></div>`;
  const bd=document.createElement("div");bd.className="modal-body";bd.appendChild(body);box.appendChild(bd);
  const act=document.createElement("div");act.className="modal-foot actions";
  const s=Object.assign(document.createElement("button"),{className:"btn"+(danger?" danger":""),textContent:saveTxt});
  const c=Object.assign(document.createElement("button"),{className:"btn ghost",textContent:"ยกเลิก"});
  const close=()=>{m.remove();flushPending();};
  c.onclick=close; $(".modal-x",box).onclick=close;
  s.onclick=async()=>{s.disabled=true;const o=s.textContent;s.textContent="กำลังดำเนินการ…";
    try{await onSave();close();}catch(e){toast(e.message||"ทำรายการไม่สำเร็จ");s.disabled=false;s.textContent=o;}};
  act.append(c,s);box.appendChild(act);m.appendChild(box);
  m.onclick=e=>{if(e.target===m)close();};
  $("#modalHost").appendChild(m);return m;
}

/* ───── โครงหน้า ───── */
function gate(title,msg,icon){
  $("#app").innerHTML=`<div class="gate"><div class="box"><div class="em-ic">${icon||"🔒"}</div><h2>${esc(title)}</h2><p>${msg}</p>
    <button class="btn full" id="gb">กลับหน้าหลัก</button></div></div>`;
  $("#gb").onclick=()=>Hub.back();
}
/* โครงหน้าเดียวกับระบบสอบ: แถบบน (โลโก้ · ชื่อระบบ · ผู้ใช้ · กลับหน้าหลัก) → หัวหน้า → ตัวเลขสรุป → แท็บ */
const BACK_SVG='<svg viewBox="0 0 24 24" width="15" height="15"><path d="M15 18l-6-6 6-6"/></svg>';
function shell(title,note,stats,tabs,active,onTab,eyebrow){
  const at=S.loadedAt?new Date(S.loadedAt):null;
  const upd=at?"อัปเดต "+String(at.getHours()).padStart(2,"0")+":"+String(at.getMinutes()).padStart(2,"0"):"";
  const branch=ME&&ME.role==="branch";
  $("#app").innerHTML=`
    <div class="topbar">
      <div class="brand"><div class="logo-wrap"><img src="../logo.png" alt="FAB"></div>
        <div class="brand-text"><div class="t-title">ระบบส่งเอกสารเบิกเงินประชุมสาขา</div><div class="t-sub">FAB Operations &amp; Training Hub</div></div></div>
      <div class="spacer"></div>
      <span class="userchip ${branch?"":"admin"}">${esc((branch?ME.name:Hub.fullName())||"—")}</span>
      <button class="btn-back" id="out" title="กลับหน้าหลัก">${BACK_SVG}<span class="bt-label">กลับหน้าหลัก</span></button>
    </div>
    <div class="shell">
      <div class="pagehead">${eyebrow?`<div class="ph-eyebrow">${esc(eyebrow)}</div>`:""}
        <div class="ph-title">${esc(title)}</div>
        <div class="ph-sub">${esc(note)}${upd?` <span class="upd">· ${upd}</span>`:""}</div></div>
      ${stats||""}
      <div class="segbar" role="tablist">
        ${tabs.map(x=>`<button class="tab" role="tab" data-k="${x.k}" aria-selected="${x.k===active}">${esc(x.t)}${x.n?`<span class="n">${x.n}</span>`:""}</button>`).join("")}
      </div>
      <div id="body"></div>
    </div>`;
  $("#out").onclick=()=>Hub.back();
  $("#app").querySelectorAll(".tab").forEach(b=>b.onclick=()=>onTab(b.dataset.k));
  return $("#body");
}
function statsOf(list,firstLabel){
  const wait=list.filter(c=>{const s=statusOf(c);return s==="ส่งแล้ว"||s==="รอดำเนินการ";});
  const ok=list.filter(c=>statusOf(c)==="อนุมัติ");
  return `<div class="kpis">
      <div class="kpi"><div class="k-l">${firstLabel}</div><div class="k-n">${list.length}</div><div class="k-d">ใบ · ${short(sumOf(list))} บาท</div></div>
      <div class="kpi ${wait.length?"a":"calm"}"><div class="k-l">รอดำเนินการ</div><div class="k-n">${wait.length}</div><div class="k-d">ใบ · ${short(sumOf(wait))} บาท</div></div>
      <div class="kpi b"><div class="k-l">อนุมัติแล้ว</div><div class="k-n">${short(sumOf(ok))}</div><div class="k-d">บาท · ${ok.length} ใบ</div></div>
    </div>`;
}

/* ---------- สาขา ---------- */
function renderBranch(){
  const mine=CLAIMS().filter(x=>x.branchCode===ME.code).sort(byTime);
  const brand=Branches.brandName(Branches.brandOf(ME.code));
  const body=shell(ME.name,"ส่งเอกสารเบิกเงินประชุมสาขา พร้อมรูปใบเสร็จ",statsOf(mine,"ส่งเอกสารแล้ว"),
    [{k:"send",t:"ส่งเอกสาร"},{k:"hist",t:"ประวัติ",n:mine.length}],TAB,k=>{TAB=k;renderBranch();},
    "สาขา · "+brand+" · รหัส "+ME.code);
  if(TAB==="hist") return branchHistory(body,mine);
  branchSend(body);
}
function branchSend(body){
  if(!can("submit-claim")){
    body.innerHTML=`<div class="empty">สาขานี้ยังไม่ได้รับสิทธิ์ส่งเอกสาร<br>ติดต่อผู้ดูแลฮับ</div>`; return;
  }
  const f=document.createElement("div"); f.className="card form-card";
  f.innerHTML=`
    <div class="f2">
      <div class="field"><label>ชื่อผู้ทำการเบิก</label><input id="cn" autocomplete="name" placeholder="เช่น นาย/นาง/คุณ ..." value="${esc(DRAFT.claimant)}"></div>
      <div class="field"><label>จำนวนเงิน (บาท)</label><input id="am" inputmode="decimal" placeholder="เช่น 1200" value="${esc(DRAFT.amount)}"></div>
    </div>
    <div class="field"><label>หมายเหตุ (ถ้ามี)</label><textarea id="nt" placeholder="พิมพ์หมายเหตุ...">${esc(DRAFT.note)}</textarea></div>
    <div class="field"><label>แนบรูป (1–${MAX_PHOTOS} รูป)</label><input id="ph" type="file" accept="image/*" multiple>
      <div class="photos" id="strip" style="margin-top:9px"></div></div>
    <div class="submit-row"><span class="msg" id="msg"></span><button class="btn" id="send">ส่งเอกสาร</button></div>`;
  body.appendChild(f);
  const msg=(t,cls)=>{const m=$("#msg",f); m.textContent=t||""; m.className="msg"+(cls?" "+cls:"");};
  ["cn","am","nt"].forEach((id,i)=>$("#"+id,f).oninput=e=>{DRAFT[["claimant","amount","note"][i]]=e.target.value;});

  /* รูปที่แนบ: อัปขึ้น Drive ทันที กด × เพื่อเอาออก */
  let busy=0;
  const strip=$("#strip",f);
  const drawStrip=()=>{
    strip.innerHTML="";
    DRAFT.photos.forEach((u,i)=>{
      const w=document.createElement("span"); w.style.position="relative"; w.style.display="inline-block";
      const im=new Image(); im.src=u; im.alt="รูปที่แนบ"; im.onclick=()=>zoom(u);
      const x=Object.assign(document.createElement("button"),{type:"button",className:"modal-x",textContent:"×",title:"เอารูปนี้ออก"});
      x.style.cssText="position:absolute;top:-6px;right:-6px;width:24px;height:24px;background:var(--bg2);border:1px solid var(--border);border-radius:50%";
      x.onclick=()=>{DRAFT.photos.splice(i,1); drawStrip();};
      w.append(im,x); strip.appendChild(w);
    });
  };
  drawStrip();
  $("#ph",f).onchange=async e=>{
    const files=Array.from(e.target.files||[]); e.target.value="";
    const room=MAX_PHOTOS-DRAFT.photos.length-busy;
    if(files.length>room) toast("แนบได้สูงสุด "+MAX_PHOTOS+" รูป");
    for(const file of files.slice(0,Math.max(0,room))){
      const w=document.createElement("span"); w.className="up";
      const im=new Image(); im.alt="กำลังอัปโหลด"; w.appendChild(im); strip.appendChild(w);
      busy++;
      try{ const d=await HubMod.compressImage(file,1100,170000); im.src=d;
        const url=await S.uploadPhoto(d); DRAFT.photos.push(url); }
      catch(err){ toast(err.message||"แนบรูปไม่สำเร็จ"); }
      finally{ busy--; w.remove(); drawStrip(); }
    }
  };

  $("#send",f).onclick=async e=>{
    msg("");
    const claimant=$("#cn",f).value.trim(), amountStr=$("#am",f).value.trim().replace(/,/g,""), note=$("#nt",f).value.trim();
    if(!claimant) return msg("กรุณาใส่ชื่อผู้ทำการเบิก","bad");
    if(!/^[0-9]{1,7}(\.[0-9]{1,2})?$/.test(amountStr)||!(Number(amountStr)>0)) return msg("ยอดเงินไม่ถูกต้อง","bad");
    if(busy) return msg("รอรูปอัปโหลดให้เสร็จก่อน","bad");
    if(!DRAFT.photos.length) return msg("กรุณาแนบรูปอย่างน้อย 1 รูป","bad");
    const b=e.currentTarget; b.disabled=true; b.textContent="กำลังส่ง…";
    try{
      const docNo=newDocNo();
      await S.set("claims",docNo,{docNo,branchCode:ME.code,branchName:ME.name,claimantName:claimant,
        amount:Math.round(Number(amountStr)*100)/100,note,photos:DRAFT.photos.slice(0,MAX_PHOTOS),
        status:"ส่งแล้ว",submittedAt:nowISO(),submittedBy:Hub.fullName()});
      DRAFT={claimant:"",amount:"",note:"",photos:[]};
      toast("ส่งสำเร็จ · เลขเอกสาร "+docNo);
      renderBranch();
      const m=$("#msg"); if(m){ m.textContent="ส่งสำเร็จ · เลขเอกสาร "+docNo; m.className="msg ok"; }
    }catch(err){ msg("ส่งไม่สำเร็จ: "+(err.message||"ลองใหม่อีกครั้ง"),"bad"); b.disabled=false; b.textContent="ส่งเอกสาร"; }
  };
}
function branchHistory(body,mine){
  body.insertAdjacentHTML("beforeend",`<div class="sec"><b>ประวัติสาขา</b><span>${mine.length} รายการ</span></div>`);
  if(!mine.length){ body.insertAdjacentHTML("beforeend",`<div class="empty">ยังไม่มีประวัติ</div>`); return; }
  mine.forEach(x=>body.appendChild(slip(x,false)));
}

/* ---------- เอกสารหนึ่งใบ ---------- */
function slip(x,admin){
  const st=statusOf(x), p=pillOf(st);
  const s=document.createElement("div"); s.className="slip "+p[1];
  const brand=Branches.brandOf(x.branchCode);
  s.innerHTML=`<div class="head">
      <div class="grow">
        <div class="amt">${money(x.amount)}<em>บาท</em></div>
        <div class="muted">${admin?`<span class="tag">${esc(Branches.brandName(brand))}</span>${esc(Branches.label(x.branchCode,x.branchName))} · `:""}<span class="docno">${esc(x.docNo||x.id)}</span></div>
      </div><span class="pill ${p[0]}">${esc(st)}</span></div>
    <div style="margin-top:11px">
      <div class="lead"><span>ผู้ทำการเบิก</span><span class="fill"></span><span class="v">${esc(x.claimantName||x.payee||"-")}</span></div>
      <div class="lead"><span>ส่งเมื่อ</span><span class="fill"></span><span class="v">${esc(stamp(x.submittedAt))}</span></div>
      ${x.statusAt?`<div class="lead"><span>อัปเดตสถานะ</span><span class="fill"></span><span class="v">${esc(x.statusBy||"-")} · ${esc(stamp(x.statusAt))}</span></div>`:""}
    </div>
    ${x.note?`<div class="desc">${esc(x.note)}</div>`:""}`;
  const ph=photoStrip(x.photos);
  if(ph.children.length) s.appendChild(ph);

  const a=document.createElement("div"); a.className="actions";
  if(admin&&can("update-status")){
    const sel=document.createElement("select"); sel.setAttribute("aria-label","สถานะเอกสาร");
    sel.innerHTML=STATUSES.map(v=>`<option ${v===st?"selected":""}>${esc(v)}</option>`).join("");
    sel.onchange=()=>setStatus(x,st,sel);
    a.appendChild(sel);
  }
  /* สาขาลบได้เฉพาะใบที่ยังไม่อนุมัติ — ใบที่อนุมัติแล้วเป็นหลักฐานการจ่ายเงิน */
  const mayDelete=admin?can("delete-claims"):(can("delete-own")&&x.branchCode===ME.code&&st!=="อนุมัติ");
  if(mayDelete){
    const d=Object.assign(document.createElement("button"),{className:"btn sm danger push",textContent:"ลบ"});
    d.onclick=()=>removeClaim(x);
    a.appendChild(d);
  }
  if(a.children.length) s.appendChild(a);
  return s;
}
async function setStatus(x,from,sel){
  const to=sel.value;
  sel.blur(); sel.disabled=true;
  try{
    /* expect = สถานะที่เห็นอยู่บนจอ · อีกเครื่องเพิ่งเปลี่ยนไป จะไม่เขียนทับ */
    const expectStatus=x.status==null?null:{status:x.status};
    await S.update("claims",x.id,{status:to,statusAt:nowISO(),statusBy:Hub.fullName()},expectStatus);
    toast("อัปเดตสถานะเป็น “"+to+"” แล้ว");
  }catch(e){ toast(e.message||"อัปเดตสถานะไม่สำเร็จ"); sel.value=from; sel.disabled=false; }
}
function removeClaim(x){
  const f=document.createElement("div");
  f.innerHTML=`<div style="font-size:15px">ยืนยันลบเอกสาร <b class="docno">${esc(x.docNo||x.id)}</b> ?</div>
    <div class="muted" style="margin-top:6px">${esc(Branches.label(x.branchCode,x.branchName))} · ${money(x.amount)} บาท · ลบแล้วเรียกคืนไม่ได้</div>`;
  modal("ลบเอกสาร",f,async()=>{
    await S.refresh().catch(()=>{});
    const cur=S.get("claims",x.id);
    if(!cur) throw new Error("เอกสารนี้ถูกลบไปแล้ว");
    if(ME.role==="branch"&&statusOf(cur)==="อนุมัติ") throw new Error("เอกสารนี้อนุมัติแล้ว ลบไม่ได้");
    await S.remove("claims",x.id,{status:cur.status});
    toast("ลบเอกสารแล้ว");
  },"ลบเอกสาร",true);
}

/* ---------- ผู้ดูแล / ทีมบริหาร ---------- */
function renderAdmin(){
  if(!can("view-claims")&&!can("update-status"))
    return gate("ไม่มีสิทธิ์เข้าระบบนี้","บัญชีของคุณยังไม่ได้รับสิทธิ์ในระบบเบิกเงินประชุมสาขา<br>ขอสิทธิ์ได้จากผู้ดูแลฮับ (⚙️ → สิทธิ์ปุ่มแต่ละระบบ)");
  const all=CLAIMS();
  const manage=can("update-status");
  const body=shell(manage?"รายการทั้งหมด":"ภาพรวมการเบิก","เอกสารเบิกเงินประชุมจากทุกสาขา",statsOf(all,"เอกสารทั้งหมด"),
    [{k:"list",t:"รายการ",n:all.length}],"list",()=>{},
    manage?"ผู้ดูแลระบบ · ตรวจและอัปเดตสถานะ":"ดูอย่างเดียว");
  adminList(body);
}
function brandOptions(sel){
  return `<option value="">ทุกแบรนด์</option>`+Branches.brands().map(k=>`<option value="${esc(k)}" ${sel===k?"selected":""}>${esc(Branches.brandName(k))}</option>`).join("");
}
function adminList(body){
  const fl=document.createElement("div"); fl.className="filters";
  fl.innerHTML=`<div class="field"><label>สถานะ</label><select id="fs"><option value="">ทั้งหมด</option>
      ${STATUSES.map(v=>`<option ${F.status===v?"selected":""}>${esc(v)}</option>`).join("")}</select></div>
    <div class="field"><label>แบรนด์</label><select id="fb">${brandOptions(F.brand)}</select></div>
    <div class="field q"><label>ค้นหา</label><input id="fq" value="${esc(F.q)}" placeholder="สาขา · ผู้เบิก · เลขเอกสาร"></div>`;
  body.appendChild(fl);
  const out=document.createElement("div"); body.appendChild(out);
  const draw=()=>{
    const q=F.q.trim().toLowerCase();
    const list=CLAIMS().filter(c=>(!F.status||statusOf(c)===F.status)
        &&(!F.brand||Branches.brandOf(c.branchCode)===F.brand)
        &&(!q||[c.branchCode,Branches.label(c.branchCode,c.branchName),c.claimantName,c.docNo||c.id].join(" ").toLowerCase().indexOf(q)>=0))
      .sort(byTime);
    const nb=new Set(list.map(c=>c.branchCode)).size;
    out.innerHTML=`<div class="sec"><b>รายการ</b><span>${list.length} รายการ · ${nb} สาขา · ${money(sumOf(list))} บาท</span></div>`;
    if(!list.length){ out.insertAdjacentHTML("beforeend",`<div class="empty">ไม่มีรายการ</div>`); return; }
    list.forEach(x=>out.appendChild(slip(x,true)));
  };
  $("#fs",fl).onchange=e=>{F.status=e.target.value;draw();};
  $("#fb",fl).onchange=e=>{F.brand=e.target.value;draw();};
  $("#fq",fl).oninput=e=>{F.q=e.target.value;draw();};
  draw();
}

/* ---------- boot ---------- */
function render(){
  if(!ME) return;
  ME.role==="branch"?renderBranch():renderAdmin();
}
/* ข้อมูลใหม่มาถึงระหว่างที่คนกำลังพิมพ์หรือเลือก — รอให้ออกจากช่องก่อนค่อยวาดใหม่ ไม่งั้นเคอร์เซอร์หลุด */
let _pending=false;
function renderSafe(){
  const a=document.activeElement;
  if(a&&$("#app").contains(a)&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)){ _pending=true; return; }
  if(document.querySelector("#modalHost .mask")){ _pending=true; return; }
  render();
}
function flushPending(){ if(_pending){ _pending=false; setTimeout(renderSafe,0); } }
document.addEventListener("focusout",flushPending);

(async()=>{
  if(!Hub.guard()) return;
  if(Hub.isBranch()){
    const code=Hub.branchCode();
    ME={role:"branch",code,name:Branches.label(code,Hub.branchName())};
  }else ME={role:"office"};
  if(S.hasCache()) render();
  const [okBackend]=await Promise.all([S.checkBackend().catch(()=>null), Cfg.load()]);
  if(ME.role==="branch") ME.name=Branches.label(ME.code,Hub.branchName());
  if(okBackend===false) return gate("ระบบกำลังเปิดใช้งาน","หลังบ้านของฮับยังไม่ได้อัปเดตสำหรับระบบนี้<br>แจ้งผู้ดูแลให้ Deploy Apps Script รุ่นใหม่");
  try{ await S.refresh(); }
  catch(e){ if(!S.hasCache()) return gate("เชื่อมต่อไม่สำเร็จ","โหลดข้อมูลไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่อีกครั้ง"); toast("ใช้ข้อมูลที่โหลดไว้ล่าสุด"); }
  render();
  S.onChange(renderSafe);
  S.startPolling(45000);
})();
</script>

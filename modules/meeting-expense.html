<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบเบิกเงินประชุมร้าน · FAB Operations Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --band:#232E45; --on-band:#EDF0F6; --on-band-dim:#98A4BE;
  --bg:#EFEEEA; --slip:#FFFFFF; --slip2:#F5F4F0;
  --ink:#1E2334; --ink2:#575E74; --ink3:#8B92A6;
  --line:#DEDCD5; --line2:#EAE8E2;
  --wait:#9A6100; --wait-bg:#FBF0DA;
  --ok:#1E6B4C; --ok-bg:#DFEEE7;
  --no:#963A32; --no-bg:#F7E4E2;
  --shadow:0 1px 2px rgba(30,35,52,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --band:#151B2A; --on-band:#E6EAF3; --on-band-dim:#8C97B2;
    --bg:#12151F; --slip:#1B2030; --slip2:#232939;
    --ink:#E7EAF2; --ink2:#AAB2C6; --ink3:#7C859B;
    --line:#2E3547; --line2:#262C3C;
    --wait:#E1AE4E; --wait-bg:#33280F;
    --ok:#65C39A; --ok-bg:#123026;
    --no:#DF8981; --no-bg:#331B19;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --band:#151B2A; --on-band:#E6EAF3; --on-band-dim:#8C97B2;
  --bg:#12151F; --slip:#1B2030; --slip2:#232939;
  --ink:#E7EAF2; --ink2:#AAB2C6; --ink3:#7C859B;
  --line:#2E3547; --line2:#262C3C;
  --wait:#E1AE4E; --wait-bg:#33280F;
  --ok:#65C39A; --ok-bg:#123026;
  --no:#DF8981; --no-bg:#331B19;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans Thai Looped","Segoe UI",system-ui,sans-serif;
  font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
.in{max-width:720px;margin:0 auto;padding:0 16px}

/* band */
.band{background:var(--band);color:var(--on-band);padding:14px 0 20px}
.band .top{display:flex;gap:12px;align-items:flex-start}
h1{margin:0;font-size:20.5px;font-weight:700;letter-spacing:-.015em;line-height:1.25}
.band .note{margin:3px 0 0;font-size:12.5px;color:var(--on-band-dim)}
.exit{font-size:12.5px;color:var(--on-band);background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.16);border-radius:99px;padding:6px 14px;cursor:pointer;
  font-family:inherit;white-space:nowrap}
.exit:hover{background:rgba(255,255,255,.15)}
.crumb{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:12px;color:var(--on-band-dim)}
.crumb .sync{margin-left:auto;white-space:nowrap}
.stats{display:flex;margin-top:18px;border-top:1px solid rgba(255,255,255,.13);padding-top:14px}
.stats > div{flex:1;padding-right:10px;min-width:0}
.stats > div + div{border-left:1px solid rgba(255,255,255,.13);padding-left:14px}
.stats b{display:block;font-size:23px;font-weight:600;line-height:1.15;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.stats span{font-size:11.5px;color:var(--on-band-dim)}
.stats .hi b{color:#F0C36B}
.gauge{height:5px;border-radius:99px;background:rgba(255,255,255,.14);margin-top:14px;overflow:hidden}
.gauge i{display:block;height:100%;background:#F0C36B}
.gauge i.over{background:#E8827A}

/* tabs */
.tabbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;font:inherit;font-size:14.5px;font-weight:500;color:var(--ink3);
  padding:13px 0 11px;cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--ok)}
.tab .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:99px;
  background:var(--wait-bg);color:var(--wait);font-size:11px;font-weight:700;line-height:18px;text-align:center}
.wrap{max-width:720px;margin:0 auto;padding:4px 16px 90px}

/* generic */
.card{background:var(--slip);border:1px solid var(--line);border-radius:14px;padding:16px;
  margin:14px 0;box-shadow:var(--shadow)}
.sec{display:flex;align-items:baseline;gap:9px;margin:26px 2px 8px}
.sec b{font-size:13.5px;font-weight:600}
.sec span{font-size:12.5px;color:var(--ink3)}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.grow{flex:1;min-width:0}
.row{display:flex;gap:10px;align-items:center}
.muted{color:var(--ink3);font-size:13px}
.empty{background:var(--slip);border:1px dashed var(--line);border-radius:14px;text-align:center;
  color:var(--ink3);padding:32px 18px;font-size:14px;line-height:1.7;margin:12px 0}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:18px 0 4px}
.filters .field{margin:0}

/* receipt slip */
.slip{margin:22px 0 14px;padding:14px 16px 16px;color:var(--ink);
  background:radial-gradient(circle 6px at 7px 0, var(--bg) 97%, transparent 100%) top left/14px 11px repeat-x,
             var(--slip);
  border:1px solid var(--line);border-top:0;border-radius:0 0 13px 13px;box-shadow:var(--shadow)}
.slip .head{display:flex;align-items:flex-start;gap:10px;padding-top:6px}
.slip .amt{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.2}
.slip .amt em{font-style:normal;font-size:13px;font-weight:400;color:var(--ink3);margin-left:3px}
.lead{display:flex;align-items:baseline;gap:7px;font-size:13px;color:var(--ink2);margin-top:3px}
.lead .fill{flex:1;border-bottom:1px dotted var(--line);transform:translateY(-3px)}
.lead .v{color:var(--ink);font-weight:500;text-align:right}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.p-wait{background:var(--wait-bg);color:var(--wait)}
.p-ok{background:var(--ok-bg);color:var(--ok)}
.p-no{background:var(--no-bg);color:var(--no)}
.slip .desc{margin-top:10px;font-size:14px;padding-top:10px;border-top:1px dashed var(--line)}
.photos{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.photos img{width:64px;height:64px;object-fit:cover;border-radius:8px;
  border:1px solid var(--line);background:var(--slip2);cursor:pointer}
.photos .up{position:relative}
.photos .up::after{content:"กำลังอัป…";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(20,24,36,.55);color:#fff;font-size:10.5px;border-radius:8px}

/* forms */
label{display:block;font-size:12.5px;color:var(--ink2);margin:0 0 6px;font-weight:500}
input,select,textarea{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--slip2);
  border:1px solid var(--line);border-radius:9px;padding:10px 12px}
textarea{min-height:60px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ok);outline-offset:1px}
.field{margin:0 0 13px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
button{font-family:inherit}
.btn{background:var(--ink);color:var(--slip);border:0;border-radius:9px;padding:10px 17px;
  font-size:14.5px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 13px;font-size:13.5px}
.btn.ok{background:var(--ok);color:#fff}
.btn.no{background:transparent;color:var(--no);border:1px solid var(--line)}
.btn.full{width:100%;padding:14px;font-size:15.5px;border-radius:11px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.line-item{display:flex;gap:11px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line2)}
.card .line-item:last-child{border-bottom:0;padding-bottom:2px}
.actions{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
.tag{display:inline-block;font-size:11px;font-weight:600;color:var(--ink2);background:var(--slip2);
  border:1px solid var(--line2);border-radius:6px;padding:0 6px;margin-right:6px;vertical-align:1px}

/* modal */
.mask{position:fixed;inset:0;background:rgba(16,20,32,.6);z-index:60;display:flex;
  align-items:flex-end;justify-content:center}
.modal{background:var(--slip);width:100%;max-width:620px;max-height:92vh;overflow:auto;
  border-radius:18px 18px 0 0;padding:20px 17px 28px}
@media(min-width:700px){.mask{align-items:center;padding:20px}.modal{border-radius:16px}}
@media (prefers-reduced-motion:no-preference){.modal{animation:rise .2s cubic-bezier(.2,.8,.3,1)}}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
.modal h2{margin:0 0 16px;font-size:18px;font-weight:700;letter-spacing:-.015em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:90;background:var(--band);
  color:var(--on-band);padding:11px 20px;border-radius:99px;font-size:14px;box-shadow:0 6px 18px rgba(20,26,42,.3);
  max-width:calc(100vw - 32px);text-align:center}
.gate{min-height:100vh;background:var(--band);color:var(--on-band);display:flex;
  align-items:center;justify-content:center;padding:24px}
.gate .box{width:100%;max-width:360px;text-align:center}
.gate h1{font-size:22px;margin-bottom:8px;color:var(--on-band)}
.gate p{color:var(--on-band-dim);font-size:14px;margin:0 0 20px}
.gate .btn{background:var(--on-band);color:var(--band)}
.hide{display:none!important}
@media(max-width:420px){.f2,.filters{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"><div class="empty" style="margin:20vh 16px">กำลังเชื่อมต่อ…</div></div>
<div id="modalHost"></div>

<script src="hub-docstore.js"></script>
<script>
"use strict";
const {Hub, Cfg, Branches} = HubMod;
const S = new HubMod.Store("mx");
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const money=n=>(Number(n)||0).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});
const short=n=>{n=Number(n)||0; const neg=n<0; n=Math.abs(n);
  const t=n>=1e6?(n/1e6).toFixed(1)+"ล.":n>=1e4?Math.round(n/1e3)+"K":money(n).replace(".00","");
  return (neg?"−":"")+t;};
const nowISO=()=>new Date().toISOString();
const thisRoundId=()=>HubMod.localDate().slice(0,7);
const dmy=HubMod.fmtDMY;
const roundLabel=id=>{const[y,m]=String(id).split("-");
  return (["","ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."][+m]||"")+" "+(+y+543);};
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600);}

/* สิทธิ์ — ค่าตั้งต้นต้องตรงกับ PERM_SYSTEMS.meetexpense ในฮับ (ใช้ตอนฮับยังไม่เคยบันทึกหน้าสิทธิ์) */
const PERM_KEY="meetexpense";
const PERM_DEFAULTS={
  "view-claims":["admin","coo","vp","bzm"],
  "review-claims":["admin"], "manage-rounds":["admin"], "manage-limits":["admin"], "manage-payees":["admin"],
  "submit-claim":["branch"], "request-payee":["branch"]
};
const can=a=>HubMod.can(PERM_KEY,a,PERM_DEFAULTS);

let ME=null, TAB="now", ATAB=null;
let F={round:"", brand:"", q:""};   /* ตัวกรองของหน้าฝ่ายบัญชี — จำไว้ข้ามการเรนเดอร์ใหม่ */

/* ───── ข้อมูล ───── */
const CFG=()=>S.get("config","main")||{};
const ROUNDS=()=>S.all("rounds");
const CLAIMS=()=>S.all("claims");
const PREQ=()=>S.all("payeeReq");
const payeeOf=c=>S.get("payees",c)||{};
const payeeName=c=>payeeOf(c).name||"";
const roundOf=id=>S.get("rounds",id);
const currentRound=()=>ROUNDS().sort((a,b)=>b.id.localeCompare(a.id))[0]||null;
const branchLabel=(code,fallback)=>Branches.label(code,fallback);
const used=(rid,code)=>CLAIMS().filter(c=>c.roundId===rid&&c.branchCode===code&&c.status!=="rejected")
  .reduce((s,c)=>s+(Number(c.amount)||0),0);
/* ลำดับวงเงิน: เฉพาะรอบ → เฉพาะสาขา → ค่าเริ่มต้นของรอบ → ค่าเริ่มต้นกลาง · ใส่ 0 = ตกไปใช้ค่าถัดไป */
function limitOf(rid,code){
  const r=roundOf(rid)||{}, cfg=CFG();
  if(r.limits&&Number(r.limits[code])>0) return Number(r.limits[code]);
  if(cfg.limits&&Number(cfg.limits[code])>0) return Number(cfg.limits[code]);
  return Number(r.limitDefault)||Number(cfg.defaultLimit)||0;
}
async function saveCfg(patch){ await S.set("config","main",Object.assign({},CFG(),patch)); }

/* ───── รูป: อัปขึ้น Drive ทันทีที่แนบ เก็บเป็นลิงก์ ───── */
function zoom(src){
  const m=document.createElement("div");m.className="mask";
  m.innerHTML=`<img src="${esc(src)}" alt="บิลขยาย" style="max-width:96%;max-height:92vh;border-radius:12px;margin:auto">`;
  m.onclick=()=>m.remove();document.body.appendChild(m);}
function photoStrip(urls){
  const ph=document.createElement("div"); ph.className="photos";
  (urls||[]).forEach(u=>{const i=new Image();i.src=u;i.alt="บิลที่แนบ";i.loading="lazy";i.onclick=()=>zoom(u);ph.appendChild(i);});
  return ph;
}
function photoField(t){
  const box=document.createElement("div");box.className="field";box.urls=[];box.busy=0;
  box.innerHTML=`<label>${t}</label><input type="file" accept="image/*" multiple>
    <div class="photos" style="margin-top:9px"></div>`;
  const inp=$("input",box),strip=$(".photos",box);
  inp.onchange=async()=>{ const files=Array.from(inp.files||[]); inp.value="";
    for(const f of files){
      const wrap=document.createElement("span"); wrap.className="up";
      const i=new Image(); i.alt="บิลที่แนบ"; wrap.appendChild(i); strip.appendChild(wrap);
      box.busy++;
      try{ const u=await HubMod.compressImage(f,1100,170000); i.src=u;
        const url=await S.uploadPhoto(u); box.urls.push(url); wrap.classList.remove("up"); }
      catch(e){ wrap.remove(); toast(e.message||"แนบรูปไม่สำเร็จ"); }
      finally{ box.busy--; }
    } };
  return box;
}

function modal(title,body,onSave,saveTxt="บันทึก"){
  const m=document.createElement("div");m.className="mask";
  const box=document.createElement("div");box.className="modal";
  box.innerHTML=`<h2>${esc(title)}</h2>`;box.appendChild(body);
  const act=document.createElement("div");act.className="actions";act.style.marginTop="18px";
  const s=Object.assign(document.createElement("button"),{className:"btn",textContent:saveTxt});
  const c=Object.assign(document.createElement("button"),{className:"btn ghost",textContent:"ยกเลิก"});
  c.onclick=()=>m.remove();
  s.onclick=async()=>{s.disabled=true;const o=s.textContent;s.textContent="กำลังบันทึก…";
    try{await onSave();m.remove();}catch(e){toast(e.message||"บันทึกไม่สำเร็จ");s.disabled=false;s.textContent=o;}};
  act.append(s,c);box.appendChild(act);m.appendChild(box);
  m.onclick=e=>{if(e.target===m)m.remove();};
  $("#modalHost").appendChild(m);return m;
}

/* ───── โครงหน้า ───── */
function gate(title,msg){
  $("#app").innerHTML=`<div class="gate"><div class="box"><h1>${esc(title)}</h1><p>${msg}</p>
    <button class="btn full" id="gb">กลับหน้าฮับ</button></div></div>`;
  $("#gb").onclick=()=>Hub.back();
}
function shell(title,note,stats,tabs,active,onTab){
  const at=S.loadedAt?new Date(S.loadedAt):null;
  $("#app").innerHTML=`
    <div class="band"><div class="in">
      <div class="crumb"><button class="exit" id="out">← ฮับ</button><span>ระบบเบิกเงินประชุมร้าน</span>
        <span class="sync">${at?"อัปเดต "+String(at.getHours()).padStart(2,"0")+":"+String(at.getMinutes()).padStart(2,"0"):""}</span></div>
      <div class="top"><div class="grow"><h1>${esc(title)}</h1><div class="note">${esc(note)}</div></div></div>
      ${stats||""}
    </div></div>
    <div class="tabbar"><div class="in"><div class="tabs">
      ${tabs.map(x=>`<button class="tab" data-k="${x.k}" aria-selected="${x.k===active}">${esc(x.t)}${x.n?`<span class="n">${x.n}</span>`:""}</button>`).join("")}
    </div></div></div>
    <div class="wrap" id="body"></div>`;
  $("#out").onclick=()=>Hub.back();
  $("#app").querySelectorAll(".tab").forEach(b=>b.onclick=()=>onTab(b.dataset.k));
  return $("#body");
}

/* ---------- BRANCH ---------- */
function renderBranch(){
  const r=currentRound();
  let stats="";
  if(r){
    const lim=limitOf(r.id,ME.code), use=used(r.id,ME.code), left=lim-use;
    const pct=lim?Math.min(100,use/lim*100):0;
    stats=`<div class="stats">
        <div><b>${short(lim)}</b><span>วงเงิน ${esc(roundLabel(r.id))}</span></div>
        <div><b>${short(use)}</b><span>ส่งเบิกแล้ว</span></div>
        <div class="hi"><b>${short(left)}</b><span>คงเหลือ</span></div>
      </div>
      <div class="gauge"><i class="${use>lim?"over":""}" style="width:${pct}%"></i></div>`;
  }
  const body=shell(ME.name,"รหัสสาขา "+ME.code+(r?" · รอบ"+(r.open?"เปิดรับบิล":"ปิดแล้ว"):""),stats,
    [{k:"now",t:"รอบปัจจุบัน"},{k:"hist",t:"ประวัติย้อนหลัง"},{k:"payee",t:"ผู้รับเงิน"}],TAB,k=>{TAB=k;renderBranch();});

  if(TAB==="payee") return branchPayee(body);
  if(TAB==="hist")  return branchHistory(body);
  if(!r){ body.innerHTML=`<div class="empty">ยังไม่มีรอบเบิกที่เปิดไว้<br>รอฝ่ายบัญชีเปิดรอบก่อนนะครับ</div>`; return; }

  const allowed=can("submit-claim");
  const btn=Object.assign(document.createElement("button"),{className:"btn full",textContent:"ส่งบิลเบิกเงิน"});
  btn.style.marginTop="18px"; btn.disabled=!r.open||!allowed; btn.onclick=()=>claimForm(r.id);
  body.appendChild(btn);
  body.insertAdjacentHTML("beforeend", !allowed
    ? `<div class="muted" style="text-align:center;margin-top:9px">สาขานี้ยังไม่ได้รับสิทธิ์ส่งบิล ติดต่อผู้ดูแลฮับ</div>`
    : r.open
    ? `<div class="muted" style="text-align:center;margin-top:9px">ผู้รับเงินรอบนี้ · ${esc(payeeName(ME.code)||"ยังไม่ได้ระบุ")}${r.dueDate?" · ส่งถึง "+esc(dmy(r.dueDate)):""}</div>`
    : `<div class="muted" style="text-align:center;margin-top:9px">รอบนี้ปิดรับบิลแล้ว ติดต่อฝ่ายบัญชีถ้าต้องส่งเพิ่ม</div>`);

  const mine=CLAIMS().filter(x=>x.roundId===r.id&&x.branchCode===ME.code)
    .sort((a,b)=>(b.submittedAt||"").localeCompare(a.submittedAt||""));
  body.insertAdjacentHTML("beforeend",`<div class="sec"><b>บิลที่ส่งรอบนี้</b><span>${mine.length} ใบ</span></div>`);
  if(!mine.length) body.insertAdjacentHTML("beforeend",`<div class="empty">ยังไม่ได้ส่งบิลรอบนี้</div>`);
  mine.forEach(x=>body.appendChild(slip(x,false)));
}
function branchHistory(body){
  const mine=CLAIMS().filter(x=>x.branchCode===ME.code);
  if(!mine.length){ body.innerHTML=`<div class="empty">ยังไม่มีประวัติการเบิก</div>`; return; }
  const g={}; mine.forEach(x=>(g[x.roundId]=g[x.roundId]||[]).push(x));
  Object.keys(g).sort().reverse().forEach(rid=>{
    const list=g[rid].sort((a,b)=>(b.submittedAt||"").localeCompare(a.submittedAt||""));

function claimForm(rid){

  const f=document.createElement("div");
  f.innerHTML=`<div class="muted" style="margin-bottom:14px">รอบ ${esc(roundLabel(rid))} · ${lim?"วงเงินคงเหลือ "+money(left)+" บาท":"ยังไม่ได้ตั้งวงเงิน"}</div>
    <div class="f2">

      <div class="field"><label>วันที่ประชุม</label><input id="dt" type="date" value="${HubMod.localDate()}"></div>
    </div>
    <div class="field"><label>ผู้รับเงิน</label><input id="pe" value="${esc(payeeName(ME.code))}" placeholder="ชื่อผู้รับเงิน"></div>
    <div class="field"><label>รายละเอียด</label><textarea id="nt" placeholder="เช่น ค่าอาหารว่างประชุมพนักงาน 12 คน"></textarea></div>`;
  const pf=photoField("รูปบิล / ใบเสร็จ"); f.appendChild(pf);
  modal("ส่งบิลเบิกเงิน",f,async()=>{
    const amount=Math.round(Number($("#am",f).value)*100)/100; if(!amount||amount<=0) throw new Error("ใส่จำนวนเงินก่อน");
    if(pf.busy) throw new Error("รอรูปอัปโหลดให้เสร็จก่อน");
    if(!pf.urls.length) throw new Error("แนบรูปบิลอย่างน้อย 1 รูป");
    /* ดึงข้อมูลล่าสุดก่อนเช็ควงเงิน — อีกเครื่องของสาขาเดียวกันอาจเพิ่งส่งบิลไป หรือบัญชีเพิ่งปิดรอบ */
    await S.refresh().catch(()=>{});
    const r=roundOf(rid)||r0;
    if(!r||!r.open) throw new Error("รอบนี้ปิดรับบิลแล้ว");

    if(lim2&&amount>left2) throw new Error("เกินวงเงินคงเหลือ ("+money(left2)+" บาท)");

      meetDate:$("#dt",f).value,payee:$("#pe",f).value.trim(),note:$("#nt",f).value.trim(),
      photos:pf.urls,status:"pending",submittedAt:nowISO(),submittedBy:Hub.fullName()});
    toast("ส่งบิลเรียบร้อย");
  },"ส่งบิล");
}

/* slip */
function slip(x,admin){
  const s=document.createElement("div"); s.className="slip";
  const p=x.status==="approved"?["p-ok","อนุมัติแล้ว"]:x.status==="rejected"?["p-no","ไม่อนุมัติ"]:["p-wait","รอตรวจ"];
  const brand=Branches.brandOf(x.branchCode);
  s.innerHTML=`<div class="head">
      <div class="grow">
        <div class="amt">${money(x.amount)}<em>บาท</em></div>
        <div class="muted">${admin?`<span class="tag">${esc(Branches.brandName(brand))}</span>`+esc(branchLabel(x.branchCode,x.branchName))+" · ":""}${esc(roundLabel(x.roundId))}</div>
      </div><span class="pill ${p[0]}">${p[1]}</span></div>
    <div style="margin-top:11px">
      <div class="lead"><span>วันที่ประชุม</span><span class="fill"></span><span class="v">${esc(dmy(x.meetDate)||"-")}</span></div>
      <div class="lead"><span>ผู้รับเงิน</span><span class="fill"></span><span class="v">${esc(x.payee||"-")}</span></div>
      <div class="lead"><span>ส่งเมื่อ</span><span class="fill"></span><span class="v">${esc(dmy(x.submittedAt)||"-")}</span></div>
      ${x.reviewedAt?`<div class="lead"><span>ตรวจโดย</span><span class="fill"></span><span class="v">${esc(x.reviewedBy||"-")} · ${esc(dmy(x.reviewedAt))}</span></div>`:""}
    </div>
    ${x.note?`<div class="desc">${esc(x.note)}</div>`:""}
    ${x.reviewNote?`<div class="desc muted">บัญชี: ${esc(x.reviewNote)}</div>`:""}`;
  const ph=photoStrip(x.photos);
  if(ph.children.length) s.appendChild(ph);
  if(admin&&x.status==="pending"&&can("review-claims")){
    const a=document.createElement("div"); a.className="actions";
    const y=Object.assign(document.createElement("button"),{className:"btn sm ok",textContent:"อนุมัติ"});
    const n=Object.assign(document.createElement("button"),{className:"btn sm no",textContent:"ไม่อนุมัติ"});
    y.onclick=()=>review(x,"approved"); n.onclick=()=>review(x,"rejected");
    a.append(y,n); s.appendChild(a);
  }
  return s;
}
function review(x,status){
  const f=document.createElement("div");
  f.innerHTML=`<div class="muted" style="margin-bottom:12px">${esc(branchLabel(x.branchCode,x.branchName))} · ${money(x.amount)} บาท</div>
    <div class="field"><label>หมายเหตุถึงสาขา</label><textarea id="rn" placeholder="${status==="rejected"?"เหตุผลที่ไม่อนุมัติ":"ไม่ใส่ก็ได้"}"></textarea></div>`;
  modal(status==="approved"?"อนุมัติบิลนี้":"ไม่อนุมัติบิลนี้",f,async()=>{
    const note=$("#rn",f).value.trim();
    if(status==="rejected"&&!note) throw new Error("ใส่เหตุผลที่ไม่อนุมัติ ให้สาขารู้ว่าต้องแก้อะไร");
    /* expect = ยังรอตรวจอยู่ · กันสองคนกดพร้อมกันแล้วผลของคนหลังทับคนแรก */
    await S.update("claims",x.id,{status,reviewNote:note,reviewedAt:nowISO(),reviewedBy:Hub.fullName()},{status:"pending"});
    toast(status==="approved"?"อนุมัติแล้ว":"บันทึกแล้ว");
  },"ยืนยัน");
}

function adminTabs(){
  const pend=CLAIMS().filter(c=>c.status==="pending").length;
  const preq=PREQ().filter(p=>p.status==="pending").length;
  const t=[];
  if(can("view-claims")||can("review-claims")) t.push({k:"claims",t:"บิลเบิก",n:can("review-claims")?pend:0});
  if(can("manage-rounds")) t.push({k:"rounds",t:"รอบเบิก"});
  if(can("manage-limits")) t.push({k:"branches",t:"สาขา & วงเงิน"});
  if(can("manage-payees")) t.push({k:"payees",t:"ผู้รับเงิน",n:preq});
  return t;
}
function renderAdmin(){
  const tabs=adminTabs();
  if(!tabs.length) return gate("ไม่มีสิทธิ์เข้าระบบนี้","บัญชีของคุณยังไม่ได้รับสิทธิ์ในระบบเบิกเงินประชุมร้าน<br>ขอสิทธิ์ได้จากผู้ดูแลฮับ (⚙️ → สิทธิ์ปุ่มแต่ละระบบ)");
  if(!tabs.some(t=>t.k===ATAB)) ATAB=tabs[0].k;
  const r=currentRound();
  const pend=CLAIMS().filter(c=>c.status==="pending");
  const appr=r?CLAIMS().filter(c=>c.roundId===r.id&&c.status==="approved").reduce((s,c)=>s+(Number(c.amount)||0),0):0;
  const stats=`<div class="stats">
      <div class="hi"><b>${pend.length}</b><span>บิลรอตรวจ</span></div>
      <div><b>${short(appr)}</b><span>อนุมัติรอบล่าสุด</span></div>
      <div><b>${Branches.list().length}</b><span>สาขาในฮับ</span></div>
    </div>`;
  const who=Hub.fullName();
  const body=shell(can("review-claims")?"ฝ่ายบัญชี":"ภาพรวมการเบิก",
    (r?"รอบล่าสุด "+roundLabel(r.id)+(r.open?" · เปิดรับบิล":" · ปิดแล้ว"):"ยังไม่มีรอบเบิก")+(who?" · "+who:""),
    stats,tabs,ATAB,k=>{ATAB=k;renderAdmin();});

}

function adminPayees(body){
  const pend=PREQ().filter(p=>p.status==="pending").sort((a,b)=>(a.createdAt||"").localeCompare(b.createdAt||""));
  body.insertAdjacentHTML("beforeend",`<div class="sec"><b>คำขอเปลี่ยนผู้รับเงิน</b><span>${pend.length} รายการ</span></div>`);
  if(!pend.length) body.insertAdjacentHTML("beforeend",`<div class="empty">ไม่มีคำขอค้างอยู่</div>`);
  pend.forEach(p=>{
    const c=document.createElement("div"); c.className="card";
    c.innerHTML=`<div style="font-weight:600;font-size:16px">${esc(branchLabel(p.branchCode,p.branchName))}</div>
      <div class="muted" style="margin-top:4px">จาก ${esc(payeeName(p.branchCode)||"ยังไม่ได้ระบุ")} · ขอเมื่อ ${esc(dmy(p.createdAt))}</div>
      <div style="font-size:16px;font-weight:600;margin-top:2px">เปลี่ยนเป็น ${esc(p.newName)}</div>
      ${p.bank?`<div class="muted">${esc(p.bank)}</div>`:""}
      ${p.reason?`<div style="margin-top:8px;font-size:14px">${esc(p.reason)}</div>`:""}`;
    const a=document.createElement("div"); a.className="actions";
    const y=Object.assign(document.createElement("button"),{className:"btn sm ok",textContent:"อนุมัติเปลี่ยน"});
    const n=Object.assign(document.createElement("button"),{className:"btn sm no",textContent:"ปฏิเสธ"});
    const lock=v=>{y.disabled=n.disabled=v;};
    y.onclick=async()=>{ lock(true); try{
        await S.update("payeeReq",p.id,{status:"approved",reviewedAt:nowISO(),reviewedBy:Hub.fullName()},{status:"pending"});
        await S.set("payees",p.branchCode,{name:p.newName,note:p.bank||"",updatedAt:nowISO(),updatedBy:Hub.fullName()});
        toast("เปลี่ยนผู้รับเงินแล้ว"); }catch(e){ toast(e.message); lock(false); } };
    n.onclick=async()=>{ lock(true); try{
        await S.update("payeeReq",p.id,{status:"rejected",reviewedAt:nowISO(),reviewedBy:Hub.fullName()},{status:"pending"});
        toast("ปฏิเสธคำขอแล้ว"); }catch(e){ toast(e.message); lock(false); } };
    a.append(y,n); c.appendChild(a); body.appendChild(c);
  });
  const all=Branches.list();
  const fl=document.createElement("div"); fl.className="filters";
  fl.innerHTML=`<div class="field"><label>แบรนด์</label><select id="pb2">${brandOptions(F.brand)}</select></div>
    <div class="field"><label>ค้นหาสาขา</label><input id="pq" value="${esc(F.q)}" placeholder="รหัส หรือชื่อสาขา"></div>`;
  body.appendChild(fl);
  const out=document.createElement("div"); body.appendChild(out);
  const draw=()=>{
    const q=F.q.trim().toLowerCase();
    const list=all.filter(b=>(!F.brand||b.brand===F.brand)&&(!q||(b.code+" "+b.name).toLowerCase().indexOf(q)>=0));
    out.innerHTML=`<div class="sec"><b>ผู้รับเงินปัจจุบัน</b><span>${list.length} สาขา</span></div>`;
    if(!list.length){ out.insertAdjacentHTML("beforeend",`<div class="empty">ไม่พบสาขา</div>`); return; }
    const p=document.createElement("div"); p.className="card"; p.style.padding="4px 16px";
    list.forEach(b=>{
      const row=document.createElement("div"); row.className="line-item";
      row.innerHTML=`<div class="grow"><div style="font-weight:500"><span class="tag">${esc(b.brandName)}</span>${esc(b.code)} ${esc(b.name)}</div>
        <div class="muted">${esc(payeeName(b.code)||"ยังไม่ได้ระบุ")}</div></div>`;
      const e=Object.assign(document.createElement("button"),{className:"btn sm ghost",textContent:"ตั้งเอง"});
      e.onclick=()=>{
        const f=document.createElement("div");
        f.innerHTML=`<div class="field"><label>ชื่อผู้รับเงิน</label><input id="n" value="${esc(payeeName(b.code))}"></div>
          <div class="field"><label>ช่องทางรับเงิน</label><input id="k" value="${esc(payeeOf(b.code).note||"")}"></div>`;
        modal("ผู้รับเงิน · "+b.code+" "+b.name,f,async()=>{
          const name=$("#n",f).value.trim(); if(!name) throw new Error("ใส่ชื่อผู้รับเงินก่อน");
          await S.set("payees",b.code,{name,note:$("#k",f).value.trim(),updatedAt:nowISO(),updatedBy:Hub.fullName()});
          toast("บันทึกแล้ว"); });
      };
      row.appendChild(e); p.appendChild(row);
    });
    out.appendChild(p);
  };
  $("#pb2",fl).onchange=e=>{F.brand=e.target.value;draw();};
  $("#pq",fl).oninput=e=>{F.q=e.target.value;draw();};
  draw();
}

/* ---------- boot ---------- */
function render(){
  if(!ME) return;
  ME.role==="branch"?renderBranch():renderAdmin();
}
/* ข้อมูลใหม่มาถึงระหว่างที่คนกำลังพิมพ์ค้นหา — รอให้ออกจากช่องก่อนค่อยวาดใหม่ ไม่งั้นเคอร์เซอร์หลุด */
let _pending=false;
function renderSafe(){
  const a=document.activeElement;
  if(a&&$("#app").contains(a)&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)){ _pending=true; return; }
  render();
}
document.addEventListener("focusout",()=>{ if(_pending){ _pending=false; setTimeout(renderSafe,0); } });

(async()=>{
  if(!Hub.guard()) return;
  if(Hub.isBranch()){
    const code=Hub.branchCode();
    ME={role:"branch",code,name:branchLabel(code,Hub.branchName())};
  }else ME={role:"office"};
  if(S.hasCache()) render();
  const [okBackend]=await Promise.all([S.checkBackend().catch(()=>null), Cfg.load()]);
  if(ME.role==="branch") ME.name=branchLabel(ME.code,Hub.branchName());
  if(okBackend===false) return gate("ระบบกำลังเปิดใช้งาน","หลังบ้านของฮับยังไม่ได้อัปเดตสำหรับระบบนี้<br>แจ้งผู้ดูแลให้ Deploy Apps Script รุ่นใหม่");
  try{ await S.refresh(); }
  catch(e){ if(!S.hasCache()) return gate("เชื่อมต่อไม่สำเร็จ","โหลดข้อมูลไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่อีกครั้ง"); toast("ใช้ข้อมูลที่โหลดไว้ล่าสุด"); }
  render();
  S.onChange(renderSafe);
  S.startPolling(45000);
})();
</script>

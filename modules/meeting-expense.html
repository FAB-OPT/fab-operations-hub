<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบเบิกเงินประชุมร้าน · FAB Operations Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hub-mod.css">
<style>
/* เฉพาะระบบเบิกเงิน — ส่วนกลางอยู่ที่ hub-mod.css */
/* บิลหนึ่งใบ: แถบซ้ายบอกสถานะ (แบบแถวคำตอบในระบบสอบ) ส้ม = รอตรวจ · เขียว = อนุมัติ · แดง = ไม่อนุมัติ */
.slip{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px 16px 22px;
  margin:12px 0;position:relative;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.slip:hover{border-color:var(--border2);box-shadow:var(--shadow-sm)}
.slip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold)}
.slip.st-approved::before{background:var(--green)}
.slip.st-rejected::before{background:var(--red)}
.slip .head{display:flex;align-items:flex-start;gap:10px}
.slip .amt{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.2}
.slip .amt em{font-style:normal;font-size:13px;font-weight:600;color:var(--text3);margin-left:4px}
.lead{display:flex;align-items:baseline;gap:7px;font-size:13px;color:var(--text2);margin-top:3px}
.lead .fill{flex:1;border-bottom:1px dotted var(--border2);transform:translateY(-3px);min-width:12px}
.lead .v{color:var(--text);font-weight:700;text-align:right}
.p-wait{background:var(--gold-soft);color:var(--gold-ink);border-color:var(--gold-line)}
.p-ok{background:var(--green-soft);color:var(--green-ink);border-color:var(--green-line)}
.p-no{background:var(--red-soft);color:var(--red-ink);border-color:var(--red-line)}
.slip .desc{margin-top:10px;font-size:14px;padding-top:10px;border-top:1px dashed var(--border)}
.slip .desc.muted{font-size:13px}
.line-item{display:flex;gap:11px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.card .line-item:last-child{border-bottom:0;padding-bottom:4px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 4px}
.filters .field{margin:0}
@media(max-width:420px){.filters{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"><div class="empty" style="margin:20vh 16px">กำลังเชื่อมต่อ…</div></div>
<div id="modalHost"></div>

<script src="hub-docstore.js"></script>
<script>
"use strict";
const {Hub, Cfg, Branches} = HubMod;
const S = new HubMod.Store("mx");
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const money=n=>(Number(n)||0).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});
const short=n=>{n=Number(n)||0; const neg=n<0; n=Math.abs(n);
  const t=n>=1e6?(n/1e6).toFixed(1)+"ล.":n>=1e4?Math.round(n/1e3)+"K":money(n).replace(".00","");
  return (neg?"−":"")+t;};
const nowISO=()=>new Date().toISOString();
const thisRoundId=()=>HubMod.localDate().slice(0,7);
const dmy=HubMod.fmtDMY;
const roundLabel=id=>{const[y,m]=String(id).split("-");
  return (["","ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."][+m]||"")+" "+(+y+543);};
/* ข้อความใหม่แทนที่อันเก่า — ถ้าซ้อนกันสองอันที่ตำแหน่งเดียวกันจะอ่านไม่ออกทั้งคู่ */
function toast(t){document.querySelectorAll(".toast").forEach(x=>x.remove());
  const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600);}

/* สิทธิ์ — ค่าตั้งต้นต้องตรงกับ PERM_SYSTEMS.meetexpense ในฮับ (ใช้ตอนฮับยังไม่เคยบันทึกหน้าสิทธิ์) */
const PERM_KEY="meetexpense";
const PERM_DEFAULTS={
  "view-claims":["admin","coo","vp","bzm"],
  "review-claims":["admin"], "manage-rounds":["admin"], "manage-limits":["admin"], "manage-payees":["admin"],
  "submit-claim":["branch"], "request-payee":["branch"]
};
const can=a=>HubMod.can(PERM_KEY,a,PERM_DEFAULTS);

let ME=null, TAB="now", ATAB=null;
let F={round:"", brand:"", q:""};   /* ตัวกรองของหน้าฝ่ายบัญชี — จำไว้ข้ามการเรนเดอร์ใหม่ */

/* ───── ข้อมูล ───── */
const CFG=()=>S.get("config","main")||{};
const ROUNDS=()=>S.all("rounds");
const CLAIMS=()=>S.all("claims");
const PREQ=()=>S.all("payeeReq");
const payeeOf=c=>S.get("payees",c)||{};
const payeeName=c=>payeeOf(c).name||"";
const roundOf=id=>S.get("rounds",id);
const currentRound=()=>ROUNDS().sort((a,b)=>b.id.localeCompare(a.id))[0]||null;
const branchLabel=(code,fallback)=>Branches.label(code,fallback);
const used=(rid,code)=>CLAIMS().filter(c=>c.roundId===rid&&c.branchCode===code&&c.status!=="rejected")
  .reduce((s,c)=>s+(Number(c.amount)||0),0);
/* ลำดับวงเงิน: เฉพาะรอบ → เฉพาะสาขา → ค่าเริ่มต้นของรอบ → ค่าเริ่มต้นกลาง · ใส่ 0 = ตกไปใช้ค่าถัดไป */
function limitOf(rid,code){
  const r=roundOf(rid)||{}, cfg=CFG();
  if(r.limits&&Number(r.limits[code])>0) return Number(r.limits[code]);
  if(cfg.limits&&Number(cfg.limits[code])>0) return Number(cfg.limits[code]);
  return Number(r.limitDefault)||Number(cfg.defaultLimit)||0;
}
async function saveCfg(patch){ await S.set("config","main",Object.assign({},CFG(),patch)); }

/* ───── รูป: อัปขึ้น Drive ทันทีที่แนบ เก็บเป็นลิงก์ ───── */
function zoom(src){
  const m=document.createElement("div");m.className="zoom";
  m.innerHTML=`<img src="${esc(src)}" alt="บิลขยาย">`;
  m.onclick=()=>m.remove();document.body.appendChild(m);}
function photoStrip(urls){
  const ph=document.createElement("div"); ph.className="photos";
  (urls||[]).forEach(u=>{const i=new Image();i.src=u;i.alt="บิลที่แนบ";i.loading="lazy";i.onclick=()=>zoom(u);ph.appendChild(i);});
  return ph;
}
function photoField(t){
  const box=document.createElement("div");box.className="field";box.urls=[];box.busy=0;
  box.innerHTML=`<label>${t}</label><input type="file" accept="image/*" multiple>
    <div class="photos" style="margin-top:9px"></div>`;
  const inp=$("input",box),strip=$(".photos",box);
  inp.onchange=async()=>{ const files=Array.from(inp.files||[]); inp.value="";
    for(const f of files){
      const wrap=document.createElement("span"); wrap.className="up";
      const i=new Image(); i.alt="บิลที่แนบ"; wrap.appendChild(i); strip.appendChild(wrap);
      box.busy++;
      try{ const u=await HubMod.compressImage(f,1100,170000); i.src=u;
        const url=await S.uploadPhoto(u); box.urls.push(url); wrap.classList.remove("up"); }
      catch(e){ wrap.remove(); toast(e.message||"แนบรูปไม่สำเร็จ"); }
      finally{ box.busy--; }
    } };
  return box;
}

/* กล่องแบบเดียวกับระบบสอบ: หัว (ชื่อ + ปิด) · เนื้อหาพื้นเทา · ปุ่มท้าย ยกเลิกซ้าย ยืนยันขวา */
function modal(title,body,onSave,saveTxt="บันทึก"){
  const m=document.createElement("div");m.className="mask";
  const box=document.createElement("div");box.className="modal";
  box.innerHTML=`<div class="modal-head"><h3>${esc(title)}</h3><button class="modal-x" type="button" aria-label="ปิด">×</button></div>`;
  const bd=document.createElement("div");bd.className="modal-body";bd.appendChild(body);box.appendChild(bd);
  const act=document.createElement("div");act.className="modal-foot actions";
  const s=Object.assign(document.createElement("button"),{className:"btn",textContent:saveTxt});
  const c=Object.assign(document.createElement("button"),{className:"btn ghost",textContent:"ยกเลิก"});
  c.onclick=()=>m.remove(); $(".modal-x",box).onclick=()=>m.remove();
  s.onclick=async()=>{s.disabled=true;const o=s.textContent;s.textContent="กำลังบันทึก…";
    try{await onSave();m.remove();}catch(e){toast(e.message||"บันทึกไม่สำเร็จ");s.disabled=false;s.textContent=o;}};
  act.append(c,s);box.appendChild(act);m.appendChild(box);
  m.onclick=e=>{if(e.target===m)m.remove();};
  $("#modalHost").appendChild(m);return m;
}

/* ───── โครงหน้า ───── */
function gate(title,msg,icon){
  $("#app").innerHTML=`<div class="gate"><div class="box"><div class="em-ic">${icon||"🔒"}</div><h2>${esc(title)}</h2><p>${msg}</p>
    <button class="btn full" id="gb">กลับหน้าหลัก</button></div></div>`;
  $("#gb").onclick=()=>Hub.back();
}
/* โครงหน้าเดียวกับระบบสอบ: แถบบน (โลโก้ · ชื่อระบบ · ผู้ใช้ · กลับหน้าหลัก) → หัวหน้า → ตัวเลขสรุป → แท็บ */
const BACK_SVG='<svg viewBox="0 0 24 24" width="15" height="15"><path d="M15 18l-6-6 6-6"/></svg>';
function shell(title,note,stats,tabs,active,onTab,eyebrow){
  const at=S.loadedAt?new Date(S.loadedAt):null;
  const upd=at?"อัปเดต "+String(at.getHours()).padStart(2,"0")+":"+String(at.getMinutes()).padStart(2,"0"):"";
  const branch=ME&&ME.role==="branch";
  $("#app").innerHTML=`
    <div class="topbar">
      <div class="brand"><div class="logo-wrap"><img src="../logo.png" alt="FAB"></div>
        <div class="brand-text"><div class="t-title">ระบบเบิกเงินประชุมร้าน</div><div class="t-sub">FAB Operations &amp; Training Hub</div></div></div>
      <div class="spacer"></div>
      <span class="userchip ${branch?"":"admin"}">${esc((branch?ME.name:Hub.fullName())||"—")}</span>
      <button class="btn-back" id="out" title="กลับหน้าหลัก">${BACK_SVG}<span class="bt-label">กลับหน้าหลัก</span></button>
    </div>
    <div class="shell">
      <div class="pagehead">${eyebrow?`<div class="ph-eyebrow">${esc(eyebrow)}</div>`:""}
        <div class="ph-title">${esc(title)}</div>
        <div class="ph-sub">${esc(note)}${upd?` <span class="upd">· ${upd}</span>`:""}</div></div>
      ${stats||""}
      <div class="segbar" role="tablist">
        ${tabs.map(x=>`<button class="tab" role="tab" data-k="${x.k}" aria-selected="${x.k===active}">${esc(x.t)}${x.n?`<span class="n">${x.n}</span>`:""}</button>`).join("")}
      </div>
      <div id="body"></div>
    </div>`;
  $("#out").onclick=()=>Hub.back();
  $("#app").querySelectorAll(".tab").forEach(b=>b.onclick=()=>onTab(b.dataset.k));
  return $("#body");
}

/* ---------- BRANCH ---------- */
function renderBranch(){
  const r=currentRound();
  let stats="";
  if(r){
    const lim=limitOf(r.id,ME.code), use=used(r.id,ME.code), left=lim-use;
    const pct=lim?Math.min(100,use/lim*100):0;
    stats=`<div class="kpis">
        <div class="kpi"><div class="k-l">วงเงิน ${esc(roundLabel(r.id))}</div><div class="k-n">${short(lim)}</div><div class="k-d">บาท</div></div>
        <div class="kpi"><div class="k-l">ส่งเบิกแล้ว</div><div class="k-n">${short(use)}</div>
          <div class="bar"><i class="${use>lim?"over":""}" style="width:${pct}%"></i></div></div>
        <div class="kpi ${left<0?"warn":"a"}"><div class="k-l">คงเหลือ</div><div class="k-n">${short(left)}</div><div class="k-d">บาท</div></div>
      </div>`;
  }
  const body=shell(ME.name,r?"รอบ "+roundLabel(r.id)+(r.open?" · เปิดรับบิล":" · ปิดรับบิลแล้ว"):"ยังไม่มีรอบเบิก",stats,
    [{k:"now",t:"รอบปัจจุบัน"},{k:"hist",t:"ประวัติย้อนหลัง"},{k:"payee",t:"ผู้รับเงิน"}],TAB,k=>{TAB=k;renderBranch();},
    "สาขา · "+Branches.brandName(Branches.brandOf(ME.code)));

  if(TAB==="payee") return branchPayee(body);
  if(TAB==="hist")  return branchHistory(body);
  if(!r){ body.innerHTML=`<div class="empty">ยังไม่มีรอบเบิกที่เปิดไว้<br>รอฝ่ายบัญชีเปิดรอบก่อนนะครับ</div>`; return; }

  const allowed=can("submit-claim");
  const btn=Object.assign(document.createElement("button"),{className:"btn full",textContent:"ส่งบิลเบิกเงิน"});
  btn.style.marginTop="18px"; btn.disabled=!r.open||!allowed; btn.onclick=()=>claimForm(r.id);
  body.appendChild(btn);
  body.insertAdjacentHTML("beforeend", !allowed
    ? `<div class="muted" style="text-align:center;margin-top:9px">สาขานี้ยังไม่ได้รับสิทธิ์ส่งบิล ติดต่อผู้ดูแลฮับ</div>`
    : r.open
    ? `<div class="muted" style="text-align:center;margin-top:9px">ผู้รับเงินรอบนี้ · ${esc(payeeName(ME.code)||"ยังไม่ได้ระบุ")}${r.dueDate?" · ส่งถึง "+esc(dmy(r.dueDate)):""}</div>`
    : `<div class="muted" style="text-align:center;margin-top:9px">รอบนี้ปิดรับบิลแล้ว ติดต่อฝ่ายบัญชีถ้าต้องส่งเพิ่ม</div>`);

  const mine=CLAIMS().filter(x=>x.roundId===r.id&&x.branchCode===ME.code)
    .sort((a,b)=>(b.submittedAt||"").localeCompare(a.submittedAt||""));
  body.insertAdjacentHTML("beforeend",`<div class="sec"><b>บิลที่ส่งรอบนี้</b><span>${mine.length} ใบ</span></div>`);
  if(!mine.length) body.insertAdjacentHTML("beforeend",`<div class="empty">ยังไม่ได้ส่งบิลรอบนี้</div>`);
  mine.forEach(x=>body.appendChild(slip(x,false)));
}
function branchHistory(body){
  const mine=CLAIMS().filter(x=>x.branchCode===ME.code);
  if(!mine.length){ body.innerHTML=`<div class="empty">ยังไม่มีประวัติการเบิก</div>`; return; }
  const g={}; mine.forEach(x=>(g[x.roundId]=g[x.roundId]||[]).push(x));
  Object.keys(g).sort().reverse().forEach(rid=>{
    const list=g[rid].sort((a,b)=>(b.submittedAt||"").localeCompare(a.submittedAt||""));
    const sum=list.filter(x=>x.status==="approved").reduce((s,x)=>s+(Number(x.amount)||0),0);
    body.insertAdjacentHTML("beforeend",
      `<div class="sec"><b>${esc(roundLabel(rid))}</b><span>${list.length} ใบ · อนุมัติ ${money(sum)} บาท</span></div>`);
    list.forEach(x=>body.appendChild(slip(x,false)));
  });
}
function branchPayee(body){
  const cur=payeeOf(ME.code);
  const pend=PREQ().filter(p=>p.branchCode===ME.code&&p.status==="pending");
  body.insertAdjacentHTML("beforeend",`<div class="card">
    <label>ผู้รับเงินปัจจุบัน</label>
    <div style="font-size:19px;font-weight:600;line-height:1.4">${esc(cur.name||"ยังไม่ได้ระบุ")}</div>
    ${cur.note?`<div class="muted">${esc(cur.note)}</div>`:""}
    ${cur.updatedAt?`<div class="muted" style="margin-top:7px">อัปเดต ${esc(dmy(cur.updatedAt))}</div>`:""}</div>`);
  if(pend.length) body.insertAdjacentHTML("beforeend",
    `<div class="card" style="border-color:var(--gold-line);background:var(--gold-soft)"><span class="pill p-wait">รอฝ่ายบัญชีอนุมัติ</span>
      <div style="margin-top:9px;font-size:15px">ขอเปลี่ยนเป็น <b>${esc(pend[0].newName)}</b></div>
      ${pend[0].bank?`<div class="muted">${esc(pend[0].bank)}</div>`:""}
      ${pend[0].reason?`<div class="muted">${esc(pend[0].reason)}</div>`:""}</div>`);
  if(!can("request-payee")) return;
  const b=Object.assign(document.createElement("button"),{className:"btn full",textContent:"แจ้งเปลี่ยนผู้รับเงิน"});
  b.disabled=!!pend.length;
  b.onclick=()=>{
    const f=document.createElement("div");
    f.innerHTML=`<div class="field"><label>ชื่อผู้รับเงินคนใหม่</label><input id="pn" placeholder="ชื่อ–นามสกุล"></div>
      <div class="field"><label>ช่องทางรับเงิน</label><input id="pb" placeholder="เช่น ธ.กสิกร 123-4-56789-0"></div>
      <div class="field"><label>เหตุผลที่เปลี่ยน</label><textarea id="pr" placeholder="เช่น ผจก.สาขาคนเดิมย้ายสาขา"></textarea></div>`;
    modal("แจ้งเปลี่ยนผู้รับเงิน",f,async()=>{
      const n=$("#pn",f).value.trim(); if(!n) throw new Error("ใส่ชื่อผู้รับเงินก่อน");
      await S.refresh().catch(()=>{});
      if(PREQ().some(p=>p.branchCode===ME.code&&p.status==="pending")) throw new Error("มีคำขอค้างอยู่แล้ว รอฝ่ายบัญชีอนุมัติก่อน");
      const id=uid();
      await S.set("payeeReq",id,{branchCode:ME.code,branchName:ME.name,newName:n,
        bank:$("#pb",f).value.trim(),reason:$("#pr",f).value.trim(),status:"pending",
        createdAt:nowISO(),createdBy:Hub.fullName()});
      toast("ส่งคำขอให้ฝ่ายบัญชีแล้ว");
    },"ส่งคำขอ");
  };
  body.appendChild(b);
}
function claimForm(rid){
  const r0=roundOf(rid);
  const lim=limitOf(rid,ME.code), left=lim-used(rid,ME.code);
  const f=document.createElement("div");
  f.innerHTML=`<div class="muted" style="margin-bottom:14px">รอบ ${esc(roundLabel(rid))} · ${lim?"วงเงินคงเหลือ "+money(left)+" บาท":"ยังไม่ได้ตั้งวงเงิน"}</div>
    <div class="f2">
      <div class="field"><label>จำนวนเงิน (บาท)</label><input id="am" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00"></div>
      <div class="field"><label>วันที่ประชุม</label><input id="dt" type="date" value="${HubMod.localDate()}"></div>
    </div>
    <div class="field"><label>ผู้รับเงิน</label><input id="pe" value="${esc(payeeName(ME.code))}" placeholder="ชื่อผู้รับเงิน"></div>
    <div class="field"><label>รายละเอียด</label><textarea id="nt" placeholder="เช่น ค่าอาหารว่างประชุมพนักงาน 12 คน"></textarea></div>`;
  const pf=photoField("รูปบิล / ใบเสร็จ"); f.appendChild(pf);
  modal("ส่งบิลเบิกเงิน",f,async()=>{
    const amount=Math.round(Number($("#am",f).value)*100)/100; if(!amount||amount<=0) throw new Error("ใส่จำนวนเงินก่อน");
    if(pf.busy) throw new Error("รอรูปอัปโหลดให้เสร็จก่อน");
    if(!pf.urls.length) throw new Error("แนบรูปบิลอย่างน้อย 1 รูป");
    /* ดึงข้อมูลล่าสุดก่อนเช็ควงเงิน — อีกเครื่องของสาขาเดียวกันอาจเพิ่งส่งบิลไป หรือบัญชีเพิ่งปิดรอบ */
    await S.refresh().catch(()=>{});
    const r=roundOf(rid)||r0;
    if(!r||!r.open) throw new Error("รอบนี้ปิดรับบิลแล้ว");
    const lim2=limitOf(rid,ME.code), left2=lim2-used(rid,ME.code);
    if(lim2&&amount>left2) throw new Error("เกินวงเงินคงเหลือ ("+money(left2)+" บาท)");
    const id=uid();
    await S.set("claims",id,{roundId:rid,branchCode:ME.code,branchName:ME.name,amount,
      meetDate:$("#dt",f).value,payee:$("#pe",f).value.trim(),note:$("#nt",f).value.trim(),

/* slip */
function slip(x,admin){
  const s=document.createElement("div"); s.className="slip st-"+(x.status||"pending");
  const p=x.status==="approved"?["p-ok","อนุมัติแล้ว"]:x.status==="rejected"?["p-no","ไม่อนุมัติ"]:["p-wait","รอตรวจ"];
  const brand=Branches.brandOf(x.branchCode);
  s.innerHTML=`<div class="head">
      <div class="grow">
        <div class="amt">${money(x.amount)}<em>บาท</em></div>
        <div class="muted">${admin?`<span class="tag">${esc(Branches.brandName(brand))}</span>`+esc(branchLabel(x.branchCode,x.branchName))+" · ":""}${esc(roundLabel(x.roundId))}</div>
      </div><span class="pill ${p[0]}">${p[1]}</span></div>
    <div style="margin-top:11px">
      <div class="lead"><span>วันที่ประชุม</span><span class="fill"></span><span class="v">${esc(dmy(x.meetDate)||"-")}</span></div>
      <div class="lead"><span>ผู้รับเงิน</span><span class="fill"></span><span class="v">${esc(x.payee||"-")}</span></div>
      <div class="lead"><span>ส่งเมื่อ</span><span class="fill"></span><span class="v">${esc(dmy(x.submittedAt)||"-")}</span></div>
      ${x.reviewedAt?`<div class="lead"><span>ตรวจโดย</span><span class="fill"></span><span class="v">${esc(x.reviewedBy||"-")} · ${esc(dmy(x.reviewedAt))}</span></div>`:""}
    </div>
    ${x.note?`<div class="desc">${esc(x.note)}</div>`:""}
    ${x.reviewNote?`<div class="desc muted">บัญชี: ${esc(x.reviewNote)}</div>`:""}`;
  const ph=photoStrip(x.photos);
  if(ph.children.length) s.appendChild(ph);
  if(admin&&x.status==="pending"&&can("review-claims")){
    const a=document.createElement("div"); a.className="actions";
    const y=Object.assign(document.createElement("button"),{className:"btn sm ok",textContent:"อนุมัติ"});
    const n=Object.assign(document.createElement("button"),{className:"btn sm no",textContent:"ไม่อนุมัติ"});
    y.onclick=()=>review(x,"approved"); n.onclick=()=>review(x,"rejected");
    a.append(y,n); s.appendChild(a);
  }
  return s;
}
function review(x,status){
  const f=document.createElement("div");
  f.innerHTML=`<div class="muted" style="margin-bottom:12px">${esc(branchLabel(x.branchCode,x.branchName))} · ${money(x.amount)} บาท</div>
    <div class="field"><label>หมายเหตุถึงสาขา</label><textarea id="rn" placeholder="${status==="rejected"?"เหตุผลที่ไม่อนุมัติ":"ไม่ใส่ก็ได้"}"></textarea></div>`;
  modal(status==="approved"?"อนุมัติบิลนี้":"ไม่อนุมัติบิลนี้",f,async()=>{
    const note=$("#rn",f).value.trim();
    if(status==="rejected"&&!note) throw new Error("ใส่เหตุผลที่ไม่อนุมัติ ให้สาขารู้ว่าต้องแก้อะไร");
    /* expect = ยังรอตรวจอยู่ · กันสองคนกดพร้อมกันแล้วผลของคนหลังทับคนแรก */
    await S.update("claims",x.id,{status,reviewNote:note,reviewedAt:nowISO(),reviewedBy:Hub.fullName()},{status:"pending"});
    toast(status==="approved"?"อนุมัติแล้ว":"บันทึกแล้ว");
  },"ยืนยัน");
}

/* ---------- ฝ่ายบัญชี / ทีมบริหาร ---------- */
function adminTabs(){
  const pend=CLAIMS().filter(c=>c.status==="pending").length;
  const preq=PREQ().filter(p=>p.status==="pending").length;
  const t=[];
  if(can("view-claims")||can("review-claims")) t.push({k:"claims",t:"บิลเบิก",n:can("review-claims")?pend:0});
  if(can("manage-rounds")) t.push({k:"rounds",t:"รอบเบิก"});
  if(can("manage-limits")) t.push({k:"branches",t:"สาขา & วงเงิน"});
  if(can("manage-payees")) t.push({k:"payees",t:"ผู้รับเงิน",n:preq});
  return t;
}
function renderAdmin(){
  const tabs=adminTabs();
  if(!tabs.length) return gate("ไม่มีสิทธิ์เข้าระบบนี้","บัญชีของคุณยังไม่ได้รับสิทธิ์ในระบบเบิกเงินประชุมร้าน<br>ขอสิทธิ์ได้จากผู้ดูแลฮับ (⚙️ → สิทธิ์ปุ่มแต่ละระบบ)");
  if(!tabs.some(t=>t.k===ATAB)) ATAB=tabs[0].k;
  const r=currentRound();
  const pend=CLAIMS().filter(c=>c.status==="pending");
  const appr=r?CLAIMS().filter(c=>c.roundId===r.id&&c.status==="approved").reduce((s,c)=>s+(Number(c.amount)||0),0):0;
  const stats=`<div class="kpis">
      <div class="kpi ${pend.length?"a":"calm"}"><div class="k-l">บิลรอตรวจ</div><div class="k-n">${pend.length}</div><div class="k-d">ใบ · ทุกรอบ</div></div>
      <div class="kpi b"><div class="k-l">อนุมัติรอบล่าสุด</div><div class="k-n">${short(appr)}</div><div class="k-d">บาท</div></div>
      <div class="kpi"><div class="k-l">สาขาในฮับ</div><div class="k-n">${Branches.list().length}</div><div class="k-d">สาขาที่ยังเปิด</div></div>
    </div>`;
  const body=shell(can("review-claims")?"ฝ่ายบัญชี":"ภาพรวมการเบิก",
    r?"รอบล่าสุด "+roundLabel(r.id)+(r.open?" · เปิดรับบิล":" · ปิดแล้ว"):"ยังไม่มีรอบเบิก",
    stats,tabs,ATAB,k=>{ATAB=k;renderAdmin();},
    can("review-claims")?"ตรวจบิล · รอบเบิก · วงเงิน · ผู้รับเงิน":"ดูอย่างเดียว");
  ({claims:adminClaims,rounds:adminRounds,branches:adminBranches,payees:adminPayees})[ATAB](body);
}
function brandOptions(sel){
  return `<option value="">ทุกแบรนด์</option>`+Branches.brands().map(k=>`<option value="${esc(k)}" ${sel===k?"selected":""}>${esc(Branches.brandName(k))}</option>`).join("");
}
function adminClaims(body){
  const rounds=ROUNDS().sort((a,b)=>b.id.localeCompare(a.id));
  if(!rounds.length){ body.innerHTML=`<div class="empty">ยังไม่มีรอบเบิก${can("manage-rounds")?"<br>ไปที่แท็บ “รอบเบิก” เพื่อเปิดรอบแรก":""}</div>`; return; }
  if(F.round!=="_all"&&!roundOf(F.round)) F.round=rounds[0].id;
  const sel=document.createElement("div"); sel.className="filters";
  sel.innerHTML=`<div class="field"><label>เลือกรอบ</label><select id="rs">
      ${rounds.map(x=>`<option value="${esc(x.id)}" ${F.round===x.id?"selected":""}>${esc(roundLabel(x.id))}</option>`).join("")}
      <option value="_all" ${F.round==="_all"?"selected":""}>ทุกรอบ</option></select></div>
    <div class="field"><label>แบรนด์</label><select id="bs">${brandOptions(F.brand)}</select></div>`;
  body.appendChild(sel);
  const out=document.createElement("div"); body.appendChild(out);
  const draw=()=>{
    const list=CLAIMS().filter(c=>(F.round==="_all"||c.roundId===F.round)&&(!F.brand||Branches.brandOf(c.branchCode)===F.brand))
      .sort((a,b)=>(a.status==="pending"?0:1)-(b.status==="pending"?0:1)||(b.submittedAt||"").localeCompare(a.submittedAt||""));
    const wait=list.filter(c=>c.status==="pending").reduce((s,c)=>s+(Number(c.amount)||0),0);
    const tot=list.filter(c=>c.status==="approved").reduce((s,c)=>s+(Number(c.amount)||0),0);
    const nb=new Set(list.map(c=>c.branchCode)).size;
    out.innerHTML=`<div class="card"><div class="lead"><span>รอตรวจ</span><span class="fill"></span><span class="v">${money(wait)} บาท</span></div>
      <div class="lead"><span>อนุมัติแล้ว</span><span class="fill"></span><span class="v">${money(tot)} บาท</span></div>
      <div class="lead"><span>จำนวนบิล</span><span class="fill"></span><span class="v">${list.length} ใบ · ${nb} สาขา</span></div></div>`;
    if(!list.length) out.insertAdjacentHTML("beforeend",`<div class="empty">ยังไม่มีบิลในรอบนี้</div>`);
    list.forEach(x=>out.appendChild(slip(x,true)));
  };
  $("#rs",sel).onchange=e=>{F.round=e.target.value;draw();};
  $("#bs",sel).onchange=e=>{F.brand=e.target.value;draw();};
  draw();
}

      <div class="field"><label>ส่งบิลถึงวันที่</label><input id="rd" type="date"></div></div>

      const id=$("#rm",f).value; if(!/^\d{4}-\d{2}$/.test(id)) throw new Error("เลือกเดือนก่อน");

  rounds.forEach(r=>{

        <span class="pill ${r.open?"p-ok":"p-no"}">${r.open?"เปิดรับ":"ปิดแล้ว"}</span></div>`;

      {className:"btn sm "+(r.open?"no":"ok"),textContent:r.open?"ปิดรับบิล":"เปิดรับบิลอีกครั้ง"});
    t.onclick=async()=>{ t.disabled=true; try{await S.update("rounds",r.id,{open:!r.open});
      toast(r.open?"ปิดรอบแล้ว":"เปิดรอบแล้ว");}catch(e){toast(e.message||"ทำรายการไม่สำเร็จ");t.disabled=false;} };
    a.appendChild(t); c.appendChild(a); body.appendChild(c);

function limitForm(b){

  modal("ตั้งวงเงินสาขา",f,async()=>{
    const v=Math.max(0,Number($("#bl",f).value)||0);

}

}
/* ข้อมูลใหม่มาถึงระหว่างที่คนกำลังพิมพ์ค้นหา — รอให้ออกจากช่องก่อนค่อยวาดใหม่ ไม่งั้นเคอร์เซอร์หลุด */
let _pending=false;
function renderSafe(){
  const a=document.activeElement;
  if(a&&$("#app").contains(a)&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)){ _pending=true; return; }
  render();
}
document.addEventListener("focusout",()=>{ if(_pending){ _pending=false; setTimeout(renderSafe,0); } });

(async()=>{
  if(!Hub.guard()) return;
  if(Hub.isBranch()){
    const code=Hub.branchCode();
    ME={role:"branch",code,name:branchLabel(code,Hub.branchName())};
  }else ME={role:"office"};
  if(S.hasCache()) render();
  const [okBackend]=await Promise.all([S.checkBackend().catch(()=>null), Cfg.load()]);
  if(ME.role==="branch") ME.name=branchLabel(ME.code,Hub.branchName());
  if(okBackend===false) return gate("ระบบกำลังเปิดใช้งาน","หลังบ้านของฮับยังไม่ได้อัปเดตสำหรับระบบนี้<br>แจ้งผู้ดูแลให้ Deploy Apps Script รุ่นใหม่");
  try{ await S.refresh(); }
  catch(e){ if(!S.hasCache()) return gate("เชื่อมต่อไม่สำเร็จ","โหลดข้อมูลไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่อีกครั้ง"); toast("ใช้ข้อมูลที่โหลดไว้ล่าสุด"); }
  render();
  S.onChange(renderSafe);
  S.startPolling(45000);
})();
</script>
</body>
</html>

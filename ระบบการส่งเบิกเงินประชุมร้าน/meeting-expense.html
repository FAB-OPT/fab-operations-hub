<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบเบิกเงินประชุมร้าน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --band:#232E45; --on-band:#EDF0F6; --on-band-dim:#98A4BE;
  --bg:#EFEEEA; --slip:#FFFFFF; --slip2:#F5F4F0;
  --ink:#1E2334; --ink2:#575E74; --ink3:#8B92A6;
  --line:#DEDCD5; --line2:#EAE8E2;
  --wait:#9A6100; --wait-bg:#FBF0DA;
  --ok:#1E6B4C; --ok-bg:#DFEEE7;
  --no:#963A32; --no-bg:#F7E4E2;
  --shadow:0 1px 2px rgba(30,35,52,.05);
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --band:#151B2A; --on-band:#E6EAF3; --on-band-dim:#8C97B2;
    --bg:#12151F; --slip:#1B2030; --slip2:#232939;
    --ink:#E7EAF2; --ink2:#AAB2C6; --ink3:#7C859B;
    --line:#2E3547; --line2:#262C3C;
    --wait:#E1AE4E; --wait-bg:#33280F;
    --ok:#65C39A; --ok-bg:#123026;
    --no:#DF8981; --no-bg:#331B19;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --band:#151B2A; --on-band:#E6EAF3; --on-band-dim:#8C97B2;
  --bg:#12151F; --slip:#1B2030; --slip2:#232939;
  --ink:#E7EAF2; --ink2:#AAB2C6; --ink3:#7C859B;
  --line:#2E3547; --line2:#262C3C;
  --wait:#E1AE4E; --wait-bg:#33280F;
  --ok:#65C39A; --ok-bg:#123026;
  --no:#DF8981; --no-bg:#331B19;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans Thai Looped","Segoe UI",system-ui,sans-serif;
  font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
.in{max-width:720px;margin:0 auto;padding:0 16px}

/* band */
.band{background:var(--band);color:var(--on-band);padding:18px 0 20px}
.band .top{display:flex;gap:14px;align-items:flex-start}
h1{margin:0;font-size:20.5px;font-weight:700;letter-spacing:-.015em;line-height:1.25}
.band .note{margin:3px 0 0;font-size:12.5px;color:var(--on-band-dim)}
.exit{font-size:12.5px;color:var(--on-band);background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.16);border-radius:99px;padding:6px 14px;cursor:pointer;
  font-family:inherit;white-space:nowrap}
.exit:hover{background:rgba(255,255,255,.15)}
.stats{display:flex;margin-top:18px;border-top:1px solid rgba(255,255,255,.13);padding-top:14px}
.stats > div{flex:1;padding-right:10px;min-width:0}
.stats > div + div{border-left:1px solid rgba(255,255,255,.13);padding-left:14px}
.stats b{display:block;font-size:23px;font-weight:600;line-height:1.15;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.stats span{font-size:11.5px;color:var(--on-band-dim)}
.stats .hi b{color:#F0C36B}
.gauge{height:5px;border-radius:99px;background:rgba(255,255,255,.14);margin-top:14px;overflow:hidden}
.gauge i{display:block;height:100%;background:#F0C36B}
.gauge i.over{background:#E8827A}

/* tabs */
.tabbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;font:inherit;font-size:14.5px;font-weight:500;color:var(--ink3);
  padding:13px 0 11px;cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--ok)}
.wrap{max-width:720px;margin:0 auto;padding:4px 16px 90px}

/* generic */
.card{background:var(--slip);border:1px solid var(--line);border-radius:14px;padding:16px;
  margin:14px 0;box-shadow:var(--shadow)}
.sec{display:flex;align-items:baseline;gap:9px;margin:26px 2px 8px}
.sec b{font-size:13.5px;font-weight:600}
.sec span{font-size:12.5px;color:var(--ink3)}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.grow{flex:1;min-width:0}
.row{display:flex;gap:10px;align-items:center}
.muted{color:var(--ink3);font-size:13px}
.empty{background:var(--slip);border:1px dashed var(--line);border-radius:14px;text-align:center;
  color:var(--ink3);padding:32px 18px;font-size:14px;line-height:1.7;margin:12px 0}

/* receipt slip */
.slip{margin:22px 0 14px;padding:14px 16px 16px;color:var(--ink);
  background:radial-gradient(circle 6px at 7px 0, var(--bg) 97%, transparent 100%) top left/14px 11px repeat-x,
             var(--slip);
  border:1px solid var(--line);border-top:0;border-radius:0 0 13px 13px;box-shadow:var(--shadow)}
.slip .head{display:flex;align-items:flex-start;gap:10px;padding-top:6px}
.slip .amt{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.2}
.slip .amt em{font-style:normal;font-size:13px;font-weight:400;color:var(--ink3);margin-left:3px}
.lead{display:flex;align-items:baseline;gap:7px;font-size:13px;color:var(--ink2);margin-top:3px}
.lead .fill{flex:1;border-bottom:1px dotted var(--line);transform:translateY(-3px)}
.lead .v{color:var(--ink);font-weight:500}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.p-wait{background:var(--wait-bg);color:var(--wait)}
.p-ok{background:var(--ok-bg);color:var(--ok)}
.p-no{background:var(--no-bg);color:var(--no)}
.slip .desc{margin-top:10px;font-size:14px;padding-top:10px;border-top:1px dashed var(--line)}
.photos{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.photos img,.photos .ph{width:64px;height:64px;object-fit:cover;border-radius:8px;
  border:1px solid var(--line);background:var(--slip2);cursor:pointer}

/* forms */
label{display:block;font-size:12.5px;color:var(--ink2);margin:0 0 6px;font-weight:500}
input,select,textarea{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--slip2);
  border:1px solid var(--line);border-radius:9px;padding:10px 12px}
textarea{min-height:60px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ok);outline-offset:1px}
.field{margin:0 0 13px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
button{font-family:inherit}
.btn{background:var(--ink);color:var(--slip);border:0;border-radius:9px;padding:10px 17px;
  font-size:14.5px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 13px;font-size:13.5px}
.btn.ok{background:var(--ok);color:#fff}
.btn.no{background:transparent;color:var(--no);border:1px solid var(--line)}
.btn.full{width:100%;padding:14px;font-size:15.5px;border-radius:11px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.line-item{display:flex;gap:11px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line2)}
.card .line-item:last-child{border-bottom:0;padding-bottom:2px}
.actions{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}

/* modal / login */
.mask{position:fixed;inset:0;background:rgba(16,20,32,.6);z-index:60;display:flex;
  align-items:flex-end;justify-content:center}
.modal{background:var(--slip);width:100%;max-width:620px;max-height:92vh;overflow:auto;
  border-radius:18px 18px 0 0;padding:20px 17px 28px}
@media(min-width:700px){.mask{align-items:center;padding:20px}.modal{border-radius:16px}}
@media (prefers-reduced-motion:no-preference){.modal{animation:rise .2s cubic-bezier(.2,.8,.3,1)}}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
.modal h2{margin:0 0 16px;font-size:18px;font-weight:700;letter-spacing:-.015em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:90;background:var(--band);
  color:var(--on-band);padding:11px 20px;border-radius:99px;font-size:14px;box-shadow:0 6px 18px rgba(20,26,42,.3)}
.login-page{min-height:100vh;background:var(--band);color:var(--on-band);display:flex;
  align-items:center;justify-content:center;padding:24px}
.login{width:100%;max-width:330px}
.login h1{font-size:25px;margin-bottom:6px;color:var(--on-band)}
.login p{color:var(--on-band-dim);font-size:13.5px;margin:0 0 22px}
.login input{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);
  color:var(--on-band);text-align:center;font-size:17px;letter-spacing:.06em;padding:13px}
.login input::placeholder{color:var(--on-band-dim);letter-spacing:0}
.login .btn{background:var(--on-band);color:var(--band)}
.login .hint{margin-top:16px;font-size:12.5px;color:var(--on-band-dim);text-align:center}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app"><div class="empty" style="margin:20vh 16px">กำลังเชื่อมต่อ…</div></div>
<div id="modalHost"></div>

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const money=n=>(Number(n)||0).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});
const short=n=>{n=Number(n)||0; return n>=1e6?(n/1e6).toFixed(1)+"ล.":n>=1e4?Math.round(n/1e3)+"K":money(n).replace(".00","");};
const nowISO=()=>new Date().toISOString();
const thisRoundId=()=>new Date().toISOString().slice(0,7);
const roundLabel=id=>{const[y,m]=String(id).split("-");
  return ["","ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."][+m]+" "+(+y+543);};
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2300);}

let DB=null, CFG=null, ROUNDS=[], CLAIMS=[], PAYEES={}, PREQ=[], PHOTO={};
let ME=null, TAB="now", ATAB="claims";

/* photos */
function compress(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader(); fr.onerror=()=>rej(new Error("อ่านไฟล์ไม่ได้"));
    fr.onload=()=>{ const img=new Image(); img.onerror=()=>rej(new Error("ไฟล์ไม่ใช่รูปภาพ"));
      img.onload=()=>{ const max=1100, sc=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement("canvas"); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        let q=.72,o=c.toDataURL("image/jpeg",q);
        while(o.length>170000&&q>.28){q-=.1;o=c.toDataURL("image/jpeg",q);}
        res(o); }; img.src=fr.result; };
    fr.readAsDataURL(file); });
}
async function savePhoto(u){const id=uid();await DB.doc("photos/"+id).set({d:u,at:nowISO()});PHOTO[id]=u;return id;}
function photoNode(id){
  if(PHOTO[id]){const i=new Image();i.src=PHOTO[id];i.alt="บิลที่แนบ";i.onclick=()=>zoom(id);return i;}
  const d=document.createElement("div"); d.className="ph";
  DB.doc("photos/"+id).get().then(s=>{ if(!s.exists)return; PHOTO[id]=s.data().d;
    const i=new Image();i.src=PHOTO[id];i.alt="บิลที่แนบ";i.onclick=()=>zoom(id);d.replaceWith(i);}).catch(()=>{});
  return d;
}
function zoom(id){ if(!PHOTO[id])return;
  const m=document.createElement("div");m.className="mask";
  m.innerHTML=`<img src="${PHOTO[id]}" alt="บิลขยาย" style="max-width:96%;max-height:92vh;border-radius:12px;margin:auto">`;
  m.onclick=()=>m.remove();document.body.appendChild(m);}
function photoField(t){
  const box=document.createElement("div");box.className="field";box.ids=[];
  box.innerHTML=`<label>${t}</label><input type="file" accept="image/*" capture="environment" multiple>
    <div class="photos" style="margin-top:9px"></div>`;
  const inp=$("input",box),strip=$(".photos",box);
  inp.onchange=async()=>{ for(const f of Array.from(inp.files||[])){
      try{ const u=await compress(f); box.ids.push(await savePhoto(u));
        const i=new Image();i.src=u;i.alt="บิลที่แนบ";strip.appendChild(i);}catch(e){toast(e.message||"แนบรูปไม่สำเร็จ");} }
    inp.value=""; };
  return box;
}

/* helpers */
const branchOf=c=>(CFG.branches||[]).find(b=>b.code===c)||{code:c,name:c,limit:0};
const roundOf=id=>ROUNDS.find(r=>r.id===id);
const currentRound=()=>ROUNDS.slice().sort((a,b)=>b.id.localeCompare(a.id))[0]||null;
const used=(rid,code)=>CLAIMS.filter(c=>c.roundId===rid&&c.branchCode===code&&c.status!=="rejected")
  .reduce((s,c)=>s+(Number(c.amount)||0),0);
function limitOf(rid,code){ const r=roundOf(rid)||{}, b=branchOf(code);
  if(r.limits&&r.limits[code]!=null) return Number(r.limits[code]);
  if(b.limit) return Number(b.limit);
  return Number(r.limitDefault)||Number(CFG.defaultLimit)||0; }
const payeeName=c=>(PAYEES[c]&&PAYEES[c].name)||"";

function modal(title,body,onSave,saveTxt="บันทึก"){
  const m=document.createElement("div");m.className="mask";
  const box=document.createElement("div");box.className="modal";
  box.innerHTML=`<h2>${esc(title)}</h2>`;box.appendChild(body);
  const act=document.createElement("div");act.className="actions";act.style.marginTop="18px";
  const s=Object.assign(document.createElement("button"),{className:"btn",textContent:saveTxt});
  const c=Object.assign(document.createElement("button"),{className:"btn ghost",textContent:"ยกเลิก"});
  c.onclick=()=>m.remove();
  s.onclick=async()=>{s.disabled=true;try{await onSave();m.remove();}catch(e){toast(e.message||"บันทึกไม่สำเร็จ");s.disabled=false;}};
  act.append(s,c);box.appendChild(act);m.appendChild(box);
  m.onclick=e=>{if(e.target===m)m.remove();};
  $("#modalHost").appendChild(m);return m;
}

/* login */
function renderLogin(){
  const a=$("#app");
  if(!CFG||!CFG.adminCode){
    a.innerHTML=`<div class="login-page"><div class="login">
      <h1>ตั้งค่าครั้งแรก</h1>
      <p>ตั้งรหัสสำหรับฝ่ายบัญชี/ออฟฟิศ เพื่อเริ่มใช้ระบบ</p>
      <div class="field"><input id="ac" placeholder="รหัสผู้ดูแล" autocomplete="off"></div>
      <button class="btn full" id="go">เริ่มใช้งาน</button></div></div>`;
    $("#go").onclick=async()=>{ const v=$("#ac").value.trim(); if(!v)return toast("ใส่รหัสก่อน");
      await DB.doc("meta/config").set({adminCode:v,branches:[],defaultLimit:0,createdAt:nowISO()});
      localStorage.setItem("mx_login",v); toast("ตั้งค่าเรียบร้อย"); };
    return;
  }
  a.innerHTML=`<div class="login-page"><div class="login">
    <h1>เบิกเงินประชุมร้าน</h1>
    <p>ใส่รหัสสาขา หรือรหัสฝ่ายบัญชี</p>
    <div class="field"><input id="lc" placeholder="รหัสเข้าใช้งาน" autocomplete="off"></div>
    <button class="btn full" id="go">เข้าใช้งาน</button>
    <div class="hint">ขอรหัสสาขาได้จากฝ่ายบัญชี</div></div></div>`;
  const go=()=>{ const v=$("#lc").value.trim(); if(!v)return;
    if(v===CFG.adminCode) ME={role:"admin"};
    else { const b=(CFG.branches||[]).find(x=>x.code.toLowerCase()===v.toLowerCase());
      if(!b) return toast("ไม่พบรหัสนี้"); ME={role:"branch",code:b.code,name:b.name}; }
    localStorage.setItem("mx_login",v); render(); };
  $("#go").onclick=go; $("#lc").onkeydown=e=>{if(e.key==="Enter")go();};
}
function autoLogin(){
  const v=localStorage.getItem("mx_login"); if(!v||!CFG||!CFG.adminCode)return;
  if(v===CFG.adminCode){ME={role:"admin"};return;}
  const b=(CFG.branches||[]).find(x=>x.code.toLowerCase()===v.toLowerCase());
  if(b) ME={role:"branch",code:b.code,name:b.name};
}
const logout=()=>{localStorage.removeItem("mx_login");ME=null;render();};

/* shell */
function shell(title,note,stats,tabs,active,onTab){
  $("#app").innerHTML=`
    <div class="band"><div class="in">
      <div class="top"><div class="grow"><h1>${esc(title)}</h1><div class="note">${esc(note)}</div></div>
        <button class="exit" id="out">ออก</button></div>
      ${stats||""}
    </div></div>
    <div class="tabbar"><div class="in"><div class="tabs">
      ${tabs.map(x=>`<button class="tab" data-k="${x.k}" aria-selected="${x.k===active}">${esc(x.t)}</button>`).join("")}
    </div></div></div>
    <div class="wrap" id="body"></div>`;
  $("#out").onclick=logout;
  $("#app").querySelectorAll(".tab").forEach(b=>b.onclick=()=>onTab(b.dataset.k));
  return $("#body");
}

/* ---------- BRANCH ---------- */
function renderBranch(){
  const r=currentRound();
  let stats="";
  if(r){
    const lim=limitOf(r.id,ME.code), use=used(r.id,ME.code), left=lim-use;
    const pct=lim?Math.min(100,use/lim*100):0;
    stats=`<div class="stats">
        <div><b>${short(lim)}</b><span>วงเงิน ${esc(roundLabel(r.id))}</span></div>
        <div><b>${short(use)}</b><span>ส่งเบิกแล้ว</span></div>
        <div class="hi"><b>${short(left)}</b><span>คงเหลือ</span></div>
      </div>
      <div class="gauge"><i class="${use>lim?"over":""}" style="width:${pct}%"></i></div>`;
  }
  const body=shell(ME.name,"รหัสสาขา "+ME.code+(r?" · รอบ"+(r.open?"เปิดรับบิล":"ปิดแล้ว"):""),stats,
    [{k:"now",t:"รอบปัจจุบัน"},{k:"hist",t:"ประวัติย้อนหลัง"},{k:"payee",t:"ผู้รับเงิน"}],TAB,k=>{TAB=k;renderBranch();});

  if(TAB==="payee") return branchPayee(body);
  if(TAB==="hist")  return branchHistory(body);
  if(!r){ body.innerHTML=`<div class="empty">ยังไม่มีรอบเบิกที่เปิดไว้<br>รอฝ่ายบัญชีเปิดรอบก่อนนะครับ</div>`; return; }

  const btn=Object.assign(document.createElement("button"),{className:"btn full",textContent:"ส่งบิลเบิกเงิน"});
  btn.style.marginTop="18px"; btn.disabled=!r.open; btn.onclick=()=>claimForm(r);
  body.appendChild(btn);
  body.insertAdjacentHTML("beforeend", r.open
    ? `<div class="muted" style="text-align:center;margin-top:9px">ผู้รับเงินรอบนี้ · ${esc(payeeName(ME.code)||"ยังไม่ได้ระบุ")}${r.dueDate?" · ส่งถึง "+esc(r.dueDate):""}</div>`
    : `<div class="muted" style="text-align:center;margin-top:9px">รอบนี้ปิดรับบิลแล้ว ติดต่อฝ่ายบัญชีถ้าต้องส่งเพิ่ม</div>`);

  const mine=CLAIMS.filter(x=>x.roundId===r.id&&x.branchCode===ME.code)
    .sort((a,b)=>(b.submittedAt||"").localeCompare(a.submittedAt||""));
  body.insertAdjacentHTML("beforeend",`<div class="sec"><b>บิลที่ส่งรอบนี้</b><span>${mine.length} ใบ</span></div>`);
  if(!mine.length) body.insertAdjacentHTML("beforeend",`<div class="empty">ยังไม่ได้ส่งบิลรอบนี้</div>`);
  mine.forEach(x=>body.appendChild(slip(x,false)));
}
function branchHistory(body){
  const mine=CLAIMS.filter(x=>x.branchCode===ME.code);
  if(!mine.length){ body.innerHTML=`<div class="empty">ยังไม่มีประวัติการเบิก</div>`; return; }
  const g={}; mine.forEach(x=>(g[x.roundId]=g[x.roundId]||[]).push(x));
  Object.keys(g).sort().reverse().forEach(rid=>{
    const list=g[rid].sort((a,b)=>(b.submittedAt||"").localeCompare(a.submittedAt||""));
    const sum=list.filter(x=>x.status==="approved").reduce((s,x)=>s+(Number(x.amount)||0),0);
    body.insertAdjacentHTML("beforeend",

/* slip */
function slip(x,admin){
  const s=document.createElement("div"); s.className="slip";
  const p=x.status==="approved"?["p-ok","อนุมัติแล้ว"]:x.status==="rejected"?["p-no","ไม่อนุมัติ"]:["p-wait","รอตรวจ"];
  s.innerHTML=`<div class="head">
      <div class="grow">
        <div class="amt">${money(x.amount)}<em>บาท</em></div>
        <div class="muted">${admin?esc(x.branchName)+" · ":""}${esc(roundLabel(x.roundId))}</div>
      </div><span class="pill ${p[0]}">${p[1]}</span></div>
    <div style="margin-top:11px">
      <div class="lead"><span>วันที่ประชุม</span><span class="fill"></span><span class="v">${esc(x.meetDate||"-")}</span></div>
      <div class="lead"><span>ผู้รับเงิน</span><span class="fill"></span><span class="v">${esc(x.payee||"-")}</span></div>
      <div class="lead"><span>ส่งเมื่อ</span><span class="fill"></span><span class="v">${esc((x.submittedAt||"").slice(0,10))}</span></div>
    </div>
    ${x.note?`<div class="desc">${esc(x.note)}</div>`:""}
    ${x.reviewNote?`<div class="desc muted">บัญชี: ${esc(x.reviewNote)}</div>`:""}`;
  const ph=document.createElement("div"); ph.className="photos";
  (x.photoIds||[]).forEach(id=>ph.appendChild(photoNode(id)));
  if(ph.children.length) s.appendChild(ph);
  if(admin&&x.status==="pending"){
    const a=document.createElement("div"); a.className="actions";
    const y=Object.assign(document.createElement("button"),{className:"btn sm ok",textContent:"อนุมัติ"});
    const n=Object.assign(document.createElement("button"),{className:"btn sm no",textContent:"ไม่อนุมัติ"});
    y.onclick=()=>review(x,"approved"); n.onclick=()=>review(x,"rejected");
    a.append(y,n); s.appendChild(a);
  }
  return s;
}
function review(x,status){
  const f=document.createElement("div");
  f.innerHTML=`<div class="muted" style="margin-bottom:12px">${esc(x.branchName)} · ${money(x.amount)} บาท</div>
    <div class="field"><label>หมายเหตุถึงสาขา</label><textarea id="rn" placeholder="${status==="rejected"?"เหตุผลที่ไม่อนุมัติ":"ไม่ใส่ก็ได้"}"></textarea></div>`;
  modal(status==="approved"?"อนุมัติบิลนี้":"ไม่อนุมัติบิลนี้",f,async()=>{
    await DB.doc("claims/"+x.id).update({status,reviewNote:$("#rn",f).value.trim(),reviewedAt:nowISO()});
    toast(status==="approved"?"อนุมัติแล้ว":"บันทึกแล้ว");
  },"ยืนยัน");
}

      <div class="field"><label>วงเงินเฉพาะสาขา</label><input id="bl" type="number" min="0" value="${b.limit||0}"></div></div>
    <div class="muted">ใส่ 0 = ใช้วงเงินเริ่มต้น</div>`;
  if(i!=null){ const d=Object.assign(document.createElement("button"),{className:"btn sm no",textContent:"ลบสาขานี้"});

      await DB.doc("meta/config").update({branches:arr}); d.closest(".mask").remove(); toast("ลบแล้ว"); };

(async()=>{
  DB=await claude.use("db");
  if(!DB){ $("#app").innerHTML=`<div class="empty" style="margin:20vh 16px">หน้านี้ต้องเปิดผ่านลิงก์แอปบน claude.ai จึงจะบันทึกข้อมูลได้</div>`; return; }
  let first=true;
  DB.doc("meta/config").onSnapshot(s=>{ CFG=s.exists?s.data():{};
    if(first){ first=false; autoLogin(); } else if(ME&&ME.role==="branch"){
      const b=(CFG.branches||[]).find(x=>x.code===ME.code); if(b) ME.name=b.name; }
    render(); },
    e=>toast("โหลดการตั้งค่าไม่สำเร็จ ("+e.code+")"));
  DB.collection("rounds").onSnapshot(s=>{ROUNDS=s.docs.map(d=>({id:d.id,...d.data()}));if(CFG)render();});
  DB.collection("claims").onSnapshot(s=>{CLAIMS=s.docs.map(d=>({id:d.id,...d.data()}));if(CFG)render();});
  DB.collection("payees").onSnapshot(s=>{PAYEES={};s.docs.forEach(d=>PAYEES[d.id]=d.data());if(CFG)render();});
  DB.collection("payeeReq").onSnapshot(s=>{PREQ=s.docs.map(d=>({id:d.id,...d.data()}));if(CFG)render();});
})();
</script>
</body>
